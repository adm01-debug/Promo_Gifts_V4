title = "Promo Gifts — Gitleaks Config"

[extend]
useDefault = true

# ─── Valores públicos conhecidos ──────────────────────────────────────────────
# A Supabase publishable key (formato sb_publishable_*) é explicitamente
# projetada para ser embutida em código de browser (prefixo VITE_).
# Aparece nos bundles de produção — não é um segredo operacional.
# RLS restringe o que a chave pode acessar; sem ela o app não inicializa.
#
# Registrada aqui para evitar falso-positivo no workflow de CI (e2e.yml)
# onde o valor é usado como fallback quando o secret do repositório não está
# configurado. Ver issue #167.
# ──────────────────────────────────────────────────────────────────────────────

[allowlist]
description = "Chaves publishable do Supabase (valores públicos embutidos nos bundles)"
regexes = [
  # Fallback público no e2e.yml — chave publishable do projeto doufsxqlfjyuvxuezpln
  '''sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU''',
  # URL do projeto Supabase (pública — aparece em todas as chamadas de rede)
  '''doufsxqlfjyuvxuezpln\.supabase\.co''',
  # JWT anon key (role: anon) que estava hardcoded em client.ts antes do commit a9a667ff.
  # Substituído por VITE_SUPABASE_PUBLISHABLE_KEY em 2026-05-23.
  # Chave anon é pública por design (role sem privilégios, embutida nos bundles).
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvdWZzeHFsZmp5dXZ4dWV6cGxuIiwicm9sZSI6ImFub24i''',
  # Placeholder fake JWT nos workflows de CI — formato header.placeholder (não é segredo real)
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.placeholder''',
  # Chaves de localStorage / property keys em código de app — não são segredos
  '''promobrind\.(magazines|cart|filters|quotes)\.[a-z0-9._-]+''',
  # Property keys de filtro (minSupplierSales90d, minPromoSales90d, etc.)
  '''min(Supplier|Promo)Sales[0-9]+d''',
]
paths = [
  # Documentação e auditorias — contêm exemplos, logs e curl com tokens de exemplo
  '''docs/.*''',
  '''audit/.*''',
  # Testes — tokens e chaves são mock/fixture, não segredos reais
  '''tests/.*''',
  '''src/.*__tests__.*''',
  '''src/pages/__tests__/.*''',
  '''src/pages/magazine/hooks/__tests__/.*''',
  '''src/services/__tests__/.*''',
  # Amostras de payload para testes de webhook (mock data)
  '''src/lib/webhook-events-payload-samples\.ts''',
  # Teste de credenciais da edge function (fixture)
  '''supabase/functions/_shared/credentials\.test\.ts''',
  # Migrations 20261022194* — contêm REVOKE ALL ON TABLE ... FROM anon (DDL de
  # remoção de privilégio). REVOKE é SQL padrão, não segredo. O gitleaks detecta
  # o token "anon" no contexto do REVOKE como falso-positivo (run 39915162290).
  '''supabase/migrations/20261022194.*\.sql''',
]

# Commit histórico com service_role hardcoded (E002 removeu do código fonte).
# A chave precisa ser rotacionada (E001, PO) antes de remover esta entrada.
commits = ["b5e044f459c0a755b12c47403fa4ff2014be955e"]
