## .github/labels.yml — Source of truth para labels do repo
##
## Sincronizado automaticamente por .github/workflows/labels-sync.yml
## sempre que este arquivo muda no branch `main`.
##
## Para adicionar/remover/mudar label: editar aqui, abrir PR.
## NÃO criar/editar labels direto pelo GitHub UI — vira drift.

# ─── area:* — qual parte do sistema ─────────────────────────────────────────
- name: "area:contracts"
  color: "5319e7"
  description: "Pacote _shared/contracts + Edge Function migrations"

# ─── priority:* — urgência ──────────────────────────────────────────────────
- name: "priority:p0"
  color: "b60205"
  description: "Crítico — risco operacional, bloqueia merge"
- name: "priority:p1"
  color: "d93f0b"
  description: "Alto — fazer em até 2 sprints"
- name: "priority:p2"
  color: "fbca04"
  description: "Médio — backlog priorizado"

# ─── type:* — natureza do trabalho ──────────────────────────────────────────
- name: "type:refactor"
  color: "0e8a16"
  description: "Reescrita sem mudança comportamental"
- name: "type:migration"
  color: "c2e0c6"
  description: "Migration de banco de dados"
- name: "type:ci"
  color: "006b75"
  description: "Pipeline / GitHub Actions / automation"
- name: "type:cleanup"
  color: "bfd4f2"
  description: "Remoção de código legado / dead code"

# ─── automation / bot ────────────────────────────────────────────────────────
- name: "Lovable"
  color: "e4e669"
  description: "Commit/PR gerado pelo Lovable (gpt-engineer-app[bot])"
- name: "autoheal"
  color: "f9d0c4"
  description: "Correção automática aplicada pelo autoheal workflow"
- name: "automated"
  color: "bfd4f2"
  description: "PR ou issue criado por automação de CI"
- name: "dependencies"
  color: "0075ca"
  description: "Atualização de dependências (Dependabot / npm)"

# ─── security ────────────────────────────────────────────────────────────────
- name: "security"
  color: "d93f0b"
  description: "Problema ou melhoria de segurança"
- name: "gitleaks"
  color: "b60205"
  description: "Segredo detectado pelo gitleaks"

# ─── bugs ────────────────────────────────────────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "Algo não está funcionando como esperado"

# ─── priority (aliases legados usados em workflows) ──────────────────────────
- name: "priority-high"
  color: "b60205"
  description: "Alta prioridade (alias usado por workflows automáticos)"
- name: "priority/high"
  color: "b60205"
  description: "Alta prioridade (formato slash)"
- name: "priority/medium"
  color: "fbca04"
  description: "Prioridade média (formato slash)"
- name: "priority/low"
  color: "0e8a16"
  description: "Prioridade baixa (formato slash)"

# ─── CI / observabilidade ────────────────────────────────────────────────────
- name: "ci"
  color: "006b75"
  description: "Falha ou melhoria de CI (alias curto)"
- name: "deploy-failure"
  color: "b60205"
  description: "Deploy falhou — issue aberta por deploy-gates"
- name: "drift-check"
  color: "e4e669"
  description: "Desvio detectado entre GitHub e Supabase (edge functions / schema)"
- name: "ddl-out-of-band"
  color: "d93f0b"
  description: "DDL aplicada fora do fluxo de migration versionado"
- name: "ci-inconclusive"
  color: "fbca04"
  description: "Check de CI inconclusivo — não passou nem falhou"
- name: "uptime"
  color: "0075ca"
  description: "Issue de disponibilidade aberta pelo uptime-monitor"
- name: "ledger-manifest-drift"
  color: "e4e669"
  description: "Desvio entre supabase_migrations e manifest.json"
- name: "capacity-growth"
  color: "0075ca"
  description: "Alerta de crescimento de capacidade (storage / DB)"
- name: "perf-slo"
  color: "d93f0b"
  description: "SLO de performance violado"

# ─── governance ──────────────────────────────────────────────────────────────
- name: "ratchet-override"
  color: "e99695"
  description: "Autoriza aumento de baseline de ratchet neste PR (revisão obrigatória)"
