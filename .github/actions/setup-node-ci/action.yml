name: Setup Node CI
description: >
  Composite action: checkout + setup-node (npm) + lockfile check + npm ci.
  Cobre os 3 primeiros steps de ~90% dos workflows deste repo.

inputs:
  fetch-depth:
    description: Profundidade do fetch (0 = historico completo)
    required: false
    default: '1'
  persist-credentials:
    description: Manter credenciais do GITHUB_TOKEN para workflows que fazem push
    required: false
    default: 'true'
  ignore-scripts:
    description: Passar --ignore-scripts ao npm ci
    required: false
    default: 'false'
  working-directory:
    description: Diretorio onde rodar npm ci
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Check lockfile sync
      shell: sh
      run: node scripts/check-lockfile-sync.mjs

    - name: Install dependencies
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.ignore-scripts }}" = "true" ]; then
          npm ci --no-audit --no-fund --ignore-scripts
        else
          npm ci --no-audit --no-fund
        fi
