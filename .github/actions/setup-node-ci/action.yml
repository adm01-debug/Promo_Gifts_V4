name: Setup Node CI
description: >
  Composite action: checkout + setup-node (com cache npm) + npm ci.
  Cobre os 3 primeiros steps de ~90% dos workflows deste repo.

inputs:
  fetch-depth:
    description: Profundidade do fetch (0 = histórico completo)
    required: false
    default: '1'
  node-cache:
    description: Gerenciador de pacotes para cache (npm|yarn|bun)
    required: false
    default: 'npm'
  working-directory:
    description: Diretório onde rodar npm ci
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.node-cache }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
