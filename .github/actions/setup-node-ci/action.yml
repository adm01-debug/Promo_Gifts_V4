name: Setup Node CI
description: >
  Composite action: setup-node (npm) + lockfile check + npm ci.
  Requer checkout prévio — cada job deve executar actions/checkout@v4 antes
  de invocar esta ação (GitHub Actions não consegue carregar uma action local
  sem o repositório já ter sido clonado).
  Cobre os steps de setup de ~90% dos workflows deste repo.

inputs:
  ignore-scripts:
    description: Passar --ignore-scripts ao npm ci
    required: false
    default: 'false'
  skip-install:
    description: >
      Pular lockfile check e npm ci (apenas setup-node).
      Usar em gates que só precisam de Node.js puro (sem node_modules).
    required: false
    default: 'false'
  working-directory:
    description: Diretorio onde rodar npm ci
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Check lockfile sync
      if: ${{ inputs.skip-install != 'true' }}
      shell: sh
      run: node scripts/check-lockfile-sync.mjs

    - name: Install dependencies
      if: ${{ inputs.skip-install != 'true' }}
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.ignore-scripts }}" = "true" ]; then
          npm ci --no-audit --no-fund --ignore-scripts
        else
          npm ci --no-audit --no-fund
        fi
