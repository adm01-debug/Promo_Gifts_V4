name: Setup Node CI
description: >
  Composite action: setup-node (npm) + lockfile check + npm ci.
  Requer checkout prévio — cada job deve executar actions/checkout@v4 antes
  de invocar esta ação (GitHub Actions não consegue carregar uma action local
  sem o repositório já ter sido clonado).
  Cobre os steps de setup de ~90% dos workflows deste repo.
  E90: inputs padronizados (install, ignore-scripts); expressões de inputs fora de run: (via env:).
  (Sem a sintaxe de expressão aqui: o runner avalia a description e falha ao carregar a action.)

inputs:
  install:
    description: >
      Executar lockfile check e npm ci. Use 'false' para só instalar Node.js.
      Equivalente inverso de skip-install (mantido para compatibilidade).
    required: false
    default: 'true'
  ignore-scripts:
    description: Passar --ignore-scripts ao npm ci
    required: false
    default: 'false'
  skip-install:
    description: >
      DEPRECATED: use install: 'false' em seu lugar.
      Pular lockfile check e npm ci (apenas setup-node).
      Mantido para compatibilidade retroativa com workflows existentes.
    required: false
    default: 'false'
  working-directory:
    description: Diretorio onde rodar npm ci
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Check lockfile sync
      if: inputs.install != 'false' && inputs.skip-install != 'true'
      shell: sh
      run: node scripts/check-lockfile-sync.mjs

    - name: Install dependencies
      if: inputs.install != 'false' && inputs.skip-install != 'true'
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          npm ci --no-audit --no-fund --ignore-scripts
        else
          npm ci --no-audit --no-fund
        fi
