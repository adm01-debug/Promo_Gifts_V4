name: E2E (Playwright)

# E17: sharding 4×2 — job e2e-gates (pre-flight), e2e-shard (matrix), merge-reports.
# Job opcional: roda os specs públicos sempre; specs autenticados só se
# E2E_USER_EMAIL/E2E_USER_PASSWORD estiverem configurados como secrets do repo.
# Artefatos (relatório HTML, screenshots, vídeos, traces) são publicados.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - '.nvmrc'
      - 'playwright.config.*'
      - 'vite.config.*'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; push/dispatch não


defaults:
  run:
    shell: bash

# ─── JOB 0: DETECÇÃO DE SECRETS ──────────────────────────────────────────────
# E013: Determina quais projetos Playwright estão disponíveis com base nos secrets.
# chromium-authed só entra na matrix quando has_e2e == 'true'.
jobs:
  secrets-check:
    uses: ./.github/workflows/_secrets-check.yml
    secrets: inherit

# ─── JOB 1: PRÉ-VÔOS (header-sticky + carrinhos URL-state) ──────────────────
# Roda uma vez; se falhar, os shards não sobem (needs: e2e-gates).
  e2e-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # G-H3: fork guard
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CI: "true"
      FORCE_COLOR: "0"
      PWTEST_FORBID_ONLY: "1"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium'
          start-vite: 'true'

      # ─── HEADER STICKY GATE ────────────────────────────────────────────────
      - name: 🧲 Run E2E header-sticky gate (fail-fast por rota/viewport)
        id: e2e_header_sticky
        if: env.E2E_USER_EMAIL != ''
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright test \
            e2e/flows/22-header-sticky.spec.ts \
            --project=chromium-authed \
            --max-failures=1 \
            --reporter=github,list \
            && touch playwright-report/.header-sticky-passed
        continue-on-error: true

      - name: 🛑 Fail-fast se header sticky falhou
        if: steps.e2e_header_sticky.outcome == 'failure'
        run: |
          echo "::error title=Header sticky regression::O Header global deixou de ser sticky em alguma rota/viewport. Spec: e2e/flows/22-header-sticky.spec.ts. Causa raiz típica: 'overflow' / 'transform' / 'filter' em ancestral do <header> em src/components/layout/MainLayout.tsx criando scroll container ou stacking context indevido."
          exit 1

      # ─── CARRINHOS URL-STATE ───────────────────────────────────────────────
      - name: 🛒 Run /carrinhos & /orcamentos URL-state E2E
        id: e2e_carrinhos_urlstate
        if: (steps.e2e_header_sticky.outcome == 'success' || steps.e2e_header_sticky.outcome == 'skipped') && env.E2E_USER_EMAIL != ''
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright test \
            e2e/carrinhos/list-url-state-restore.spec.ts \
            e2e/carrinhos/list-url-state-overdue-chip.spec.ts \
            e2e/carrinhos/list-url-state-search-debounce.spec.ts \
            e2e/carrinhos/list-url-state-clear-filters.spec.ts \
            e2e/orcamentos/list-url-state-restore.spec.ts \
            --project=chromium-authed \
            --retries=2 \
            --workers=1
        continue-on-error: true

      - name: 🛑 Fail se carrinhos URL-state falhou
        if: steps.e2e_carrinhos_urlstate.outcome == 'failure'
        run: |
          echo "::error title=Carrinhos URL-state regression::Specs de URL-state em /carrinhos ou /orcamentos falharam."
          exit 1

# ─── JOB 2: SHARDS DE REGRESSÃO ──────────────────────────────────────────────
# matriz shard:[1,2,3,4] × project:[chromium-public,chromium-authed]
# chromium-authed só roda quando E2E_USER_EMAIL estiver configurado.
  e2e-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # E24: E2E leg ≤ 30 min por shard
    needs: [e2e-gates, secrets-check]
    if: needs.e2e-gates.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # E013: inclui chromium-authed somente quando secrets E2E estão configurados
        project: ${{ fromJSON(needs.secrets-check.outputs.has_e2e == 'true' && '["chromium-public","chromium-authed"]' || '["chromium-public"]') }}
    env:
      CI: "true"
      FORCE_COLOR: "0"
      PWTEST_FORBID_ONLY: "1"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium'
          start-vite: 'true'

      - name: Run E2E regression shard ${{ matrix.shard }}/4 (${{ matrix.project }})
        # E013: sem guard por step — a matrix já exclui chromium-authed sem creds
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          npx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/4 \
            --grep-invert @smoke \
            --reporter=blob,json

      # E012: valida mínimo de testes por shard (evita false-green com 0 testes)
      - name: Check min tests executed (shard ${{ matrix.shard }}, ${{ matrix.project }})
        if: always()
        uses: ./.github/actions/check-min-tests
        with:
          results-json: 'playwright-report/results.json'
          min: '1'

      - name: Upload blob report (shard ${{ matrix.shard }}, ${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 1  # temporário — só para merge-reports; E88 tier padrão não se aplica

      - name: Upload evidence artifacts (shard ${{ matrix.shard }}, ${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            e2e-artifacts/
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário
          retention-days: 14

# ─── JOB 3: MERGE DE RELATÓRIOS ──────────────────────────────────────────────
# Baixa todos os blob-report-* e gera um único HTML report + JSON + JUnit.
  merge-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # E24: estático ≤ 10 min (merge/upload puro)
    needs: [e2e-gates, e2e-shard]
    if: always() && needs.e2e-shard.result != 'skipped'  # E011: roda quando shards rodaram, mesmo que falhem
    env:
      ARTIFACT_RETENTION_DAYS: "14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci

      - name: Download all blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports \
            --reporter=html,json,junit \
            ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-report/results.xml

      - name: 📋 Generate feature summary
        if: always()
        run: node scripts/e2e-feature-summary.mjs || true  # ok: resumo é best-effort; não deve bloquear upload de artefato

      - name: 📤 Append feature summary to GitHub UI
        if: always()
        run: |
          if test -f playwright-report/feature-summary.md; then
            {
              echo "## 🧪 E2E Feature Summary (regression)"
              echo ""
              cat playwright-report/feature-summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check min tests executed  # E42
        if: always()
        uses: ./.github/actions/check-min-tests
        with:
          results-json: 'playwright-report/results.json'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

      - name: Upload feature summary (markdown)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-feature-summary
          path: playwright-report/feature-summary.md
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: ignore

      - name: 🛑 Fail job se algum shard registrou falhas
        if: needs.e2e-shard.result == 'failure'
        run: |
          echo "::error title=Regression failed::Alguns shards falharam — veja 'playwright-report' (HTML) e 'e2e-evidence-*' (screenshots/vídeos)."
          exit 1
