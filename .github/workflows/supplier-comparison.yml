name: Supplier Comparison CI

on:
  pull_request:
    paths:
      - 'src/hooks/products/useSupplierComparison.ts'
      - 'src/components/compare/SupplierComparisonModal.tsx'
      - 'tests/hooks/useSupplierComparison*'
      - 'e2e/flows/supplier-comparison-visual.spec.ts'
      - '.github/workflows/supplier-comparison.yml'

permissions:
  contents: read

concurrency:
  group: supplier-comparison-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não
env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}


defaults:
  run:
    shell: bash

jobs:
  test-supplier-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Unit & Property Tests with Coverage
        run: npm run test:supplier-comparison
      
      - name: Run Visual Regression Tests
        run: npx playwright test e2e/flows/supplier-comparison-visual.spec.ts --project=chromium-public
      
      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
