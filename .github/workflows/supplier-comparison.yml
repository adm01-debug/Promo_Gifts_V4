name: Supplier Comparison CI

on:
  pull_request:
    paths:
      - 'src/hooks/products/useSupplierComparison.ts'
      - 'src/components/compare/SupplierComparisonModal.tsx'
      - 'tests/hooks/useSupplierComparison*'
      - 'e2e/flows/supplier-comparison-visual.spec.ts'
      - '.github/workflows/supplier-comparison.yml'

permissions:
  contents: read

concurrency:
  group: supplier-comparison-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não

defaults:
  run:
    shell: bash

jobs:
  test-supplier-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
      
      - name: Run Unit & Property Tests with Coverage
        run: npm run test:supplier-comparison
      
      - name: Run Visual Regression Tests
        run: npx playwright test e2e/flows/supplier-comparison-visual.spec.ts --project=chromium-public
      
      - name: Upload Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
