name: Supplier Comparison CI

on:
  pull_request:
    paths:
      - 'src/hooks/products/useSupplierComparison.ts'
      - 'src/components/compare/SupplierComparisonModal.tsx'
      - 'tests/hooks/useSupplierComparison*'
      - 'e2e/flows/supplier-comparison-visual.spec.ts'

permissions:
  contents: read

concurrency:
  group: supplier-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-supplier-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Unit & Property Tests with Coverage
        run: npm run test:supplier-comparison
      
      - name: Run Visual Regression Tests
        run: npx playwright test e2e/flows/supplier-comparison-visual.spec.ts --project=chromium-public
      
      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
