name: E2E Cart — Matrix (E79)

# Consolidação dos workflows de carrinho em uma única matriz.
# Substitui: e2e-cart-delete-popover, e2e-carts-undo-rpc-atomic,
#   cart-invariants-smoke, cart-quality.
# Os workflows individuais permanecem ativos; este é o dono canônico.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/cart/**'
      - 'src/contexts/SellerCartContext.tsx'
      - 'src/hooks/products/useSellerCarts.ts'
      - 'e2e/ui/cart-*.spec.ts'
      - 'e2e/flows/13*.spec.ts'
      - 'e2e/carrinhos/**'
      - 'e2e/helpers/cart-*.ts'
      - '.github/workflows/e2e-cart.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/cart/**'
      - 'src/contexts/SellerCartContext.tsx'
      - 'src/hooks/products/useSellerCarts.ts'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a executar (vazio = todas)'
        required: false
        default: ''

# R1 — permissões mínimas
permissions:
  contents: read

# R2 — PRs cancelam; push em main e dispatch não
concurrency:
  group: e2e-cart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  secrets_check:
    name: Verify E2E secrets (Cart)
    # E82 — PR usa mock-auth; secrets só são necessários em push/dispatch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check required secrets
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -z "$E2E_USER_EMAIL" ]    && missing+=(E2E_USER_EMAIL)
          [ -z "$E2E_USER_PASSWORD" ] && missing+=(E2E_USER_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]} — configure em Settings › Secrets › Actions"
            exit 1
          fi
          echo "Secrets OK"

  e2e_cart:
    name: E2E Cart · ${{ matrix.suite }}
    needs: [secrets_check]
    # E82 — roda em PR (secrets_check skipped) ou em push/dispatch (secrets_check success)
    if: always() && (needs.secrets_check.result == 'success' || needs.secrets_check.result == 'skipped')
    runs-on: ubuntu-24.04
    # R3 — timeout por job
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cart-delete-popover
          - carts-undo-rpc
          - cart-handoff
        include:
          - suite: cart-delete-popover
            spec: >-
              e2e/ui/cart-delete-header-popover.spec.ts
              e2e/ui/cart-delete-header-popover-exhaustive.spec.ts
            project: chromium-authed
          - suite: carts-undo-rpc
            spec: 'e2e/flows/13b-carts-undo-rpc-atomic.spec.ts'
            project: chromium-authed
          - suite: cart-handoff
            spec: >-
              e2e/carrinhos/cart-to-quote-handoff.spec.ts
              e2e/carrinhos/cart-to-quote-handoff-persistence.spec.ts
              e2e/carrinhos/quote-handoff-url-params.spec.ts
              e2e/carrinhos/sidebar-no-legacy-labels.spec.ts
            project: chromium-authed
    # R5 — secrets via env:
    # E82 — PR: E2E_MOCK_AUTH=1 (sem credenciais reais); push/dispatch: credenciais reais
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_MOCK_AUTH: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32

      # R4 — node-version-file: .nvmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - name: Filtrar suite
        if: github.event.inputs.suite != '' && github.event.inputs.suite != matrix.suite
        env:
          SUITE_FILTER: ${{ github.event.inputs.suite }}
        run: |
          echo "::notice::Suite ${{ matrix.suite }} ignorada (filtro: $SUITE_FILTER)"
          exit 0

      - name: Run E2E Cart · ${{ matrix.suite }}
        run: |
          npx playwright test ${{ matrix.spec }} \
            --project=${{ matrix.project }} \
            --reporter=line,html

      # R6 — retention-days: 14
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cart-${{ matrix.suite }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
