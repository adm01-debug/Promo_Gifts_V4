name: No Prod Leak in Dev/Test Config

# Incidente 2026-10-13 — tráfego de dev/testes E2E batendo em produção.
# Gate leve: falha se a ref de produção (doufsxqlfjyuvxuezpln) aparecer em
# arquivos de config de dev/teste fora do esperado (scripts/check-no-prod-leak.mjs).
# Não requer npm ci completo — o script só lê arquivos de texto do repo.

on:
  pull_request:
    branches: [main]
    paths-ignore:  # E14: docs-only PRs não introduzem prod leak
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG*'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-no-prod-leak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  no_prod_leak:
    name: Check no prod leak
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check no prod leak
        run: node scripts/check-no-prod-leak.mjs
