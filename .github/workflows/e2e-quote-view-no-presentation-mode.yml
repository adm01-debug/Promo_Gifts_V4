name: E2E Quote View — Sem Modo Apresentação

# Regressão: garante que "Modo Apresentação" não volte ao DropdownMenu do
# QuoteViewPage. Roda sobre o harness dev-only `/__visual/quote-view-order`
# (sem auth/seed). Matriz: light/dark × desktop/mobile + keyboard nav +
# snapshots visuais do menu em mobile.

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/quotes/QuoteViewPage.tsx'
      - 'src/pages/quotes/quote-view/useQuoteViewData.ts'
      - 'src/pages/__visual/QuoteViewOrderHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-view-no-presentation-mode.spec.ts'
      - '.github/workflows/e2e-quote-view-no-presentation-mode.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/quotes/QuoteViewPage.tsx'
      - 'src/pages/quotes/quote-view/useQuoteViewData.ts'
      - 'src/pages/__visual/QuoteViewOrderHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-view-no-presentation-mode.spec.ts'
      - '.github/workflows/e2e-quote-view-no-presentation-mode.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'  # E10/E89 — weekly Monday 04:15 UTC

permissions:
  contents: read

concurrency:
  group: e2e-quote-view-no-presentation-mode-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:


defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      FORCE_COLOR: "0"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium

      - name: Run spec (light/dark × desktop/mobile + keyboard + snapshots)
        run: |
          npx playwright test \
            e2e/quotes/quote-view-no-presentation-mode.spec.ts \
            --project=chromium-public \
            --reporter=list

      # Estabilidade: roda a mesma suíte 3x para flagrar flakiness (qualquer
      # falha em qualquer repetição quebra o job).
      - name: Stability run (--repeat-each=3)
        run: |
          npx playwright test \
            e2e/quotes/quote-view-no-presentation-mode.spec.ts \
            --project=chromium-public \
            --repeat-each=3 \
            --retries=0 \
            --reporter=list

      - name: Upload report + snapshots em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quote-view-no-presentation-mode
          path: |
            playwright-report
            test-results
            e2e/quotes/quote-view-no-presentation-mode.spec.ts-snapshots
          retention-days: 14

  # E10 — alerta de falha no cron semanal (deduplication via label ci-focused-e2e)
  notify-failure:
    name: Notificar falha — Quote View No Pres (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowName = 'E2E Quote View — Sem Modo Apresentação';
            const label = 'ci-focused-e2e';
            const title = `[CI] ${workflowName} falhou no cron semanal`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha detectada: ${runUrl} — ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: [label],
                body: [
                  `## ❌ ${workflowName} falhou no cron semanal`,
                  '',
                  `- **Run:** ${runUrl}`,
                  `- **Triggered:** ${new Date().toISOString()}`,
                  '',
                  'Verifique os artifacts do run para screenshots, diffs e traces.',
                ].join('\n'),
              });
            }
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quote View Sem Apresentação (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '[CI] E2E Quote View — Sem Modo Apresentação falhou no cron semanal';
            const label = 'ci-focused-e2e';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Cron passou em ${new Date().toISOString()} — fechando. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
            }
