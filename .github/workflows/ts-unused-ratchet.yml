name: TS Unused Locals Ratchet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ts-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: noUnusedLocals ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run noUnusedLocals ratchet
        run: sh scripts/tsc-unused-ratchet.sh
