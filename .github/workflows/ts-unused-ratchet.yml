name: TS Unused Locals Ratchet

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tsconfig*.json'
      - 'scripts/tsc-unused-ratchet.sh'
      - '.github/workflows/ts-unused-ratchet.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tsconfig*.json'
      - 'scripts/tsc-unused-ratchet.sh'
      - '.github/workflows/ts-unused-ratchet.yml'
  schedule:
    - cron: '47 6 * * 1' # semanal, segunda 06:00 UTC — varredura incondicional

concurrency:
  group: ts-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ratchet:
    name: noUnusedLocals ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run noUnusedLocals ratchet
        run: sh scripts/tsc-unused-ratchet.sh
