name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: TypeScript + ESLint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci

      # GATE 0: SSOT Supabase — bloqueia se project ID errado estiver em client.ts
      # Previne reincidência do incidente 401 de produção (2026-06-11).
      # Lovable reverteu CURRENT_PROJECT_ID 6+ vezes em 10 min → este gate bloqueia.
      - name: Gate 0 — SSOT Supabase (bloqueante)
        run: node scripts/validate-supabase-config.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      # GATE 0.5: Dependency audit — bloqueia se advisory allowlist expirar ou
      # novos advisories não-revisados aparecerem. Previne supply-chain silencioso.
      # continue-on-error: false → gate bloqueante (gap HIGH identificado em auditoria 2026-09-27)
      - name: Gate 0.5 — Dependency audit (bloqueante)
        run: node scripts/check-dependency-audit.mjs

      # GATE 1: TypeScript — zero regressions vs baseline
      - name: TypeScript gate (zero regressions)
        run: node scripts/check-tsc-baseline.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      # GATE 2: ESLint — zero regressions vs baseline
      - name: ESLint gate (zero regressions)
        run: node scripts/check-eslint-baseline.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      # GATE 2.3: `as any` gate — freeze baseline, prevent regressions
      - name: Gate 2.3 — as any baseline (zero regressions)
        run: node scripts/check-any-type-baseline.mjs

      # GATE 2.4: Migration path references — bloqueia referências novas a arquivos
      # inexistentes sob supabase/migrations{,-snapshot}/ e qa/migrations-draft/.
      # Baseline em .migration-refs-baseline.json congela o legado.
      - name: Gate 2.4 — Migration path references (bloqueante)
        run: node scripts/check-migration-path-references.mjs

      # GATE 2.4.1: contrato AST de relações/RPCs Supabase. O catálogo inicial
      # é uma fotografia read-only de pg_catalog; Storage, bancos externos,
      # aliases documentados e dispatch dinâmico legado têm tratamento explícito.
      - name: Gate 2.4.1 — Supabase reference catalog (bloqueante)
        run: node scripts/check-supabase-reference-catalog.mjs

      # GATE 2.4.2: preserva o legado de migrations, mas impede que uma
      # migration nova introduza nome sem timestamp UTC ou versão colidente.
      - name: Gate 2.4.2 — Migration filename contract (bloqueante)
        run: node scripts/check-migration-filename-contract.mjs


      # GATE 2.5: Product type fields — campos críticos nunca podem ser removidos
      # Previne: remoção de price/shortDescription/category_id durante merge (gap C2)
      # Previne: renomeação silenciosa pelo Lovable como price→sale_price (gap L3)
      - name: Gate 2.5 — Product type fields (bloqueante)
        run: node scripts/check-product-type-fields.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      # GATE 2.6: QuotesConfigurableList — invariantes de layout + a11y + unit (expiração)
      # Previne regressão de ordem/alinhamento/testids/aria-label e da lógica determinística de expiração.
      - name: Gate 2.6 — Quotes list validation (bloqueante)
        run: node scripts/validate-quotes-list.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      # GATE 2.7: overflow-x: clip em MainLayout/html/body (bloqueante)
      # Previne regressão silenciosa do sticky da sidebar: `overflow-x: hidden`
      # promove overflow-y para auto (CSS spec) e anula `position: sticky`.
      - name: Gate 2.7 — overflow-x-clip (bloqueante)
        run: node scripts/check-overflow-x-clip.mjs

      # GATE 4.5: Types inventory drift (bloqueante) — PLANO_DBA E42
      # Substitui o job "Supabase Types Sync" que tinha continue-on-error:true,
      # secret inexistente (SUPABASE_PROJECT_ID) e CLI não-pinado.
      # Previne incidente 7716ae9: Lovable removeu tabelas magazine_* em "Changes"
      # commit silenciosamente → 80+ erros TS. Com este gate, qualquer remoção de
      # Table/View/Function/Enum de types.ts sem entrada na allowlist bloqueia o PR.
      - name: Gate 4.5 — Types inventory drift (bloqueante)
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          node scripts/check-types-inventory-drift.mjs --base "$BASE"

      # GATE 3: Build (zero build errors)
      - name: Build check
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      # GATE 3.5: Bundle size (bloqueante — regressões vazam antes de virar débito)
      # Enforça 3 camadas: (1) limite global por chunk, (2) limite total,
      # (3) limites por chunk crítico + regressão >15% vs snapshot em
      # bundle-size-baseline.json.
      # Para atualizar após refactor intencional: node scripts/check-bundle-size.mjs --update-baseline
      - name: Gate 3.5 — Bundle size check (per-chunk + regression)
        run: node scripts/check-bundle-size.mjs

  # GATE 4: Unit tests (fast — no network)
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci

      - name: Run unit tests
        run: npm run test:ci-core
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
