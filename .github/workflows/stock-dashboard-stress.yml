name: Estoque — Stress Loop Nightly (anti-flake)

# Roda os 4 specs do /estoque em loop (N repetições) para detectar flakiness
# antes que chegue ao main. Falha se qualquer iteração quebrar OU se o tempo
# médio por iteração ultrapassar o limite.
#
# Disparo manual (workflow_dispatch) + semanal (segunda 03:09 UTC).
# Não bloqueia PRs por padrão — promova para required check depois de calibrar.

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Repetições por spec (default 20; hard-cap 20 aplicado no script — E81)'
        required: false
        default: '20'
      max_avg_seconds:
        description: 'Tempo médio máximo por iteração em segundos (default 8)'
        required: false
        default: '8'
  schedule:
    - cron: '9 3 * * 1' # semanal, segunda 03:09 UTC

concurrency:
  group: stock-dashboard-stress
  cancel-in-progress: false

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  stress:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec:
          - e2e/admin/stock-health-badges.spec.ts
          - e2e/admin/stock-dashboard-layout.spec.ts
          - e2e/admin/stock-dashboard-visual.spec.ts
          - e2e/admin/stock-dashboard-empty.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run spec ${{ matrix.spec }} x${{ github.event.inputs.repeat || '20' }}
        env:
          CI: true
          REPEAT: ${{ github.event.inputs.repeat || '20' }}
          MAX_AVG: ${{ github.event.inputs.max_avg_seconds || '8' }}
          SPEC: ${{ matrix.spec }}
        run: |
          set -eo pipefail
          # E81: hard-cap de 20 repetições para evitar runs de 60+ min
          REPEAT=$(( REPEAT > 20 ? 20 : REPEAT ))
          START=$(date +%s)
          npx playwright test "$SPEC" \
            --project=chromium-public \
            --repeat-each="$REPEAT" \
            --workers=2 \
            --reporter=line
          END=$(date +%s)
          ELAPSED=$((END - START))
          AVG=$(awk "BEGIN { printf \"%.2f\", $ELAPSED / $REPEAT }")
          echo "::notice::Spec=${{ matrix.spec }} repeats=$REPEAT elapsed=${ELAPSED}s avg=${AVG}s/iter"
          awk "BEGIN { exit ($AVG > $MAX_AVG) ? 1 : 0 }" || {
            echo "::error::Avg ${AVG}s/iter excede limite ${MAX_AVG}s"
            exit 1
          }

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
