name: Deploy Gates

# Quality gates antes do deploy em main.
# Rodam em paralelo onde possível. Se QUALQUER UM falhar, bloqueia o pipeline.
#
# Ordem dos gates:
#  0. ssot-gate      - SSOT Supabase (project ID canônico) — NOVO, bloqueia todos os outros
#  0.5. dependency-audit - npm audit (sem CVEs high/critical)
#  0.6. dependency-review - dependency-review-action (E97, PR-only)
#  1. lint+tsc       - codigo passa lint e typecheck
#  2. unit-tests     - vitest passa
#  3. e2e-smoke      - playwright smoke test (login + dashboard)
#  4. lighthouse     - perf>=75 a11y>=90 seo>=95 pwa>=80
#  5. seo-sanity     - canonical/og:url/twitter:url corretos, sem dominios proibidos
#  6. build          - vite build sem erros (gate de seguranca final)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores do mesmo PR (pull_request); preserva push/dispatch.
concurrency:
  group: deploy-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================================
  # GATE 0: SSOT Supabase — DEVE PASSAR antes de todos os outros
  # Previne reincidência do incidente 401 de produção (2026-06-11).
  # Lovable reverteu CURRENT_PROJECT_ID 6+ vezes sem que CI detectasse.
  # ============================================================
  ssot-gate:
    name: Gate 0 - SSOT Supabase (project ID canônico)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
        with:
          skip-install: 'true'
      - name: Validate SSOT — client.ts deve apontar para doufsxqlfjyuvxuezpln
        run: node scripts/validate-supabase-config.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

  dependency-audit:
    name: Gate 0.5 - Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ssot-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - name: Auditar dependências (advisory ≥ high bloqueia deploy)
        run: node scripts/check-dependency-audit.mjs

  dependency-review:
    name: Gate 0.6 - Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ssot-gate]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review — falha em deps com CVE severity ≥ high (E97)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense, CC-BY-4.0, Python-2.0

  lint-typecheck:
    name: Gate 1 - Lint + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ssot-gate]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - run: npm run typecheck
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      - run: npm run lint:baseline
      # REGRA #2 — Product type fields (bloqueante)
      # Previne remoção silenciosa de price/sale_price/shortDescription/category_id
      # durante merge (gap C2) ou renomeação pelo Lovable (gap L3).
      - name: Gate 1.1 — Product type fields (bloqueante)
        run: node scripts/check-product-type-fields.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      # REGRA #4 — Types inventory drift (bloqueante)
      # Previne remoção de Tables/Views/Functions/Enums de types.ts sem allowlist.
      # Incidente: 7716ae9 Lovable removeu magazine_* → 80+ erros TS.
      - name: Gate 1.2 — Types inventory drift (bloqueante)
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          node scripts/check-types-inventory-drift.mjs --base "$BASE"
      # Migration contracts (bloqueante) — previne referências a arquivos inexistentes,
      # nomes sem timestamp UTC e RPCs/tabelas não catalogadas.
      - name: Gate 1.3 — Migration contracts (bloqueante)
        run: |
          node scripts/check-migration-path-references.mjs
          node scripts/check-supabase-reference-catalog.mjs
          node scripts/check-migration-filename-contract.mjs
      # REGRA E44 — Visual baselines (bloqueante)
      # Previne remoção de PNGs de baseline de specs rodadas em CI sem
      # --update-snapshots (e2e-dialogs-pr-check, ui-visual-a11y, etc.)
      - name: Gate 1.4 — Visual baselines commitados (bloqueante)
        run: node scripts/check-visual-baselines.mjs
      # E55 — "Salvar Alterações" em fluxo de rascunho (bloqueante)
      # Previne que o Lovable reintroduza o pattern draft-lock detectado nos
      # rascunhos do fluxo de orçamentos.
      - name: Gate 1.5 — Sem "Salvar Alterações" em fluxos de rascunho (bloqueante)
        run: node scripts/check-no-salvar-alteracoes-draft.mjs
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      # E41 — TSC ratchet file guard (PR-only, bloqueante)
      # Previne que um PR aumente .tsc-ratchet-baseline sem label ratchet-override.
      # Não roda TSC — apenas compara o ARQUIVO de baseline contra o base do PR.
      - name: Gate 1.7 — TSC ratchet file guard (bloqueante em PR)
        if: github.event_name == 'pull_request'
        run: sh scripts/tsc-unused-ratchet.sh --check-ratchet
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      # E55 — Detecta arquivos texto encodados acidentalmente em base64.
      # Heurística: linha ≥ 200 chars de alfabeto base64 puro em arquivo texto.
      # Integrado ao gate para bloquear via "Gate Final - Deploy Ready".
      - name: Gate 1.8 — Detect accidentally base64-encoded files (bloqueante)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" > /tmp/b64-files.txt
          elif [[ "$EVENT" == "push" ]]; then
            git diff --name-only --diff-filter=AM HEAD~1 HEAD > /tmp/b64-files.txt \
              || git ls-files > /tmp/b64-files.txt
          else
            git ls-files > /tmp/b64-files.txt
          fi
          INCLUDE='\.(ts|tsx|js|jsx|json|sql|sh|md|yaml|yml|html|css|env|env\.example|toml|conf|rc)$'
          EXCLUDE='(package-lock\.json|pnpm-lock\.yaml|bun\.lock|yarn\.lock|\.min\.|\.bundle\.|^supabase/migrations-snapshot/ALL_IN_ONE\.sql$)'
          FOUND=0
          while IFS= read -r F; do
            [[ -z "$F" || ! -f "$F" ]] && continue
            [[ "$F" =~ $INCLUDE ]] || continue
            [[ "$F" =~ $EXCLUDE ]] && continue
            N=0
            while IFS= read -r L || [[ -n "$L" ]]; do
              N=$((N+1)); LEN=${#L}
              if (( LEN >= 200 )) && [[ "$L" =~ ^[A-Za-z0-9+/=]+$ ]]; then
                FOUND=$((FOUND+1))
                echo "::error file=$F,line=$N::${LEN} chars de alfabeto base64 puro — arquivo possivelmente encodado acidentalmente."
              fi
            done < "$F"
          done < /tmp/b64-files.txt
          exit $(( FOUND > 0 ))

  unit-tests:
    name: Gate 2 - Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ssot-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      # Gate rapido de regressao. Suites amplas seguem no CI principal:
      # `test:quality`, `Hook tests` e `Test Coverage`.
      - run: npm run test:deploy-gate
      - name: Webhook scenario matrix (contratos Zod, 0 HTTP)
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            tests/contracts/webhook-scenario-matrix.test.ts \
            --reporter=dot

  database-integrity:
    name: Gate 2.5 - PostgreSQL Transactional Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ssot-gate]
    # Dependabot e forks não têm acesso a secrets live — marca skipped
    # explicitamente em vez de falhar verde vazio (E59).
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate discount approval, grants and trigger races on PG17
        run: scripts/test-approved-plan-database.sh
      - name: Validate guarded quote RPC proposals on pinned isolated PG17
        run: npm run test:quote-rpc:postgres
      - name: Block frontend promotion until canonical quote RPC contract is live
        run: npm run check:quote-rpc:canonical -- --require-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln

  e2e-smoke:
    name: Gate 3 - E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ssot-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: |
          if [ -d "e2e" ] || [ -d "tests/e2e" ] || [ -d "playwright" ]; then
            npm run test:e2e:smoke
          else
            echo "::warning::No e2e folder found, skipping (will be added in future PR)"
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Gate 4 - Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ssot-gate]
    # Gate opcional (CLAUDE.md) — falha não bloqueia deploy-ready.
    continue-on-error: true
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: lighthouse-placeholder-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - run: npm run build
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  seo-sanity:
    name: Gate 5 - SEO Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ssot-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
        with:
          skip-install: 'true'
      - name: Run SEO sanity check
        run: node scripts/seo-sanity-check.mjs

  restore-cart-rpc-gate:
    name: Gate 5.5 - RPC restore_seller_cart presente no canônico
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [ssot-gate]
    # Dependabot e forks não têm acesso a SERVICE_ROLE_KEY — skipa (E59).
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - name: Verificar assinatura publicada da RPC
        run: npm run check:restore-seller-cart-rpc
        env:
          CANONICAL_SUPABASE_URL: https://doufsxqlfjyuvxuezpln.supabase.co
          # A RPC é deliberadamente invisível para anon. O smoke precisa de
          # service_role para distinguir assinatura ausente de ACL correta.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRICT: '1'

  build:
    name: Gate 6 - Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-typecheck, seo-sanity, restore-cart-rpc-gate]
    permissions:
      contents: read
      id-token: write      # necessário para attest-build-provenance (E99)
      attestations: write  # necessário para attest-build-provenance (E99)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node CI
        uses: ./.github/actions/setup-node-ci
      - run: npm run build
      # E55 — Bundle size (bloqueante)
      # Roda após o build para garantir que dist/assets/ existe.
      # E41 — Bundle ratchet: em PR também verifica se o ARQUIVO de baseline aumentou.
      - name: Gate 1.6 — Bundle size dentro dos limites (bloqueante)
        run: node scripts/check-bundle-size.mjs --check-ratchet
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 7
      # E99 — SBOM + build provenance attestation (push para main apenas)
      # Gera SBOM SPDX-JSON do dist/ e atesta proveniência do build no GHCR.
      # Skipped em PRs e workflow_dispatch — sem impacto no tempo de CI de PRs.
      - name: Generate SBOM (E99)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ github.run_id }}.spdx.json
          path: dist/
          format: spdx-json
      - name: Attest build provenance (E99)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/**/*.js'

  deploy-ready:
    name: Gate Final - Deploy Ready
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - ssot-gate
      - dependency-audit
      - dependency-review
      - lint-typecheck
      - unit-tests
      - database-integrity
      - e2e-smoke
      - lighthouse
      - seo-sanity
      - restore-cart-rpc-gate
      - build
    steps:
      - name: Require every blocking gate to pass
        env:
          GATE_RESULTS: ${{ join(needs.*.result, ',') }}
          # database-integrity e restore-cart-rpc-gate podem ser skipped em
          # PRs do Dependabot/fork (sem acesso a secrets live — E59).
          DB_INTEGRITY: ${{ needs.database-integrity.result }}
          RESTORE_CART: ${{ needs.restore-cart-rpc-gate.result }}
          # dependency-review só roda em PR — skip é esperado em push/dispatch (E97).
          DEP_REVIEW: ${{ needs.dependency-review.result }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          FAIL=0

          # Falha em qualquer gate que quebrou ou foi cancelado
          if [[ ",${GATE_RESULTS}," == *,failure,* || \
                ",${GATE_RESULTS}," == *,cancelled,* ]]; then
            echo "Blocking gate result: ${GATE_RESULTS}" >&2
            FAIL=1
          fi

          # Skipped é aceito APENAS para gates com condicionais explícitas.
          # Em qualquer outro contexto, skipped é falha.
          if [[ ",${GATE_RESULTS}," == *,skipped,* ]]; then
            # Constrói o conjunto de skipped aceitáveis neste contexto
            ALLOWED_SKIP=0
            if [[ "$IS_DEPENDABOT" == "true" || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              # Para Dependabot e forks: database-integrity e restore-cart-rpc-gate
              # podem ser skipped (sem secrets). Todos os outros skipped são falha.
              if [[ "$DB_INTEGRITY" == "skipped" ]]; then ALLOWED_SKIP=$((ALLOWED_SKIP+1)); fi
              if [[ "$RESTORE_CART" == "skipped" ]]; then ALLOWED_SKIP=$((ALLOWED_SKIP+1)); fi
            fi
            # E97: dependency-review é PR-only — skip esperado em push/dispatch
            if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
              if [[ "$DEP_REVIEW" == "skipped" ]]; then ALLOWED_SKIP=$((ALLOWED_SKIP+1)); fi
            fi
            # Conta total de skipped
            TOTAL_SKIP=$(echo "${GATE_RESULTS}" | tr ',' '\n' | grep -c "^skipped$" || true)
            if [[ "$TOTAL_SKIP" -gt "$ALLOWED_SKIP" ]]; then
              echo "::error::Gate(s) inesperadamente skipped (${TOTAL_SKIP} skipped, ${ALLOWED_SKIP} permitidos): ${GATE_RESULTS}" >&2
              FAIL=1
            elif [[ "$ALLOWED_SKIP" -gt 0 ]]; then
              echo "::warning::${ALLOWED_SKIP} gate(s) skipped (condicionais: E59/E97)"
            fi
          fi

          if [[ "$FAIL" -eq 1 ]]; then
            echo "Blocking gate result: ${GATE_RESULTS}" >&2
            exit 1
          fi
          echo "All blocking deploy gates passed: ${GATE_RESULTS}"
