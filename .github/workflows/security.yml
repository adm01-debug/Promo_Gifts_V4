name: Security Scan

on:
  pull_request:
    branches: [main]
    paths-ignore:  # E14: docs-only PRs dificilmente introduzem secrets
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG*'
  push:
    branches: [main]
  schedule:
    - cron: '25 6 * * 1'  # segunda 06:25 UTC — 03:25 BRT (E89)

permissions:
  contents: read
  pull-requests: read
  # security-events: write — removido E92 (nenhum upload SARIF neste workflow)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: necessário apenas para organizações
          # Para usuário pessoal, não precisa de licença

  headers-mirror:
    name: CSP mirror — public/_headers == vercel.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify headers mirror
        run: node scripts/check-headers-mirror.mjs
