name: Supabase Linter Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    # Roda diariamente às 06:00 UTC para detectar drift fora de PR
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      confirm_magazine_hardening:
        description: 'Digite APPLY_MAGAZINE_HARDENING_CANONICAL para aplicar 3 migrations expansivas'
        required: false
        type: string

jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Run Supabase linter against baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
        run: node scripts/check-supabase-linter.mjs

  deploy-magazine-hardening:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_magazine_hardening == 'APPLY_MAGAZINE_HARDENING_CANONICAL'
    name: Apply Magazine hardening — canonical only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Guard — projeto e credencial canônicos
        run: |
          test "$SUPABASE_PROJECT_REF" = "doufsxqlfjyuvxuezpln"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Aplicar três migrations expansivas em uma única transação
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const expectedRef = 'doufsxqlfjyuvxuezpln';
          if (!token || projectRef !== expectedRef) {
            throw new Error('canonical_project_guard_failed');
          }

          const migrations = [
            ['20260909200000', 'magazine_hardening_v2', 'supabase/migrations/20260909200000_magazine_hardening_v2.sql'],
            ['20260909201000', 'public_sitemap_rpc', 'supabase/migrations/20260909201000_public_sitemap_rpc.sql'],
            ['20260909210000', 'audit_security_definer_acl_allow_public_endpoints', 'supabase/migrations/20260909210000_audit_security_definer_acl_allow_public_endpoints.sql'],
          ];

          const apiBase = `https://api.supabase.com/v1/projects/${projectRef}/database`;
          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          };

          async function execute(query, readOnly) {
            const endpoint = readOnly ? `${apiBase}/query/read-only` : `${apiBase}/query`;
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify(readOnly ? { query } : { query, read_only: false }),
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`management_api_${response.status}:${body.slice(0, 600)}`);
            }
            return body ? JSON.parse(body) : [];
          }

          const versions = migrations.map(([version]) => `'${version}'`).join(',');
          const inspectSql = `
            SELECT
              (SELECT count(*)::int FROM supabase_migrations.schema_migrations
                WHERE version IN (${versions})) AS migration_count,
              EXISTS (SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='magazines' AND column_name='edit_version') AS has_edit_version,
              to_regprocedure('public.magazine_create_v2(uuid,text,text)') IS NOT NULL AS has_create_v2,
              to_regprocedure('public.magazine_import_local_v2(text,jsonb)') IS NOT NULL AS has_import_v2,
              to_regprocedure('public.get_sitemap_public(integer,integer)') IS NOT NULL AS has_sitemap_rpc
          `;

          const preflight = (await execute(inspectSql, true))?.[0] ?? {};
          console.log(`Preflight: migrations=${preflight.migration_count}, edit_version=${preflight.has_edit_version}, create=${preflight.has_create_v2}, import=${preflight.has_import_v2}, sitemap=${preflight.has_sitemap_rpc}`);
          const allObjects = preflight.has_edit_version && preflight.has_create_v2 && preflight.has_import_v2 && preflight.has_sitemap_rpc;
          if (Number(preflight.migration_count) === 3 && allObjects) {
            console.log('Todas as migrations expansivas já existem; nenhuma mutação necessária.');
            process.exit(0);
          }
          if (Number(preflight.migration_count) !== 0 || allObjects || preflight.has_edit_version || preflight.has_create_v2 || preflight.has_import_v2 || preflight.has_sitemap_rpc) {
            throw new Error('unexpected_partial_state');
          }

          const statements = ['BEGIN;'];
          for (const [version, name, path] of migrations) {
            const sql = readFileSync(path, 'utf8');
            if (sql.includes('$migration_body$')) {
              throw new Error(`reserved_dollar_quote_in_${path}`);
            }
            statements.push(sql);
            statements.push(`
              INSERT INTO supabase_migrations.schema_migrations (version, name, statements)
              VALUES ('${version}', '${name}', ARRAY[$migration_body$${sql}$migration_body$]::text[])
              ON CONFLICT (version) DO NOTHING;
            `);
          }
          statements.push('COMMIT;');
          await execute(statements.join('\n'), false);

          const postflight = (await execute(`
            SELECT state.*,
              has_function_privilege('anon', 'public.get_sitemap_public(integer,integer)', 'EXECUTE') AS anon_sitemap,
              has_function_privilege('anon', 'public.magazine_import_local_v2(text,jsonb)', 'EXECUTE') AS anon_import,
              has_function_privilege('authenticated', 'public.magazine_import_local_v2(text,jsonb)', 'EXECUTE') AS auth_import,
              has_function_privilege('anon', 'public.magazine_create_v2(uuid,text,text)', 'EXECUTE') AS anon_create,
              has_function_privilege('authenticated', 'public.magazine_create_v2(uuid,text,text)', 'EXECUTE') AS auth_create
            FROM (${inspectSql}) state
          `, true))?.[0] ?? {};
          console.log(`Postflight: migrations=${postflight.migration_count}, edit_version=${postflight.has_edit_version}, create=${postflight.has_create_v2}, import=${postflight.has_import_v2}, sitemap=${postflight.has_sitemap_rpc}, anon_sitemap=${postflight.anon_sitemap}, anon_import=${postflight.anon_import}, auth_import=${postflight.auth_import}`);
          if (
            Number(postflight.migration_count) !== 3 ||
            !postflight.has_edit_version || !postflight.has_create_v2 ||
            !postflight.has_import_v2 || !postflight.has_sitemap_rpc ||
            !postflight.anon_sitemap || postflight.anon_import ||
            !postflight.auth_import || postflight.anon_create || !postflight.auth_create
          ) {
            throw new Error('postflight_contract_failed');
          }
          NODE
