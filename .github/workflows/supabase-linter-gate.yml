name: Supabase Linter Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # E19: 06:03 UTC (não :00/:30; ≥10 min antes de wraparound-monitor-report às 06:15)
    - cron: "3 6 * * *"
  workflow_dispatch:

jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Check Security Advisors and live catalog gates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
        run: node scripts/check-supabase-linter.mjs
