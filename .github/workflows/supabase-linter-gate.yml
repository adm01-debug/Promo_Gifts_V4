name: Supabase Linter Gate

on:
  pull_request:
    branches: [main]
    paths:  # E14: só relevante quando supabase ou integrações mudam
      - 'supabase/**'
      - 'src/integrations/supabase/**'
      - 'scripts/*supabase*'
      - 'package*.json'
  push:
    branches: [main]
  schedule:
    # Roda diariamente às 06:00 UTC para detectar drift fora de PR
    - cron: "57 6 * * *"  # E89: ≥20min after schema-snapshot-export Mon 06:36 (daily stays clear)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-linter-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  linter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check Security Advisors and live catalog gates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
        run: node scripts/check-supabase-linter.mjs
