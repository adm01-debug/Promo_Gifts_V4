name: Supabase Linter Gate

on:
  pull_request:
    branches: [main]
    paths:  # E14: só relevante quando supabase ou integrações mudam
      - 'supabase/**'
      - 'src/integrations/supabase/**'
      - 'scripts/*supabase*'
      - 'package*.json'
      - '.github/workflows/supabase-linter-gate.yml'
  push:
    branches: [main]
  schedule:
    # Roda diariamente às 06:57 UTC para detectar drift fora de PR
    - cron: "57 6 * * *"  # E89: ≥20min after schema-snapshot-export Mon 06:36 (daily stays clear)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-linter-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  linter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # PR mode: validação contra allowlist estática apenas — não chama a API live.
      # Evita falha espúria (71% hit rate) quando os advisors live divergem da allowlist.
      # E050 (2026-10-18): migrado de supabase-linter-baseline.json para lint-0029-allowlist.json.
      - name: Validate static allowlist (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ALLOWLIST=".security/lint-0029-allowlist.json"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::${ALLOWLIST} não encontrado — allowlist ausente."
            exit 1
          fi
          node --input-type=module <<'EOF'
            import { readFileSync } from 'fs';
            const b = JSON.parse(readFileSync('.security/lint-0029-allowlist.json', 'utf8'));
            if (!Array.isArray(b.functions)) {
              console.error('❌ Allowlist inválida: campo functions ausente');
              process.exit(1);
            }
            const at = b.description ?? 'N/A';
            console.log(`✅ Allowlist estática válida: ${b.functions.length} funções documentadas (${at})`);
          EOF
          echo "ℹ️ PR mode: somente allowlist estática verificada — gate live roda em push/schedule."

      # Push/schedule mode: comparação live, mas items do baseline são aceitos.
      - name: Check Security Advisors and live catalog gates
        if: github.event_name != 'pull_request'
        id: live_check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
        run: |
          set -euo pipefail
          node scripts/check-supabase-linter.mjs
          echo "lint_passed=true" >> "$GITHUB_OUTPUT"

      - name: Upload allowlist artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-linter-allowlist-${{ github.run_number }}
          path: .security/lint-0029-allowlist.json
          retention-days: 14  # E88
