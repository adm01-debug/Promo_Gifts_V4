name: Supabase Linter Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Roda diariamente às 06:00 UTC para detectar drift fora de PR
    - cron: "46 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-linter-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Check Security Advisors and live catalog gates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
        run: node scripts/check-supabase-linter.mjs
