name: Nightly Full CI

# E15: renomeado de full-ci.yml → nightly-full.yml.
# Antes rodava em PR + push (duplicando deploy-gates.yml). Agora só noturno
# (schedule) e dispatch manual — cobertura completa de vitest + E2E shardado
# custa ~30min+, inadequado para cada PR.
on:
  schedule:
    # Todo dia às 02:43 UTC (fora do horário de pico de PRs)
    - cron: '43 2 * * *'  # diário 02:43 UTC (E89)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-ci-${{ github.ref }}
  cancel-in-progress: false  # E19: schedule nunca cancelado


defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: Lint, Typecheck & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Guard — package-lock em sincronia
        run: node scripts/check-lockfile-sync.mjs

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:baseline

      - name: Unit & Integration Tests (Coverage)
        run: npm run test:ci-core:coverage
        env:
          TZ: America/Sao_Paulo

      - name: Validate Coverage Threshold
        run: |
          pct=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Current Coverage: $pct%"
          if (( $(echo "$pct < 50" | bc -l) )); then
            echo "Coverage below 50% threshold!"
            exit 1
          fi

      - name: Vitest — stress + fuzz badges (blocking)
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            src/hooks/products/__tests__/useProductIntelligenceBadges.test.tsx \
            src/hooks/products/__tests__/useProductIntelligenceBadges.stress.test.tsx \
            src/hooks/admin/__tests__/useIntelligenceBadgeSettings.fuzz.test.ts

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    needs: quality-gate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Sharded Parallel)
        run: |
          npx playwright test --shard=${{ matrix.shard }}/2 \
            e2e/catalog.spec.ts \
            e2e/kit-builder.spec.ts \
            e2e/login.spec.ts \
            e2e/mockup-generate.spec.ts \
            e2e/routes/app/replenishment-grid-visual.spec.ts \
            e2e/catalog/product-card-badges-visual.spec.ts \
            e2e/catalog/product-card-to-superfilter.spec.ts \
            --project=chromium-authed
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright Artifacts (Screenshots & Diffs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            e2e-artifacts/
          retention-days: 14

      - name: Upload Playwright Report (Always)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14


  # E159 — suites com toMatchSnapshot movidas de e2e-focused.yml para o nightly.
  # Rodam em chromium-public (sem credenciais E2E necessárias).
  e2e-visual-focused:
    name: E2E Visual Focused · ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    needs: quality-gate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - pdf-dialog
          - color-swatch
          - magazine-header
          - dialogs
        include:
          - suite: pdf-dialog
            spec: 'e2e/flows/pdf-dialog.spec.ts'
          - suite: color-swatch
            spec: >-
              e2e/catalog/color-swatch-selected-no-clip.spec.ts
              e2e/catalog/color-swatch-two-lines-grid.spec.ts
              e2e/catalog/color-swatch-wrap-visual.spec.ts
          - suite: magazine-header
            spec: >-
              e2e/flows/magazine-header-align.spec.ts
              e2e/flows/magazine-header-responsive.spec.ts
          - suite: dialogs
            spec: >-
              e2e/ui/dialog-visual.spec.ts
              e2e/ui/confirm-dialog-visual.spec.ts
              e2e/ui/alert-dialog-visual.spec.ts
              e2e/ui/undo-toast-visual.spec.ts
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E Visual · ${{ matrix.suite }}
        run: |
          npx playwright test ${{ matrix.spec }} \
            --project=chromium-public \
            --reporter=line,html
      - name: Upload report + artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-visual-focused-${{ matrix.suite }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  audit-report:
    name: Final Audit Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [quality-gate, e2e-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Download Coverage Summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Generate Audit Report
        run: node scripts/generate-audit-report.mjs

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-audit-report
          path: audit-report.txt
          retention-days: 14
