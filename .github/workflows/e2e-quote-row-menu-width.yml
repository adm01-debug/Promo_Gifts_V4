name: E2E — Quote Row Menu Width

on:
  push:
    branches: [main]
    paths:
      - 'src/components/quotes/QuotesConfigurableList.tsx'
      - 'src/index.css'
      - 'e2e/quotes/quote-row-menu-width*.spec.ts'
      - '.github/workflows/e2e-quote-row-menu-width.yml'
  pull_request:
    paths:
      - 'src/components/quotes/QuotesConfigurableList.tsx'
      - 'src/index.css'
      - 'e2e/quotes/quote-row-menu-width*.spec.ts'
      - '.github/workflows/e2e-quote-row-menu-width.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-quote-row-menu-width-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  menu-width:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      E2E_BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
      - name: Run quote-row-menu-width specs (${{ matrix.viewport }})
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test \
            e2e/quotes/quote-row-menu-width.spec.ts \
            e2e/quotes/quote-row-menu-width-zoom.spec.ts \
            --project=chromium-authed \
            --grep "${{ matrix.viewport }}" \
            --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-menu-width-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
          retention-days: 14
          if-no-files-found: ignore
