name: Reusable — E2E Runtime Relevance

on:
  workflow_call:
    inputs:
      requires_backend:
        description: false para suítes que só usam harness local (sem Supabase)
        type: boolean
        default: true
    outputs:
      relevant:
        description: Se o diff exige executar testes E2E contra o backend
        value: ${{ jobs.detect.outputs.relevant }}

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detectar impacto de runtime/E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.result.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Publicar decisão
        id: result
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          SUPABASE_E2E_PROJECT_REF: ${{ vars.SUPABASE_E2E_PROJECT_REF }}
          REQUIRES_BACKEND: ${{ inputs.requires_backend }}
        run: |
          # GUARD: E2E nunca roda contra o banco de produção (incidente 2026-11-14: ~97% das
          # requisições /rest/v1 vinham de localhost em runners do CI). Sem projeto de
          # staging configurado (vars.SUPABASE_E2E_PROJECT_REF), o E2E com backend é pulado.
          if [[ "${REQUIRES_BACKEND}" == "true" && ( -z "${SUPABASE_E2E_PROJECT_REF}" || "${SUPABASE_E2E_PROJECT_REF}" == "doufsxqlfjyuvxuezpln" ) ]]; then
            echo "::notice::E2E com backend pulado: vars.SUPABASE_E2E_PROJECT_REF ausente ou igual à produção (ver docs/ci/SEGREDOS.md)."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "push" ]]; then
            node .github/scripts/e2e-relevance.mjs >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
