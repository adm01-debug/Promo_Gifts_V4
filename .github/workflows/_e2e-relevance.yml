name: Reusable — E2E Runtime Relevance

on:
  workflow_call:
    outputs:
      relevant:
        description: Se o diff exige executar testes E2E contra o backend
        value: ${{ jobs.detect.outputs.relevant }}

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detectar impacto de runtime/E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.result.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Publicar decisão
        id: result
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "push" ]]; then
            node --input-type=module <<'NODE'
            import { appendFileSync } from 'node:fs';

            const files = JSON.parse(process.env.CHANGED_FILES || '[]');
            const deliveryUnit = 'src/pages/__tests__/QuoteBuilderDeliveryTooltip.test.tsx';
            const isSrcUnit = (file) =>
              file.startsWith('src/') &&
              (file.includes('/__tests__/') || /\.(?:test|spec)\.[^/]+$/.test(file));
            const isRuntime = (file) => {
              if (file === deliveryUnit) return true;
              if (isSrcUnit(file)) return false;
              return (
                file.startsWith('src/') ||
                file.startsWith('e2e/') ||
                file.startsWith('tests/') ||
                file.startsWith('public/') ||
                file.startsWith('.github/actions/e2e-setup/') ||
                ['package.json', 'package-lock.json', '.nvmrc'].includes(file) ||
                /^(?:playwright|vite)\.config\./.test(file)
              );
            };
            appendFileSync(process.env.GITHUB_OUTPUT, `relevant=${files.some(isRuntime)}\n`);
            NODE
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
