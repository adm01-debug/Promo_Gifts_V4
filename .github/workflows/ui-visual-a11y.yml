name: UI · Visual & A11y
on:
  pull_request:
    paths:
      - "src/components/ui/ConfirmDialog.tsx"
      - "src/components/ui/OptimizedImage.tsx"
      - "src/components/ui/alert-dialog.tsx"
      - "src/components/ui/__tests__/**"
      - "src/pages/dev/ConfirmDialogHarness.tsx"
      - "src/pages/dev/AlertDialogHarness.tsx"
      - "e2e/ui/**"
      - "tests/setup.ts"
      - "tests/mocks/**"
      - ".github/workflows/ui-visual-a11y.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-visual-a11y-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  confirm-dialog:
    name: ConfirmDialog · unit + a11y + visual
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Vitest — ConfirmDialog (responsive + a11y + keyboard + layout)
        run: TZ=America/Sao_Paulo npx vitest run src/components/ui/__tests__/ConfirmDialog.*.test.tsx
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Playwright — install chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright — visual + boundingBox
        run: npx playwright test e2e/ui/confirm-dialog-visual.spec.ts --project=chromium-public
      - name: Upload Playwright report (screenshots + vídeos + traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-confirm-dialog
          path: |
            playwright-report
            test-results
          retention-days: 14

  alert-dialog:
    name: AlertDialog · visual + no-clip H/V
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Playwright — install chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright — AlertDialog visual + boundingBox
        run: npx playwright test e2e/ui/alert-dialog-visual.spec.ts --project=chromium-public
      - name: Upload Playwright report (screenshots + vídeos + traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-alert-dialog
          path: |
            playwright-report
            test-results
          retention-days: 14

  optimized-image:
    name: OptimizedImage · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Vitest — OptimizedImage
        run: TZ=America/Sao_Paulo npx vitest run src/components/ui/__tests__/OptimizedImage.test.tsx
