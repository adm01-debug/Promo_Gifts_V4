name: UI · Visual & A11y
on:
  pull_request:
    paths:
      - "src/components/ui/ConfirmDialog.tsx"
      - "src/components/ui/OptimizedImage.tsx"
      - "src/components/ui/alert-dialog.tsx"
      - "src/components/ui/__tests__/**"
      - "src/pages/dev/ConfirmDialogHarness.tsx"
      - "src/pages/dev/AlertDialogHarness.tsx"
      - "e2e/ui/**"
      - "tests/setup.ts"
      - "tests/mocks/**"
      - ".github/workflows/ui-visual-a11y.yml"
  push:
    branches: [main]

jobs:
  confirm-dialog:
    name: ConfirmDialog · unit + a11y + visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Vitest — ConfirmDialog (responsive + a11y + keyboard + layout)
        run: npx vitest run src/components/ui/__tests__/ConfirmDialog.*.test.tsx
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-all-${{ runner.os }}-
      - name: Playwright — install browsers exercised by the visual suite
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright — visual + boundingBox
        run: npx playwright test e2e/ui/confirm-dialog-visual.spec.ts
      - name: Upload Playwright report (screenshots + vídeos + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-confirm-dialog
          path: |
            playwright-report
            test-results
          retention-days: 7

  alert-dialog:
    name: AlertDialog · visual + no-clip H/V
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-all-${{ runner.os }}-
      - name: Playwright — install browsers exercised by the visual suite
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright — AlertDialog visual + boundingBox
        run: npx playwright test e2e/ui/alert-dialog-visual.spec.ts
      - name: Upload Playwright report (screenshots + vídeos + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-alert-dialog
          path: |
            playwright-report
            test-results
          retention-days: 7

  optimized-image:
    name: OptimizedImage · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Vitest — OptimizedImage
        run: npx vitest run src/components/ui/__tests__/OptimizedImage.test.tsx
