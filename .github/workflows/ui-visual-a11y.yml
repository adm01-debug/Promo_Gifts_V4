name: UI · Visual & A11y
on:
  pull_request:
    paths:
      - "src/components/ui/OptimizedImage.tsx"
      - "src/components/ui/__tests__/**"
      - "tests/setup.ts"
      - "tests/mocks/**"
      - ".github/workflows/ui-visual-a11y.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-visual-a11y-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  optimized-image:
    name: OptimizedImage · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Vitest — OptimizedImage
        run: TZ=America/Sao_Paulo npx vitest run src/components/ui/__tests__/OptimizedImage.test.tsx
