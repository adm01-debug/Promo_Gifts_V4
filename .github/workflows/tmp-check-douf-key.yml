name: tmp-check-douf-key

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe env Vercel Brindes com VERCEL_TOKEN do Gifts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          code=$(curl -s -o /tmp/vercel.json -w "%{http_code}" \
            "https://api.vercel.com/v9/projects/prj_LVKX7uhs1VhTjDDznD7KinvjgHXU/env/SCQKCm2xiZIjEFKy?decrypt=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || true)
          echo "vercel_env_http=$code"
          if [ "$code" = "200" ]; then
            node -e 'const j=require("/tmp/vercel.json"); console.log("key="+j.key, "target="+j.target.join(","), "type="+j.type)'
          else
            echo "::error::VERCEL_TOKEN do Gifts nao cobre o projeto Brindes (http=$code)"
            exit 1
          fi