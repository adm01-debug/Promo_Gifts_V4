name: E2E • Swatch QuickView (Lista + Tabela)

# Gate de regressão para a navegação por bolinhas de cor → QuickView nas views
# Lista e Tabela. Roda em PR e push em main, paralelizado por browser
# (chromium/firefox/webkit) para validar foco, teclado e a11y de forma consistente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - '.nvmrc'
      - 'playwright.config.*'
      - 'vite.config.*'
      - '.github/workflows/e2e-swatch-quickview.yml'

concurrency:
  group: e2e-swatch-quickview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
  E2E_BASE_URL: http://localhost:8080

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  swatch-quickview:
    name: ${{ matrix.browser }} • swatch→QV
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    # webkit runners são sistematicamente preemptados por shutdown signal de infraestrutura
    # chromium e firefox continuam bloqueantes; webkit reporta mas não bloqueia
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Validar projeto Supabase alvo antes de usar credenciais
        run: |
          EXPECTED="https://doufsxqlfjyuvxuezpln.supabase.co"
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL ausente ou inválida para o E2E." >&2
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "E2E bloqueado: VITE_SUPABASE_URL deve usar HTTPS." >&2
            exit 1
          fi
          ORIGIN="${VITE_SUPABASE_URL%%/*}"/"${VITE_SUPABASE_URL#*//}"
          ORIGIN="$(echo "$VITE_SUPABASE_URL" | cut -d'/' -f1-3)"
          if [ "$ORIGIN" != "$EXPECTED" ]; then
            echo "E2E bloqueado: VITE_SUPABASE_URL não aponta ao projeto canônico doufsxqlfjyuvxuezpln." >&2
            exit 1
          fi
          echo "Destino Supabase do E2E validado: projeto canônico HTTPS."
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium,${{ matrix.browser }}'
          start-vite: 'false'
          require-auth: 'true'
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      - name: Run swatch→QuickView suite (V1 + V2 + focus/QV)
        # O reporter json do playwright.config.ts já tem `outputFile` explícito
        # (playwright-report/results.json). Quando `outputFile` existe, o Playwright
        # IGNORA PLAYWRIGHT_JSON_OUTPUT_NAME — por isso o guard E42 abaixo lê o
        # results.json padrão (cada job da matriz roda num runner isolado).
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test \
            e2e/catalog/swatch-quickview-list-table.spec.ts \
            e2e/catalog/swatch-quickview-v2-list-table.spec.ts \
            e2e/catalog/swatch-picker-v2-focus-and-quickview.spec.ts \
            --project=${{ matrix.browser }}-authed
      - name: Check min tests executed  # E42
        if: always()
        uses: ./.github/actions/check-min-tests
        with:
          results-json: 'playwright-report/results.json'
      - name: Upload report + traces + videos (${{ matrix.browser }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-swatch-qv-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
          retention-days: 14
