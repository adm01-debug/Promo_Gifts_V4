name: E2E · Update Dialog snapshots
# Espelha os workflows de AlertDialog/ConfirmDialog para o Dialog genérico.
# Executa `playwright test --update-snapshots` para o spec do Dialog
# e faz commit dos PNGs atualizados. Dispara manualmente OU quando o próprio
# spec (ou o harness) é editado.
on:
  workflow_dispatch:
  push:
    paths:
      - "e2e/ui/dialog-visual.spec.ts"
      - "src/pages/dev/DialogHarness.tsx"

permissions:
  contents: write

# Evita execuções simultâneas — a última em fila cancela as anteriores no mesmo ref.
concurrency:
  group: e2e-update-dialog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Bootstrap (install deps + chromium)
        run: npm run e2e:bootstrap
      - name: Update baselines
        run: npm run e2e:dialog:update
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/ui/dialog-visual.spec.ts-snapshots || true
          if git diff --cached --quiet; then
            echo "Sem mudanças de baseline."
          else
            git commit -m "chore(e2e): update Dialog visual snapshots [skip ci]"
            git push
          fi
