name: E2E · Update Dialog snapshots
# Espelha os workflows de AlertDialog/ConfirmDialog para o Dialog genérico.
# Executa `playwright test --update-snapshots` para o spec do Dialog
# e faz commit dos PNGs atualizados. Dispara manualmente OU quando o próprio
# spec (ou o harness) é editado.
on:
  workflow_dispatch:
  push:
    paths:
      - "e2e/ui/dialog-visual.spec.ts"
      - "src/pages/dev/DialogHarness.tsx"
      - ".github/workflows/e2e-update-dialog-snapshots.yml"

permissions:
  contents: write

# Evita execuções simultâneas — a última em fila cancela as anteriores no mesmo ref.
concurrency:
  group: e2e-update-dialog-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.1.34
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Bootstrap (install deps + chromium)
        run: npm run e2e:bootstrap
      - name: Update baselines
        run: npm run e2e:dialog:update
      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          # shellcheck disable=SC2016 # aspas simples intencionais: $1 e GIT_PUSH_TOKEN expandem quando o git chama o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Commit updated snapshots
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/ui/dialog-visual.spec.ts-snapshots || true  # ok: sem snapshots novos é resultado válido
          if git diff --cached --quiet; then
            echo "Sem mudanças de baseline."
          else
            git commit -m "chore(e2e): update Dialog visual snapshots [skip ci]"
            git push
          fi
