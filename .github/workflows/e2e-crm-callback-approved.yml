name: E2E — CRM Callback (approved → V4 → CRM)

# Executa o spec e2e/flows/28-crm-callback-approved.spec.ts sem mocking,
# usando o CRM_CALLBACK_API_KEY real. Sem os secrets CRM, o job degrada
# para static-pass (E09) — exceto em workflow_dispatch, que falha explicitamente.

on:
  push:
    branches: [main]
    paths:
      - "e2e/flows/28-crm-callback-approved.spec.ts"
      - "supabase/functions/receive-crm-callback/**"
      - ".github/workflows/e2e-crm-callback-approved.yml"
  pull_request:
    branches: [main]
    paths:
      - "e2e/flows/28-crm-callback-approved.spec.ts"
      - "supabase/functions/receive-crm-callback/**"
      - ".github/workflows/e2e-crm-callback-approved.yml"
  workflow_dispatch:
  schedule:
    # Smoke diário 06:20 UTC (03:20 America/Sao_Paulo)
    - cron: "20 6 * * *"  # diário 06:20 UTC (E89)

concurrency:
  group: e2e-crm-callback-approved-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}


defaults:
  run:
    shell: bash

jobs:
  e2e-crm-callback:
    name: approved → V4 → CRM (no-mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Preview/staging Supabase — SSOT canônico (doufsxqlfjyuvxuezpln)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      # Segredos reais — o job falha antes do Playwright rodar se ausentes.
      CRM_CALLBACK_API_KEY: ${{ secrets.CRM_CALLBACK_API_KEY }}
      V4_CALLBACK_URL: ${{ secrets.V4_CALLBACK_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Verificar secrets CRM (E09)
        id: crm-check
        run: |
          missing=0
          for var in CRM_CALLBACK_API_KEY E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::warning::Secret obrigatório ausente: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::workflow_dispatch requer os secrets CRM_CALLBACK_API_KEY/E2E_ADMIN_*."
              exit 1
            fi
            echo "::notice::Secrets ausentes — cron/push pulado graciosamente (configure secrets para ativar)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Todos os secrets obrigatórios presentes."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.crm-check.outputs.skip != 'true'
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        if: steps.crm-check.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.crm-check.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E — approved → V4 → CRM (sem mocking)
        if: steps.crm-check.outputs.skip != 'true'
        # E16: chromium-smoke → chromium-public; o spec específico não usa o filtro @smoke
        # do projeto chromium-smoke (grep: /@smoke/) — que silenciaria o spec se não tagged.
        run: npx playwright test e2e/flows/28-crm-callback-approved.spec.ts --project=chromium-public --retries=1 --workers=1

      - name: Upload Playwright report
        if: always() && steps.crm-check.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-crm-callback
          path: |
            playwright-report/
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 14
          if-no-files-found: ignore
          # trace.zip EXCLUÍDO (E26): arquivos de trace contêm dados de form (incluindo
          # credenciais de E2E_ADMIN_*) e este repositório é público.
