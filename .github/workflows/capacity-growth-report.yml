name: capacity-growth-report

# =============================================================================
# Etapa E30 do PLANO_DBA_CORRECOES_MELHORIAS_50_ETAPAS_2026-09-16.md.
# Ver docs/E30_PLANO_CAPACIDADE_2026-09-16.md para a investigação completa.
#
# O que faz: roda scripts/capacity-growth-projection.mjs, que lê a série
# histórica de ops.table_size_history (gravada diariamente pelo cron
# table-size-history-daily — ver a migration da etapa E30) e projeta o
# tamanho de cada tabela `public` 90 dias à frente por regressão linear
# simples entre o primeiro e o último ponto da série. Sinaliza (issue
# rotulada `capacity-growth`, ou comentário se já existir uma aberta)
# qualquer tabela cuja projeção passe de 20% do banco ou 30%/mês de
# crescimento.
#
# O que NÃO faz: não aplica DDL, não faz DROP/TRUNCATE, não decide
# retenção — é advisory/best-effort, não um gate (mesmo padrão de
# ddl-out-of-band-detector.yml, etapa E12). Depende da migration de E30
# (tabela ops.table_size_history + cron) já ter sido aplicada — enquanto
# não for, o check degrada para inconclusive (sem issue) e só loga aviso.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   - SUPABASE_ACCESS_TOKEN : PAT da Management API (mesmo secret de
#                             ddl-out-of-band-detector.yml)
# Variável sobrescrevível (não-secret):
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
# =============================================================================

on:
  # schedule:
  #   - cron: '16 9 * * 1' # semanal, segunda 09:16 UTC (06:16 BRT)
  # E31: schedule desabilitado — aguardando migration [DBA-E30] (ops.table_size_history).
  # Reativar após aplicação via .github/workflows/db-apply-migration.yml.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: capacity-growth-report
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  project:
    name: Projeta crescimento a partir de ops.table_size_history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Roda projeção
        id: check
        continue-on-error: true
        # E56: captura exit_code para tri-state (0=ok, 1=alerta, 2=inconclusivo)
        run: |
          set +e
          node scripts/capacity-growth-projection.mjs --out=/tmp/capacity-growth.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-growth-report-${{ github.run_id }}
          path: /tmp/capacity-growth.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Compute issue body (tabelas acima do limiar)
        # exit 1 (FAILED) e exit 2 (INCONCLUSIVE) chegam aqui como 'failure' via
        # continue-on-error. Só abrimos issue quando o relatório existe e lista
        # >=1 tabela sinalizada — caso contrário só logamos warning, sem issue.
        id: issue_body
        if: steps.check.outcome == 'failure'
        run: |
          node <<'NODEEOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const DELIM = 'BODY_EOF_CAPACITY';
          let skip = 'true';
          let title = '';
          let body = '';
          try {
            const report = JSON.parse(fs.readFileSync('/tmp/capacity-growth.json', 'utf-8'));
            const flags = report?.flags || [];
            if (flags.length === 0) {
              process.stderr.write('Relatório existe mas flags está vazio — nada a fazer.\n');
            } else {
              const today = new Date().toISOString().slice(0, 10);
              title = `[capacity-growth] ${flags.length} tabela(s) projetada(s) acima do limiar — ${today}`;
              const lines = flags.map((f) => {
                const growth = f.growthPctPerMonth == null ? 'n/d' : `${f.growthPctPerMonth}%/mês`;
                return `- \`${f.table}\` — atual ${f.currentBytes} bytes, projeção ${report.horizonDays}d: ${f.projectedBytes} bytes (${f.projectedSharePct}% do banco), crescimento: ${growth}`;
              });
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              body = [
                `## Projeção de crescimento (${report.horizonDays} dias, série de ${report.seriesDaysAvailable} dias)`,
                '',
                `Limiares: >${report.objectSharePct}% do banco projetado OU >${report.monthlyGrowthPct}%/mês.`,
                '',
                ...lines,
                '',
                `Run: ${runUrl}`,
                '',
                '### Como agir',
                'Não é uma ordem de DROP/retenção automática — só um alerta antecipado (PLANO_DBA E30/E26-E29).',
                'Investigar a causa do crescimento (backfill pontual vs. tendência real) antes de propor qualquer ação de retenção, particionamento ou índice — qualquer DDL resultante segue a REGRA #8 (aprovação explícita do PO por objeto).',
                '',
                '_Projeção por regressão linear simples entre o primeiro e o último ponto da série — sensível a outliers isolados (ex. backfill único). Confirmar a tendência com mais de um ponto antes de agir._',
              ].join('\n');
              skip = 'false';
            }
          } catch (e) {
            process.stderr.write(`Projeção inconclusiva ou sem relatório (${e.message}) — provavelmente ops.table_size_history ainda não existe (E30 aguardando aprovação do PO). Não é um achado de capacidade, apenas logando.\n`);
          }
          process.stdout.write(`skip=${skip}\n`);
          if (skip === 'false') {
            process.stdout.write(`title=${title}\n`);
            process.stdout.write(`body<<${DELIM}\n${body}\n${DELIM}\n`);
          }
          NODEEOF

      - name: Reportar issue de capacidade
        # E12 — ci-issue action com dedupe por marcador <!-- ci-issue:capacity-growth -->
        if: steps.check.outcome == 'failure' && steps.issue_body.outputs.skip != 'true'
        uses: ./.github/actions/ci-issue
        with:
          key: capacity-growth
          title: ${{ steps.issue_body.outputs.title }}
          body: ${{ steps.issue_body.outputs.body }}
          labels: capacity-growth,priority/low
          state: open

      - name: Não quebra o build
        if: steps.check.outcome == 'failure'
        # E56: tri-state — distingue falha real (exit 1) de inconclusivo (exit 2)
        run: |
          if [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
            echo "::warning::Projeção de capacidade inconclusiva (exit 2) — sem SUPABASE_ACCESS_TOKEN ou ops.table_size_history ausente (E30 pendente). Nenhuma tabela sinalizada."
          else
            echo "::warning::Projeção encontrou tabela(s) acima do limiar — ver issue/artefato desta run. Job não quebra build (advisory, não gate)."
          fi
