name: Personalização — diagnóstico readonly do artifact fixo

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/personalization-trace-diagnostics.yml'
      - 'scripts/diagnose-personalization-artifact.py'
      - 'tests/scripts/test_personalization_artifact_diagnostics.py'
      - 'docs/operations/PERSONALIZATION_TRACE_DIAGNOSTICS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: personalization-trace-diagnostics-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitized-trace-evidence:
    name: Evidência sanitizada — artifact fixo
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Testar ZIP, formato e privacidade sem rede
        run: python3 -m unittest discover -s tests/scripts -p test_personalization_artifact_diagnostics.py -v

      - name: Coletar somente o artifact autorizado
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/diagnose-personalization-artifact.py
          --output work/personalization-trace/report.json
          --summary work/personalization-trace/summary.md

      - name: Exibir resumo sanitizado
        if: always()
        run: |
          if [ -f work/personalization-trace/summary.md ]; then
            cat work/personalization-trace/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar apenas JSON e Markdown sanitizados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personalization-trace-evidence-${{ github.run_id }}
          path: |
            work/personalization-trace/report.json
            work/personalization-trace/summary.md
          if-no-files-found: error
          retention-days: 14

