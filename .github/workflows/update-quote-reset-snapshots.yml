name: Update Quote Visual Snapshots

# Workflow manual: regenera as baselines visuais dos specs:
#   - e2e/quotes/quote-reset-stepper-layout.spec.ts
#   - e2e/quotes/quote-number-subtitle.spec.ts (todos os breakpoints)
#   - e2e/quotes/quote-pdf-header-snapshot.spec.ts (768/1024)
# Use APENAS quando a mudança visual for intencional (refactor de layout,
# novo step, novo subtítulo de quote_number, novo cabeçalho do PDF, etc.).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch destino do commit (default: branch atual)'
        required: false
        default: ''
      commit_message:
        description: 'Mensagem do commit de baselines'
        required: false
        default: 'test(e2e): update quote visual snapshots'

concurrency:
  group: update-quote-reset-snapshots
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  CI: 'true'

permissions:
  contents: read

jobs:
  update-snapshots:
    name: Regerar baselines (--update-snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      E2E_BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run Playwright with --update-snapshots
        run: |
          npx playwright test \
            e2e/quotes/quote-reset-stepper-layout.spec.ts \
            e2e/quotes/quote-number-subtitle.spec.ts \
            e2e/quotes/quote-pdf-header-snapshot.spec.ts \
            e2e/quotes/quote-new-fab.spec.ts \
            --project=chromium-authed \
            --update-snapshots \
            --reporter=list

      - name: Commit & push baselines
        env:
          INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
          INPUT_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/quotes/quote-reset-stepper-layout.spec.ts-snapshots/ \
                  e2e/quotes/quote-number-subtitle.spec.ts-snapshots/ \
                  e2e/quotes/quote-pdf-header-snapshot.spec.ts-snapshots/ \
                  e2e/quotes/quote-new-fab.spec.ts-snapshots/ || true
          if git diff --cached --quiet; then
            echo "Nenhuma baseline nova/alterada — nada para commitar."
            exit 0
          fi
          git commit -m "$INPUT_COMMIT_MESSAGE"
          git push origin "HEAD:$INPUT_BRANCH"

      - name: Upload HTML report (debug)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-update-snapshots
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
