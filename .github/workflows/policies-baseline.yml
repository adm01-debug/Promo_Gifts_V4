name: Policies Baseline

# =============================================================================
# Baseline assinado das RLS policies do schema `public` (auditoria 20-dim,
# Onda 2). Complementa o detector de DDL out-of-band: o schema_signature
# cobre tabelas/colunas, mas NÃO cobre CREATE/DROP/ALTER POLICY — e uma
# policy afrouxada fora do fluxo de migrations abre dados silenciosamente.
#
# O que faz: roda scripts/check-policies-baseline.mjs, que consulta
# pg_policies (read-only via Management API) e difa contra o snapshot
# assinado `.security/policies-baseline.json` (sha256 das linhas).
#
# Seed inicial: o baseline commitado vem com `pending_seed: true` (o gate
# fica dormente/static-pass) porque o snapshot exige credenciais do projeto
# canônico. Para semear: rode este workflow manualmente com `seed=true` —
# ele gera o snapshot live e abre um PR com o baseline preenchido; o merge
# desse PR ativa o gate.
#
# Secrets/vars (mesmos do ddl-out-of-band-detector):
#   - SUPABASE_ACCESS_TOKEN (secret) : PAT da Management API
#   - SUPABASE_PROJECT_REF   (var)   : default doufsxqlfjyuvxuezpln
#
# Sem credenciais (ex.: PR de fork): o script degrada para static-pass.
# =============================================================================

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.security/policies-baseline.json'
      - 'scripts/check-policies-baseline.mjs'
      - '.github/workflows/policies-baseline.yml'
  push:
    branches: [main]
  schedule:
    - cron: '30 10 * * 1' # semanal, segunda 10:30 UTC — E89: ≥20min after security-definer-acl-multi-env (10:09)
  workflow_dispatch:
    inputs:
      seed:
        description: 'Gerar/regenerar o baseline a partir do live e abrir PR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: policies-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  check:
    name: Drift de policies vs baseline assinado
    # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.seed) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Check policies baseline
        id: check_baseline
        continue-on-error: true
        # E56: --require-live emite exit 2 (inconclusive) sem credenciais —
        # tri-state: 0=ok, 1=drift, 2=inconclusivo (não bloqueia).
        run: |
          set +e
          node scripts/check-policies-baseline.mjs --require-live
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verificar resultado (E56 — tri-state)
        if: steps.check_baseline.outcome == 'failure'
        run: |
          if [ "${{ steps.check_baseline.outputs.exit_code }}" = "2" ]; then
            echo "::warning::policies-baseline inconclusivo (exit 2) — sem SUPABASE_ACCESS_TOKEN (PR de fork) ou baseline com pending_seed: true. Gate dormente."
          else
            echo "::error::Drift de RLS policies detectado — veja o output do step acima."
            exit 1
          fi

  seed:
    name: Seed/regen do baseline + PR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify required secrets
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado — seed requer PAT da Management API}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Snapshot live → baseline
        # --require-live: sem credenciais o script sai 2 em vez de terminar
        # verde sem gravar nada (seed dormente mascarado como sucesso).
        run: node scripts/check-policies-baseline.mjs --update-baseline --require-live

      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Commit baseline (detecta mudanças)
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
        id: changes
        run: |
          set -euo pipefail
          BRANCH="bot/policies-baseline-seed-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .security/policies-baseline.json
          if git --no-pager diff --cached --quiet; then
            echo "::notice::Nenhuma mudança detectada no baseline — nada a commitar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(security): atualiza baseline assinado de RLS policies"
            git push origin "${BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cria PR com baseline atualizado
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          gh pr create \
            --title "chore(security): baseline de RLS policies ($(date +%Y-%m-%d))" \
            --body "Snapshot live de \`pg_policies\` (schema public) gravado em \`.security/policies-baseline.json\` com sha256. Revisar a lista de policies antes de mergear — depois do merge, o gate policies-baseline passa a bloquear drift não revisado." \
            --label "ci-automation" \
            --base main \
            --head "${{ steps.changes.outputs.branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
