name: PDF Visual Regression

on:
  pull_request:
    paths:
      - 'src/components/pdf/**'
      - 'src/lib/pdf/**'
      - 'src/lib/quotes/personalizationSummary.ts'
      - 'qa/exports/**'
      - 'scripts/qa/generate-proposal-pdf.mjs'
      - 'scripts/qa/diff-proposal-pdfs.mjs'
      - '.github/workflows/pdf-visual-regression.yml'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Atualiza qa/exports/baseline/*.png (commit incluso)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pdf-visual-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não

defaults:
  run:
    shell: bash

jobs:
  pdf-diff:
    name: Diff visual dos PDFs de proposta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # E61: removed contents:write — baselines update via artifact download, not git push
    env:
      PDF_VISUAL_THRESHOLD_PCT: '0.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc


      - name: Instalar poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Executar gate visual
        if: ${{ github.event.inputs.update_baseline != 'true' }}
        run: node scripts/qa/diff-proposal-pdfs.mjs

      - name: Atualizar baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: node scripts/qa/diff-proposal-pdfs.mjs --update-baseline

      # E61: replaced git commit+push with artifact upload — developer downloads and commits manually
      - name: Upload baseline atualizado (artifact — commit manualmente)
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-baseline-updated-${{ github.run_id }}
          path: qa/exports/baseline/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar artifacts (diffs + renderizações)
        if: failure() || github.event.inputs.update_baseline == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-visual-diff
          path: |
            qa/exports/rendered/*.png
            qa/exports/diff/*.png
            qa/exports/proposal-*.pdf
          if-no-files-found: ignore
          retention-days: 14
