name: Global Search Quality Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'src/components/search/**'
      - 'e2e/flows/global-search-comprehensive.spec.ts'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/components/search/**'
      - 'e2e/flows/global-search-comprehensive.spec.ts'

permissions:
  contents: read

concurrency:
  group: global-search-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest - Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Coverage is scoped to the search components actually exercised by this gate.
      # The global 60% threshold in vitest.config.ts applies to the whole src/ tree
      # and cannot be met by a search-only run; per-run thresholds override it.
      - name: Run Global Search component tests with coverage
        run: TZ=America/Sao_Paulo npx vitest run src/components/search/__tests__ --coverage --coverage.include='src/components/search/**' --coverage.thresholds.lines=50 --coverage.thresholds.functions=50 --coverage.thresholds.branches=40 --coverage.thresholds.statements=50 --reporter=default --reporter=json --outputFile=vitest-report.json
      - name: Detect Vitest Flaky
        if: always()
        run: node src/test/detect-flaky-vitest.mjs
      - name: Coverage Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Vitest Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Percentage |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries | .[] | "| \(.key) | \(.value.pct)% |"' coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Search coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-coverage
          path: coverage/
          retention-days: 14

  playwright:
    name: Playwright - Cross-browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Search E2E (Multi-browser)
        run: npx playwright test e2e/flows/global-search-comprehensive.spec.ts --project=chromium-authed --project=firefox-authed --project=webkit-authed
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CI: true
      - name: Detect Flaky & Quarantine
        if: always()
        run: node e2e/scripts/detect-flaky.mjs
      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: e2e-artifacts/
          retention-days: 14
      - name: Upload Quarantine List
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quarantine-list
          path: quarantine-list.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: search-e2e-report
          path: playwright-report/
          retention-days: 14
