name: stock-filter-stress

on:
  # E38: stress só por agenda e workflow_dispatch, nunca em PR (carga desnecessária em revisão)
  schedule:
    # Nightly 03:17 UTC — seed rotativa por data para ampliar cobertura
    - cron: '17 3 * * *'  # diário 03:17 UTC (E89)
  workflow_dispatch:
    inputs:
      master_seed:
        description: 'STRESS_MASTER_SEED (decimal ou 0x...)'
        required: false
        default: ''
      sims:
        description: 'STRESS_SIMS'
        required: false
        default: ''
      replay_seed:
        description: 'STRESS_REPLAY_SEED (reexecuta só essa iteração)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: stock-filter-stress-${{ github.ref }}
  cancel-in-progress: false  # R2/E38: stress/schedule nunca cancelado


defaults:
  run:
    shell: bash

jobs:
  stress:
    name: stock-filter stress (dispatch=5k / nightly=25k)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Default dispatch (nightly sobrescreve para 25k)
      STRESS_SIMS: '5000'
      STRESS_MASTER_SEED: '48879' # 0xbeef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Configura seeds (nightly = rotativa, dispatch = inputs)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MASTER_SEED: ${{ inputs.master_seed }}
          INPUT_SIMS: ${{ inputs.sims }}
          INPUT_REPLAY_SEED: ${{ inputs.replay_seed }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "STRESS_SIMS=25000" >> "$GITHUB_ENV"
            # seed rotativa baseada na data (YYYYMMDD)
            DATE_SEED=$(date -u +%Y%m%d)
            echo "STRESS_MASTER_SEED=${DATE_SEED}" >> "$GITHUB_ENV"
            echo "STRESS_UNIVERSE_SEED=${DATE_SEED}" >> "$GITHUB_ENV"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_MASTER_SEED" ]; then echo "STRESS_MASTER_SEED=$INPUT_MASTER_SEED" >> "$GITHUB_ENV"; fi
            if [ -n "$INPUT_SIMS" ];        then echo "STRESS_SIMS=$INPUT_SIMS"               >> "$GITHUB_ENV"; fi
            if [ -n "$INPUT_REPLAY_SEED" ]; then echo "STRESS_REPLAY_SEED=$INPUT_REPLAY_SEED" >> "$GITHUB_ENV"; fi
          fi

      - name: Roda stress vs oráculo (logs reproduzíveis)
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI: 'true'
        run: |
          mkdir -p .stress-artifacts
          echo "::group::Seeds da execução"
          echo "event=$EVENT_NAME"
          echo "STRESS_MASTER_SEED=${STRESS_MASTER_SEED}"
          echo "STRESS_UNIVERSE_SEED=${STRESS_UNIVERSE_SEED:-default}"
          echo "STRESS_SIMS=${STRESS_SIMS}"
          echo "STRESS_REPLAY_SEED=${STRESS_REPLAY_SEED:-none}"
          echo "::endgroup::"
          TZ=America/Sao_Paulo npx vitest run src/lib/inventory/__tests__/stock-filter.stress.test.ts \
            --reporter=verbose 2>&1 | tee .stress-artifacts/stress.log

      - name: Upload logs (para replay)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-filter-stress-${{ github.run_id }}
          path: .stress-artifacts/
          retention-days: 14
