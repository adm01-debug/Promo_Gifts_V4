name: CI - Replenishment Module Quality Gate

# 2026-09-27: paths filter — 23min de CI só quando reposição/E2E/supabase muda
# 2026-10-01: E26 — env scope, remove continue-on-error/--pass-with-no-tests, timeout fix
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'

concurrency:
  group: replenishment-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run lint

      - name: Type check
        run: node scripts/check-tsc-baseline.mjs

      - name: Run Module Tests (Unit & Integration)
        run: TZ=America/Sao_Paulo bunx vitest run src/hooks/products/__tests__/useReplenishments.integration.test.ts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Tests (Smoke)
        run: bunx playwright test e2e/replenishment-stress.spec.ts

      - name: E2E — Paridade visual /novidades vs /reposicao
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        id: card_parity
        run: npm run test:e2e:card-parity

      - name: Upload Playwright artifacts (parity)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-report
          path: playwright-report/
          retention-days: 14
