name: CI - Replenishment Module Quality Gate

# 2026-09-27: paths filter — 23min de CI só quando reposição/E2E/supabase muda
# 2026-10-01: E26 — env scope, remove continue-on-error/--pass-with-no-tests, timeout fix
# 2026-10-01: E26 v2 — credencial-gate no step de stress test (evita falha sem E22)
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'

concurrency:
  group: replenishment-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      # E53: use the correct secret name (VITE_SUPABASE_PUBLISHABLE_KEY, not VITE_SUPABASE_ANON_KEY)
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # E53: use setup-node (project standard) instead of setup-bun
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: node scripts/check-tsc-baseline.mjs

      - name: Run Module Tests (Unit & Integration)
        # E53: live Supabase integration only on push (not on PR to avoid prod reads)
        if: github.event_name == 'push'
        run: TZ=America/Sao_Paulo npx vitest run src/hooks/products/__tests__/useReplenishments.integration.test.ts

      - name: Install Playwright browsers
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Smoke)
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        run: npx playwright test e2e/replenishment-stress.spec.ts --project=chromium-authed

      - name: E2E — Paridade visual /novidades vs /reposicao
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        id: card_parity
        run: npm run test:e2e:card-parity

      - name: Upload Playwright artifacts (parity)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-report
          path: playwright-report/
          retention-days: 14
