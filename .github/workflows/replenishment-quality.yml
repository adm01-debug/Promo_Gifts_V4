name: CI - Replenishment Module Quality Gate

# 2026-09-27: paths filter — 23min de CI só quando reposição/E2E/supabase muda
# 2026-10-01: E26 — env scope, remove continue-on-error/--pass-with-no-tests, timeout fix
# 2026-10-01: E26 v2 — credencial-gate no step de stress test (evita falha sem E22)
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'

concurrency:
  group: replenishment-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}  # E53: fallback
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}  # E53: fallback
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # E53: use setup-node (project standard) instead of setup-bun
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: node scripts/check-tsc-baseline.mjs

      - name: Run Module Tests (Unit & Integration)
        # E53: live Supabase integration only on push (not on PR to avoid prod reads)
        if: github.event_name == 'push'
        run: TZ=America/Sao_Paulo npx vitest run src/hooks/products/__tests__/useReplenishments.integration.test.ts

      - name: Install Playwright browsers
        if: env.E2E_USER_EMAIL != ''
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Smoke)
        if: env.E2E_USER_EMAIL != ''
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright test e2e/replenishment-stress.spec.ts --project=chromium-authed

      - name: E2E — Paridade visual /novidades vs /reposicao
        if: env.E2E_USER_EMAIL != ''
        id: card_parity
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e:card-parity

      - name: Upload Playwright artifacts (parity)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: playwright-report/
          retention-days: 14
