name: CI - Replenishment Module Quality Gate

# 2026-09-27: paths filter — 23min de CI só quando reposição/E2E/supabase muda
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'

# Cancela runs antigos do mesmo branch/PR — evita gastar slots em commits superados.
concurrency:
  group: replenishment-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Lint check
        run: bun run lint
        
      - name: Type check
        run: node scripts/check-tsc-baseline.mjs
        
      - name: Run Module Tests (Unit & Integration)
        run: TZ=America/Sao_Paulo bunx vitest run src/hooks/products/__tests__/useReplenishments.integration.test.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
      - name: Run E2E Tests (Smoke)
        continue-on-error: true
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test e2e/replenishment-stress.spec.ts --pass-with-no-tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: E2E — Paridade visual /novidades vs /reposicao (informativo)
        id: card_parity_info
        continue-on-error: true
        run: |
          bunx playwright install --with-deps chromium
          npm run test:e2e:card-parity -- --pass-with-no-tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Card parity — gate estrito (tolerância 4px)
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        run: |
          echo "::group::Card parity strict run (sem --pass-with-no-tests)"
          npm run test:e2e:card-parity
          echo "::endgroup::"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright artifacts (parity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: playwright-report/
          retention-days: 7
