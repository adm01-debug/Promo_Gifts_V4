name: CI - Replenishment Module Quality Gate

# 2026-09-27: paths filter — 23min de CI só quando reposição/E2E/supabase muda
# 2026-10-01: E26 — env scope, remove continue-on-error/--pass-with-no-tests, timeout fix
# 2026-10-01: E26 v2 — credencial-gate no step de stress test (evita falha sem E22)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.ts'
      - 'vite.config.*'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.ts'
      - 'vite.config.*'
      - '.tsc-baseline.json'
      - '.eslint-baseline.json'
      - '.github/workflows/replenishment-quality.yml'

concurrency:
  group: replenishment-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  # Unit-only diffs must not start the 18+ minute authenticated parity suite.
  relevance:
    uses: ./.github/workflows/_e2e-relevance.yml

  audit:
    needs: relevance
    if: needs.relevance.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_E2E_PROJECT_REF && format('https://{0}.supabase.co', vars.SUPABASE_E2E_PROJECT_REF) || '' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY_E2E }}
      VITE_SUPABASE_E2E_PROJECT_ID: ${{ vars.SUPABASE_E2E_PROJECT_REF }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_BASE_URL: http://127.0.0.1:8081
      E2E_FORCE_START_SERVER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # E53: use setup-node (project standard) instead of setup-bun
        with:
          persist-credentials: false # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: node scripts/check-tsc-baseline.mjs

      - name: Navigation helper contract
        run: npx vitest run tests/config/e2e-nav-helper-smoke.test.ts

      - name: Run Module Tests (Unit & Integration)
        # E53: live Supabase integration only on push (not on PR to avoid prod reads)
        if: github.event_name == 'push'
        run: TZ=America/Sao_Paulo npx vitest run src/hooks/products/__tests__/useReplenishments.integration.test.ts

      - name: Run E2E Tests (Smoke)
        if: env.E2E_USER_EMAIL != ''
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # O stress valida grid/virtualização/resiliência, não o login real.
          # Mock auth elimina rate-limit/504 do Supabase no runner da CI.
          E2E_MOCK_AUTH: '1'
        # O spec compartilha a sessão autenticada e o mesmo servidor local.
        # Serializar evita colisão no login/page.goto entre os cenários.
        run: npx playwright test e2e/replenishment-stress.spec.ts --project=chromium-authed --workers=1

      - name: E2E — Paridade visual /novidades vs /reposicao
        if: env.E2E_USER_EMAIL != ''
        id: card_parity
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # A paridade valida layout do artefato que vai a produção. Usar o
          # preview elimina a transformação lazy do Vite dev que, no runner
          # frio, consumiu 120s em quatro tentativas antes de o mesmo grafo
          # passar em 6–50s nos 13 cenários seguintes.
          E2E_SERVER_MODE: preview
        # A suíte mede múltiplos viewports contra um único servidor local. Com
        # fullyParallel + 2 workers, navegações concorrentes deixam a app em
        # nprogress-busy e produzem falso timeout antes dos títulos das páginas.
        run: npm run test:e2e:card-parity -- --workers=1

      - name: Upload Playwright artifacts (parity)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: |
            playwright-report/
            !playwright-report/**/*.webm
          if-no-files-found: error
          retention-days: 14
