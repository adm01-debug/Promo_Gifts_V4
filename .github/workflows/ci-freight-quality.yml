name: Freight & Quote Quality Gate

on:
  pull_request:
    paths:
      - 'src/components/kit-builder/**'
      - 'src/hooks/quotes/**'
      - 'supabase/functions/quote-sync/**'
      - 'supabase/functions/webhook-*/**'
      - 'tests/components/kit-builder/**'
      - 'tests/hooks/quotes/**'
      - 'tests/contracts/webhook-scenario-matrix.test.ts'
      - 'tests/edge-functions/integration/**'
      - 'e2e/flows/33-*'
      - '.github/workflows/ci-freight-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-freight-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não
defaults:
  run:
    shell: bash

jobs:
  freight-unit:
    name: Freight Unit Tests + Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run FreightEstimator + quoteHelpers tests with coverage
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            tests/components/kit-builder/FreightEstimator.test.tsx \
            tests/hooks/quotes/quoteHelpers.freight.test.ts \
            --coverage \
            --coverage.include='src/components/kit-builder/FreightEstimator.tsx' \
            --coverage.include='src/hooks/quotes/quoteHelpers.ts' \
            --coverage.reporter=json-summary \
            --coverage.thresholds.lines=75 \
            --reporter=dot
      - name: Check critical path coverage thresholds
        run: node scripts/check-critical-path-coverage.mjs
        env:
          COVERAGE_JSON_PATH: coverage/coverage-summary.json

  webhook-matrix:
    name: Webhook Scenario Matrix (≥200 cenários, 0 HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run webhook contract matrix
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            tests/contracts/webhook-scenario-matrix.test.ts \
            --reporter=verbose

  edge-integration-suite:
    name: Edge Functions · Freight CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run all edge integration tests
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            tests/edge-functions/integration/ \
            --reporter=dot

  edge-coverage-gate:
    # E49: renamed to reflect what it actually measures (contract presence, not code coverage)
    name: Edge Integration Presence Gate (≥60% functions covered)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # E49: script only reads filesystem — no npm install needed
      - name: Check edge integration presence percentage
        run: node scripts/check-edge-integration-coverage.mjs
        env:
          EDGE_COVERAGE_THRESHOLD: '60'

  freight-e2e:
    name: E2E Freight Flow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run freight E2E flow
        run: |
          npx playwright test e2e/flows/33-quote-freight-delivery.spec.ts \
            --project=chromium-authed \
            --reporter=dot
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:8080' }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-freight-report
          path: playwright-report/
          retention-days: 14

  massive-fuzzing:
    name: Massive Fuzzing Session
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run 1000 hermetic fuzzing scenarios
        run: TZ=America/Sao_Paulo npx vitest run tests/integration/massive-fuzzing.test.ts
