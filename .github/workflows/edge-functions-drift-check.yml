name: edge-functions-drift-check

# =============================================================================
# Drift check entre o repo (supabase/functions/**) e o projeto canônico no
# Supabase. Falha o build se um ou mais slugs estiverem com hash divergente.
#
# Rodadas:
#   - cron diário (06:06 BRT = 09:06 UTC)
#   - todo PR (sem filtro paths — step check_paths decide se drift é necessário;
#     E74 fix: required check funciona em qualquer PR, não só os que tocam funções)
#   - manual via workflow_dispatch
#   - logo após "Deploy Edge Functions" terminar em main (E65)
#
# Requer um secret: SUPABASE_ACCESS_TOKEN
#   Personal Access Token de Management API:
#     https://supabase.com/dashboard/account/tokens
#
# Variável (não-secret) que pode ser sobrescrita:
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
# =============================================================================

on:
  schedule:
    - cron: '6 9 * * *'   # 09:06 UTC / 06:06 BRT (E58)
  pull_request:
    # Sem filtro paths — roda em todos os PRs para que o required check
    # "Compare GitHub × Canonical" seja efetivo (E74 fix — Codex P1).
    # O step check_paths detecta se algum arquivo de edge function mudou;
    # se não mudou, o job passa sem executar o drift check custoso.
  workflow_dispatch:
  # E65 (plano de 100, 2026-09-24): antes só rodava em PR e no cron diário —
  # drift introduzido entre um merge e o próximo cron (até 24h) era
  # silencioso. Dispara logo após "Deploy Edge Functions" terminar em main,
  # comparando o canônico contra o que acabou de ser (re)deployado.
  workflow_run:
    workflows: ['Deploy Edge Functions']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: edge-functions-drift-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  drift:
    name: Compare GitHub × Canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          # E57: pull_request usa SHA exato do head (não o merge commit do tip do branch);
          #      workflow_run usa o SHA que acabou de ser deployado;
          #      fallback para github.sha nos demais eventos.
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          # fetch-depth: 2 necessário para git diff HEAD^1 HEAD no step check_paths (E74)
          fetch-depth: 2

      - name: Check se arquivos de edge function mudaram
        id: check_paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needs_drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD^1 = parent 1 do merge commit = tip do branch base do PR
          # fetch-depth: 2 no checkout garante que HEAD^1 existe.
          # Se o diff falhar por qualquer motivo, conservativamente executa o drift check.
          if ! changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null); then
            echo "::warning::git diff HEAD^1 HEAD falhou — executando drift check por precaução"
            echo "needs_drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          needs_drift=false
          # Usar herestring <<< ao invés de printf|grep-q para evitar SIGPIPE
          # com pipefail ativo (grep -q sai cedo após match, status 141 do pipe
          # propaga via pipefail e o if avalia falso silenciosamente).
          if grep -qE '^(supabase/functions/|audit/edge-functions-canonical-only\.json|\.github/workflows/edge-functions-drift-check\.yml|supabase/config\.toml|\.security/edge-functions-verify-jwt-false-allowlist\.json)' <<< "$changed"; then
            needs_drift=true
          fi
          echo "needs_drift=$needs_drift" >> "$GITHUB_OUTPUT"
          if [ "$needs_drift" = "false" ]; then
            echo "::notice::Nenhum arquivo de edge function alterado — drift check pulado. Required check satisfeito."
          fi

      - name: Verify required secrets
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN não configurado}"
      - name: Install Supabase CLI
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          # supabase/setup-cli@v2 bloqueada pela GitHub Actions policy (P46).
          VERSION="2.101.0"
          wget -q "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" \
               -O /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
          chmod +x /usr/local/bin/supabase
          supabase --version

      - name: Resolve list of slugs from repo
        id: list_slugs
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          slugs=$(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' -print0 \
            | xargs -0 -n1 dirname | xargs -n1 basename | sort -u)
          echo "Found $(echo "$slugs" | wc -l) slugs in repo"
          echo "$slugs" > /tmp/repo_slugs.txt

          allowlist="audit/edge-functions-canonical-only.json"
          jq -e '
            (.project_ref == "doufsxqlfjyuvxuezpln") and
            (.functions | type == "array") and
            all(.functions[];
              (.slug | type == "string" and length > 0) and
              (.owner | type == "string" and length > 0) and
              (.reason | type == "string" and length > 0)
            )
          ' "$allowlist" >/dev/null
          jq -r '.functions[].slug' "$allowlist" | sort -u > /tmp/canonical_only_allowlist.txt

          declared=$(jq '.functions | length' "$allowlist")
          unique=$(wc -l < /tmp/canonical_only_allowlist.txt)
          if [ "$declared" -ne "$unique" ]; then
            echo "::error::Slugs duplicados em $allowlist"
            exit 1
          fi

      - name: List edge functions in canonical
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '.[].slug' | sort -u > /tmp/canonical_slugs.txt
          echo "Found $(wc -l < /tmp/canonical_slugs.txt) functions in canonical"

      - name: Detect orphans and missing deploys
        id: slug_diff
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          # ok (comm || true): comm pode falhar se um dos arquivos estiver vazio — arquivo de saída vazio é resultado válido para cada diff
          comm -23 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt > /tmp/missing_deploy.txt || true  # ok: comm exits 1 on empty input — empty output is valid
          comm -13 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt > /tmp/canonical_not_in_repo.txt || true  # ok: idem
          comm -23 /tmp/canonical_not_in_repo.txt /tmp/canonical_only_allowlist.txt > /tmp/orphans.txt || true  # ok: idem
          comm -12 /tmp/canonical_not_in_repo.txt /tmp/canonical_only_allowlist.txt > /tmp/canonical_only_present.txt || true  # ok: idem
          comm -23 /tmp/canonical_only_allowlist.txt /tmp/canonical_slugs.txt > /tmp/canonical_only_stale.txt || true  # ok: idem
          {
            echo "## Slug-level diff"
            echo
            echo "**🟨 Pending deploy (in repo, not in canonical):**"
            if [ -s /tmp/missing_deploy.txt ]; then
              sed 's/^/- /' /tmp/missing_deploy.txt
            else
              echo "- _(none)_"
            fi
            echo
            echo "**🟥 Orphans (in canonical, not in repo):**"
            if [ -s /tmp/orphans.txt ]; then
              sed 's/^/- /' /tmp/orphans.txt
            else
              echo "- _(none)_"
            fi
            echo
            echo "**🟦 Canonical-only documentadas:**"
            if [ -s /tmp/canonical_only_present.txt ]; then
              sed 's/^/- /' /tmp/canonical_only_present.txt
            else
              echo "- _(none)_"
            fi
            if [ -s /tmp/canonical_only_stale.txt ]; then
              echo
              echo "**⚠️ Entradas canonical-only ausentes no canônico:**"
              sed 's/^/- /' /tmp/canonical_only_stale.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            if [ -s /tmp/missing_deploy.txt ]; then echo "has_missing=true"; else echo "has_missing=false"; fi
            if [ -s /tmp/orphans.txt ]; then echo "has_orphans=true"; else echo "has_orphans=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Download functions from canonical and diff content
        id: hash_diff
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical_download

          drift_count=0
          missing_in_dl=0
          aligned_count=0
          {
            echo "slug,status,repo_sha256,canonical_sha256,files_compared,notes"
          } > /tmp/drift_report.csv

          for slug in $(comm -12 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt); do
            target_dir="/tmp/canonical_download/$slug"
            mkdir -p "$target_dir/supabase"

            # E57: 2 retries (3 tentativas no total) em caso de falha de download.
            # Erros transitórios da Management API causavam falsos positivos.
            _dl_ok=0
            for _dl_attempt in 1 2 3; do
              if supabase functions download "$slug" \
                    --project-ref "$SUPABASE_PROJECT_REF" \
                    --use-api \
                    --workdir "$target_dir" > /tmp/dl.log 2>&1; then
                _dl_ok=1
                break
              fi
              echo "::warning::Download attempt $_dl_attempt/3 for $slug failed: $(tail -n 1 /tmp/dl.log)"
              [ "$_dl_attempt" -lt 3 ] && sleep 5
            done
            if [ "$_dl_ok" -eq 0 ]; then
              missing_in_dl=$((missing_in_dl+1))
              echo "$slug,download_failed,,," >> /tmp/drift_report.csv
              continue
            fi

            canon_dir="$target_dir/supabase/functions/$slug"
            if [ ! -d "$canon_dir" ]; then
              canon_index="$(find "$target_dir" -name index.ts -print -quit || true)"  # ok: find retorna non-zero em certas condições de permissão — string vazia é tratada abaixo
              if [ -n "$canon_index" ]; then
                canon_dir="$(dirname "$canon_index")"
              fi
            fi

            if [ ! -d "$canon_dir" ] || [ -z "$(find "$canon_dir" -type f -print -quit)" ]; then
              echo "::warning::diretório da função não encontrado após download para $slug"
              missing_in_dl=$((missing_in_dl+1))
              echo "$slug,no_index_after_download,,," >> /tmp/drift_report.csv
              continue
            fi

            canon_manifest=$(cd "$target_dir" && find supabase/functions -type f -print0 | sort -z | xargs -0 sha256sum)
            files_compared=$(echo "$canon_manifest" | wc -l)
            canon_sha=$(printf '%s' "$canon_manifest" | sha256sum | awk '{print $1}')

            # E030: symmetric — also detects files in repo absent from canonical
            printf '%s\n' "$canon_manifest" | awk '{print $2}' > "/tmp/canon_paths_${slug}.txt"
            repo_manifest=$(
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                relpath=$(printf '%s' "$line" | awk '{print $2}')
                if [ -f "$relpath" ]; then
                  h=$(sha256sum "$relpath" | awk '{print $1}')
                else
                  h="MISSING"
                fi
                printf '%s  %s\n' "$h" "$relpath"
              done <<< "$canon_manifest"
              find "supabase/functions/$slug" -type f 2>/dev/null | sort | while IFS= read -r f; do
                if ! grep -qxF "$f" "/tmp/canon_paths_${slug}.txt" 2>/dev/null; then
                  printf 'REPO_ONLY  %s\n' "$f"
                fi
              done
            )
            rm -f "/tmp/canon_paths_${slug}.txt"
            repo_sha=$(printf '%s' "$repo_manifest" | sha256sum | awk '{print $1}')

            if [ "$repo_sha" = "$canon_sha" ]; then
              aligned_count=$((aligned_count+1))
              echo "$slug,aligned,$repo_sha,$canon_sha,$files_compared," >> /tmp/drift_report.csv
            else
              drift_count=$((drift_count+1))
              echo "$slug,DRIFT,$repo_sha,$canon_sha,$files_compared," >> /tmp/drift_report.csv
            fi
          done

          {
            echo "drift_count=$drift_count"
            echo "missing_in_dl=$missing_in_dl"
            echo "aligned_count=$aligned_count"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Hash-level diff"
            echo
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| ✅ Aligned | $aligned_count |"
            echo "| 🟧 Drift | $drift_count |"
            echo "| ⚠️ Download failed | $missing_in_dl |"
            echo
            if [ "$drift_count" -gt 0 ]; then
              echo "### Drifted slugs"
              awk -F, '$2=="DRIFT" {print "- `"$1"`"}' /tmp/drift_report.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report
        if: steps.check_paths.outputs.needs_drift != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report
          path: /tmp/drift_report.csv
          retention-days: 14

      - name: Setup Node.js
        if: steps.check_paths.outputs.needs_drift != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify_jwt per function — allowlist gate (E42)
        id: verify_jwt_gate
        if: steps.check_paths.outputs.needs_drift != 'false'
        continue-on-error: true
        run: |
          set +e
          node scripts/check-edge-verify-jwt-allowlist.mjs --require-live --out=/tmp/verify_jwt_report.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verify_jwt report
        if: always() && steps.check_paths.outputs.needs_drift != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-jwt-report
          path: /tmp/verify_jwt_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment on PR (drift)
        if: github.event_name == 'pull_request' && steps.check_paths.outputs.needs_drift != 'false' && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('/tmp/drift_report.csv', 'utf-8');
            const drifted = csv.split('\n').filter(l => l.includes(',DRIFT,'));
            const downloadFailed = csv.split('\n').filter(l => l.includes(',download_failed,'));
            const orphans = fs.readFileSync('/tmp/orphans.txt', 'utf-8').trim();
            const missing = fs.readFileSync('/tmp/missing_deploy.txt', 'utf-8').trim();
            let body = '## 🛡️ Drift check — GitHub × Supabase\n\n';
            if (drifted.length > 0) {
              body += `**🟧 ${drifted.length} function(s) com conteúdo divergente:**\n\n`;
              for (const line of drifted) { body += `- \`${line.split(',')[0]}\`\n`; }
              body += '\n';
            }
            if (downloadFailed.length > 0) {
              body += `**⚠️ ${downloadFailed.length} função(ões) sem comparação por falha de download:**\n\n`;
              for (const line of downloadFailed) { body += `- \`${line.split(',')[0]}\`\n`; }
              body += '\n';
            }
            if (missing) { body += `**🟨 Sem deploy no canônico:**\n${missing.split('\n').map(s=>`- \`${s}\``).join('\n')}\n\n`; }
            if (orphans) { body += `**🟥 Órfãs no canônico:**\n${orphans.split('\n').map(s=>`- \`${s}\``).join('\n')}\n\n`; }
            body += '\n_Antes de mergear: aplicar PR conciliador trazendo o source canônico para o repo, ou redeployar o branch do PR._';
            github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });

      - name: Open or escalate issue (scheduled drift)
        # E57: consecutive-failure gate.
        # 1ª falha  → cria issue drift-check-pending (silenciosa, sem notificação de equipe).
        # 2ª falha consecutiva → escala pending para drift-check (notifica a equipe).
        # Se drift-check já existe (falhas anteriores já escaladas) → apenas comenta.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_run') && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('/tmp/drift_report.csv', 'utf-8');
            const drifted = csv.split('\n').filter(l => l.includes(',DRIFT,'));
            const downloadFailed = csv.split('\n').filter(l => l.includes(',download_failed,'));
            const today = new Date().toISOString().slice(0,10);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const detailBody = `Detectadas ${drifted.length} divergências no cron diário.\n\n`
              + (drifted.length ? drifted.map(l => `- \`${l.split(',')[0]}\``).join('\n') : '_(sem slugs drifted)_')
              + (downloadFailed.length
                ? `\n\nDownloads inconclusivos (após 3 tentativas): ${downloadFailed.map(l => `\`${l.split(',')[0]}\``).join(', ')}`
                : '')
              + `\n\nVer artefato \`drift-report\` em [run #${context.runId}](${runUrl}) para os hashes.`;

            // E57: verifica pending (1ª falha) e confirmed (2ª+ falha) separadamente
            const [pendingRes, confirmedRes] = await Promise.all([
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'drift-check-pending', per_page: 10
              }),
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'drift-check', per_page: 10
              })
            ]);

            const pendingIssue = pendingRes.data.find(i => i.title.startsWith('[drift-check-pending]'));
            const confirmedIssue = confirmedRes.data.find(i => i.title.startsWith('[drift-check]'));

            if (confirmedIssue) {
              // Issue confirmada já existe → apenas comentar com atualização (dedupe)
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: confirmedIssue.number,
                body: `**Atualização ${today}:**\n\n${detailBody}`
              });
            } else if (pendingIssue) {
              // 2ª falha consecutiva → escala para drift-check real (notifica equipe)
              const confirmedTitle = `[drift-check] ${drifted.length} divergência(s), ${downloadFailed.length} download(s) inconclusivo(s) em ${today}`;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pendingIssue.number,
                title: confirmedTitle,
                labels: ['drift-check', 'priority/high'],
                body: `**2ª falha consecutiva — drift confirmado (E57 consecutive-failure gate).**\n\n${detailBody}\n\n_(Promovido de \`drift-check-pending\` após 2 falhas consecutivas sem sucesso entre elas.)_`
              });
            } else {
              // 1ª falha → cria pending (não notifica ainda, aguarda confirmação)
              const pendingTitle = `[drift-check-pending] ${drifted.length} divergência(s) em ${today}`;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: pendingTitle,
                body: `**1ª falha detectada — aguardando confirmação na próxima execução (E57 consecutive-failure gate).**\n\n${detailBody}\n\n_(Será escalada para \`drift-check\` se a próxima execução também falhar. Se a próxima for OK, esta issue será fechada automaticamente.)_`,
                labels: ['drift-check-pending']
              });
            }

      - name: Reset consecutive-failure counter on success (scheduled)
        # E57: fecha qualquer issue drift-check-pending em aberto quando o drift some,
        # resetando o contador para que uma falha isolada futura comece do zero.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_run') && steps.hash_diff.outputs.drift_count == '0' && steps.hash_diff.outputs.missing_in_dl == '0' && steps.slug_diff.outputs.has_orphans != 'true' && steps.slug_diff.outputs.has_missing != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const pendingRes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-check-pending', per_page: 10
            });
            for (const issue of pendingRes.data.filter(i => i.title.startsWith('[drift-check-pending]'))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Sem drift em ${today} — execução bem-sucedida após a falha anterior. Contador resetado.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

      - name: Fail if drift detected
        if: steps.check_paths.outputs.needs_drift != 'false' && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        run: |
          # E203: Em PRs, todo drift (conteúdo, missing, orphan) é advisory — não bloqueia merge.
          # A função modificada/adicionada só pode ser deployada pós-merge via "Deploy Edge Functions".
          # Bloquear em has_missing ou has_orphans criaria deadlock: não se deploya antes de mergear,
          # não se mergeia porque a função não está deployada.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Drift advisory para PR — conteúdo: ${{ steps.hash_diff.outputs.drift_count }} função(ões), missing: ${{ steps.slug_diff.outputs.has_missing }}, orphans: ${{ steps.slug_diff.outputs.has_orphans }}. Será resolvido pelo deploy pós-merge via 'Deploy Edge Functions'."
            exit 0
          fi
          echo "::error::Drift detectado entre GitHub e canônico. Veja sumário do job e artefato drift-report.csv."
          echo "::error::Resoluções possíveis:"
          echo "::error::  1. Drift de conteúdo: rodar 'supabase functions download <slug>' e commit no repo"
          echo "::error::  2. Órfã no canônico: deletar via dashboard ou commit em supabase/functions/<slug>/"
          echo "::error::  3. Sem deploy: aguardar workflow Deploy Edge Functions ou disparar manual"
          exit 1

      - name: Fail if verify_jwt allowlist gate failed
        if: steps.check_paths.outputs.needs_drift != 'false' && steps.verify_jwt_gate.outputs.exit_code != '0'
        run: |
          echo "::error::Gate de verify_jwt/allowlist falhou (scripts/check-edge-verify-jwt-allowlist.mjs, exit=${{ steps.verify_jwt_gate.outputs.exit_code }})."
          echo "::error::Veja o log do passo 'Verify_jwt per function — allowlist gate (E42)' acima para a lista de funções sem allowlist."
          echo "::error::Correção: documentar em .security/edge-functions-verify-jwt-false-allowlist.json com um reason real,"
          echo "::error::ou reverter verify_jwt=false indevido em supabase/config.toml."
          exit 1
