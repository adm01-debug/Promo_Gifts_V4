name: edge-functions-drift-check

# =============================================================================
# Drift check entre o repo (supabase/functions/**) e o projeto canônico no
# Supabase. Falha o build se um ou mais slugs estiverem com hash divergente.
#
# Rodadas:
#   - cron diário (06:06 BRT = 09:06 UTC)
#   - todo PR (sem filtro paths — step check_paths decide se drift é necessário;
#     E74 fix: required check funciona em qualquer PR, não só os que tocam funções)
#   - manual via workflow_dispatch
#   - logo após "Deploy Edge Functions" terminar em main (E65)
#
# Requer um secret: SUPABASE_ACCESS_TOKEN
#   Personal Access Token de Management API:
#     https://supabase.com/dashboard/account/tokens
#
# Variável (não-secret) que pode ser sobrescrita:
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
# =============================================================================

on:
  schedule:
    - cron: '6 9 * * *'   # 09:06 UTC / 06:06 BRT (E58)
  pull_request:
    # Sem filtro paths — roda em todos os PRs para que o required check
    # "Compare GitHub × Canonical" seja efetivo (E74 fix — Codex P1).
    # O step check_paths detecta se algum arquivo de edge function mudou;
    # se não mudou, o job passa sem executar o drift check custoso.
  workflow_dispatch:
  # E65 (plano de 100, 2026-09-24): antes só rodava em PR e no cron diário —
  # drift introduzido entre um merge e o próximo cron (até 24h) era
  # silencioso. Dispara logo após "Deploy Edge Functions" terminar em main,
  # comparando o canônico contra o que acabou de ser (re)deployado.
  workflow_run:
    workflows: ['Deploy Edge Functions']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: edge-functions-drift-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  drift-check:
    name: Compare GitHub × Canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:

      - name: Checkout repo
        uses: actions/checkout@69297313de4cb114ed1Dedb3890c033285c932b00 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check if edge function files changed (context-aware)
        id: check_paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            added_modified=$(git diff --name-only --diff-filter=ACM \
              "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" \
              | grep -E '^supabase/functions/.+' || true)
            if [ -n "$added_modified" ]; then
              echo "needs_drift=true" >> "GGITHUB_OUTPUT"
  
  	  true
            else
              echo "Edge function files not modified in this PR - skipping drift check"
              echo "needs_drift=false" >> "GGITHUB_OUTPUT"
  
  	  true
            fi
          else
            echo "needs_drift=true" >> "GGITHUB_OUTPUT"
  
  true
          fi

      - name: Set up Node.js
        if: steps.check_paths.outputs.needs_drift != 'false'
        uses: actions/setup-node@39696e500aea70ff8010d3b00253d13932fe5b98 # v4.2.1
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies (jsr import map resolution)
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --ignore-scripts --prefer-offline
          else
            echo "No package-lock.json found, skipping npm ci"
          fi

      - name: Get slugs in repo
        if: steps.check_paths.outputs.needs_drift != 'false'
        id: repo_slugs
        run: |
          set -euo pipefail
          slugs=$(ls supabase/functions/ | grep -v _shared | tr '\n' ',' | sed 's/,$//')
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"

      - name: Get slugs in canonical
        if: steps.check_paths.outputs.needs_drift != 'false'
        id: canonical_slugs
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_PROJECT_REF: "${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}" }
        run: |
          set -euo pipefail
          slugs=$(curl -sS --fail \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.io/v1/projects/$SUPABASE_PROJECT_REF/functions" \
            | jq -r '.[].slug' | sort | tr '\n' ',' | sed 's/,$//')
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"

      - name: Compare slug lists (orphans & missing)
        if: steps.check_paths.outputs.needs_drift != 'false'
        id: slug_diff
        run: |
          set -euo pipefail
          repo_list="${{ steps.repo_slugs.outputs.slugs }}"
          canonical_list="${{ steps.canonical_slugs.outputs.slugs }}"
          IFS=',' read -ra repo_slugs     <<< "$repo_list"
          IFS=',' read -ra canonical_slugs <<< "$canonical_list"
          declare -A repo_map
          declare -A canonical_map
          for s in "${repo_slugs[@]}"; do repo_map["$s"]=1; done
          for s in "${canonical_slugs[@]}"; do canonical_map["$s"]=1; done

          orphans=()  # in canonical, not in repo
          missing=()  # in repo, not in canonical
          for s in "${canonical_slugs[@]}"; do
            [[ -z "${repo_map[$s]:-''}" ]] && orphans+=("$s")
          done
          for s in "${repo_slugs[@]}"; do
            [[ -z "${canonical_map[$s]:-''}" ]] && missing+=("$s")
          done

          if [ "${orphans[*]:-'}" != "" ]; then
            echo "::warning::Slugs orphó em canônico (não existem no repo): ${orphans[*]}"
            echo "has_orphans=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_orphans=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${missing[*]:-'}" != "" ]; then
            echo "::warning::Slugs no repo sem deploy no canûnico (possivelmente sem deploy): ${missing[*]}"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
  
    true
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download functions from canonical and diff content
        if: steps.check_paths.outputs.needs_drift != 'false'
        id: hash_diff
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_PROJECT_REF: "${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}" }
        run: |
          set -euo pipefail
          repo_slugs=($(ls supabase/functions/ | grep -v _shared))
          canonical_slugs=($(echo "${{ steps.canonical_slugs.outputs.slugs }}" | tr ',' '\n'))
          declare -A canonical_map
          for s in "${canonical_slugs[@]}"; do canonical_map[$s]=1; done

          mkdir -p drift_download

          drift_count=0
          missing_in_dl_count=0
          report="slug,status,repo_sha256,canonical_sha256,files_compared,notes\n"

          for slug in "${repo_slugs[@]}"; do
            if [[ -z "${canonical_map[$slug]:+set}" ]]; then
              report+="${slug},NOT_IN_CANONICAL,-----------------------------------------------------------------,-----------------------------------------------------------------,0,not in canonical\n"
              continue
            fi

            mkdir -p "drift_download/${slug}"
            curl -sS --fail \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.io/v1/projects/$SUPABASE_PROJECT_REF/functions/${slug}/body" \
              -o "drift_download/${slug}/index.ts" 2>/dev/null || true

            if [ ! -s "drift_download/${slug}/index.ts" ]; then
              report+="${slug},DOWNLOAD_FAILED,-----------------------------------------------------------------,-----------------------------------------------------------------,0,download failed\n"
              missing_in_dl_count=$(( missing_in_dl_count + 1 ))
              continue
            fi

            repo_files=($(find "supabase/functions/${slug}" -type f -name "*.ts" | sort))
            nl_repo=$(echo "${repo_files[*]}" | wc -l)

            if [ "${#repo_files[@]}" -eq 1 ]; then
              # Single-file function: direct SHA256 comparison
              repo_sha256=$(sha256sum "supabase/functions/${slug}/index.ts" | awk '{print $1}')
              canonical_sha256=$(sha256sum "drift_download/${slug}/index.ts" | awk '{print $1}')
              if [ "$repo_sha256" != "$canonical_sha256" ]; then
                drift_count=$(( drift_count + 1 ))
                report+="${slug},DRIFTED,${repo_sha256},${canonical_sha256},1,sha mismatch\n"
              else
                report+="${slug},OK,${repo_sha256},${canonical_sha256},1,OK\n"
              fi
            else
              # Multi-file function: compute aggregate hash over all TS files
              repo_sha256=$(sort -u -<<(for f in "${repo_files[@]}"; do sha256sum "$f"; done +| awk '{print $1}' | sha256sum | awk '{print $1}')
              # Download all files for multi-file function
              for f in "${repo_files[@]}"; do
                fname=$(basename "$f")
                if [ "$fname" != "index.ts" ]; then
                  curl -sS --fail \
                    -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                    -H "Content-Type: application/json" \
                    "https://api.supabase.io/v1/projects/$SUPABASE_PROJECT_REF/functions/${slug}/${fname}" \
                    -o "drift_download/${slug}/${fname}" 2>/dev/null || true
                fi
              done
              dl_files=($(find "drift_download/${slug}" -type f -name "*.ts" | sort))
              canonical_sha256=$(sort -u -<<(for f in "${dl_files[@]}"; do sha256sum "$f"; done) | awk '{print $1}' | sha256sum | awk '{print $1}')
              if [ "$repo_sha256" != "$canonical_sha256" ]; then
                drift_count=$(( drift_count + 1 ))
                report+="${slug},DRIFTED,${repo_sha256},${canonical_sha256},${#dl_files[@]},sha mismatch (multi-file)\n"
              else
                report+="${slug},OK,${repo_sha256},${canonical_sha256},${#dl_files[@]},OK\n"
              fi
            fi
          done

          echo -e "$report" > drift-report.csv
          echo "drift_count=${drift_count}" >> "$GITHUB_OUTPUT"
          echo "missing_in_dl=${missing_in_dl_count}" >> "$GITHUB_OUTPUT"

      - name: Upload drift report artifact
        if: steps.check_paths.outputs.needs_drift != 'false' && always()
        uses: actions/upload-artifact@4cda647f12cef9ad9da3e51d441e93fb7b5423a # v4.6.0
        with:
          name: drift-report
          path: drift-report.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Print drift summary
        if: steps.check_paths.outputs.needs_drift != 'false'
        run: |
          echo "## Drift Check Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.hash_diff.outputs.drift_count }}" -gt 0 ]; then
            echo "> [!WARN] Drift detectado em ${{ steps.hash_diff.outputs.drift_count }} função(es)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> [OK] Nenhum drift de conteúdo detectado." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.hash_diff.outputs.missing_in_dl }}" -gt 0 ]; then
            echo "> [!WARN] ${{ steps.hash_diff.outputs.missing_in_dl }} funçóes no repo sem body no canônico (download falhou)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.slug_diff.outputs.has_orphans }}" = "true" ]; then
            echo "> [!WARN] Slugs orphãs em canônico (NÃO no repo)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.slug_diff.outputs.has_missing }}" = "true" ]; then
            echo "> [!WARN] Slugs no repo sem deploy no canônico." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| slug | status | repo_sha256 | canonical_sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|--------------|-------------------|" >> "$GITHUB_STEP_SUMMARY"
          tail -n +2 drift-report.csv | awk -F, '{print "| " $1 " | " $2 " | " $3 " | " $4 " |"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify_jwt per function — allowlist gate (E42)
        if: steps.check_paths.outputs.needs_drift != 'false'
        id: verify_jwt_gate
        run: |
          set -euo pipefail
          node scripts/check-edge-verify-jwt-allowlist.mjs || { exitcode=$?; echo "exit_code=$exitcode" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Open or update drift-check-pending issue (E57 - schedule only)
        # E57: contador de falhas consecutivas: abre issue na 2a falha, escala na 3a.
        if: |
          ${{
            (github.event_name == 'schedule' || github.event_name == 'workflow_run') &&
            (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const driftCount = parseInt('${{ steps.hash_diff.outputs.drift_count }}');
            const missingInDl = parseInt('${{ steps.hash_diff.outputs.missing_in_dl }}');
            const hasOrphans = '${{ steps.slug_diff.outputs.has_orphans }}' === 'true';
            const hasMissing = '${{ steps.slug_diff.outputs.has_missing }}' === 'true';
            const today = new Date().toISOString().slice(0,10);
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const summary = []
            if (driftCount > 0) summary.push(`${driftCount} função(es) com drift de conteúdo`);
            if (missingInDl > 0) summary.push(`${missingInDl} sem body no canûnico`);
            if (hasOrphans) summary.push('funções orphãs não existem no repo');
            if (hasMissing) summary.push('funções no repo sem deploy no canûnico');

            const pendingRes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-check-pending', per_page: 10
            });
            const pending = pendingRes.data.filter(i => i.title.startsWith('[drift-check-pending]'));
            if (pending.length === 0) {
              // Primeira falha: log simples, não abre issue
              console.log(`[E57] 1a falha no ${today} - monitorando. Drift: ${summary.join(', ')}`);
              // Marca para rastrear sem abrir issue:
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `[drift-check-pending] ${today}',
                body: `Drift detectado em ${today}:\n${summary.join('\n')}\n\nRun: ${runUrl}`,
                labels: ['drift-check-pending']
              });
            } else {
              // Segunda+ falha: escala no issue
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pending[0].number,
                body: `Reinqӭdência em ${today}: ${summary.join(', ')} - [${runUrl}](${runUrl})`
              });
            }

      - name: Close drift-check-pending issue on success (E57 - schedule only)
        # E57: fecha qualquer issue drift-check-pending em aberto quando o drift some,
        # resetando o contador para que uma falha isolada futura comece do zero.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_run') && steps.hash_diff.outputs.drift_count == '0' && steps.hash_diff.outputs.missing_in_dl == '0' && steps.slug_diff.outputs.has_orphans != 'true' && steps.slug_diff.outputs.has_missing != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const pendingRes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-check-pending', per_page: 10
            });
            for (const issue of pendingRes.data.filter(i => i.title.startsWith('[drift-check-pending]'))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Sem drift em ${today} – execução bem-sucedida após a falha anterior. Contador resetado.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

      - name: Fail if drift detected
        if: steps.check_paths.outputs.needs_drift != 'false' && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        run: |
          # E203: Para eventos pull_request, somente drift estrutural (orfã / ausente) bloqueia.
          # Drift de conteúdo em PR é esperado — a função será deployada após o merge via
          # "Deploy Edge Functions". Sem essa distinção qualquer PR que toca uma edge function
          # bloquearia o merge indefinidamente (a função modificada nunca bate com o canônico
          # até ser deployada, e não se pode deployar antes de mergear).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            has_orphans="${{ steps.slug_diff.outputs.has_orphans }}"
            has_missing="${{ steps.slug_diff.outputs.has_missing }}"
            if [ "$has_orphans" = "true" ] || [ "$has_missing" = "true" ]; then
              echo "::error::Drift estrutural detectado: função orfã no canônico ou função no repo sem deploy. Ver sumário."
              exit 1
            fi
            echo "::notice::Drift de conteúdo em ${{ steps.hash_diff.outputs.drift_count }} função(ões) — advisory para PR. Será resolvido pelo deploy pós-merge via 'Deploy Edge Functions'."
            exit 0
          fi
          echo "::error::Drift detectado entre GitHub e canônico. Veja sumário do job e artefato drift-report.csv."
          echo "::error::Resoluções possíveis:"
          echo "::error::  1. Drift de conteúdo: rodar 'supabase functions download <slug>' e commit no repo"
          echo "::error::  2. Orfã no canûnico: deletar via dashboard ou commit em supabase/functions/<slug>/"
          echo "::error::  3. Sem deploy: aguardar workflow Deploy Edge Functions ou disparar manual"
          exit 1

      - name: Fail if verify_jwt allowlist gate failed
        if: steps.check_paths.outputs.needs_drift != 'false' && steps.verify_jwt_gate.outputs.exit_code != '0'
        run: |
          echo "::error::Gate de verify_jwt/allowlist falhou (scripts/check-edge-verify-jwt-allowlist.mjs, exit=${{ steps.verify_jwt_gate.outputs.exit_code }})."
          echo "::error::Veja o log do passo 'Verify_jwt per function — allowlist gate (E42)' acima para a lista de funções sem allowlist."
          echo "::error::Correção: documentar em .security/edge-functions-verify-jwt-false-allowlist.json com um reason real,"
          echo "::error::ou reverter verify_jwt=false indevido em supabase/config.toml."
          exit 1
