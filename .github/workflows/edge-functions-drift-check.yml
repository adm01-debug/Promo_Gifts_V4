name: edge-functions-drift-check

# =============================================================================
# Drift check entre o repo (supabase/functions/**) e o projeto canônico no
# Supabase. Falha o build se um ou mais slugs estiverem com hash divergente.
#
# Rodadas:
#   - cron diário (06:00 BRT = 09:00 UTC)
#   - todo PR que toca supabase/functions/**
#   - manual via workflow_dispatch
#   - logo após "Deploy Edge Functions" terminar em main (E65)
#
# Requer um secret: SUPABASE_ACCESS_TOKEN
#   Personal Access Token de Management API:
#     https://supabase.com/dashboard/account/tokens
#
# Variável (não-secret) que pode ser sobrescrita:
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
# =============================================================================

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'audit/edge-functions-canonical-only.json'
      - '.github/workflows/edge-functions-drift-check.yml'
  workflow_dispatch:
  # E65 (plano de 100, 2026-09-24): antes só rodava em PR e no cron diário —
  # drift introduzido entre um merge e o próximo cron (até 24h) era
  # silencioso. Dispara logo após "Deploy Edge Functions" terminar em main,
  # comparando o canônico contra o que acabou de ser (re)deployado.
  workflow_run:
    workflows: ['Deploy Edge Functions']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  drift:
    name: Compare GitHub × Canonical
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Resolve list of slugs from repo
        id: list_slugs
        run: |
          set -euo pipefail
          slugs=$(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' \
            -exec dirname {} \; | xargs -n1 basename | sort -u)
          echo "Found $(echo "$slugs" | wc -l) slugs in repo"
          echo "$slugs" > /tmp/repo_slugs.txt

          allowlist="audit/edge-functions-canonical-only.json"
          jq -e '
            (.project_ref == "doufsxqlfjyuvxuezpln") and
            (.functions | type == "array") and
            all(.functions[];
              (.slug | type == "string" and length > 0) and
              (.owner | type == "string" and length > 0) and
              (.reason | type == "string" and length > 0)
            )
          ' "$allowlist" >/dev/null
          jq -r '.functions[].slug' "$allowlist" | sort -u > /tmp/canonical_only_allowlist.txt

          declared=$(jq '.functions | length' "$allowlist")
          unique=$(wc -l < /tmp/canonical_only_allowlist.txt)
          if [ "$declared" -ne "$unique" ]; then
            echo "::error::Slugs duplicados em $allowlist"
            exit 1
          fi

      - name: List edge functions in canonical
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '.[].slug' | sort -u > /tmp/canonical_slugs.txt
          echo "Found $(wc -l < /tmp/canonical_slugs.txt) functions in canonical"

      - name: Detect orphans and missing deploys
        id: slug_diff
        run: |
          set -euo pipefail
          comm -23 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt > /tmp/missing_deploy.txt || true
          comm -13 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt > /tmp/canonical_not_in_repo.txt || true
          comm -23 /tmp/canonical_not_in_repo.txt /tmp/canonical_only_allowlist.txt > /tmp/orphans.txt || true
          comm -12 /tmp/canonical_not_in_repo.txt /tmp/canonical_only_allowlist.txt > /tmp/canonical_only_present.txt || true
          comm -23 /tmp/canonical_only_allowlist.txt /tmp/canonical_slugs.txt > /tmp/canonical_only_stale.txt || true
          {
            echo "## Slug-level diff"
            echo
            echo "**🟨 Pending deploy (in repo, not in canonical):**"
            if [ -s /tmp/missing_deploy.txt ]; then
              sed 's/^/- /' /tmp/missing_deploy.txt
            else
              echo "- _(none)_"
            fi
            echo
            echo "**🟥 Orphans (in canonical, not in repo):**"
            if [ -s /tmp/orphans.txt ]; then
              sed 's/^/- /' /tmp/orphans.txt
            else
              echo "- _(none)_"
            fi
            echo
            echo "**🟦 Canonical-only documentadas:**"
            if [ -s /tmp/canonical_only_present.txt ]; then
              sed 's/^/- /' /tmp/canonical_only_present.txt
            else
              echo "- _(none)_"
            fi
            if [ -s /tmp/canonical_only_stale.txt ]; then
              echo
              echo "**⚠️ Entradas canonical-only ausentes no canônico:**"
              sed 's/^/- /' /tmp/canonical_only_stale.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            if [ -s /tmp/missing_deploy.txt ]; then echo "has_missing=true"; else echo "has_missing=false"; fi
            if [ -s /tmp/orphans.txt ]; then echo "has_orphans=true"; else echo "has_orphans=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Download functions from canonical and diff content
        id: hash_diff
        # -----------------------------------------------------------------
        # Etapa E42 (2026-09-16): antes, este passo só comparava o hash de
        # `index.ts`. >=21 funções têm arquivos co-localizados além de
        # index.ts (ex. crm-db-bridge tem 8, simulation-orchestrator e
        # connections-auto-test têm 4) — código diferente nesses arquivos
        # era drift invisível. A maioria desses arquivos extras são
        # `*.test.ts` (Deno tests), que NÃO fazem parte do bundle deployado
        # — confirmado ao vivo via Management API (`GET .../functions/{slug}`
        # em crm-db-bridge: retorna só index.ts + os módulos de
        # `_shared/` que ele importa, nunca os 7 `*.test.ts` locais).
        # Por isso a comparação abaixo NÃO hasheia "tudo que existe no
        # diretório do repo" (incluiria testes nunca deployados → falso
        # positivo). Em vez disso, usa a lista de arquivos que o PRÓPRIO
        # download retornou como fonte da verdade de "o que é o bundle" —
        # isso também cobre `supabase/functions/_shared/*.ts`, que o
        # download traz como irmão de `$slug/` e que a versão antiga deste
        # gate nunca comparava.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical_download

          drift_count=0
          missing_in_dl=0
          aligned_count=0
          {
            echo "slug,status,repo_sha256,canonical_sha256,files_compared,notes"
          } > /tmp/drift_report.csv

          for slug in $(comm -12 /tmp/repo_slugs.txt /tmp/canonical_slugs.txt); do
            target_dir="/tmp/canonical_download/$slug"
            mkdir -p "$target_dir/supabase"

            if ! supabase functions download "$slug" \
                  --project-ref "$SUPABASE_PROJECT_REF" \
                  --use-api \
                  --workdir "$target_dir" > /tmp/dl.log 2>&1; then
              echo "::warning::Falha ao baixar $slug: $(tail -n 1 /tmp/dl.log)"
              missing_in_dl=$((missing_in_dl+1))
              echo "$slug,download_failed,,,," >> /tmp/drift_report.csv
              continue
            fi

            canon_dir="$target_dir/supabase/functions/$slug"
            if [ ! -d "$canon_dir" ]; then
              canon_index="$(find "$target_dir" -name index.ts -print -quit || true)"
              if [ -n "$canon_index" ]; then
                canon_dir="$(dirname "$canon_index")"
              fi
            fi

            if [ ! -d "$canon_dir" ] || [ -z "$(find "$canon_dir" -type f -print -quit)" ]; then
              echo "::warning::diretório da função não encontrado após download para $slug"
              missing_in_dl=$((missing_in_dl+1))
              echo "$slug,no_index_after_download,,,," >> /tmp/drift_report.csv
              continue
            fi

            # Manifesto = lista "sha256  caminho_relativo" de TODOS os arquivos
            # que o download trouxe (raiz = $target_dir, caminhos tipo
            # supabase/functions/<slug>/index.ts e
            # supabase/functions/_shared/<helper>.ts), em ordem estável.
            canon_manifest=$(cd "$target_dir" && find supabase/functions -type f -print0 | sort -z | xargs -0 sha256sum)
            files_compared=$(echo "$canon_manifest" | wc -l)
            canon_sha=$(printf '%s' "$canon_manifest" | sha256sum | awk '{print $1}')

            # Mesmo manifesto, mas hasheando o arquivo correspondente do repo
            # (mesmo caminho relativo). Arquivo ausente no repo => "MISSING"
            # em vez do hash, para não mascarar um caminho deployado que não
            # existe mais localmente.
            # Capturado via $(...) (não concatenação manual) de propósito: o
            # mesmo tipo de captura que gerou canon_manifest acima, para que
            # os dois lados percam (ou não) a quebra de linha final do MESMO
            # jeito antes do sha256 final — misturar os dois estilos faz o
            # hash de repo_manifest e canon_manifest divergirem mesmo com
            # conteúdo logicamente idêntico (bug real encontrado e corrigido
            # em teste manual desta etapa, 2026-09-16).
            repo_manifest=$(
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                relpath=$(printf '%s' "$line" | awk '{print $2}')
                if [ -f "$relpath" ]; then
                  h=$(sha256sum "$relpath" | awk '{print $1}')
                else
                  h="MISSING"
                fi
                printf '%s  %s\n' "$h" "$relpath"
              done <<< "$canon_manifest"
            )
            repo_sha=$(printf '%s' "$repo_manifest" | sha256sum | awk '{print $1}')

            if [ "$repo_sha" = "$canon_sha" ]; then
              aligned_count=$((aligned_count+1))
              echo "$slug,aligned,$repo_sha,$canon_sha,$files_compared," >> /tmp/drift_report.csv
            else
              drift_count=$((drift_count+1))
              echo "$slug,DRIFT,$repo_sha,$canon_sha,$files_compared," >> /tmp/drift_report.csv
            fi
          done

          {
            echo "drift_count=$drift_count"
            echo "missing_in_dl=$missing_in_dl"
            echo "aligned_count=$aligned_count"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Hash-level diff"
            echo
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| ✅ Aligned | $aligned_count |"
            echo "| 🟧 Drift | $drift_count |"
            echo "| ⚠️ Download failed | $missing_in_dl |"
            echo
            if [ "$drift_count" -gt 0 ]; then
              echo "### Drifted slugs"
              awk -F, '$2=="DRIFT" {print "- `"$1"`"}' /tmp/drift_report.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: /tmp/drift_report.csv

      # -----------------------------------------------------------------
      # Etapa E42 (2026-09-16): checagem independente de verify_jwt — a
      # comparação de hash acima nunca olhou pra isso. Roda em modo
      # --require-live porque este job já exige SUPABASE_ACCESS_TOKEN (ver
      # cabeçalho do arquivo); sem live evidence aqui vira `inconclusive`
      # (exit 2), não passa em silêncio. `continue-on-error` só para deixar
      # os passos de relatório abaixo rodarem antes do job falhar de fato —
      # a falha real acontece no passo "Fail if verify_jwt..." no final.
      - name: Verify_jwt per function — allowlist gate (E42)
        id: verify_jwt_gate
        continue-on-error: true
        run: |
          set +e
          node scripts/check-edge-verify-jwt-allowlist.mjs --require-live --out=/tmp/verify_jwt_report.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verify_jwt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-jwt-report
          path: /tmp/verify_jwt_report.json
          if-no-files-found: ignore

      - name: Comment on PR (drift)
        if: github.event_name == 'pull_request' && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('/tmp/drift_report.csv', 'utf-8');
            const drifted = csv.split('\n').filter(l => l.includes(',DRIFT,'));
            const downloadFailed = csv.split('\n').filter(l => l.includes(',download_failed,'));
            const orphans = fs.readFileSync('/tmp/orphans.txt', 'utf-8').trim();
            const missing = fs.readFileSync('/tmp/missing_deploy.txt', 'utf-8').trim();
            let body = '## 🛡️ Drift check — GitHub × Supabase\n\n';
            if (drifted.length > 0) {
              body += `**🟧 ${drifted.length} function(s) com conteúdo divergente:**\n\n`;
              for (const line of drifted) {
                body += `- \`${line.split(',')[0]}\`\n`;
              }
              body += '\n';
            }
            if (downloadFailed.length > 0) {
              body += `**⚠️ ${downloadFailed.length} função(ões) sem comparação por falha de download:**\n\n`;
              for (const line of downloadFailed) {
                body += `- \`${line.split(',')[0]}\`\n`;
              }
              body += '\n';
            }
            if (missing) {
              body += `**🟨 Sem deploy no canônico:**\n${missing.split('\n').map(s=>`- \`${s}\``).join('\n')}\n\n`;
            }
            if (orphans) {
              body += `**🟥 Órfãs no canônico:**\n${orphans.split('\n').map(s=>`- \`${s}\``).join('\n')}\n\n`;
            }
            body += '\n_Antes de mergear: aplicar PR conciliador trazendo o source canônico para o repo, ou redeployar o branch do PR._';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Open issue (scheduled drift)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_run') && (steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('/tmp/drift_report.csv', 'utf-8');
            const drifted = csv.split('\n').filter(l => l.includes(',DRIFT,'));
            const downloadFailed = csv.split('\n').filter(l => l.includes(',download_failed,'));
            const today = new Date().toISOString().slice(0,10);
            const title = `[drift-check] ${drifted.length} divergência(s), ${downloadFailed.length} download(s) inconclusivo(s) em ${today}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift-check'
            });
            const dup = existing.data.find(i => i.title.startsWith('[drift-check]'));
            const body = `Detectadas ${drifted.length} divergências no cron diário.\n\n` +
                         drifted.map(l => `- \`${l.split(',')[0]}\``).join('\n') +
                         (downloadFailed.length ? `\n\nDownloads inconclusivos: ${downloadFailed.map(l => `\`${l.split(',')[0]}\``).join(', ')}` : '') +
                         '\n\nVer artefato `drift-report` desta execução para os hashes.';
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body: `Atualização do dia ${today}:\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift-check','priority/high']
              });
            }

      # ---------------------------------------------------------------
      # MODO ENFORCE — quebra build/PR se houver qualquer drift.
      # Validado em 25/05/2026 (run 26413875585): 82/82 aligned, 0 drift.
      # Histórico: começou em modo observação no PR #342, promovido a
      # enforce após primeira execução limpa.
      #
      # Etapa E42 (2026-09-16): o passo hash_diff acima passou a comparar o
      # manifesto do bundle inteiro (index.ts + _shared/* importado), não só
      # index.ts — ver comentário no passo. Validado localmente com dados ao
      # vivo via MCP (108/108 funções, 0 drift na comparação por nome/slug;
      # a comparação por conteúdo do bundle completo roda pela primeira vez
      # na próxima execução real deste workflow — sem token de deploy neste
      # ambiente de edição não é possível re-executar
      # `supabase functions download` aqui para revalidar o "82/82" acima
      # com a métrica nova).
      # ---------------------------------------------------------------
      - name: Fail if drift detected
        if: steps.hash_diff.outputs.drift_count != '0' || steps.hash_diff.outputs.missing_in_dl != '0' || steps.slug_diff.outputs.has_orphans == 'true' || steps.slug_diff.outputs.has_missing == 'true'
        run: |
          echo "::error::Drift detectado entre GitHub e canônico. Veja sumário do job e artefato drift-report.csv."
          echo "::error::Resoluções possíveis:"
          echo "::error::  1. Drift de conteúdo: rodar 'supabase functions download <slug>' e commit no repo"
          echo "::error::  2. Órfã no canônico: deletar via dashboard ou commit em supabase/functions/<slug>/"
          echo "::error::  3. Sem deploy: aguardar workflow Deploy Edge Functions ou disparar manual"
          exit 1

      # ---------------------------------------------------------------
      # Etapa E42 (2026-09-16): gate independente para verify_jwt — falha se
      # alguma função ao vivo com verify_jwt=false não estiver documentada em
      # .security/edge-functions-verify-jwt-false-allowlist.json (ou se uma
      # entrada da allowlist não tiver `reason`). Ver passo "Verify_jwt per
      # function — allowlist gate (E42)" acima para os detalhes.
      # ---------------------------------------------------------------
      - name: Fail if verify_jwt allowlist gate failed
        if: steps.verify_jwt_gate.outputs.exit_code != '0'
        run: |
          echo "::error::Gate de verify_jwt/allowlist falhou (scripts/check-edge-verify-jwt-allowlist.mjs, exit=${{ steps.verify_jwt_gate.outputs.exit_code }})."
          echo "::error::Veja o log do passo 'Verify_jwt per function — allowlist gate (E42)' acima para a lista de funções sem allowlist."
          echo "::error::Correção: documentar em .security/edge-functions-verify-jwt-false-allowlist.json com um reason real,"
          echo "::error::ou reverter verify_jwt=false indevido em supabase/config.toml."
          exit 1
