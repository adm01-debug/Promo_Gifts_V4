name: E2E • Thumb QuickView (paridade + a11y)

# Bloqueia merge em regressão. Roda smoke (fail-fast) e DEPOIS a suíte completa
# em paralelo nos 3 browsers (chromium/firefox/webkit). Falha em qualquer um
# = falha o workflow (matrix sem fail-fast desabilitado = comportamento padrão).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-thumb-quickview-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
  E2E_BASE_URL: http://localhost:8080

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (fail-fast)
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium'
          start-vite: 'false'
      - name: Smoke
        # O smoke instala somente Chromium; os três engines são cobertos pela
        # matriz bloqueante abaixo. Sem escopo, o Playwright tentava iniciar
        # Firefox/WebKit não instalados e produzia 25 falsos negativos.
        run: npx playwright test e2e/flows/03b-thumb-quickview.smoke.spec.ts --project=chromium-public --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: smoke-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  thumb-quickview:
    name: ${{ matrix.browser }} • 03b
    needs: smoke
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium,${{ matrix.browser }}'
          start-vite: 'false'
      - name: Run thumb-quickview suite
        run: |
          npx playwright test e2e/flows/03b-product-thumb-quickview.spec.ts \
            --project=${{ matrix.browser }}-authed \
            --reporter=line,html
      - name: Upload report + traces + videos (${{ matrix.browser }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
