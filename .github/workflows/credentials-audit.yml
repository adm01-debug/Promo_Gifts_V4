name: Credentials Audit

on:
  pull_request:
    paths:
      - 'supabase/functions/**/*.ts'
      - 'supabase/functions/**/*.tsx'
      - 'scripts/audit-credentials.mjs'
      - '.audit-credentials-baseline.json'
      - '.github/workflows/credentials-audit.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: credentials-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static analysis of credential handling
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Run credentials audit
        run: node scripts/audit-credentials.mjs --baseline .audit-credentials-baseline.json
