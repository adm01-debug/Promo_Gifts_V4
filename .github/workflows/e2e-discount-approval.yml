name: E2E Discount Approval (04c*)

# Executa apenas os specs da fila de aprovação de desconto e faz upload
# do playwright-report + trace/screenshot/video em qualquer falha.

on:
  push:
    branches: [main]
    paths:
      - "e2e/flows/04c*.spec.ts"
      - "e2e/helpers/discount-approval-*.ts"
      - "e2e/helpers/setup-discount-admin.ts"
      - "e2e/helpers/discount-notification-seed.ts"
      - "e2e/helpers/pagination-asserts.ts"
      - "src/components/admin/DiscountApproval*"
      - "src/pages/admin/DiscountRequestDetailPage.tsx"
      - ".github/workflows/e2e-discount-approval.yml"
  pull_request:
    paths:
      - "e2e/flows/04c*.spec.ts"
      - "e2e/helpers/discount-approval-*.ts"
      - "e2e/helpers/setup-discount-admin.ts"
      - "e2e/helpers/discount-notification-seed.ts"
      - "e2e/helpers/pagination-asserts.ts"
      - "src/components/admin/DiscountApproval*"
      - "src/pages/admin/DiscountRequestDetailPage.tsx"
      - ".github/workflows/e2e-discount-approval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-discount-approval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  discount-approval-e2e:
    name: Playwright — 04c* (discount approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup

      - name: Build app
        run: npm run build

      - name: Run 04c* discount approval specs (1ª passada)
        id: run1
        env:
          CI: "1"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright test e2e/flows/04c --project=chromium-authed --retries=0 --reporter=html,list,github

      - name: Re-run failed specs (única retentativa)
        if: failure() && steps.run1.conclusion == 'failure'
        env:
          CI: "1"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright test --last-failed --project=chromium-authed --retries=0 --reporter=html,list,github

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-04c
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (trace, screenshot, video, HTML dumps)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-04c
          path: |
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
            e2e/.evidence/
          retention-days: 14
          if-no-files-found: ignore

  discount-widget-badge-live:
    name: Playwright — 04ck (badge pendentes ao vivo) ×3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup

      - name: Build app
        run: npm run build

      - name: Run 04ck (badge pendentes) ×3
        env:
          CI: "1"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright test e2e/flows/04ck --project=chromium-authed --repeat-each=3 --retries=0 --reporter=html,list,github

      - name: Upload Playwright HTML report (04ck)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-04ck
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (04ck)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-04ck
          path: |
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
            e2e/.evidence/
          retention-days: 14
          if-no-files-found: ignore
