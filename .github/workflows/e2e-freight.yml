name: E2E Freight — Matrix (E80)

# Consolidação dos workflows de frete em uma única matriz.
# Substitui: freight-e2e-staging, freight-quality-gates,
#   ci-freight-quality (se tiver specs playwright).
# Os workflows individuais permanecem ativos; este é o dono canônico.
# Nota: e2e-quote-freight-block.yml está consolidado em e2e-quotes.yml (E77).

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/freight/**'
      - 'src/pages/**freight**'
      - 'src/hooks/**freight**'
      - 'e2e/flows/freight-*.spec.ts'
      - 'e2e/visual/quote-freight-block.spec.ts'
      - '.github/workflows/e2e-freight.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/freight/**'
      - 'e2e/flows/freight-*.spec.ts'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a executar (vazio = todas)'
        required: false
        default: ''

# R1 — permissões mínimas
permissions:
  contents: read

# R2 — PRs cancelam; push e dispatch não
concurrency:
  group: e2e-freight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  secrets_check:
    name: Verify E2E secrets (Freight)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check required secrets
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -z "$E2E_USER_EMAIL" ]    && missing+=(E2E_USER_EMAIL)
          [ -z "$E2E_USER_PASSWORD" ] && missing+=(E2E_USER_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]} — configure em Settings › Secrets › Actions"
            exit 1
          fi
          echo "Secrets OK"

  e2e_freight:
    name: E2E Freight · ${{ matrix.suite }}
    needs: [secrets_check]
    runs-on: ubuntu-24.04
    # R3 — timeout por job
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - complete-flow
          - freight-block-visual
        include:
          - suite: complete-flow
            spec: 'e2e/flows/freight-quest-complete-flow.spec.ts'
            project: chromium-authed
          - suite: freight-block-visual
            spec: 'e2e/visual/quote-freight-block.spec.ts'
            project: chromium-public
    # R5 — secrets via env:
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32

      # R4 — node-version-file: .nvmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - name: Filtrar suite
        if: github.event.inputs.suite != '' && github.event.inputs.suite != matrix.suite
        env:
          SUITE_FILTER: ${{ github.event.inputs.suite }}
        run: |
          echo "::notice::Suite ${{ matrix.suite }} ignorada (filtro: $SUITE_FILTER)"
          exit 0

      - name: Run E2E Freight · ${{ matrix.suite }}
        run: |
          npx playwright test ${{ matrix.spec }} \
            --project=${{ matrix.project }} \
            --reporter=line,html

      # R6 — retention-days: 14
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-freight-${{ matrix.suite }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
