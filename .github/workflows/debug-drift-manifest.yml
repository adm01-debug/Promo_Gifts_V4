name: debug-drift-manifest
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump manifests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          REF=doufsxqlfjyuvxuezpln
          OUT=/tmp/dbg
          mkdir -p "$OUT"
          for slug in ai-recommendations cors-audit word-magic mcp-server; do
            td="/tmp/dl/$slug"
            mkdir -p "$td/supabase"
            supabase functions download "$slug" --project-ref "$REF" --use-api --workdir "$td" >/tmp/dl.log 2>&1 || { echo "DLFAIL $slug"; continue; }
            cd "$td"
            find supabase/functions -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/${slug}.canon_manifest.txt"
            printf '%s' "$(cat "$OUT/${slug}.canon_manifest.txt")" | sha256sum | awk '{print $1}' > "$OUT/${slug}.canon_sha.txt"
            cd - >/dev/null
            echo "=== $slug canon_sha=$(cat "$OUT/${slug}.canon_sha.txt") files=$(wc -l < "$OUT/${slug}.canon_manifest.txt")"
            cat "$OUT/${slug}.canon_manifest.txt"
            echo "--- repo files for $slug:"
            find "supabase/functions/$slug" -type f | sort
            echo "--- repo eol:"
            file "supabase/functions/$slug"/* 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dbg-manifests
          path: /tmp/dbg
