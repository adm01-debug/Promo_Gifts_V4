name: Freight E2E — Staging Smoke

# Execução manual com credenciais reais (doufsxqlfjyuvxuezpln).
# NÃO usa CI_SKIP_FREIGHT_E2E — os testes rodam de fato.
# Útil para validar o fluxo de frete após deploy ou antes de release.
#
# Pré-requisito: secrets.VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY
# configurados no repositório (Settings → Secrets → Actions).
# Sem eles o workflow ainda roda mas conecta no projeto canônico via fallback.

on:
  workflow_dispatch:
    inputs:
      extra_info:
        description: 'Contexto opcional (motivo do run, branch, ticket)'
        required: false
        default: ''

# R1 — permissões mínimas
permissions:
  contents: read

# R2 — concurrency sem cancel para trigger manual (evita matar run em progresso)
concurrency:
  group: freight-e2e-staging-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  freight_e2e_staging:
    name: freight-e2e-staging (chromium-public)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # R3 — E2E ≤ 30 min

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'  # R4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
        run: npm run build

      - name: Start preview server (vite preview)
        run: |
          ./node_modules/.bin/vite preview --port 8080 &
          timeout 30 sh -c 'until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 1; done'

      - name: Run freight E2E (staging — com credenciais reais)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
          CI: 'true'
          E2E_BASE_URL: 'http://localhost:8080'
          E2E_REUSE_EXISTING_SERVER: '1'
          EXTRA_INFO: ${{ github.event.inputs.extra_info }}
        run: |
          echo "## Freight E2E Staging Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID:** \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Projeto Supabase:** \`doufsxqlfjyuvxuezpln\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EXTRA_INFO" ]; then
            echo "- **Contexto:** $EXTRA_INFO" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ./node_modules/.bin/playwright test \
            e2e/flows/freight-quest-complete-flow.spec.ts \
            --project=chromium-public \
            --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freight-staging-report-${{ github.run_id }}
          path: |
            playwright-report/
            e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload artefatos de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freight-staging-failure-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.html
            test-results/**/trace.zip
          retention-days: 14
          if-no-files-found: ignore
