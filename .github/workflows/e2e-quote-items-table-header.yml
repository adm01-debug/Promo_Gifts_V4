name: Quote Items Table — Header (cross-browser e2e)

# Garante que o header do QuoteItemsTable (fora do scroller, com
# scrollbar-gutter dinâmico e alinhamento header↔body) não regrida em
# Chromium, Firefox e WebKit.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/components/quotes/**'
      - 'e2e/quotes/quote-items-table-header-radius.spec.ts'
      - '.github/workflows/e2e-quote-items-table-header.yml'
      - 'playwright.config.ts'
  push:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/components/quotes/**'
      - 'e2e/quotes/quote-items-table-header-radius.spec.ts'
      - '.github/workflows/e2e-quote-items-table-header.yml'

concurrency:
  group: quote-items-table-header-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  header-e2e:
    name: Quote Items Table header — ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    permissions:
      contents: read
      # pull-requests: write — removido E92 (não usado neste job)
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_BASE_URL: http://localhost:8080
      PW_TEST_HTML_REPORT_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browser }}
      - name: Run header spec on ${{ matrix.browser }}-public
        run: |
          npx playwright test \
            e2e/quotes/quote-items-table-header-radius.spec.ts \
            --project=${{ matrix.browser }}-public \
            --reporter=list,github
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 14
