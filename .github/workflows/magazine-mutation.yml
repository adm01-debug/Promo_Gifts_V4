name: Magazine Mutation Testing

# Roda o catálogo de mutações M1–M6 contra `tests/magazine/` e produz
# um mutation score consolidado. Uma mutação SURVIVED é lacuna de
# cobertura — o CI falha o job para forçar revisão.

on:
  pull_request:
    paths:
      - 'tests/magazine/**'
      - 'tests/utils/tailwindRings.ts'
      - 'src/pages/magazine/components/PreviewSidebar.tsx'
      - 'src/pages/magazine/components/PagesRail.tsx'
      - 'src/pages/magazine/components/steps/LayoutStep.tsx'
      - 'scripts/mutation-test-magazine.mjs'
      - '.github/workflows/magazine-mutation.yml'
  schedule:
    - cron: '27 6 * * 1' # Segundas 06:27 UTC (drift semanal) — E89
  workflow_dispatch:
    inputs:
      only:
        description: 'Lista de IDs de mutação (ex.: M1,M4)'
        required: false
        default: ''

concurrency:
  group: magazine-mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: Mutation Score (M1–M6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Derivar escopo de mutações a partir do diff (PR)
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          # E81: --only derivado do diff em PR; completo no cron.
          # M1-M3 → tests/utils/tailwindRings.ts
          # M4-M6 → src/pages/magazine/components/PagesRail.tsx
          # Qualquer outro arquivo no paths → todas
          CHANGED=$(git diff --name-only HEAD^ 2>/dev/null || echo "")
          IDS=""
          echo "$CHANGED" | grep -qF "tests/utils/tailwindRings.ts"           && IDS="${IDS}M1,M2,M3,"
          echo "$CHANGED" | grep -qF "src/pages/magazine/components/PagesRail.tsx" && IDS="${IDS}M4,M5,M6,"
          OTHER=$(echo "$CHANGED" \
            | grep -vF "tests/utils/tailwindRings.ts" \
            | grep -vF "src/pages/magazine/components/PagesRail.tsx" \
            | grep -c . || true)  # ok: grep -c exits 1 quando 0 matches — 0 é resultado válido
          if [ "${OTHER:-0}" -gt "0" ]; then
            IDS="M1,M2,M3,M4,M5,M6"
          fi
          CLEAN=$(echo "$IDS" | tr ',' '\n' | sort -u | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          echo "only=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "Mutações selecionadas: ${CLEAN:-todas}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run mutation suite
        env:
          CI: 'true'
          NODE_ENV: 'test'
          # E81: PR → escopo derivado do diff; dispatch → manual; cron → vazio (todas)
          INPUT_ONLY: ${{ steps.scope.outputs.only || github.event.inputs.only }}
        run: |
          ONLY="$INPUT_ONLY"
          if [ -n "$ONLY" ]; then
            node scripts/mutation-test-magazine.mjs --only="$ONLY"
          else
            node scripts/mutation-test-magazine.mjs
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magazine-mutation-report
          path: reports/mutation/
          retention-days: 14

  mutation-ok:
    name: Magazine Mutation OK
    needs: [mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check result
        run: |
          if [ '${{ needs.mutation.result }}' = 'success' ]; then
            echo '✅ Mutation score 100% — todas as mutações killed'
          else
            echo '❌ Alguma mutação sobreviveu ou erro de infra — ver artifact magazine-mutation-report'
            exit 1
          fi
