name: Gitleaks — Full History Audit

# Roda 1 vez por dia + on-demand para escanear TODO o historico Git
# buscando secrets vazados (chaves Supabase, tokens Bitrix, JWTs, etc).
#
# DIFERENCA do .gitleaks.toml: aquele e usado pelo pre-commit hook
# para BLOQUEAR commits novos. Este workflow audita TUDO QUE JA EXISTE.

on:
  schedule:
    - cron: '44 6 * * *'      # diario as 06:44 UTC (03:44 BRT)
  workflow_dispatch:           # botao "Run workflow" no GitHub UI
  push:
    branches: [main]           # tambem audita a cada merge em main

permissions:
  contents: read
  security-events: write  # E174: upload SARIF ao Security Dashboard
  issues: write                # para abrir issue automatica em finding

concurrency:
  group: gitleaks-history-audit-${{ github.ref }}
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  gitleaks-full-history:
    name: Scan complete git history for leaked secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          fetch-depth: 0       # baixa TODO o historico, nao apenas o ultimo commit

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: not required for OSS repos. Adicionar GITLEAKS_LICENSE
          # como secret quando o repo for privatizado (Etapa 1 do plano).
        with:
          config-path: .gitleaks.toml

      - name: Upload SARIF to Security Dashboard (E174)
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: results.sarif
          retention-days: 90  # E88 — auditoria de vazamento de segredos (SARIF); retenção longa justificada para rastreabilidade de segurança

      - name: Compute issue body (gitleaks)
        id: issue_body
        if: failure()
        run: |
          node <<'NODEEOF' >> "$GITHUB_OUTPUT"
          const DELIM = 'BODY_EOF_GITLEAKS';
          const today = new Date().toISOString().slice(0, 10);
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const title = `[SECURITY] Gitleaks encontrou secrets vazados — ${today}`;
          const body = [
            '## Gitleaks detectou possiveis secrets no historico',
            '',
            `Run: ${runUrl}`,
            `Artifact: gitleaks-report-${process.env.GITHUB_RUN_ID}`,
            '',
            '### Acoes obrigatorias',
            `1. Baixar o artifact \`gitleaks-report-${process.env.GITHUB_RUN_ID}\` para detalhes`,
            '2. Categorizar cada finding em:',
            '   - (a) false positive -> adicionar ao allowlist em `.gitleaks.toml`',
            '   - (b) chave ja rotacionada -> documentar e adicionar ao allowlist',
            '   - (c) chave AINDA VALIDA -> **ROTACIONAR IMEDIATAMENTE**',
            '3. Para findings tipo (c): documentar o que foi rotacionado e quando',
            '4. Fechar esta issue apos resolver todos os findings',
            '',
            'SLA: 24h para findings tipo (c), 7 dias para tipos (a)/(b).',
          ].join('\n');
          process.stdout.write(`title=${title}\n`);
          process.stdout.write(`body<<${DELIM}\n${body}\n${DELIM}\n`);
          process.stdout.write(`skip=false\n`);
          NODEEOF

      - name: Reportar issue de gitleaks
        # E12 — ci-issue action com dedupe por marcador <!-- ci-issue:gitleaks-audit -->
        if: failure() && steps.issue_body.outputs.skip != 'true'
        uses: ./.github/actions/ci-issue
        with:
          key: gitleaks-audit
          title: ${{ steps.issue_body.outputs.title }}
          body: ${{ steps.issue_body.outputs.body }}
          labels: security,priority/high,gitleaks
          state: open
