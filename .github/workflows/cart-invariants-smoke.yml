name: Cart Invariants Smoke (Carrinho)

# Run cart-invariants smoke suite in parallel shards.
# Used by Gate 3 (E2E Smoke) and standalone mode.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      shard_index:
        type: number
        required: false
        default: 0
      total_shards:
        type: number
        required: false
        default: 0
      browser:
        type: string
        required: false
        default: 'chromium'
  workflow_dispatch:
    inputs:
      total_shards:
        description: 'Number of parallel shards (default: 0)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: cart-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute shards based on CART_TOTAL_SHARDS or default.
  setup:
    name: Setup Shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read CART_TOTAL_SHARDS from variables
        id: matrix
        env:
          INPUT_SHARDS: ${{ inputs.total_shards }}
          VAR_SHARDS: ${{ vars.CART_TOTAL_SHARDS }}
        run: |
          # Priority order: workflow_dispatch input > GITHUB_VARS > default (2)
          if [ -n "$INPUT_SHARDS" ] && [ "$INPUT_SHARDS" != "0" ]; then
            TOTAL=$INPUT_SHARDS
          elif [ -n "$VAR_SHARDS" ] && [ "$VAR_SHARDS" != "0" ]; then
            TOTAL=$VAR_SHARDS
          else
            TOTAL=2
          fi
          SHARDS="$(seq 1 $TOTAL)"
          MATRIX="["
          first=true
          for i in $SHARDS; do
            if ! $first; then MATRIX="$MATRIX_,"; fi
            first=false
            MATRIX="$MATRIX{ \"index\": $i, \"total\": $TOTAL }"
          done
          MATRIX="$MATRIX]"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # Run cart invariant tests in parallel shards.
  run:
    name: cart-invariants (${{ matrix.browser }}-authed · shard ${{ matrix.index }}/${{ matrix.total }})
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.matrix) }}
        browser: [chromium, firefox]
    outputs:
      results-json: ${{ steps.run.outputs.results-json }}
    env:
      CI: "true"
      FORCE_COLOR: "0"
      PWTEST_FORBID_ONLY: "1"
      VITE_SUPA@�SE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPA@�SE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijG_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browser }}
          start-vite: 'true'

      - name: Run cart invariants (shard ${{ matrix.shard.index }}/${{ matrix.shard.total }})
        id: run
        run: |
          mkdir -p playwright-report
          npx playwright test \
            e2e/flows/cart-invariants.spec.ts \
            --project=${{ matrix.browser }}-authed \
            --shard=${{ matrix.shard.index }}/${{ matrix.shard.total }} \
            --reporter=github,list,json
        env:
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-${{ matrix.browser }}-${{ matrix.shard.index }}.json
        continue-on-error: true

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cart-invariants-results-${{ matrix.browser }}-${{ matrix.shard.index }}
          path: playwright-report/results-${{ matrix.browser }}-${{ matrix.shard.index }}.json
          retention-days: 14
          if-no-files-found: ignore

  # Aggregate results from all shards.
  summary:
    name: cart-invariants-summary
    needs: [run]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    outputs:
      all-passed: ${{ steps.aggregate.outputs.all-passed }}
      recommended_shards: ${{ steps.summary.outputs.recommended_shards }}
      should_bump: ${{ steps.summary.outputs.should_bump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: cart-invariants-results-*
          path: playwright-report
          merge-multiple: true

      - uses: actions/setup-node@cdca335f6d252ef29b5a6538ac3954ac99c8dda0 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (aggregator script)
        run: npm ci --ignore-scripts

      - name: Aggregate shard results
        id: aggregate
        run: |
          node scripts/aggregate-cart-invariants.mjs

      - name: Auto-tune shard count
        id: summary
        run: |
          node scripts/cart-invariants-autotune.mjs

      # Persistência do auto-tune. Sóruda:
      #   - quando o step anterior recomendou bump;
      #   - no branch default (main), fora de PR — evita fork PR
      #     mutando repo state;
      #   - se o secret CART_TUNE_PAT estiver presente (a permissão de
      #     `Variables: Read and write` NÃO existe no GITHUB_TOKEN default).
      # Caso o secret não exista, o step apenas registra um aviso e segue.
      - name: Persistir CART_TOTAL_SHARDS (auto-tune)
        if: >
          always() &&
          steps.summary.outputs.should_bump == '1' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CART_TUNE_PAT }}
          REC: ${{ steps.summary.outputs.recommended_shards }}
        run: |
          set -e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Secret CART_TUNE_PAT ausente — não é possível persistir CART_TOTAL_SHARDS. Defina manualmente em Settings → Secrets and variables → Actions → Variables."
            {
              echo ""
              echo "> ⚠ **Auto-tune não persistiu.** Configure o secret \`CART_TUNE_PAT\` (PAT fine-grained com escopo \`Variables: Read and write\` no repo) para habilitar."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh variable set CART_TOTAL_SHARDS --body "$REC"
          echo "CART_TOTAL_SHARDS atualizado para $REC"
          {
            echo ""
            echo "> ✅ **Auto-tune persistiu CART_TOTAL_SHARDS=$RECPP no repo.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cart-invariants-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
