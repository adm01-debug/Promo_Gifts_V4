name: stock-rupture-fuzz

on:
  pull_request:
    paths:
      - 'src/lib/inventory/**'
      - 'src/types/stock.ts'
      - 'src/components/inventory/**'
      - '.github/workflows/stock-rupture-fuzz.yml'
  workflow_dispatch:
  schedule:
    # Nightly 04:11 UTC — varredura adicional
    - cron: '11 4 * * *'

permissions:
  contents: read

concurrency:
  group: stock-rupture-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Risco de Ruptura — fuzz (800 sims, 10 invariantes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run rupture-risk fuzz suite
        run: |
          mkdir -p .fuzz-artifacts
          TZ=America/Sao_Paulo npx vitest run \
            src/lib/inventory/__tests__/stock-filter.rupture-risk.fuzz.test.ts \
            src/lib/inventory/__tests__/stock-filter.rupture-risk.test.ts \
            --reporter=verbose 2>&1 | tee .fuzz-artifacts/fuzz.log
        env:
          CI: 'true'

      - name: Upload fuzz logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-rupture-fuzz-${{ github.run_id }}
          path: .fuzz-artifacts/
          retention-days: 30
