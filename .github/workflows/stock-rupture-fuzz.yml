name: stock-rupture-fuzz

on:
  # E38: fuzz só por agenda e workflow_dispatch, nunca em PR (carga desnecessária em revisão)
  workflow_dispatch:
  schedule:
    # Nightly 04:11 UTC — varredura adicional
    - cron: '11 4 * * *'  # diário 04:11 UTC (E89)

permissions:
  contents: read

concurrency:
  group: stock-rupture-fuzz-${{ github.ref }}
  cancel-in-progress: false  # R2/E38: fuzz/schedule nunca cancelado


defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Risco de Ruptura — fuzz (800 sims, 10 invariantes)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run rupture-risk fuzz suite
        run: |
          mkdir -p .fuzz-artifacts
          TZ=America/Sao_Paulo npx vitest run \
            src/lib/inventory/__tests__/stock-filter.rupture-risk.fuzz.test.ts \
            src/lib/inventory/__tests__/stock-filter.rupture-risk.test.ts \
            --reporter=verbose 2>&1 | tee .fuzz-artifacts/fuzz.log
        env:
          CI: 'true'

      - name: Upload fuzz logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-rupture-fuzz-${{ github.run_id }}
          path: .fuzz-artifacts/
          retention-days: 14
