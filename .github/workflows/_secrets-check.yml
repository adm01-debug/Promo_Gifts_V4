name: _secrets-check (reusable)

# =============================================================================
# E23 — Workflow reutilizavel para validacao de secrets E2E.
# Outputs:
#   has_e2e   — true se E2E_USER_EMAIL + E2E_USER_PASSWORD presentes
#   has_admin — true se E2E_ADMIN_EMAIL + E2E_ADMIN_PASSWORD presentes
#
# Callers:
#   jobs:
#     secrets-check:
#       uses: ./.github/workflows/_secrets-check.yml
#       secrets: inherit
#     my-job:
#       needs: secrets-check
#       if: needs.secrets-check.outputs.has_e2e == 'true'
# =============================================================================

on:
  workflow_call:
    inputs:
      fail_if_missing:
        description: 'Falhar o job se credenciais E2E_USER estiverem ausentes'
        required: false
        type: boolean
        default: false
    secrets:
      E2E_USER_EMAIL:
        required: false
      E2E_USER_PASSWORD:
        required: false
      E2E_ADMIN_EMAIL:
        required: false
      E2E_ADMIN_PASSWORD:
        required: false
    outputs:
      has_e2e:
        description: 'true se credenciais E2E_USER estao presentes'
        value: ${{ jobs.check.outputs.has_e2e }}
      has_admin:
        description: 'true se credenciais E2E_ADMIN estao presentes'
        value: ${{ jobs.check.outputs.has_admin }}

permissions:
  contents: read

jobs:
  check:
    name: Verifica secrets E2E
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      has_e2e: ${{ steps.check.outputs.has_e2e }}
      has_admin: ${{ steps.check.outputs.has_admin }}
    steps:
      - name: Checa credenciais E2E
        id: check
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          FAIL_IF_MISSING: ${{ inputs.fail_if_missing }}
        run: |
          set -euo pipefail

          if [ -n "${E2E_USER_EMAIL:-}" ] && [ -n "${E2E_USER_PASSWORD:-}" ]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciais E2E_USER presentes — specs autenticados habilitados."
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            if [ "${FAIL_IF_MISSING:-false}" = "true" ]; then
              echo "::error::E2E_USER_EMAIL e/ou E2E_USER_PASSWORD ausentes."
              echo "::error::Configure os secrets do repositorio (ver PLANO E22) antes de rodar este gate."
              exit 1
            else
              echo "::warning::E2E_USER_EMAIL e/ou E2E_USER_PASSWORD ausentes — specs autenticados serao pulados (skip gracioso)."
            fi
          fi

          if [ -n "${E2E_ADMIN_EMAIL:-}" ] && [ -n "${E2E_ADMIN_PASSWORD:-}" ]; then
            echo "has_admin=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciais E2E_ADMIN presentes — specs de admin habilitados."
          else
            echo "has_admin=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_ADMIN_EMAIL e/ou E2E_ADMIN_PASSWORD ausentes — specs de admin serao pulados."
          fi
