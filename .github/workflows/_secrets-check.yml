name: _secrets-check (reusable)

# =============================================================================
# E23 — Workflow reutilizavel para validacao de secrets E2E.
# Callers:
#   jobs:
#     secrets-check:
#       uses: ./.github/workflows/_secrets-check.yml
#       secrets: inherit
#       with:
#         fail_if_missing: true   # gate obrigatorio
#     my-job:
#       needs: secrets-check
#       if: needs.secrets-check.outputs.e2e_ready == 'true'
# =============================================================================

on:
  workflow_call:
    inputs:
      fail_if_missing:
        description: 'Falhar o job se credenciais E2E estiverem ausentes'
        required: false
        type: boolean
        default: false
    secrets:
      E2E_USER_EMAIL:
        required: false
      E2E_USER_PASSWORD:
        required: false
    outputs:
      e2e_ready:
        description: 'true se credenciais E2E estao presentes'
        value: ${{ jobs.check.outputs.e2e_ready }}

permissions:
  contents: read

jobs:
  check:
    name: Verifica secrets E2E
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      e2e_ready: ${{ steps.check.outputs.e2e_ready }}
    steps:
      - name: Checa credenciais E2E
        id: check
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          FAIL_IF_MISSING: ${{ inputs.fail_if_missing }}
        run: |
          set -euo pipefail
          if [ -n "${E2E_USER_EMAIL:-}" ] && [ -n "${E2E_USER_PASSWORD:-}" ]; then
            echo "e2e_ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciais E2E presentes — specs autenticados habilitados."
          else
            echo "e2e_ready=false" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_IF_MISSING" = "true" ]; then
              echo "::error::E2E_USER_EMAIL e/ou E2E_USER_PASSWORD ausentes."
              echo "::error::Configure os secrets do repositorio (ver PLANO E22) antes de rodar este gate."
              exit 1
            else
              echo "::warning::E2E_USER_EMAIL e/ou E2E_USER_PASSWORD ausentes — specs autenticados serao pulados (skip gracioso)."
            fi
          fi
