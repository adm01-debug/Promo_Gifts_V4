name: E2E · Update Magazine Ring snapshots
# Executa `playwright test --update-snapshots` para o spec pixel-perfect dos
# rings do PreviewSidebar (fecha o gap M5 da auditoria Magazine). Dispara
# manualmente OU quando o próprio spec / harness é editado.
on:
  workflow_dispatch:
  push:
    paths:
      - "e2e/ui/magazine-ring-visual.spec.ts"
      - "src/pages/dev/MagazineRingHarness.tsx"
      - ".github/workflows/e2e-update-magazine-ring-snapshots.yml"

permissions:
  contents: write

concurrency:
  group: e2e-update-magazine-ring-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}


defaults:
  run:
    shell: bash

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Bootstrap (install deps + chromium)
        run: npm run e2e:bootstrap
      - name: Update baselines
        run: npm run e2e:magazine-ring:update
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/ui/magazine-ring-visual.spec.ts-snapshots || true
          if git diff --cached --quiet; then
            echo "Sem mudanças de baseline."
          else
            git commit -m "chore(e2e): update Magazine Ring visual snapshots [skip ci]"
            git push
          fi
