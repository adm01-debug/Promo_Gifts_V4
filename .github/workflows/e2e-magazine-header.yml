name: E2E — Magazine Header Layout

# Valida alinhamento e responsividade do header do Editor de Revistas.
# Specs: magazine-header-align.spec.ts, magazine-header-responsive.spec.ts
# Requer conta de teste autenticada; usa storageState gerado pelo job setup.
# E41: vacuous green eliminado — job condicionado ao secrets-check.

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/magazine/**'
      - 'e2e/flows/magazine-header*.spec.ts'
      - '.github/workflows/e2e-magazine-header.yml'
      - 'playwright.config.ts'
      - 'scripts/e2e-mock-auth-setup.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/pages/magazine/**'
      - 'e2e/flows/magazine-header*.spec.ts'
      - '.github/workflows/e2e-magazine-header.yml'
      - 'playwright.config.ts'
      - 'scripts/e2e-mock-auth-setup.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-magazine-header-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: America/Sao_Paulo
  CI: "true"
  FORCE_COLOR: "0"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}  # E54: fallback
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}  # E54: fallback


defaults:
  run:
    shell: bash

jobs:
  secrets-check:
    uses: ./.github/workflows/_secrets-check.yml
    secrets: inherit
    with:
      fail_if_missing: ${{ github.event_name == 'push' }}

  e2e-magazine-header:
    name: E2E — Magazine Header (authed)
    needs: secrets-check
    if: needs.secrets-check.outputs.has_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Pre-generate E2E fixtures
        run: npm run e2e:generate-fixtures

      - name: Start dev server
        run: npm run dev &
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Wait for server
        run: timeout 120 bash -c 'until curl -sf http://localhost:8080 > /dev/null 2>&1; do sleep 1; done'

      - name: Setup auth state
        run: npx playwright test --project=setup
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Run Magazine Header E2E
        run: |
          if [ ! -f e2e/.auth/storageState.json ]; then
            echo "❌ storageState.json não encontrado — login E2E falhou."
            exit 1
          fi
          AUTH_OK=$(node -e "try{const s=JSON.parse(require('fs').readFileSync('e2e/.auth/storageState.json','utf-8'));const ok=(s.origins||[]).some(o=>(o.localStorage||[]).some(e=>e.name&&e.name.startsWith('sb-')&&e.name.endsWith('-auth-token')&&e.value&&e.value.length>10));console.log(ok?'1':'0')}catch(e){console.log('0')}")
          if [ "$AUTH_OK" = "0" ]; then
            echo "❌ storageState.json sem token de sessão Supabase (sb-*-auth-token) — login E2E falhou com credenciais fornecidas."
            exit 1
          fi
          npx playwright test \
            e2e/flows/magazine-header-align.spec.ts \
            e2e/flows/magazine-header-responsive.spec.ts \
            --project=chromium-authed \
            --reporter=github,list,html,json
        env:
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-magazine-header.json
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-magazine-header-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  magazine-header-ok:
    name: Magazine Header OK
    needs: [secrets-check, e2e-magazine-header]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check result
        run: |
          HEADER_RESULT="${{ needs.e2e-magazine-header.result }}"
          if [ "$HEADER_RESULT" = 'success' ] || [ "$HEADER_RESULT" = 'skipped' ]; then
            echo "✅ Magazine Header E2E passed (result: $HEADER_RESULT)"
          else
            echo "❌ Magazine Header E2E failed — ver artifact e2e-magazine-header-report"
            exit 1
          fi
