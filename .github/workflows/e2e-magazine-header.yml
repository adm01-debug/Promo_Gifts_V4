name: E2E — Magazine Header Layout

# Valida alinhamento e responsividade do header do Editor de Revistas.
# Specs: magazine-header-align.spec.ts, magazine-header-responsive.spec.ts
# Requer conta de teste autenticada; usa storageState gerado pelo job setup.

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/magazine/**'
      - 'e2e/flows/magazine-header*.spec.ts'
      - '.github/workflows/e2e-magazine-header.yml'
      - 'playwright.config.ts'
      - 'scripts/e2e-mock-auth-setup.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/pages/magazine/**'
      - 'e2e/flows/magazine-header*.spec.ts'
      - '.github/workflows/e2e-magazine-header.yml'
      - 'playwright.config.ts'
      - 'scripts/e2e-mock-auth-setup.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-magazine-header-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  CI: "true"
  FORCE_COLOR: "0"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

jobs:
  e2e-magazine-header:
    name: E2E — Magazine Header (authed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Pre-generate E2E fixtures
        run: npm run e2e:generate-fixtures

      - name: Start dev server
        run: npm run dev &
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Wait for server
        run: timeout 120 bash -c 'until curl -sf http://localhost:8080 > /dev/null 2>&1; do sleep 1; done'

      - name: Setup auth state
        run: |
          if [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ]; then
            npx playwright test --project=setup
          fi
        env:
          E2E_BASE_URL: http://localhost:8080
        continue-on-error: true

      - name: Run Magazine Header E2E
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "⚠️ Credenciais E2E não configuradas — pulando testes autenticados."
            exit 0
          fi
          if [ ! -f e2e/.auth/storageState.json ]; then
            echo "❌ storageState.json não encontrado — login E2E falhou."
            exit 1
          fi
          npx playwright test \
            e2e/flows/magazine-header-align.spec.ts \
            e2e/flows/magazine-header-responsive.spec.ts \
            --project=chromium-authed \
            --reporter=github,list,html,json \
            --pass-with-no-tests
        env:
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-magazine-header.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-magazine-header-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  magazine-header-ok:
    name: Magazine Header OK
    needs: [e2e-magazine-header]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check result
        run: |
          if [ '${{ needs.e2e-magazine-header.result }}' = 'success' ]; then
            echo '✅ Magazine Header E2E passed'
          else
            echo '❌ Magazine Header E2E failed — ver artifact e2e-magazine-header-report'
            exit 1
          fi
