name: E2E Quote Item Editor Sheet

# Valida o redesign do header do QuoteItemEditorSheet em 320/375/768:
# ordem DOM ("+ Produto" antes do título), layout (sem overflow),
# acessibilidade (foco/tab) e snapshots visuais por viewport.
# Roda em Chromium/Firefox/WebKit (matriz de browser) em todo PR que
# tocar no sheet, no harness visual, na rota ou na própria spec.

on:
  push:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemEditorSheet.tsx'
      - 'src/components/quotes/QuoteBuilderProductSearch.tsx'
      - 'src/pages/__visual/QuoteItemEditorSheetHarness.tsx'
      - 'src/pages/__visual/QuoteAddProductButtonHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-item-editor-sheet-header.spec.ts'
      - 'e2e/quotes/quote-add-product-button.spec.ts'
      - '.github/workflows/e2e-quote-item-editor-sheet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemEditorSheet.tsx'
      - 'src/components/quotes/QuoteBuilderProductSearch.tsx'
      - 'src/pages/__visual/QuoteItemEditorSheetHarness.tsx'
      - 'src/pages/__visual/QuoteAddProductButtonHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-item-editor-sheet-header.spec.ts'
      - 'e2e/quotes/quote-add-product-button.spec.ts'
      - '.github/workflows/e2e-quote-item-editor-sheet.yml'
  workflow_dispatch:
  schedule:
    - cron: '42 4 * * 1'  # E10 — weekly Monday 04:23 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-quote-item-editor-sheet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

jobs:
  editor-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run QuoteItemEditorSheet spec (${{ matrix.browser }})
        run: |
          npx playwright test \
            e2e/quotes/quote-item-editor-sheet-header.spec.ts \
            e2e/quotes/quote-add-product-button.spec.ts \
            --project=${{ matrix.browser }}-public \
            --reporter=line

      - name: Upload report + snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quote-item-editor-sheet-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            e2e/quotes/quote-item-editor-sheet-header.spec.ts-snapshots
            e2e/quotes/quote-add-product-button.spec.ts-snapshots
          retention-days: 14

  # E10 — alerta de falha no cron semanal (deduplication via label ci-focused-e2e)
  notify-failure:
    name: Notificar falha — Quote Item Editor (cron)
    if: failure() && github.event_name == 'schedule'
    needs: [editor-sheet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowName = 'E2E Quote Item Editor Sheet';
            const label = 'ci-focused-e2e';
            const title = `[CI] ${workflowName} falhou no cron semanal`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha detectada: ${runUrl} — ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: [label],
                body: [
                  `## ❌ ${workflowName} falhou no cron semanal`,
                  '',
                  `- **Run:** ${runUrl}`,
                  `- **Triggered:** ${new Date().toISOString()}`,
                  '',
                  'Verifique os artifacts do run para screenshots, diffs e traces.',
                ].join('\n'),
              });
            }
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quote Item Editor Sheet (cron recuperado)
    if: success() && github.event_name == 'schedule'
    needs: [editor-sheet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '[CI] E2E Quote Item Editor Sheet falhou no cron semanal';
            const label = 'ci-focused-e2e';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Cron passou em ${new Date().toISOString()} — fechando. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
            }
