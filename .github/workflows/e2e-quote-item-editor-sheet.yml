name: E2E Quote Item Editor Sheet

# Valida o redesign do header do QuoteItemEditorSheet em 320/375/768:
# ordem DOM ("+ Produto" antes do título), layout (sem overflow),
# acessibilidade (foco/tab) e snapshots visuais por viewport.
# Roda em Chromium/Firefox/WebKit (matriz de browser) em todo PR que
# tocar no sheet, no harness visual, na rota ou na própria spec.

on:
  push:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemEditorSheet.tsx'
      - 'src/components/quotes/QuoteBuilderProductSearch.tsx'
      - 'src/pages/__visual/QuoteItemEditorSheetHarness.tsx'
      - 'src/pages/__visual/QuoteAddProductButtonHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-item-editor-sheet-header.spec.ts'
      - 'e2e/quotes/quote-add-product-button.spec.ts'
      - '.github/workflows/e2e-quote-item-editor-sheet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/quotes/QuoteItemEditorSheet.tsx'
      - 'src/components/quotes/QuoteBuilderProductSearch.tsx'
      - 'src/pages/__visual/QuoteItemEditorSheetHarness.tsx'
      - 'src/pages/__visual/QuoteAddProductButtonHarness.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/quotes/quote-item-editor-sheet-header.spec.ts'
      - 'e2e/quotes/quote-add-product-button.spec.ts'
      - '.github/workflows/e2e-quote-item-editor-sheet.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 4 * * 1'  # E10/E89 — weekly Monday 04:50 UTC (≥5min after 04:44)

permissions:
  contents: read

concurrency:
  group: e2e-quote-item-editor-sheet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  editor-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run QuoteItemEditorSheet spec (${{ matrix.browser }})
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test \
            e2e/quotes/quote-item-editor-sheet-header.spec.ts \
            e2e/quotes/quote-add-product-button.spec.ts \
            --project=${{ matrix.browser }}-public \
            --reporter=line

      - name: Upload report + snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quote-item-editor-sheet-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            e2e/quotes/quote-item-editor-sheet-header.spec.ts-snapshots
            e2e/quotes/quote-add-product-button.spec.ts-snapshots
          retention-days: 14

  # E10/E12 — usa ci-issue action para dedupe real
  notify-failure:
    name: Notificar falha — Quote Item Editor Sheet (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [editor-sheet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-item-editor-sheet
          title: "[CI] E2E Quote Item Editor Sheet falhou no cron semanal"
          body: |
            ## ❌ E2E Quote Item Editor Sheet falhou no cron semanal

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered:** ${{ github.run_started_at }}

            Verifique os artifacts do run para screenshots, diffs e traces.
          labels: ci-focused-e2e
          state: open
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quote Item Editor Sheet (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [editor-sheet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-item-editor-sheet
          title: "[CI] E2E Quote Item Editor Sheet falhou no cron semanal"
          body: "Todos os testes passaram."
          labels: ci-focused-e2e
          state: resolved
