name: draft-label-guard

# Gate dedicado — detecta regressão quando o label "Salvar Alterações"
# reaparece nos fluxos de RASCUNHO de orçamento.
# O label canônico é "Salvar Rascunho" (SSOT: aria-label + texto + testid
# quote-save-draft*). Este workflow é rápido (<20s) por design.
#
# NOTA: o mesmo script (`npm run check:no-salvar-alteracoes-draft`) também
# roda dentro do job `lint-typecheck` do deploy-gates.yml (Gate 1.5).
# O required check canônico é "Gate Final - Deploy Ready" (.github/required-checks.json).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: draft-label-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-label-guard:
    name: Draft label guard (Salvar Alterações → Salvar Rascunho)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Verificar ausência de "Salvar Alterações" em fluxos de rascunho
        run: node scripts/check-no-salvar-alteracoes-draft.mjs