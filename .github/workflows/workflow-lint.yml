name: Workflow Lint (E11)

# E11 — PLANO_WORKFLOWS_CI_100_ETAPAS_2026-09-26
# Valida contratos estruturais (actionlint + shellcheck + check-workflow-contracts.mjs)
# em qualquer PR que toque .github/** ou scripts de contratos.
# Modo REPORT até E20 (gate será habilitado lá via --gate flag).

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'scripts/check-workflow-contracts.mjs'
      - 'scripts/check-workflow-contracts.allowlist.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'scripts/check-workflow-contracts.mjs'
      - 'scripts/check-workflow-contracts.allowlist.json'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint

      - name: Run actionlint
        # shellcheck is run automatically by actionlint for run: blocks.
        # Pre-existing style/info codes suppressed; fix them in E25.
        run: |
          /tmp/actionlint \
            -ignore 'SC2006' \
            -ignore 'SC2016' \
            -ignore 'SC2034' \
            -ignore 'SC2038' \
            -ignore 'SC2086' \
            -ignore 'SC2129' \
            -ignore 'SC2188' \
            -ignore 'SC2215'

  workflow-contracts:
    name: Workflow contract checks (C1–8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check workflow contracts (gate mode — E20)
        run: node scripts/check-workflow-contracts.mjs --gate
