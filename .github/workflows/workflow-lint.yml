name: Workflow Lint

# Valida workflows com actionlint + shellcheck em qualquer PR que toque .github/**.
# check-workflow-contracts.mjs --gate roda em deploy-gates.yml Gate 1.11 (E91).

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'scripts/check-workflow-contracts.mjs'
      - 'scripts/check-workflow-contracts.allowlist.json'
      - '.github/workflows/workflow-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'scripts/check-workflow-contracts.mjs'
      - 'scripts/check-workflow-contracts.allowlist.json'
      - '.github/workflows/workflow-lint.yml'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          # SHA256 verificado contra checksums oficiais (E91 2026-10-14)
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint

      - name: Run actionlint
        # shellcheck é executado automaticamente pelo actionlint em run: blocks.
        # SC2129: '>>' múltiplos redirecionamentos — falso positivo de estilo; aceito.
        # TODOS os outros códigos SC são erros reais (E91 — sem -ignore amplos).
        run: |
          /tmp/actionlint \
            -ignore 'SC2129'

