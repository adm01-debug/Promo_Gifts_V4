name: Edge Functions — Deno Tests

# Dos 89 arquivos de teste em supabase/functions (13.102 linhas), 77 são Deno e
# o CI rodava `deno test` em exatamente 2 deles: log-login-attempt (em
# edge-integration-all.yml e log-login-fuzz-weekly.yml) e magazine-import-local
# (em magazine-unit-tests.yml). Os outros 75 nunca foram executados por runner
# nenhum — foram escritos, revisados e esquecidos.
#
# Os 12 arquivos que importam `vitest` são do Vitest e estão listados no
# include do vitest.config.ts; aqui eles são ignorados.
#
# O import map de supabase/functions/deno.json já redireciona esm.sh e
# deno.land para npm:/jsr: justamente "para evitar falhas de TLS/rede no CI", e
# o `deno check` de ci.yml:518 já roda sobre todas as funções com ele — então a
# infraestrutura para isto já existia; faltava o job.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-deno-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-deno-tests.yml'
  workflow_dispatch:

concurrency:
  group: edge-deno-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deno-tests:
    name: Deno Tests (edge functions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Inventário antes de rodar
        run: |
          echo "arquivos de teste em supabase/functions: $(find supabase/functions -name '*test*.ts' | wc -l)"
          echo "dos quais Vitest (ignorados aqui): $(grep -rl \"from 'vitest'\" supabase/functions --include='*test*.ts' | wc -l)"

      # --allow-all: estes testes leem fixtures, checam env e alguns sobem
      # servidor local. Sem rede externa real — o import map resolve tudo para
      # npm:/jsr:, baixados no passo de cache do próprio setup-deno.
      # Primeira execucao desta PR mediu: 323 passaram, 99 falharam, 8 ignorados.
      # As falhas NAO sao testes quebrados: sao testes de integracao AO VIVO que
      # batem em fake-project.supabase.co / test.supabase.co e morrem em
      # "dns error: failed to lookup address information". Eles pertencem ao
      # edge-integration-all.yml, que roda com segredos e funcao publicada —
      # nao a um job unitario sem rede.
      #
      # Por isso o --ignore abaixo lista: (a) os 12 arquivos Vitest, que o
      # vitest.config ja coleta; (b) os de integracao ao vivo, por caminho.
      - name: deno test (unitarios, sem rede)
        run: |
          set -euo pipefail

          # Integracao AO VIVO: pertencem ao edge-integration-all.yml, que roda
          # com segredos e funcao publicada.
          # Sem barra final: o --ignore do Deno nao casa diretorio terminado em "/".
          AO_VIVO="supabase/functions/tests/integration"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/production-readiness.test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/security-integration_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/external_db_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/mcp-keys-step-up_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/rls-policies_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/tests/step-up-role-revocation_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/visual-search/integration_test.ts"
          AO_VIVO="$AO_VIVO,supabase/functions/webhook-inbound/integration_test.ts"

          # Vitest: ja coletados pelo vitest.config.ts. A regex cobre aspas
          # simples E duplas — com so um dos dois, 8 dos 12 arquivos escapavam.
          VITEST=$(grep -rlE "from ['\"]vitest['\"]" supabase/functions --include='*test*.ts' | sort | paste -sd, -)
          test -n "$VITEST" || { echo "::error::grep de vitest voltou vazio"; exit 1; }
          echo "arquivos vitest encontrados: $(echo "$VITEST" | tr ',' '\n' | wc -l) (esperado 12)"

          echo "ignorando ao vivo: $AO_VIVO"
          echo "ignorando vitest:  $VITEST"

          deno test \
            --config supabase/functions/deno.json \
            --allow-all \
            --no-check \
            --ignore="$AO_VIVO,$VITEST" \
            supabase/functions/
