name: Uptime Monitor

# Verifica disponibilidade do site (Vercel) e da edge function health-check
# (Supabase doufsxqlfjyuvxuezpln) a cada 15 min. Em falha, abre ou comenta
# numa issue com label "uptime" (sem duplicar issue aberta).
#
# health-check não tem [functions.health-check] em supabase/config.toml,
# então cai no default verify_jwt=true do gateway Supabase — por isso os
# headers apikey/Authorization são obrigatórios. A chave usada é a
# anon/publishable key, lida em runtime de src/integrations/supabase/client.ts
# (já é pública no bundle do front-end; não é secret — e ler do client.ts
# evita uma segunda cópia hardcoded que dispararia o Gitleaks).

on:
  schedule:
    - cron: '*/30 * * * *'  # E20: reduzido de 15→30 min (96→48 runs/dia)
  workflow_dispatch:

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

env:
  SITE_URL: https://www.promogifts.com.br/
  FN_URL: https://doufsxqlfjyuvxuezpln.supabase.co/functions/v1/health-check
  # check-login é a edge crítica de negócio (gate de login). verify_jwt=false; o preflight
  # OPTIONS responde via _shared/cors.ts sem autenticação — prova que a função está no ar.
  LOGIN_FN_URL: https://doufsxqlfjyuvxuezpln.supabase.co/functions/v1/check-login
  # GoTrue: /auth/v1/health responde 200 quando o serviço de auth está de pé.
  # Sem ela, uma queda só do GoTrue (site+edges OK) passa batida — aconteceu
  # em 2026-10-11: auth 522 por ~1h com todos os outros probes verdes.
  AUTH_HEALTH_URL: https://doufsxqlfjyuvxuezpln.supabase.co/auth/v1/health


defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6  # E85: 2 retries × 30s × 4 probes + overhead
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          sparse-checkout: |
            src/integrations/supabase/client.ts
          sparse-checkout-cone-mode: false

      - name: Probe site + edge function
        id: probe
        run: |
          set +e
          ANON_KEY=$(grep -o 'eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*' src/integrations/supabase/client.ts | head -1)
          if [ -z "$ANON_KEY" ]; then
            echo "::error::anon key não encontrada em src/integrations/supabase/client.ts — falha do monitor, não do site"
            echo "site=-1" >> "$GITHUB_OUTPUT"
            echo "fn=-1" >> "$GITHUB_OUTPUT"
            echo "login=-1" >> "$GITHUB_OUTPUT"
            echo "auth=-1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          curl -sf --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null "$SITE_URL"
          SITE=$?
          curl -sf --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -o /dev/null "$FN_URL"
          FN=$?
          curl -sf --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -X OPTIONS \
            -H "Origin: https://www.promogifts.com.br" \
            -H "Access-Control-Request-Method: POST" \
            -o /dev/null "$LOGIN_FN_URL"
          LOGIN=$?
          curl -sf --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -o /dev/null "$AUTH_HEALTH_URL"
          AUTH=$?
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "fn=$FN" >> "$GITHUB_OUTPUT"
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"
          echo "auth=$AUTH" >> "$GITHUB_OUTPUT"
          [ "$SITE" -eq 0 ] && [ "$FN" -eq 0 ] && [ "$LOGIN" -eq 0 ] && [ "$AUTH" -eq 0 ]

      - name: Abrir ou comentar issue de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uptime --color B60205 --description "Falha de disponibilidade detectada pelo Uptime Monitor" 2>/dev/null || true  # ok: label pode já existir — idempotente
          BODY="Falha em $(date -u +%FT%TZ) — site=${{ steps.probe.outputs.site }} health-check=${{ steps.probe.outputs.fn }} check-login(OPTIONS)=${{ steps.probe.outputs.login }} auth-health=${{ steps.probe.outputs.auth }} (0 = OK, outro valor = exit code do curl). Run: $RUN_URL
          Runbook: [docs/DISASTER_RECOVERY.md §3](https://github.com/${{ github.repository }}/blob/main/docs/DISASTER_RECOVERY.md)"
          ISSUE=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "Uptime: falha de disponibilidade detectada" --label uptime --body "$BODY"
          fi

      - name: Fechar issue de uptime na recuperação
        # E12 — fecha a issue quando todos os probes passam
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" \
              --body "✅ Todos os probes passaram em $(date -u +%FT%TZ) — fechando."
            gh issue close "$ISSUE" --reason completed
          fi
