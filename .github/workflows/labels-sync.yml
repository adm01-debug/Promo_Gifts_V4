# Sincroniza labels do repo a partir de .github/labels.yml
#
# Dispara automaticamente quando .github/labels.yml muda no main.
# Também pode ser disparado manualmente (workflow_dispatch).
#
# Usa crazy-max/ghaction-github-labeler (mantém apenas as labels listadas;
# para preservar labels não-gerenciadas, setar skip-delete: true).

name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labels-sync.yml'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: labels-sync-${{ github.ref }}
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Apply labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # E12: skip-delete: true preserva labels criadas fora do YAML
          # (ex: uptime, ci-inconclusive abertas por ci-issue action).
          # false apagaria essas labels e quebraria issues em aberto.
          skip-delete: true
          dry-run: false
