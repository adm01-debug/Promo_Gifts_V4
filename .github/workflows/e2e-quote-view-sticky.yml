name: E2E · Quote View Sticky & Scroll

on:
  pull_request:
    paths:
      - 'src/components/layout/**'
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/pages/__visual/QuoteViewOrderHarness.tsx'
      - 'src/App.css'
      - 'src/styles/responsive.css'
      - 'e2e/quotes/quote-view-sticky-sidebar.spec.ts'
      - 'e2e/quotes/quote-view-overflow-regression.spec.ts'
      - 'e2e/quotes/quote-items-inner-scroll.spec.ts'
      - 'e2e/quotes/quote-view-mainlayout-overflow.spec.ts'
      - 'e2e/quotes/quote-view-sticky-visual.spec.ts'
      - '.github/workflows/e2e-quote-view-sticky.yml'
      - 'scripts/check-overflow-x-clip.mjs'
  workflow_dispatch:
  schedule:
    - cron: '22 4 * * 1'  # E10/E89 — weekly Monday 04:22 UTC

permissions:
  contents: read

concurrency:
  group: e2e-quote-view-sticky-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  overflow-static-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: '.nvmrc', cache: npm }
      - name: Static gate — overflow-x-clip em MainLayout/html/body
        run: node scripts/check-overflow-x-clip.mjs

  sticky-and-scroll:
    needs: overflow-static-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-public, firefox-public, webkit-public]
    env:
      CI: 'true'
      E2E_BASE_URL: 'http://localhost:8080'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 127.0.0.1 &
          # E96/C26: substituído npx wait-on (não está no lockfile) por loop bash nativo
          timeout 60 bash -c 'until curl -sf http://localhost:8080 > /dev/null; do sleep 1; done'
      - name: Run Playwright (${{ matrix.project }})
        run: |
          npx playwright test \
            e2e/quotes/quote-view-sticky-sidebar.spec.ts \
            e2e/quotes/quote-view-overflow-regression.spec.ts \
            e2e/quotes/quote-view-mainlayout-overflow.spec.ts \
            e2e/quotes/quote-view-sticky-visual.spec.ts \
            e2e/quotes/quote-items-inner-scroll.spec.ts \
            --project=${{ matrix.project }} \
            --reporter=list,html,github
      - name: Upload Playwright trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-quote-view-sticky-traces-${{ matrix.project }}
          path: |
            test-results/**
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
            playwright-report/**
          retention-days: 14

  # E10/E12 — usa ci-issue action para dedupe real
  notify-failure:
    name: Notificar falha — Quote View Sticky (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [overflow-static-gate, sticky-and-scroll]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-view-sticky
          title: "[CI] E2E · Quote View Sticky & Scroll falhou no cron semanal"
          body: |
            ## ❌ E2E · Quote View Sticky & Scroll falhou no cron semanal

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered:** ${{ github.run_started_at }}

            Verifique os artifacts do run para screenshots, diffs e traces.
          labels: ci-focused-e2e
          state: open
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quote View Sticky (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [overflow-static-gate, sticky-and-scroll]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-view-sticky
          title: "[CI] E2E · Quote View Sticky & Scroll falhou no cron semanal"
          body: "Todos os testes passaram."
          labels: ci-focused-e2e
          state: resolved
