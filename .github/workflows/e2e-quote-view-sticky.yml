name: E2E · Quote View Sticky & Scroll

on:
  pull_request:
    paths:
      - 'src/components/layout/**'
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/pages/__visual/QuoteViewOrderHarness.tsx'
      - 'src/App.css'
      - 'src/styles/responsive.css'
      - 'e2e/quotes/quote-view-sticky-sidebar.spec.ts'
      - 'e2e/quotes/quote-view-overflow-regression.spec.ts'
      - 'e2e/quotes/quote-items-inner-scroll.spec.ts'
      - 'e2e/quotes/quote-view-mainlayout-overflow.spec.ts'
      - 'e2e/quotes/quote-view-sticky-visual.spec.ts'
      - '.github/workflows/e2e-quote-view-sticky.yml'
      - 'scripts/check-overflow-x-clip.mjs'
  workflow_dispatch:
  schedule:
    - cron: '22 4 * * 1'  # E10 — weekly Monday 04:23 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-quote-view-sticky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overflow-static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: npm }
      - name: Static gate — overflow-x-clip em MainLayout/html/body
        run: node scripts/check-overflow-x-clip.mjs

  sticky-and-scroll:
    needs: overflow-static-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-public, firefox-public, webkit-public]
    env:
      CI: 'true'
      E2E_BASE_URL: 'http://localhost:8080'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 127.0.0.1 &
          npx wait-on http://localhost:8080 -t 60000
      - name: Run Playwright (${{ matrix.project }})
        run: |
          npx playwright test \
            e2e/quotes/quote-view-sticky-sidebar.spec.ts \
            e2e/quotes/quote-view-overflow-regression.spec.ts \
            e2e/quotes/quote-view-mainlayout-overflow.spec.ts \
            e2e/quotes/quote-view-sticky-visual.spec.ts \
            e2e/quotes/quote-items-inner-scroll.spec.ts \
            --project=${{ matrix.project }} \
            --reporter=list,html,github
      - name: Upload Playwright trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-quote-view-sticky-traces-${{ matrix.project }}
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14

  # E10 — alerta de falha no cron semanal (deduplication via label ci-focused-e2e)
  notify-failure:
    name: Notificar falha — Quote View Sticky (cron)
    if: failure() && github.event_name == 'schedule'
    needs: [overflow-static-gate, sticky-and-scroll]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowName = 'E2E · Quote View Sticky & Scroll';
            const label = 'ci-focused-e2e';
            const title = `[CI] ${workflowName} falhou no cron semanal`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha detectada: ${runUrl} — ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: [label],
                body: [
                  `## ❌ ${workflowName} falhou no cron semanal`,
                  '',
                  `- **Run:** ${runUrl}`,
                  `- **Triggered:** ${new Date().toISOString()}`,
                  '',
                  'Verifique os artifacts do run para screenshots, diffs e traces.',
                ].join('\n'),
              });
            }