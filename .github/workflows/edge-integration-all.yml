name: Edge Integration Tests — All Functions

# Roda testes de integração mocked para TODAS as 18+ edge functions cobertas.
# Bloqueia merges se qualquer função crítica falhar.

# 2026-09-27: paths filter — 11min de edge integration só quando edge functions ou testes mudam
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'tests/edge-functions/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/edge-integration-all.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'tests/edge-functions/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/edge-integration-all.yml'
  workflow_dispatch:

concurrency:
  group: edge-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo

jobs:
  edge-integration:
    name: Edge Function Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate bloqueante: toda edge function deployada precisa de teste LIVE.
      - name: Gate — cobertura LIVE de edge functions
        run: npm run check:edge-live-coverage

      # Gate estático: log-login-attempt NUNCA pode retornar 5xx.
      - name: Gate — log-login-attempt contrato nunca-5xx
        run: npm run check:log-login-contract

      # Handler-direct Deno tests para log-login-attempt (fecha gap G1).
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno handler-direct tests (log-login-attempt)
        run: deno test --config supabase/functions/deno.json --allow-env --allow-net --allow-read supabase/functions/log-login-attempt/index_test.ts

      # Roda todos os 18+ testes de integração de edge functions (mocked).
      - name: Run all edge function integration tests
        run: |
          npx vitest run tests/edge-functions/integration/ \
            --reporter=verbose \
            --coverage \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.statements=0

      # Testes LIVE — skip silencioso sem segredos; rodam de fato com eles.
      - name: Run all edge function integration tests (LIVE)
        run: npx vitest run tests/edge-functions/live/ --reporter=verbose
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_DEV_EMAIL: ${{ secrets.E2E_DEV_EMAIL }}
          E2E_DEV_PASSWORD: ${{ secrets.E2E_DEV_PASSWORD }}
