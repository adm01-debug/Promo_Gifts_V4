name: Daily flows simulation

on:
  schedule:
    - cron: '12 6 * * *' # Diário 06:00 UTC
  workflow_dispatch:
    inputs:
      scale:
        description: 'Multiplicador de cenários (1 = ~600)'
        default: '3'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Simulate daily flows
        run: node scripts/simulate-daily-flows.mjs --scale=${{ github.event.inputs.scale || '3' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-flows-simulation
          path: qa/reports/daily-flows-simulation-*.*
          retention-days: 30
