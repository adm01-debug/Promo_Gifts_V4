name: Daily flows simulation

on:
  schedule:
    - cron: '12 6 * * *' # Diário 06:12 UTC
  workflow_dispatch:
    inputs:
      scale:
        description: 'Multiplicador de cenários (1 = ~600)'
        default: '3'

concurrency:
  group: daily-flows-simulation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # E81: gh api para ler timestamp do último run bem-sucedido


defaults:
  run:
    shell: bash

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          fetch-depth: 0              # E81: histórico completo para git log --after
      - name: Git diff guard (schedule only)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # E81: guard "desde o último success" via API (mais robusto que --since="25h")
          LAST_SUCCESS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-flows-simulation.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)  # ok: primeiro run não tem histórico
          if [ -z "$LAST_SUCCESS" ]; then
            echo "Nenhum run bem-sucedido anterior — rodando simulação incondicional"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git log --after="$LAST_SUCCESS" --oneline -- src/ scripts/simulate-daily-flows.mjs supabase/migrations/ 2>/dev/null | head -1)
            if [ -z "$CHANGED" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Nenhuma mudança relevante desde o último run bem-sucedido ($LAST_SUCCESS) — pulando simulação"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        with:
          node-version-file: '.nvmrc'
      - name: Simulate daily flows
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
        run: node scripts/simulate-daily-flows.mjs --scale="$SCALE"
      - name: Upload report
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.skip != 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-flows-simulation-${{ github.run_id }}
          path: qa/reports/daily-flows-simulation-*.*
          if-no-files-found: warn
          retention-days: 30
