name: Daily flows simulation

on:
  schedule:
    - cron: '12 6 * * *' # Diário 06:00 UTC
  workflow_dispatch:
    inputs:
      scale:
        description: 'Multiplicador de cenários (1 = ~600)'
        default: '3'

concurrency:
  group: daily-flows-simulation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - name: Git diff guard (schedule only)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          CHANGED=$(git log --since="25 hours ago" --oneline -- src/ scripts/simulate-daily-flows.mjs supabase/migrations/ 2>/dev/null | head -1)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudança relevante nas últimas 25h — pulando simulação"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        with:
          node-version-file: '.nvmrc'
      - name: Simulate daily flows
        if: github.event_name != 'schedule' || steps.guard.outputs.skip != 'true'
        env:
          SCALE: ${{ github.event.inputs.scale || '3' }}
        run: node scripts/simulate-daily-flows.mjs --scale="$SCALE"
      - name: Upload report
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.skip != 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-flows-simulation
          path: qa/reports/daily-flows-simulation-*.*
          retention-days: 30
