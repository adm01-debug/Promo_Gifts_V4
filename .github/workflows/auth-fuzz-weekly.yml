name: Auth surface fuzz (weekly)

on:
  schedule:
    - cron: '0 5 * * 1' # Segunda 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZ_STRESS: '10000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Auth wrappers fuzz + breaker
        run: TZ=America/Sao_Paulo bunx vitest run src/lib/auth --reporter=default
      - name: Static gate — chamadas diretas fora do SSOT
        run: node scripts/check-auth-direct-calls.mjs
