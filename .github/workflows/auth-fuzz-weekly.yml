name: Auth surface fuzz (weekly)

on:
  schedule:
    - cron: '12 5 * * 1' # Segunda 05:12 UTC
  workflow_dispatch:

concurrency:
  group: auth-fuzz-weekly
  cancel-in-progress: false

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  auth-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_STRESS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Auth wrappers fuzz + breaker
        run: TZ=America/Sao_Paulo npx vitest run src/lib/auth --reporter=default
      - name: Static gate — chamadas diretas fora do SSOT
        run: node scripts/check-auth-direct-calls.mjs
