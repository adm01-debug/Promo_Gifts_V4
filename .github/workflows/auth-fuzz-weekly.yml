name: Auth surface fuzz (weekly)

on:
  schedule:
    - cron: '12 5 * * 1' # Segunda 05:12 UTC
  workflow_dispatch:

concurrency:
  group: auth-fuzz-weekly
  cancel-in-progress: false

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  auth-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_STRESS: '10000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.1.34
      - run: bun install --frozen-lockfile
      - name: Auth wrappers fuzz + breaker
        run: TZ=America/Sao_Paulo bunx vitest run src/lib/auth --reporter=default
      - name: Static gate — chamadas diretas fora do SSOT
        run: node scripts/check-auth-direct-calls.mjs
