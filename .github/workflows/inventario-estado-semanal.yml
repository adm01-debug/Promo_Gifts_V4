name: Inventário do estado real (semanal)

# Refaz inventario/estado/ (banco, edge functions, rotas, uso de tabelas) a partir do banco oficial
# (somente leitura, Management API) e do código, e abre PR se algo mudou.
# Scripts: scripts/inventario/gerar-banco.mjs e scripts/inventario/gerar-repo.mjs.
# Nunca faz push direto em main — entrega via PR em branch inventario/estado-YYYY-WNN.

on:
  schedule:
    - cron: '41 12 * * 1' # segunda 12:41 UTC (09:41 BRT) — E89: ≥20min de capacity-growth-report (11:12), diário 11:16 e 12:15
  workflow_dispatch:

concurrency:
  group: inventario-estado-semanal
  cancel-in-progress: false

permissions:
  contents: write      # criar branch e commitar o inventário
  pull-requests: write # abrir PR

defaults:
  run:
    shell: bash

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Instalar ripgrep (usado pelo gerar-repo.mjs)
        run: command -v rg || sudo apt-get install -y --no-install-recommends ripgrep

      - name: Inventário do banco (somente leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
        run: node scripts/inventario/gerar-banco.mjs

      - name: Inventário do repositório (edges, rotas, uso de tabelas)
        run: node scripts/inventario/gerar-repo.mjs

      - name: Credencial de push sem token em disco (E32)
        run: |
          # shellcheck disable=SC2016 # aspas simples intencionais: $1 e GIT_PUSH_TOKEN expandem quando o git chama o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'

      - name: Abrir PR se o inventário mudou
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inventario/estado
          # Só gerado_em mudou? Não vale PR.
          if git diff --staged -U0 | grep -E '^[+-][^+-]' | grep -vqE '"gerado_em"'; then
            :
          else
            echo "Inventário sem mudança de conteúdo — nenhum PR a abrir."
            exit 0
          fi
          WEEK=$(date -u +%Y-W%V)
          BRANCH="inventario/estado-${WEEK}"
          git checkout -b "$BRANCH"
          git commit -m "chore: inventário do estado real ${WEEK}

          Gerado por inventario-estado-semanal.yml (gerar-banco.mjs + gerar-repo.mjs)."
          # Branch exclusiva deste workflow (uma por semana): reexecução na mesma semana sobrescreve.
          git push -u origin "$BRANCH" --force
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} já existe para ${BRANCH} — branch atualizado."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: inventário do estado real ${WEEK}" \
              --body "Inventário refeito automaticamente por \`.github/workflows/inventario-estado-semanal.yml\`:
          banco oficial (somente leitura) + código. Só arquivos em \`inventario/estado/\`.

          > Auto-gerado por [inventario-estado-semanal](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi

      - name: Upload do inventário
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventario-estado-${{ github.run_id }}
          path: inventario/estado/
          retention-days: 14
