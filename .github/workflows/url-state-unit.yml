name: URL State — Unit & Fuzz

on:
  push:
    branches: [main]
    paths:
      - 'src/hooks/common/**'
      - 'src/pages/quotes/**'
      - '.github/workflows/url-state-unit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/hooks/common/**'
      - 'src/pages/quotes/**'
      - '.github/workflows/url-state-unit.yml'
  schedule:
    - cron: '41 6 * * 1' # semanal, segunda 06:41 UTC — varredura incondicional — E89

permissions:
  contents: read

concurrency:
  group: url-state-unit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  url-state-unit:
    name: useListUrlState (unit + fuzz) & useQuotesListPage URL state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          persist-credentials: false  # E32
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Executa exclusivamente as suítes que garantem o contrato do useListUrlState
      # (sync com URL, debounce, clearAll) e o teste de "Limpar filtros" do
      # useQuotesListPage. Ficam isoladas do restante do CI para que uma regressão
      # de URL state falhe rápido e apareça como check dedicado no PR.
      - name: Run URL state unit + fuzz suites
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            src/hooks/common/__tests__/useListUrlState.test.tsx \
            src/hooks/common/__tests__/useListUrlState.fuzz.test.tsx \
            src/pages/quotes/__tests__/useQuotesListPage.urlState.test.tsx
