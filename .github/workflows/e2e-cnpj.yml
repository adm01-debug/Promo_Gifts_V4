name: E2E — CNPJ SSOT

on:
  push:
    branches: [main]
    paths:
      - 'src/utils/masks.ts'
      - 'src/utils/cnpj-schema.ts'
      - 'src/utils/__tests__/cnpj-*.ts'
      - 'src/pages/dev/CnpjFormHarness.tsx'
      - 'e2e/ui/cnpj-*.spec.ts'
      - '.github/workflows/e2e-cnpj.yml'
  pull_request:
    paths:
      - 'src/utils/masks.ts'
      - 'src/utils/cnpj-schema.ts'
      - 'src/utils/__tests__/cnpj-*.ts'
      - 'src/pages/dev/CnpjFormHarness.tsx'
      - 'e2e/ui/cnpj-*.spec.ts'
      - '.github/workflows/e2e-cnpj.yml'

permissions:
  contents: read

concurrency:
  group: e2e-cnpj-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  cnpj-unit-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
      - name: Gate — render de CNPJ mascarado (B1/B6)
        run: node scripts/check-cnpj-render.mjs
      - name: Unit — CNPJ exhaustive + callsites audit + display contract + fuzz
        run: TZ=America/Sao_Paulo npx vitest run src/utils/masks.test.ts src/utils/cnpj-schema.test.ts "src/utils/__tests__/cnpj-" src/components/__tests__/cnpj-render.test.tsx
      - name: E2E — CNPJ specs
        run: npx playwright test e2e/ui/cnpj-*.spec.ts --project=chromium-public --workers=2 --retries=2
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cnpj-e2e-report
          path: |
            playwright-report/
            test-results/  # E54: failure screenshots/traces
          retention-days: 14
          if-no-files-found: ignore
