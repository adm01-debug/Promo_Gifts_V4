name: Sentinel Self-Test

# Roda em PRs que mexem no sentinel/script ou via dispatch manual.
# Previne regressões: mudanças no sentinel só passam se 100% das fixtures verdes.

on:
  pull_request:
    paths:
      - 'scripts/sentinel-check.sh'
      - 'scripts/sentinel-push-range.sh'
      - 'tests/scripts/sentinel-push-range.test.mjs'
      - '.github/workflows/branch-protection-sentinel.yml'
      - '.github/workflows/sentinel-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não
defaults:
  run:
    shell: bash

jobs:
  fixtures:
    name: Run sentinel-check.sh against fixture matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Run fixture matrix
        run: |
          set -uo pipefail

          SCRIPT="scripts/sentinel-check.sh"
          chmod +x "$SCRIPT"

          FAIL=0
          PASS=0

          assert_pass() {
            local desc="$1"; local sub="$2"; local msg="$3"; local author="$4"
            if RESULT=$(bash "$SCRIPT" "$sub" "$msg" "$author" 2>&1); then
              echo "  ✅ $desc → $RESULT"
              PASS=$((PASS + 1))
            else
              echo "  ❌ $desc → DEVERIA passar, falhou: $RESULT"
              FAIL=$((FAIL + 1))
            fi
          }

          assert_fail() {
            local desc="$1"; local sub="$2"; local msg="$3"; local author="$4"
            if RESULT=$(bash "$SCRIPT" "$sub" "$msg" "$author" 2>&1); then
              echo "  ❌ $desc → DEVERIA falhar, passou: $RESULT"
              FAIL=$((FAIL + 1))
            else
              echo "  ✅ $desc → $RESULT"
              PASS=$((PASS + 1))
            fi
          }

          echo "═══════════════════════════════════════════════════════════"
          echo "  CASOS QUE DEVEM PASSAR"
          echo "═══════════════════════════════════════════════════════════"
          assert_pass "squash padrão"               "feat: nova func (#123)"      "feat: nova func (#123)"      "alice"
          assert_pass "squash 4 dígitos"            "fix: bug (#9999)"            "fix: bug (#9999)"            "alice"
          assert_pass "squash whitespace fim"       "feat: x (#1) "               "feat: x (#1) "               "alice"
          assert_pass "merge commit"                "Merge pull request #456 from x/y" "Merge pull request #456 from x/y" "alice"
          assert_pass "merge customizado do repo"   "Merge PR #1812: consolida correcoes" "Merge PR #1812: consolida correcoes" "alice"
          assert_pass "merge oficial lowercase"     "merge(pr-1852): corrige revista" "merge(pr-1852): corrige revista" "alice"
          assert_pass "revert via UI"               'Revert "feat: x (#1)" (#789)' 'Revert "feat: x (#1)" (#789)' "alice"
          assert_pass "dependabot"                  "Bump foo from 1 to 2"        "Bump foo from 1 to 2"        "dependabot[bot]"
          assert_pass "renovate"                    "fix(deps): update"           "fix(deps): update"           "renovate[bot]"
          assert_pass "github-actions"              "Auto-commit"                 "Auto-commit"                 "github-actions[bot]"
          assert_pass "lovable-dev"                 "automated"                   "automated"                   "lovable-dev[bot]"
          assert_pass "gpt-engineer-app"            "scaffold"                    "scaffold"                    "gpt-engineer-app[bot]"
          assert_pass "lovable-cloud (futuro)"      "auto"                        "auto"                        "lovable-cloud[bot]"
          assert_pass "release"                     "chore(release): v1.0.0"      "chore(release): v1.0.0"      "alice"
          assert_pass "allowlist docs(redeploy)"    "docs(redeploy): add README"  "docs(redeploy): add README"  "alice"
          assert_pass "allowlist chore(workflows)"  "chore(workflows): update CI" "chore(workflows): update CI" "alice"
          assert_pass "allowlist chore(docs)"       "chore(docs): typo"           "chore(docs): typo"           "alice"
          assert_pass "bypass motivo longo (body)"  "fix urgente" $'fix urgente\n\n[skip-sentinel: rollback emergencial T-23 prod]'  "alice"
          assert_pass "bypass motivo subject"       "fix [skip-sentinel: hotfix prod incidente]" "fix [skip-sentinel: hotfix prod incidente]" "alice"

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  CASOS QUE DEVEM FALHAR"
          echo "═══════════════════════════════════════════════════════════"
          assert_fail "push direto humano"          "feat: nova feature"          "feat: nova feature"          "alice"
          assert_fail "edit web GitHub"             "Update README.md"            "Update README.md"            "alice"
          assert_fail "release capitalizado"        "Chore(release): v1.0"        "Chore(release): v1.0"        "alice"
          assert_fail "lovable sem hífen"           "x"                           "x"                           "lovable[bot]"
          assert_fail "bypass sem motivo"           "feat: x"                     "feat: x [skip-sentinel]"     "alice"
          assert_fail "bypass motivo vazio"         "feat: x"                     "feat: x [skip-sentinel: ]"   "alice"
          assert_fail "bypass motivo 3 chars"       "feat: x"                     "feat: x [skip-sentinel: ok]" "alice"
          assert_fail "PR ID não-numérico"          "feat: x (#ABC)"              "feat: x (#ABC)"              "alice"
          assert_fail "merge lowercase sem descrição" "merge(pr-1852):"             "merge(pr-1852):"             "alice"
          assert_fail "merge lowercase sem espaço"  "merge(pr-1852):corrige"       "merge(pr-1852):corrige"       "alice"
          assert_fail "merge lowercase PR inválido" "merge(pr-ABC): corrige"       "merge(pr-ABC): corrige"       "alice"
          assert_fail "docs genérico (sem escopo)"  "docs: README"                "docs: README"                "alice"
          assert_fail "chore genérico"              "chore: bump"                 "chore: bump"                 "alice"
          assert_fail "docs escopo não-allowlist"   "docs(api): nova endpoint"    "docs(api): nova endpoint"    "alice"

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  REGRESSÃO v2.0.1 — Unicode bypass e edge cases"
          echo "═══════════════════════════════════════════════════════════"
          # Fix [13]: bypass com motivo Unicode 5 chars (10 bytes UTF-8) DEVE PASSAR
          assert_pass "bypass Unicode 5 chars"        "fix: x"                      "fix: x [skip-sentinel: ãéçüñ]"          "alice"
          # Fix [13]: bypass com motivo Unicode 4 chars (8 bytes UTF-8) DEVE FALHAR
          assert_fail "bypass Unicode 4 chars"        "fix: x"                      "fix: x [skip-sentinel: ãéçü]"           "alice"

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  $PASS passaram | $FAIL falharam"
          echo "═══════════════════════════════════════════════════════════"

          if [[ $FAIL -gt 0 ]]; then
            echo "::error::$FAIL fixture(s) divergiram do esperado"
            exit 1
          fi

  test-protection-config:
    name: Test check-protection-config parsing logic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fixture — regras completas → OK
        run: |
          set -euo pipefail
          RULES='[{"type":"required_status_checks","parameters":{"required_status_checks":[{"context":"Gate Final - Deploy Ready"}]}},{"type":"pull_request","parameters":{}},{"type":"non_fast_forward","parameters":{}}]'
          RESULT=$(echo "$RULES" | python3 -c "import sys,json; rules=json.load(sys.stdin); types={r.get('type') for r in rules} if isinstance(rules,list) else set(); gate_ok=any('Gate Final' in c.get('context','') or 'deploy-ready' in c.get('context','').lower() for r in rules if r.get('type')=='required_status_checks' for c in r.get('parameters',{}).get('required_status_checks',[])); missing=[x for x,ok in [('required_status_checks:Gate-Final-Deploy-Ready','required_status_checks' in types and gate_ok),('pull_request','pull_request' in types),('non_fast_forward','non_fast_forward' in types)] if not ok]; print('NONE' if not isinstance(rules,list) or not rules else ('OK' if not missing else 'MISSING:'+','.join(missing)))")
          if [[ "$RESULT" != "OK" ]]; then
            echo "::error::regras completas deveriam retornar OK, retornou: $RESULT"
            exit 1
          fi
          echo "✅ regras completas → OK"

      - name: Fixture — sem Gate Final → MISSING
        run: |
          set -euo pipefail
          RULES='[{"type":"pull_request","parameters":{}},{"type":"non_fast_forward","parameters":{}}]'
          RESULT=$(echo "$RULES" | python3 -c "import sys,json; rules=json.load(sys.stdin); types={r.get('type') for r in rules} if isinstance(rules,list) else set(); gate_ok=any('Gate Final' in c.get('context','') or 'deploy-ready' in c.get('context','').lower() for r in rules if r.get('type')=='required_status_checks' for c in r.get('parameters',{}).get('required_status_checks',[])); missing=[x for x,ok in [('required_status_checks:Gate-Final-Deploy-Ready','required_status_checks' in types and gate_ok),('pull_request','pull_request' in types),('non_fast_forward','non_fast_forward' in types)] if not ok]; print('NONE' if not isinstance(rules,list) or not rules else ('OK' if not missing else 'MISSING:'+','.join(missing)))")
          if [[ "$RESULT" != "MISSING:required_status_checks:Gate-Final-Deploy-Ready" ]]; then
            echo "::error::sem Gate Final deveria retornar MISSING:required_status_checks:Gate-Final-Deploy-Ready, retornou: $RESULT"
            exit 1
          fi
          echo "✅ sem Gate Final → MISSING correto"

      - name: Fixture — sem pull_request e non_fast_forward → MISSING múltiplos
        run: |
          set -euo pipefail
          RULES='[{"type":"required_status_checks","parameters":{"required_status_checks":[{"context":"Gate Final - Deploy Ready"}]}}]'
          RESULT=$(echo "$RULES" | python3 -c "import sys,json; rules=json.load(sys.stdin); types={r.get('type') for r in rules} if isinstance(rules,list) else set(); gate_ok=any('Gate Final' in c.get('context','') or 'deploy-ready' in c.get('context','').lower() for r in rules if r.get('type')=='required_status_checks' for c in r.get('parameters',{}).get('required_status_checks',[])); missing=[x for x,ok in [('required_status_checks:Gate-Final-Deploy-Ready','required_status_checks' in types and gate_ok),('pull_request','pull_request' in types),('non_fast_forward','non_fast_forward' in types)] if not ok]; print('NONE' if not isinstance(rules,list) or not rules else ('OK' if not missing else 'MISSING:'+','.join(missing)))")
          if [[ "$RESULT" != "MISSING:pull_request,non_fast_forward" ]]; then
            echo "::error::sem pull_request/non_fast_forward deveria retornar MISSING:pull_request,non_fast_forward, retornou: $RESULT"
            exit 1
          fi
          echo "✅ sem pull_request+non_fast_forward → MISSING múltiplos correto"

      - name: Fixture — lista vazia (sem rulesets) → NONE
        run: |
          set -euo pipefail
          RESULT=$(echo '[]' | python3 -c "import sys,json; rules=json.load(sys.stdin); types={r.get('type') for r in rules} if isinstance(rules,list) else set(); gate_ok=any('Gate Final' in c.get('context','') or 'deploy-ready' in c.get('context','').lower() for r in rules if r.get('type')=='required_status_checks' for c in r.get('parameters',{}).get('required_status_checks',[])); missing=[x for x,ok in [('required_status_checks:Gate-Final-Deploy-Ready','required_status_checks' in types and gate_ok),('pull_request','pull_request' in types),('non_fast_forward','non_fast_forward' in types)] if not ok]; print('NONE' if not isinstance(rules,list) or not rules else ('OK' if not missing else 'MISSING:'+','.join(missing)))")
          if [[ "$RESULT" != "NONE" ]]; then
            echo "::error::lista vazia deveria retornar NONE, retornou: $RESULT"
            exit 1
          fi
          echo "✅ lista vazia → NONE correto"

  test-push-range-selection:
    name: Test Sentinel push range selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: ./.github/actions/setup-node-ci
        with:
          install: 'true'
      - name: Test first-parent range selection
        run: TZ=America/Sao_Paulo npx vitest run tests/scripts/sentinel-push-range.test.mjs --reporter=dot
