# Delete Orphan Edge Functions
#
# Workflow manual (workflow_dispatch) que remove edge functions zumbis
# do projeto Supabase doufsxqlfjyuvxuezpln. A lista padrão são as 6 edges
# auditadas em docs/historico/orphan-edges-2026-05-10.md, mas pode ser
# estendida via input `extraEdges` (CSV) para deletar edges adicionais.
#
# Como usar:
#   1. GitHub → Actions → "Delete Orphan Edge Functions" → Run workflow
#   2. (Opcional) Em `extraEdges`, passar uma lista CSV de edges extras a deletar.
#      Exemplo: "quote-public-view,generate-mockup-nanobanana"
#   3. Primeira execução: deixar dryRun=true (default) — só lista o que faria
#   4. Segunda execução: dryRun=false E digitar DELETE no campo confirm
#
# Pré-requisito: secret SUPABASE_ACCESS_TOKEN já está configurado no repo
# (mesmo secret usado por deploy-edge-functions.yml).

name: Delete Orphan Edge Functions

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (apenas lista o que seria deletado, não deleta)'
        type: boolean
        default: true
      confirm:
        description: 'Digite DELETE para confirmar (ignorado se dryRun=true)'
        type: string
        required: false
        default: ''
      extraEdges:
        description: 'Edges adicionais a deletar, separadas por vírgula (opcional)'
        type: string
        required: false
        default: ''

concurrency:
  group: delete-orphan-edges
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete:
    name: Delete orphan edges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate confirmation gate
        if: ${{ inputs.dryRun == false }}
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM_INPUT" != "DELETE" ]]; then
            echo "::error::Para deletar de verdade, digite exatamente DELETE no campo 'confirm'."
            echo "::error::Recebido: '$CONFIRM_INPUT'"
            exit 1
          fi
          echo "✅ Confirmação aceita. Procedendo com a remoção real."

      - name: Allowlist gate — rejeitar slugs ativos no repo
        env:
          EXTRA_EDGES: ${{ inputs.extraEdges }}
        run: |
          set -euo pipefail
          ORPHANS=(
            super-processor
            quick-task
            create_user
            product-search-v2
            product-classifier
            guardrails-ml
          )
          if [[ -n "${EXTRA_EDGES// /}" ]]; then
            IFS=',' read -ra EXTRAS <<< "$EXTRA_EDGES"
            for extra in "${EXTRAS[@]}"; do
              trimmed="$(echo "$extra" | xargs)"
              [[ -n "$trimmed" ]] && ORPHANS+=("$trimmed")
            done
          fi
          FAIL=0
          for fn in "${ORPHANS[@]}"; do
            # Rejeitar se slug existe em supabase/functions/<fn>/index.ts
            if [[ -f "supabase/functions/$fn/index.ts" ]]; then
              echo "::error::Slug '$fn' tem index.ts ativo em supabase/functions/$fn/ — não pode ser deletado via este workflow. Remova do repo primeiro."
              FAIL=1
            fi
            # Rejeitar se slug está na allowlist canonical-only
            if [[ -f "audit/edge-functions-canonical-only.json" ]]; then
              if jq -e --arg slug "$fn" '.functions[] | select(.slug == $slug)' audit/edge-functions-canonical-only.json > /dev/null 2>&1; then
                echo "::error::Slug '$fn' está em audit/edge-functions-canonical-only.json — precisa de remoção manual da allowlist antes."
                FAIL=1
              fi
            fi
          done
          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi
          echo "✅ Allowlist gate passou — nenhum slug ativo detectado."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2
        with:
          version: 2.101.0

      - name: Verify SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado no repo."
            echo "::error::Configurar em Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Token presente (length=${#SUPABASE_ACCESS_TOKEN})."

      - name: Delete orphan edges
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: doufsxqlfjyuvxuezpln
          DRY_RUN: ${{ inputs.dryRun }}
          EXTRA_EDGES: ${{ inputs.extraEdges }}
        run: |
          set -euo pipefail

          ORPHANS=(
            super-processor
            quick-task
            create_user
            product-search-v2
            product-classifier
            guardrails-ml
          )

          if [[ -n "${EXTRA_EDGES// /}" ]]; then
            IFS=',' read -ra EXTRAS <<< "$EXTRA_EDGES"
            for extra in "${EXTRAS[@]}"; do
              trimmed="$(echo "$extra" | xargs)"
              [[ -n "$trimmed" ]] && ORPHANS+=("$trimmed")
            done
          fi

          echo "=============================================="
          echo " Orphan Edge Functions Cleanup"
          echo "=============================================="
          echo "Project ref: $PROJECT_REF"
          echo "Dry run:     $DRY_RUN"
          echo "Extra edges: ${EXTRA_EDGES:-<none>}"
          echo "Total:       ${#ORPHANS[@]} edge functions"
          echo "=============================================="
          echo ""

          PASS=0
          FAIL=0
          SKIP=0

          for fn in "${ORPHANS[@]}"; do
            echo "--- $fn ---"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  🔍 [DRY RUN] supabase functions delete $fn --project-ref $PROJECT_REF"
              SKIP=$((SKIP+1))
            else
              if supabase functions delete "$fn" --project-ref "$PROJECT_REF" 2>&1; then
                echo "  ✅ Deleted: $fn"
                PASS=$((PASS+1))
              else
                echo "  ⚠️  Failed (talvez já não exista): $fn"
                FAIL=$((FAIL+1))
              fi
            fi
            echo ""
          done

          echo "=============================================="
          echo " Summary"
          echo "=============================================="
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY RUN — nenhuma edge function foi de fato deletada."
            echo "Skipped (would-delete): $SKIP"
            echo ""
            echo "Para deletar de verdade, rode novamente com:"
            echo "  dryRun = false"
            echo "  confirm = DELETE"
          else
            echo "Deleted successfully: $PASS"
            echo "Failed:               $FAIL"
            if [[ $FAIL -gt 0 ]]; then
              echo "::error::$FAIL edge(s) falharam ao deletar."
              exit 1
            fi
          fi

      - name: Post-delete validation hint
        if: ${{ inputs.dryRun == false && success() }}
        run: |
          echo "## Próximos passos"
          echo ""
          echo "1. Validar via Supabase MCP que as edges sumiram:"
          echo "   MCP \`SUPABASE - GESTÃO DE PRODUTOS:list_edge_functions\`"
          echo ""
          echo "2. Conferir que ai_function_routing não tem entradas órfãs:"
          echo "   SQL: SELECT function_name FROM public.ai_function_routing"
          echo "        WHERE function_name IN ('super-processor', ...);"
          echo ""
          echo "3. Atualizar memória/notes do projeto: edges removidas em $(date -u +%Y-%m-%d)."
