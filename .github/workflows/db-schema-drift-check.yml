name: db-schema-drift-check

# =============================================================================
# Drift check entre as migrations versionadas (supabase/migrations/**) e o
# schema REAL do projeto canonico no Supabase. Pega casos como uma tabela/view
# criada direto em producao (via Studio/MCP) que nunca virou migration —
# exatamente o que aconteceu com public.ai_enrichment_queue.
#
# Como funciona:
#   1. supabase link --project-ref <ref>  (Management API token + senha do DB)
#   2. supabase migration list --linked
#      -> falha antes do replay se repo e ledger canônico não estiverem iguais.
#         Não aplica as migrations locais pendentes.
#   3. Monta uma pasta de replay temporária (scripts/drift-baseline.mjs):
#      config.toml com PG 17 + supabase/baseline/<B>_baseline_schema.sql
#      (dump do schema vivo, gerado por schema-snapshot-export.yml) + as
#      migrations aplicadas depois do dump, renumeradas B+1, B+2…
#      O histórico completo de supabase/migrations/ não reconstrói o banco
#      (tabelas criadas fora de migration desde 2026-05), por isso o replay
#      parte do baseline. Nada é escrito no banco nem no ledger.
#   4. supabase db diff --workdir <pasta> --linked --schema public
#      -> DDL necessario p/ alinhar o shadow (baseline + replay) ao remoto.
#         Qualquer DDL restante = objeto em prod sem migration = DRIFT.
#   5. Falha o job se sobrar DDL depois de remover comentarios, linhas em
#      branco e o ruído listado em supabase/baseline/drift-allowlist.txt
#      (cada entrada específica e justificada).
#
# Roda:
#   - cron diario (06:29 BRT = 09:29 UTC) — offset do edge-functions-drift-check
#   - PRs que tocam supabase/migrations/** ou supabase/config.toml
#   - manual (workflow_dispatch)
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   - SUPABASE_ACCESS_TOKEN : PAT da Management API
#                             https://supabase.com/dashboard/account/tokens
#   - SUPABASE_DB_PASSWORD  : senha do banco do projeto (Database settings)
#
# FAIL-CLOSED: faltando algum secret obrigatório, o job falha explicitamente.
# Um check verde só é válido após link e consulta live ao banco canônico.
#
# Variavel sobrescrivivel (nao-secret):
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
#
# Sessões em produção (investigacção 2026-10-15, runs 38730003472/38734310352):
#   - Este job só abre conexões remotas em `link`, `migration list` e na fase
#     migra do `db diff` (consultas de catálogo, sem pg_dump e sem lock por
#     tabela). O `db diff` primeiro replaya as migrations num shadow LOCAL; se
#     o replay falha, ele nem chega a conectar no remoto.
#   - As sessões `pg_dump` (AccessShareLock em ~500 tabelas, timeouts zerados
#     por SET de sessão do próprio pg_dump) vistas no mesmo horário vinham do
#     `supabase db dump` de schema-snapshot-export.yml, que roda em paralelo
#     no mesmo PR. Ver recomendação no PR/relatório; aqui só endurecemos este
#     job para não deixar cliente vivo contra o canônico apös o step:
#       * `timeout --signal=INT` no `db diff` (cancelamento limpo do CLI);
#       * step `if: always()` que remove containers do CLI (shadow + migra).
# =============================================================================

on:
  schedule:
    - cron: '29 9 * * *' # 06:29 BRT — E89: ≅20min after edge-functions-drift-check (09:06), ≅20min before restore-seller-cart-rpc (09:49)
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/baseline/**'
      - 'scripts/drift-baseline.mjs'
      - '.github/workflows/db-schema-drift-check.yml'
  workflow_dispatch:
  # Chamado por schema-snapshot-export.yml antes de girar o baseline: baseline
  # novo só entra se o atual + replay não acusarem drift (senão o dump novo
  # absorveria a DDL fora de migration e o drift-check deixaria de vê-la).
  workflow_call:
    inputs:
      allow_missing_baseline:
        description: 'Sem baseline ainda (bootstrap): passa sem diff em vez de falhar'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read  # autenticação no ghcr.io para pulls de imagens Docker (evita rate limit anônimo compartilhado)
  # pull-requests: write — removido E92 (não usado neste workflow)

concurrency:
  group: db-schema-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  drift:
    name: Migrations x Canonical schema
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          # E57: usa o SHA exato do head do PR (nao o merge commit do tip do branch).
          # Para eventos sem PR, github.sha ja aponta para o commit correto.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Gate - secrets obrigatórios presentes?
        id: guard
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            {
              echo "## Drift check bloqueado"
              echo
              echo "SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD ausentes."
              echo "O resultado nao pode ser considerado valido sem consulta live ao projeto canonico."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD ausentes; nao e permitido pular a validacao live."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Supabase CLI
        if: steps.guard.outputs.enabled == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v2
        with:
          version: 2.101.0

      - name: Garante registry ghcr.io (E104 — revertido de ECR por data-limit)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # supabase/setup-cli@v2 define SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io via $GITHUB_ENV.
          # E104 sobrescrevia para ECR Public (public.ecr.aws) porque ghcr.io tinha rate-limit.
          # A partir de 2026-10-24, ECR Public passou a retornar "toomanyrequests: Data limit exceeded"
          # em todas as tentativas (4 runs consecutivas); ghcr.io (44k req/min) e preferivel para
          # um unico job de drift check. Reverte para ghcr.io explicitamente.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"

      - name: Link canonical project
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # Senha via SUPABASE_DB_PASSWORD (env do job), nunca como argumento (R5).
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Ledger parity (repo x canonical)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # CLI 2.101 pode devolver tabela textual mesmo com --output-format.
          # O parser local aceita a tabela e o JSON de versoes mais novas.
          supabase migration list --linked --output-format json > /tmp/migration-ledger.json
          if ! node scripts/check-supabase-migration-ledger.mjs \
            /tmp/migration-ledger.json --summary /tmp/migration-ledger-summary.json; then
            {
              echo "## Ledger de migrations divergente"
              echo
              echo "Ha migrations locais nao aplicadas, versoes exclusivas do remoto ou pares incompativeis."
              echo "O `db diff` nao sera executado porque o shadow replay seria enganoso."
              echo "Nao execute `db push` em lote: reconcilie cada versao por efeito e autorizacao."
              echo
              echo '```json'
              cat /tmp/migration-ledger-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Monta replay (baseline + migrations aplicadas depois do dump)
        id: replay
        if: steps.guard.outputs.enabled == 'true'
        env:
          ALLOW_MISSING_BASELINE: ${{ inputs.allow_missing_baseline || false }}
        run: |
          set -euo pipefail
          if ! node scripts/drift-baseline.mjs prepare-workdir \
            --ledger /tmp/migration-ledger.json --out /tmp/drift-wd > /tmp/drift-wd.json 2> /tmp/drift-wd.stderr; then
            if [ "$ALLOW_MISSING_BASELINE" = "true" ] && grep -q 'nenhum baseline' /tmp/drift-wd.stderr; then
              echo "::notice::Sem baseline (bootstrap) — o primeiro baseline e gerado sem comparacao."
              echo "## Bootstrap: sem baseline anterior para comparar" >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "## Drift check sem baseline valido"
              echo
              echo '```'
              cat /tmp/drift-wd.stderr
              echo '```'
              echo "Gere o baseline rodando schema-snapshot-export.yml (workflow_dispatch) e"
              echo "mergeie a PR de bot/schema-snapshot. Nao copie o baseline para supabase/migrations/."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$(cat /tmp/drift-wd.stderr)"
            exit 1
          fi
          cat /tmp/drift-wd.json
          # Link da pasta de replay (o link do passo anterior vale so para a raiz do repo).
          supabase link --workdir /tmp/drift-wd --project-ref "$SUPABASE_PROJECT_REF"

      - name: Pre-pull Supabase postgres image (ghcr.io autenticado)
        if: steps.guard.outputs.enabled == 'true' && steps.replay.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # supabase db diff arranca shadow DB local com esta imagem.
          # Registry lido de SUPABASE_INTERNAL_IMAGE_REGISTRY (ghcr.io, via step anterior).
          # Autenticacao com GITHUB_TOKEN (packages: read) evita o rate limit anonimo compartilhado
          # (44k req/min entre todos runners do GitHub Actions). Tag fixa para CLI 2.101.0.
          POSTGRES_IMAGE="${SUPABASE_INTERNAL_IMAGE_REGISTRY}/supabase/postgres:17.6.1.063"
          for attempt in 1 2 3 4 5; do
            # Tenta autenticado (evita rate limit anonimo); cai em anonimo se caller nao tiver packages: read
            if echo "$GITHUB_TOKEN" | docker login ghcr.io -u x-access-token --password-stdin 2>/dev/null \
                && docker pull "$POSTGRES_IMAGE"; then
              echo "Pre-pull ok autenticado (tentativa $attempt)"
  break
            elif docker pull "$POSGRES_IMAGE"; then
              echo "Pre-pull ok anonimo (tentativa $attempt)"
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "::error::Pre-pull de $POSTGRES_IMAGE falhou apos 5 tentativas"; exit 1; }
            wait_s=$((attempt * 30))
            echo "Tentativa $attempt falhou — aguardando ${wait_s}s antes de tentar novamente"
            sleep "$wait_s"
          done

      - name: Schema drift check (baseline + replay x remote)
        if: steps.guard.outputs.enabled == 'true' && steps.replay.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Limite proprio < timeout do job: SIGINT deixa o CLI cancelar o
          # contexto e remover os containers shadow/migra antes do runner morrer.
          # E035: schemas lidos do arquivo compartilhado (mesmo usado pelo export)
          SCHEMAS=$(grep -v '^#' supabase/baseline/schemas.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          rc=0
          timeout --signal=INT --kill-after=60s 18m \
            supabase db diff --workdir /tmp/drift-wd --linked --schema "$SCHEMAS" \
            > /tmp/schema_drift.sql 2> /tmp/diff.stderr || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::supabase db diff excedeu 18 min e foi interrompido (rc=$rc)."
            fi
            # Replay quebrado no shadow: quase sempre uma migration registrada
            # depois do dump cujo SQL ja estava no baseline (repair-only de DDL
            # feita fora do fluxo) ou aplicada fora da ordem de versao. O
            # remedio e um baseline novo, nao editar a migration.
            last=$(grep -o 'Applying migration [^ ]*' /tmp/diff.stderr | tail -1 || true)  # ok: grep retorna 1 quando nao ha match; resultado vazio e valido
            if [ -n "$last" ]; then
              {
                echo "## Replay do baseline falhou"
                echo
                echo "Ultimo passo: \`$last\`."
                echo "Se a migration foi registrada com \`mode: repair-only\` depois do baseline (DDL ja"
                echo "existia no dump) ou aplicada fora da ordem de versao, gere um baseline novo:"
                echo "\`schema-snapshot-export.yml\` (workflow_dispatch) e merge da PR de bot/schema-snapshot."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::supabase db diff falhou:"; cat /tmp/diff.stderr; exit 1
          fi
          node scripts/drift-baseline.mjs filter-diff --diff /tmp/schema_drift.sql --workdir /tmp/drift-wd \
            --allowlist supabase/baseline/drift-allowlist.txt > /tmp/schema_drift.clean
          baseline=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/drift-wd.json","utf8")).baselineVersion)')
          replayed=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/drift-wd.json","utf8")).replayed_count)')
          if [ -s /tmp/schema_drift.clean ]; then
            cnt=$(wc -l < /tmp/schema_drift.clean | tr -d ' ')
            {
              echo "## Schema drift detectado"
              echo
              echo "Baseline $baseline + $replayed migration(s) replayada(s)."
              echo "O schema canonico tem DDL ($cnt linha(s) fora da allowlist) nao descrito por migration."
              echo "Provavel objeto criado direto em producao sem migration."
              echo
              echo "### Residuo (fora da allowlist)"
              echo '```sql'
              cat /tmp/schema_drift.clean
              echo '```'
              echo
              echo "Diff completo no artifact schema-reconciliation-evidence."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Schema drift detectado - veja o job summary / artifact."
            exit 1
          fi
          {
            echo "## Sem drift de schema"
            echo
            echo "Baseline $baseline + $replayed migration(s) aplicada(s) depois dele descrevem"
            echo "o schema public do projeto canonico (fora o ruido em supabase/baseline/drift-allowlist.txt)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Event trigger drift check (E036)
        if: steps.guard.outputs.enabled == 'true' && steps.replay.outputs.skip != 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          node scripts/check-event-triggers-drift.mjs

      - name: Cron job drift check (E037)
        if: steps.guard.outputs.enabled == 'true' && steps.replay.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node scripts/check-cron-drift.mjs

      # Garante que nenhum container do CLI (shadow DB / edge-runtime migra)
      # continue conectado ao canonico depois do step — inclusive em cancel
      # (cancel-in-progress) ou timeout. So toca containers rotulados pelo CLI.
      - name: Cleanup Supabase CLI containers
        if: ${{ always() && steps.guard.outputs.enabled == 'true' }}
        run: |
          set -uo pipefail
          ids=$(docker ps -aq --filter "label=com.supabase.cli.project" || true)  # ok: docker pode nao estar rodando; ids vazio = nada a remover
          if [ -n "$ids" ]; then
            echo "Removendo containers do Supabase CLI: $ids"
            # shellcheck disable=SC2086 # lista de IDs separada por spaco/linha
            docker rm -f $ids || true  # ok: cleanup best-effort; falha nao deve abortar o job
          else
            echo "Nenhum container do Supabase CLI ativo."
          fi

      - name: Upload drift artifact
        if: ${{ always() && steps.guard.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-reconciliation-evidence
          path: |
            /tmp/schema_drift.sql
            /tmp/schema_drift.clean
            /tmp/drift-wd.json
            /tmp/migration-ledger.json
            /tmp/migration-ledger-summary.json
          if-no-files-found: ignore
          retention-days: 14
