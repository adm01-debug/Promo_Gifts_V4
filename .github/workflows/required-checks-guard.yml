name: Required Checks Guard

# Falha quando o ruleset aplicável à main não exige o gate agregador canônico.
# Consulta a API de repository rulesets; a API legacy de branch protection
# responde 404/403 quando a proteção moderna é feita por ruleset.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert-required-checks:
    name: Assert Gate Final is required on main
    runs-on: ubuntu-latest
    steps:
      - name: Check required_status_checks in active main rulesets
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          REQUIRED="Gate Final - Deploy Ready"
          RULESETS_URL="https://api.github.com/repos/$REPO/rulesets?includes_parents=true&per_page=100"

          HTTP=$(curl -sS -o /tmp/rulesets.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RULESETS_URL")

          {
            echo "### Required status checks — rulesets ativos de main"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HTTP" != "200" ]]; then
            echo "::error::Não foi possível ler repository rulesets (HTTP $HTTP); estado remoto inconclusivo."
            exit 1
          fi

          IDS=$(jq -r '.[] | select(.enforcement == "active") | .id' /tmp/rulesets.json)
          if [[ -z "$IDS" ]]; then
            echo "::error::Nenhum repository ruleset ativo encontrado."
            exit 1
          fi

          : > /tmp/main-required-contexts.txt
          MATCHED=0
          for ID in $IDS; do
            DETAIL_HTTP=$(curl -sS -o "/tmp/ruleset-$ID.json" -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/rulesets/$ID")
            if [[ "$DETAIL_HTTP" != "200" ]]; then
              echo "::error::Não foi possível ler o ruleset $ID (HTTP $DETAIL_HTTP)."
              exit 1
            fi

            APPLIES=$(jq -r '
              ((.conditions.ref_name.include // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main")) and
              (((.conditions.ref_name.exclude // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main")) | not)
            ' "/tmp/ruleset-$ID.json")
            if [[ "$APPLIES" != "true" ]]; then
              continue
            fi

            MATCHED=$((MATCHED + 1))
            jq -r '
              .rules[]?
              | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]?.context
            ' "/tmp/ruleset-$ID.json" >> /tmp/main-required-contexts.txt
          done

          if [[ "$MATCHED" -eq 0 ]]; then
            echo "::error::Nenhum ruleset ativo aplicável à main foi encontrado."
            exit 1
          fi

          CONTEXTS=$(sort -u /tmp/main-required-contexts.txt)

          {
            echo "**Required contexts encontrados:**"
            if [[ -n "$CONTEXTS" ]]; then
              printf '%s\n' "$CONTEXTS" | sed 's/^/- /'
            else
              echo "- (none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ! printf '%s\n' "$CONTEXTS" | grep -qxF "$REQUIRED"; then
            echo "::error::Required status check '$REQUIRED' ausente nos rulesets ativos de main."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required check: \`$REQUIRED\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REQUIRED\` está obrigatório e o estado remoto foi comprovado." >> "$GITHUB_STEP_SUMMARY"
