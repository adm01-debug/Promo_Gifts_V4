name: Required Checks Guard

# Falha quando o ruleset aplicável à main não exige o gate agregador canônico.
# Consulta a API de repository rulesets; a API legacy de branch protection
# responde 404/403 quando a proteção moderna é feita por ruleset.

on:
  push:
    branches: [main]
  pull_request:
    # E176: sem paths filter — assert-required-checks precisa rodar em todo PR
    # para ser um required check efetivo (check com paths filter que não dispara = PR bloqueado)
    branches: [main]
  schedule:
    - cron: '45 8 * * *'  # diário 08:45 UTC — E89: ≥20min de edge-functions-drift-check (09:06)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-checks-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  assert-required-checks:
    name: Assert Gate Final is required on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          sparse-checkout: .github/required-checks.json
          sparse-checkout-cone-mode: false
      - name: Check required_status_checks in active main rulesets
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Lê o check obrigatório do JSON (E56) — evita hardcode que desincroniza
          # quando o nome do gate muda.
          REQUIRED=$(jq -r '.rulesets[] | select(.id == "main" and (._disabled // false | not)) | .required_checks[0].name' .github/required-checks.json)
          if [[ -z "$REQUIRED" || "$REQUIRED" == "null" ]]; then
            echo "::error::required-checks.json não contém entry 'main' com required_checks."
            exit 1
          fi
          RULESETS_URL="https://api.github.com/repos/$REPO/rulesets?includes_parents=true&per_page=100"

          HTTP=$(curl -sS -o /tmp/rulesets.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RULESETS_URL")

          {
            echo "### Required status checks — rulesets ativos de main"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HTTP" != "200" ]]; then
            if [[ "$HAS_PAT" != "true" ]]; then
              echo "::warning::BRANCH_PROTECTION_READ_TOKEN não configurado (usando github.token sem permissão admin — HTTP $HTTP). Verificação de rulesets pulada. Configure o PAT em Settings → Secrets and variables → Actions."
              exit 0
            fi
            echo "::error::Não foi possível ler repository rulesets (HTTP $HTTP); estado remoto inconclusivo."
            exit 1
          fi

          IDS=$(jq -r '.[] | select(.enforcement == "active") | .id' /tmp/rulesets.json)
          if [[ -z "$IDS" ]]; then
            echo "::error::Nenhum repository ruleset ativo encontrado."
            exit 1
          fi

          : > /tmp/main-required-contexts.txt
          MATCHED=0
          for ID in $IDS; do
            DETAIL_HTTP=$(curl -sS -o "/tmp/ruleset-$ID.json" -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/rulesets/$ID")
            if [[ "$DETAIL_HTTP" != "200" ]]; then
              echo "::error::Não foi possível ler o ruleset $ID (HTTP $DETAIL_HTTP)."
              exit 1
            fi

            APPLIES=$(jq -r '
              ((.conditions.ref_name.include // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main" or . == "~ALL")) and
              (((.conditions.ref_name.exclude // []) | any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main" or . == "~ALL")) | not)
            ' "/tmp/ruleset-$ID.json")
            if [[ "$APPLIES" != "true" ]]; then
              continue
            fi

            MATCHED=$((MATCHED + 1))
            jq -r '
              .rules[]?
              | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]?.context
            ' "/tmp/ruleset-$ID.json" >> /tmp/main-required-contexts.txt
          done

          if [[ "$MATCHED" -eq 0 ]]; then
            echo "::error::Nenhum ruleset ativo aplicável à main foi encontrado."
            exit 1
          fi

          CONTEXTS=$(sort -u /tmp/main-required-contexts.txt)

          {
            echo "**Required contexts encontrados:**"
            if [[ -n "$CONTEXTS" ]]; then
              printf '%s\n' "$CONTEXTS" | sed 's/^/- /'
            else
              echo "- (none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ! printf '%s\n' "$CONTEXTS" | grep -qxF "$REQUIRED"; then
            echo "::error::Required status check '$REQUIRED' ausente nos rulesets ativos de main."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required check: \`$REQUIRED\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REQUIRED\` está obrigatório e o estado remoto foi comprovado." >> "$GITHUB_STEP_SUMMARY"

  # E71 — Verifica checks fantasmas: required-checks.json vs jobs reais nos workflows
  ghost-check-guard:
    name: Ghost Check Guard — required-checks.json vs workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version-file: .nvmrc
      - name: Install js-yaml
        run: npm i --no-save js-yaml@4.3.2
      - name: Check for phantom required checks (E71)
        run: node scripts/check-required-checks.mjs

  # E40 — Inventário de segredos: abre issue quando há referências não documentadas
  secrets-inventory-check:
    name: Secrets Inventory Check (E40)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # ci-issue action (E12) — abre/fecha issues de violação
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check secrets inventory (E40)
        id: inventory
        run: node scripts/check-secrets-inventory.mjs --gate
      - name: Abrir issue de violação (schedule/push)
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ci-issue
        with:
          key: secrets-inventory-orphan
          title: '[CI] Secrets inventory — referências não documentadas em docs/ci/SEGREDOS.md'
          body: |
            O job `secrets-inventory-check` encontrou segredos/vars referenciados nos workflows mas não documentados em `docs/ci/SEGREDOS.md`.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Ação:** executar `node scripts/check-secrets-inventory.mjs --update` para ver a lista e atualizar `docs/ci/SEGREDOS.md`.
          labels: 'ci,ci-inconclusive'
          state: open
      - name: Fechar issue na recuperação (schedule/push)
        if: success() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ci-issue
        with:
          key: secrets-inventory-orphan
          title: '[CI] Secrets inventory — referências não documentadas em docs/ci/SEGREDOS.md'
          body: 'Todos os secrets/vars estão documentados em SEGREDOS.md.'
          state: resolved
