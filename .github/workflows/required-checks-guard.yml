name: Required Checks Guard

# Falha quando as regras EFETIVAS da main (rulesets ativos) não exigem o gate
# agregador canônico (nome lido de .github/required-checks.json), aprovação por
# PR (pull_request) e bloqueio de push forçado (non_fast_forward).
#
# 2026-11-13 (wf-consolida):
#   - Unificado com o job check-protection-config do branch-protection-sentinel.yml
#     (mesma pergunta, duas implementações). Ficou a mais completa: endpoint de
#     regras efetivas (rules/branches/main, funciona com github.token), as três
#     regras do sentinel (lógica coberta pelas fixtures do sentinel-self-test.yml)
#     + o nome exato do required-checks.json que este guard já conferia.
#   - Saiu de pull_request/push incondicional: o estado dos rulesets é configuração Em PR roda só quando o PR mexe no que o guard valida (paths abaixo).
#     do GitHub, não muda com o diff do PR. Agora: diário + dispatch + push em main
#     que mexa em .github/** (onde mora o required-checks.json).
#   - O ghost-check (E71, scripts/check-required-checks.mjs) é estático e foi para
#     o static-checks.yml, que roda em todo PR.
#   - Nenhum job daqui é required check no ruleset (só "Gate Final - Deploy Ready").

on:
  # PR só quando mexe no que o guard valida: um PR que renomeie required_checks[0].name
  # no JSON precisa falhar ANTES do merge, não no cron seguinte (revisão 13/11).
  pull_request:
    paths:
      - '.github/required-checks.json'
      - '.github/workflows/required-checks-guard.yml'
      - 'docs/ci/SEGREDOS.md'
      - 'scripts/check-secrets-inventory.mjs'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'docs/ci/SEGREDOS.md'
      - 'scripts/check-secrets-inventory.mjs'
      - '.github/workflows/required-checks-guard.yml'
  schedule:
    - cron: '45 8 * * *'  # diário 08:45 UTC — E89: ≥20min de edge-functions-drift-check (09:06)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-checks-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  assert-required-checks:
    name: Assert Gate Final is required on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          sparse-checkout: .github/required-checks.json
          sparse-checkout-cone-mode: false
      # A flag `protected` da API branches/ é false com rulesets (método antigo). O endpoint
      # rules/branches/main devolve as regras EFETIVAS da main (todos os rulesets ativos que a
      # alcançam) e responde com github.token — sem iterar /rulesets nem precisar de PAT.
      - name: Regras efetivas da main (Gate Final + pull_request + non_fast_forward)
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Nome do check obrigatório vem do JSON (E56) — evita hardcode que desincroniza.
          REQUIRED=$(jq -r '.rulesets[] | select(.id == "main" and (._disabled // false | not)) | .required_checks[0].name' .github/required-checks.json)
          if [[ -z "$REQUIRED" || "$REQUIRED" == "null" ]]; then
            echo "::error::required-checks.json não contém entry 'main' com required_checks."
            exit 1
          fi

          HTTP=$(curl -sS -o "$RUNNER_TEMP/rules.json" -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/rules/branches/main")
          if [[ "$HTTP" != "200" ]]; then
            echo "::error::Não foi possível ler as regras efetivas da main (HTTP $HTTP); estado remoto inconclusivo."
            exit 1
          fi

          # E11 (ex-branch-protection-sentinel.yml/check-protection-config): mesma expressão
          # exercitada pelas fixtures do sentinel-self-test.yml — mudar lá e aqui juntos.
          RESULT=$(python3 -c "import sys,json; rules=json.load(sys.stdin); types={r.get('type') for r in rules} if isinstance(rules,list) else set(); gate_ok=any('Gate Final' in c.get('context','') or 'deploy-ready' in c.get('context','').lower() for r in rules if r.get('type')=='required_status_checks' for c in r.get('parameters',{}).get('required_status_checks',[])); missing=[x for x,ok in [('required_status_checks:Gate-Final-Deploy-Ready','required_status_checks' in types and gate_ok),('pull_request','pull_request' in types),('non_fast_forward','non_fast_forward' in types)] if not ok]; print('NONE' if not isinstance(rules,list) or not rules else ('OK' if not missing else 'MISSING:'+','.join(missing)))" < "$RUNNER_TEMP/rules.json")
          CONTEXTS=$(jq -r '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context' "$RUNNER_TEMP/rules.json" | sort -u)

          {
            echo "### Regras efetivas de \`main\` (rulesets ativos)"
            echo ""
            echo "**Regras críticas:** \`$RESULT\`"
            echo ""
            echo "**Required contexts encontrados:**"
            if [[ -n "$CONTEXTS" ]]; then
              printf '%s\n' "$CONTEXTS" | sed 's/^/- /'
            else
              echo "- (none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          if [[ "$RESULT" != "OK" ]]; then
            echo "::error::Branch protection insuficiente para main: $RESULT. Configure em https://github.com/$REPO/settings/rules (passo a passo: .github/BRANCH_PROTECTION_SETUP.md)."
            FAIL=1
          fi
          if ! printf '%s\n' "$CONTEXTS" | grep -qxF "$REQUIRED"; then
            echo "::error::Required status check '$REQUIRED' (nome exato do required-checks.json) ausente nas regras efetivas da main."
            FAIL=1
          fi
          if [[ "$FAIL" -eq 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$REQUIRED\` + pull_request + non_fast_forward obrigatórios; estado remoto comprovado." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$FAIL"

  # E40 — Inventário de segredos: abre issue quando há referências não documentadas
  secrets-inventory-check:
    name: Secrets Inventory Check (E40)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write  # ci-issue action (E12) — abre/fecha issues de violação
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check secrets inventory (E40)
        id: inventory
        run: node scripts/check-secrets-inventory.mjs --gate
      - name: Abrir issue de violação (schedule/push)
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ci-issue
        with:
          key: secrets-inventory-orphan
          title: '[CI] Secrets inventory — referências não documentadas em docs/ci/SEGREDOS.md'
          body: |
            O job `secrets-inventory-check` encontrou segredos/vars referenciados nos workflows mas não documentados em `docs/ci/SEGREDOS.md`.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Ação:** executar `node scripts/check-secrets-inventory.mjs --update` para ver a lista e atualizar `docs/ci/SEGREDOS.md`.
          labels: 'ci,ci-inconclusive'
          state: open
      - name: Fechar issue na recuperação (schedule/push)
        if: success() && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: ./.github/actions/ci-issue
        with:
          key: secrets-inventory-orphan
          title: '[CI] Secrets inventory — referências não documentadas em docs/ci/SEGREDOS.md'
          body: 'Todos os secrets/vars estão documentados em SEGREDOS.md.'
          state: resolved
