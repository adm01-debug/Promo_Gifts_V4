name: DB — Aplicação controlada de migration única (E15)

# PLANO_DBA E15 — único caminho autorizado (CLAUDE.md REGRA #8) para aplicar
# uma migration NOVA no projeto canônico `doufsxqlfjyuvxuezpln` fora de um
# MCP-ticket (docs/db/POLITICA_DDL.md). `supabase db push` continua proibido.
#
# Fluxo: workflow_dispatch(version) → preflight (read-only) → apply (gated
# por `environment: production` — configurar required reviewers nas
# Settings → Environments do repositório; este workflow NÃO pode configurar
# isso sozinho) → `migration repair --status applied` → post-check
# (read-only) → receipt (abre PR com a linha nova em MIGRATIONS_SYNC_LOG.md,
# nunca commita direto em main).
#
# Cada job read-only usa scripts/preflight-migration-apply.mjs (Management
# API, nunca PostgREST — REGRA #8 corolário). O job `apply` é o único que
# toca o banco de verdade, via psql com as credenciais PG* já usadas por
# .github/workflows/migration-dry-run.yml (mesma convenção de secrets,
# mesmo padrão safe-by-default se ausentes).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da migration (prefixo numérico de supabase/migrations/<version>_*.sql)'
        required: true
        type: string
      approved_by:
        description: 'Nome do revisor que aprovou esta migration (ex.: @usuario) — obrigatório (E35)'
        required: true
        type: string
      mode:
        description: 'apply (padrão) = executa SQL + repair; repair-only = só registra no ledger sem aplicar SQL (E05: reconciliação pós-DDL via MCP)'
        required: false
        type: choice
        default: apply
        options:
          - apply
          - repair-only
      ack_baseline_rotation:
        description: 'E051: confirma que você agendará rotação do baseline (schema-snapshot-export force_rotate=true) APÓS este repair-only. Obrigatório para mode=repair-only.'
        required: false
        type: boolean
        default: false

concurrency:
  group: db-apply-migration
  cancel-in-progress: false

env:
  MIGRATION_VERSION: ${{ inputs.version }}
  SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: 1. Preflight (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          ref: main  # E35: checkout sempre de main, nunca de branch de PR

      - name: E051 — repair-only exige ack de rotação do baseline
        if: inputs.mode == 'repair-only'
        run: |
          set -euo pipefail
          {
            echo "## ⚠️ repair-only: ação pós-aplicação obrigatória (E051)"
            echo ""
            echo "\`mode: repair-only\` registra a versão no ledger **sem executar SQL**."
            echo "Se existir um baseline (\`supabase/baseline/*_baseline_schema.sql\`), o replay"
            echo "baseline + migrations subsequentes ficará **dessincronizado** até uma rotação forçada."
            echo ""
            echo "**Ação obrigatória após este workflow:**"
            echo "Disparar \`schema-snapshot-export.yml\` com \`force_rotate: true\` para gerar novo baseline."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.ack_baseline_rotation }}" != "true" ]; then
            echo "::error::repair-only requer ack_baseline_rotation=true — confirme que você agendará a rotação do baseline (schema-snapshot-export force_rotate=true) antes de prosseguir. Ver E051."
            exit 1
          fi
          echo "ack_baseline_rotation confirmado — prosseguindo com repair-only."

      - name: Valida approved_by não-vazio (E35 — rejeição antecipada)
        env:
          APPROVED_BY: ${{ inputs.approved_by }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVED_BY// /}" ]; then
            echo "::error::approved_by é obrigatório e não pode ser vazio (E35). Informe o revisor que aprovou a migration antes de prosseguir."
            exit 1
          fi
          echo "approved_by presente: '$APPROVED_BY' — prosseguindo com preflight."

      - name: Valida input antes de qualquer uso no shell
        run: node scripts/validate-migration-target.mjs --version-only

      - name: Confirma reviewer obrigatório no environment Production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # O rótulo `environment: production` sozinho NÃO exige revisão.
          # Em 2026-09-22 o environment existia mas protection_rules=[].
          reviewer_rules=$(gh api \
            "repos/${{ github.repository }}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers" and (.reviewers | length) > 0)] | length')
          if [ "$reviewer_rules" -lt 1 ]; then
            echo "::error::Environment Production sem reviewer obrigatório. Configure a proteção antes de aplicar qualquer migration."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Checa arquivo único, rollback documentado, ainda não no ledger
        run: node scripts/preflight-migration-apply.mjs --version="$MIGRATION_VERSION" --require-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  apply:
    name: 2. Apply (requer aprovação do environment production)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      # lock_timeout curto: o role anon tem statement_timeout=3s, e leitores
      # enfileirados atrás de um AccessExclusiveLock pendente começam a falhar
      # após ~1s (run 38730252412: DROP POLICY esperou 2 min, 7 statements de
      # outras sessões cancelados). Melhor a migration falhar rápido e ser
      # re-disparada. Uma migration pode sobrescrever com o seu próprio
      # `SET LOCAL lock_timeout = '...'` (ou `SET` se transaction: none).
      MIGRATION_LOCK_TIMEOUT: '1s'
      MIGRATION_STATEMENT_TIMEOUT: '10min'
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      applied_at: ${{ steps.hash.outputs.applied_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          ref: main  # E35: checkout sempre de main, nunca de branch de PR

      - name: Guard — versão e destino PostgreSQL canônico
        if: inputs.mode != 'repair-only'
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT || '5432' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/validate-migration-target.mjs --require-live-pooler

      - name: Instala postgresql-client
        if: inputs.mode != 'repair-only'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Confirma autenticação PostgreSQL antes de qualquer DDL (somente leitura)
        if: inputs.mode != 'repair-only'
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT || '5432' }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: psql -X -w -v ON_ERROR_STOP=1 -c 'BEGIN READ ONLY; SELECT 1 AS connection_ok; COMMIT;'

      - name: Localiza o arquivo da migration
        id: locate
        run: |
          set -euo pipefail
          mapfile -t FILES < <(ls supabase/migrations/"${MIGRATION_VERSION}"_*.sql 2>/dev/null || true)  # ok: ls com glob retorna non-zero se nenhum arquivo encontrado — tamanho do array é verificado abaixo
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::esperava exatamente 1 arquivo supabase/migrations/${MIGRATION_VERSION}_*.sql, encontrei ${#FILES[@]} (o job 'preflight' deveria ter barrado isso antes)."
            exit 1
          fi
          echo "file=${FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Calcula sha256 do arquivo
        id: hash
        run: |
          echo "sha256=$(sha256sum "${{ steps.locate.outputs.file }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "applied_at=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Detecta opt-out de transação no cabeçalho
        if: inputs.mode != 'repair-only'
        id: tx_optout
        run: |
          # Espelha a lógica de parseOptOut() em scripts/preflight-migration-apply.mjs:
          # se o cabeçalho declara "-- transaction: none", a migration não pode rodar
          # dentro de uma transação implícita (-1). O preflight já validou que
          # "-- approved-by:" também está presente quando transaction:none está.
          if head -40 "${{ steps.locate.outputs.file }}" | grep -qi '^[[:space:]]*--[[:space:]]*transaction[[:space:]]*:[[:space:]]*none'; then
            echo "no_tx=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_tx=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplica a migration (psql; omite -1 se transaction:none declarado)
        if: inputs.mode != 'repair-only'
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT || '5432' }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
          MIGRATION_FILE: ${{ steps.locate.outputs.file }}
          NO_TX: ${{ steps.tx_optout.outputs.no_tx }}
        run: |
          set -euo pipefail
          # Timeouts são aplicados com SET dentro da sessão/transação, NÃO via
          # PGOPTIONS: o pooler (Supavisor) ignora startup options — no run
          # 38730252412 nem lock_timeout=30s nem statement_timeout=10min valeram.
          for t in "$MIGRATION_LOCK_TIMEOUT" "$MIGRATION_STATEMENT_TIMEOUT"; do
            if ! [[ "$t" =~ ^[0-9]+(ms|s|min)$ ]]; then
              echo "::error::timeout inválido: '$t'"
              exit 1
            fi
          done
          # E078: transaction: none + pooler transaction (6543) perdem os SET de sessão.
          # Reprovar antes de aplicar para evitar lock silencioso sem timeout.
          if [ "$NO_TX" = "true" ] && [ "${PGPORT:-5432}" != "5432" ]; then
            echo "::error::E078: PGPORT=${PGPORT} (pooler transaction) incompatível com 'transaction: none' — os SET lock_timeout/statement_timeout não persistiriam. Use a porta session (5432) ou remova o cabeçalho 'transaction: none'."
            exit 1
          fi

          if [ "$NO_TX" = "true" ]; then
            # transaction: none declarado — sem -1 para permitir operações não-transacionais
            # (CONCURRENTLY, ALTER TYPE ADD VALUE, etc.) aprovadas no preflight.
            # SET de sessão: vale para todos os statements do arquivo só com o pooler
            # em modo session (porta 5432, o padrão de PGPORT). Em 6543 (transaction)
            # o SET não persistiria entre statements.
            psql -X -w -v ON_ERROR_STOP=1 \
              -c "SET lock_timeout = '${MIGRATION_LOCK_TIMEOUT}'" \
              -c "SET statement_timeout = '${MIGRATION_STATEMENT_TIMEOUT}'" \
              -f "$MIGRATION_FILE"
          else
            # Migração transacional padrão — -1 garante rollback atômico em caso de erro.
            # Com -1, psql emite BEGIN antes do primeiro -c/-f e COMMIT após o último
            # (ROLLBACK se algum falhar com ON_ERROR_STOP): os SET LOCAL e o arquivo
            # rodam na MESMA transação, na ordem dada.
            psql -X -w -1 -v ON_ERROR_STOP=1 \
              -c "SET LOCAL lock_timeout = '${MIGRATION_LOCK_TIMEOUT}'" \
              -c "SET LOCAL statement_timeout = '${MIGRATION_STATEMENT_TIMEOUT}'" \
              -f "$MIGRATION_FILE"
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v2
        with:
          version: 2.101.0

      - name: migration repair --status applied
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration repair --status applied "$MIGRATION_VERSION" --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Same password that just authenticated psql; avoid interactive CLI fallback.
          SUPABASE_DB_PASSWORD: ${{ secrets.PGPASSWORD }}

  post-check:
    name: 3. Pós-check (read-only)
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          ref: main  # E35: checkout sempre de main, nunca de branch de PR

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Confirma version no ledger após a aplicação
        run: node scripts/preflight-migration-apply.mjs --version="$MIGRATION_VERSION" --require-live --expect-applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  receipt:
    name: 4. Recibo (abre PR em MIGRATIONS_SYNC_LOG.md)
    needs: [apply, post-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          ref: main  # E35: checkout sempre de main, nunca de branch de PR

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Valida approved_by não-vazio (E35)
        env:
          APPROVED_BY: ${{ inputs.approved_by }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVED_BY// /}" ]; then
            echo "::error::approved_by é obrigatório e não pode ser vazio (E35). Informe o revisor que aprovou a migration."
            exit 1
          fi

      - name: Monta o recibo em MIGRATIONS_SYNC_LOG.md
        env:
          APPROVED_BY: ${{ inputs.approved_by }}
          MIGRATION_MODE: ${{ inputs.mode }}
        run: |
          # E052: recibo distingue aplicação real de registro puro (repair-only)
          if [ "$MIGRATION_MODE" = "repair-only" ]; then
            METODO="repair"
            STATUS="registrada-sem-aplicar"
            POS_CHECK="repair-only: SQL não executado; apenas registro no ledger (E052)"
          else
            METODO="E15"
            STATUS="aplicada"
            POS_CHECK="job post-check da run ${{ github.run_id }} confirmou a version no ledger"
          fi
          node scripts/append-migration-receipt.mjs \
            --version="$MIGRATION_VERSION" \
            --sha256="${{ needs.apply.outputs.sha256 }}" \
            --executor="GitHub Actions (db-apply-migration.yml, disparado por ${{ github.actor }}, aprovado por $APPROVED_BY)" \
            --metodo="$METODO" \
            --data-utc="${{ needs.apply.outputs.applied_at }}" \
            --pos-check="$POS_CHECK" \
            --status="$STATUS"

      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          # shellcheck disable=SC2016 # aspas simples intencionais: o git expande $1 e GIT_PUSH_TOKEN ao chamar o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Abre PR com o recibo
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
          APPROVED_BY: ${{ inputs.approved_by }}
        run: |
          set -euo pipefail
          BRANCH="e15-receipt-${MIGRATION_VERSION}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/MIGRATIONS_SYNC_LOG.md
          git commit -m "docs(migrations-log): recibo E15 — aplicação de ${MIGRATION_VERSION}" \
                     -m "Auto-gerado por .github/workflows/db-apply-migration.yml (run ${{ github.run_id }}), disparado por ${{ github.actor }}. Aprovado por: $APPROVED_BY. PLANO_DBA E15."
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: recibo de aplicação — ${MIGRATION_VERSION} (E15)" \
            --body "Recibo automático da aplicação de \`${MIGRATION_VERSION}\` via \`db-apply-migration.yml\` (run ${{ github.run_id }}, disparado por @${{ github.actor }}, aprovado por $APPROVED_BY). A migration já foi aplicada e confirmada no ledger pelos jobs \`apply\`/\`post-check\` desta mesma run — este PR só registra o recibo textual (PLANO_DBA E15/E48)."
