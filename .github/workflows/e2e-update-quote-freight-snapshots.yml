name: E2E · Update Quote Freight snapshots
# Regenera os PNGs baseline de e2e/visual/quote-freight-block.spec.ts
# (cif/fob/fob_pre × mobile/md/xl) e comita de volta.
# Execução: manual via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para comitar os baselines atualizados"
        required: true
        default: "main"
      safe_mode:
        description: "Só regenerar se falha for visual (recomendado)."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: e2e-update-quote-freight-${{ github.event.inputs.branch }}
  cancel-in-progress: false  # E19: dispatch-only nunca cancelado

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium

      - name: Dry-run (safe mode)
        if: ${{ github.event.inputs.safe_mode != 'false' }}
        id: dryrun
        continue-on-error: true
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test e2e/visual/quote-freight-block.spec.ts \
            --project=chromium-public --reporter=list

      - name: Classificar falha (visual vs real)
        if: ${{ github.event.inputs.safe_mode != 'false' && steps.dryrun.outcome == 'failure' }}
        id: classify
        run: |
          if find test-results -type f \( -name "*-diff.png" -o -name "*-actual.png" \) 2>/dev/null | grep -q .; then
            echo "kind=visual" >> "$GITHUB_OUTPUT"
          else
            echo "kind=real"   >> "$GITHUB_OUTPUT"
          fi

      - name: Abortar (falha não-visual)
        if: ${{ github.event.inputs.safe_mode != 'false' && steps.dryrun.outcome == 'failure' && steps.classify.outputs.kind == 'real' }}
        run: |
          echo "::error::Falha não é diferença visual — abortando rewrite. Corrija o erro real antes."
          exit 1

      - name: Nada a atualizar
        if: ${{ github.event.inputs.safe_mode != 'false' && steps.dryrun.outcome == 'success' }}
        run: |
          echo "✅ Spec já passa contra baselines atuais — nada a fazer."
          exit 0

      - name: Regenerar snapshots
        if: ${{ github.event.inputs.safe_mode == 'false' || (steps.dryrun.outcome == 'failure' && steps.classify.outputs.kind == 'visual') }}
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test e2e/visual/quote-freight-block.spec.ts \
            --project=chromium-public --update-snapshots --reporter=list

      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          # shellcheck disable=SC2016 # aspas simples intencionais: $1 e GIT_PUSH_TOKEN expandem quando o git chama o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Comitar baselines e abrir PR
        if: ${{ github.event.inputs.safe_mode == 'false' || (steps.dryrun.outcome == 'failure' && steps.classify.outputs.kind == 'visual') }}
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAFE_MODE_RAW: ${{ github.event.inputs.safe_mode }}
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/quote-freight-block.spec.ts-snapshots || true  # ok: sem snapshots novos é resultado válido
          if git diff --cached --quiet; then
            echo "Sem mudanças nos baselines."; exit 0
          fi
          if [ "$SAFE_MODE_RAW" != 'false' ]; then MODE='safe'; else MODE='force'; fi
          TS=$(date -u +%y%m%d-%H%M)
          BRANCH="chore/e2e-quote-freight-baselines-${TS}"
          git checkout -b "${BRANCH}"
          git commit -m "chore(e2e): update quote-freight-block visual baselines (${MODE})"
          git push origin "${BRANCH}"
          BODY="Baselines PNG gerados automaticamente pelo workflow \`e2e-update-quote-freight-snapshots\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "${BRANCH}" \
            --title "chore(e2e): update quote-freight-block visual baselines (${MODE})" \
            --body "${BODY}"
