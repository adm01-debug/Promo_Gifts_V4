name: Deploy Edge Functions

# Faz deploy das edge functions para o Supabase doufsxqlfjyuvxuezpln (Gestão de Produtos).
# Execução: manual via Actions UI ou automático em push para main com mudanças em supabase/functions/**.
#
# Pré-requisito: secret SUPABASE_ACCESS_TOKEN configurado no repo
# (Settings → Secrets and variables → Actions → New repository secret).
# Gere o token em https://supabase.com/dashboard/account/tokens

on:
  workflow_call:
    inputs:
      function_name:
        description: 'Nome de uma função específica (vazio = todas)'
        required: false
        type: string
        default: ''
      functions_json:
        description: 'JSON array de funções a deployar (ex.: ["fn-a","fn-b"]) — override a detecção automática'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Apenas listar funções, sem fazer deploy'
        required: false
        type: boolean
        default: false
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Nome de uma função específica (vazio = todas)'
        required: false
        type: string
      dry_run:
        description: 'Apenas listar funções, sem fazer deploy'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '!supabase/functions/**/*.test.ts'
      - '!supabase/functions/tests/**'
      - '!supabase/functions/README.md'

env:
  # Defina em Settings → Secrets and variables → Actions → Variables
  # como SUPABASE_PROJECT_REF (ex.: doufsxqlfjyuvxuezpln).
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-functions:
    name: Detect functions to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # E63 (plano de 100): fetch-depth 0 — `git diff` abaixo compara
          # github.event.before..github.sha para achar só as funções
          # alteradas neste push; um checkout raso (depth 1, o default) não
          # teria o commit `before` disponível.
          fetch-depth: 0

      - name: Detect edge functions
        id: detect
        env:
          FUNCTIONS_JSON: ${{ inputs.functions_json || '' }}
          FUNCTION_NAME: ${{ inputs.function_name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd supabase/functions

          if [[ -n "$FUNCTIONS_JSON" ]]; then
            JSON="$FUNCTIONS_JSON"
            COUNT=$(echo "$JSON" | jq 'length')
            echo "functions=$JSON" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            {
              echo "## 📦 Edge Functions (via workflow_call): $COUNT"
              echo "$JSON" | jq -r '.[]' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$FUNCTION_NAME" ]]; then
            FN="$FUNCTION_NAME"
            if [[ ! -d "$FN" ]]; then
              echo "❌ Pasta $FN não existe em supabase/functions/" >&2
              exit 1
            fi
            if [[ ! -f "$FN/index.ts" ]]; then
              echo "❌ $FN não tem index.ts" >&2
              exit 1
            fi
            echo "functions=[\"$FN\"]" >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # E63 (plano de 100): antes, todo push redeployava as ~108
            # funções — destruía o sinal "atualizada há X" que expôs o
            # deploy fora do fluxo de kit-ai-builder (auditoria de
            # governança, 24/09). Agora só as alteradas neste push, exceto
            # quando a mudança toca _shared/ (102 funções importam de lá).
            # cd supabase/functions no topo do script desce DOIS níveis a
            # partir da raiz do repo — cd .. sobe só um (para supabase/),
            # não para a raiz. Bug real: quebrou o 1º push pós-merge deste
            # workflow em main (run 36065556329, "cd: supabase/functions:
            # No such file or directory" na 2ª cd abaixo).
            cd ../..
            BEFORE="$GIT_BEFORE"
            AFTER="$GIT_AFTER"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              CHANGED=$(git diff --name-only "${AFTER}~1" "$AFTER" -- supabase/functions/ || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions/ || true)
            fi
            cd supabase/functions

            if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
              echo "⚠️ Mudança em supabase/functions/_shared/ — redeployando todas as funções." >&2
              mapfile -t FNS < <(find . -maxdepth 2 -name 'index.ts' -type f \
                | sed 's|^\./||;s|/index\.ts$||' \
                | grep -vE '^(_shared|tests)' \
                | sort)
            else
              mapfile -t CANDIDATES < <(echo "$CHANGED" \
                | sed -n 's|^supabase/functions/\([^/]*\)/.*|\1|p' \
                | grep -vE '^(_shared|tests)$' \
                | sort -u)
              FNS=()
              for slug in "${CANDIDATES[@]}"; do
                # Push que só remove a função (sem index.ts sobrando) não
                # entra na matriz — não há o que deployar.
                [[ -f "$slug/index.ts" ]] && FNS+=("$slug")
              done
            fi
            COUNT=${#FNS[@]}
            if [[ "$COUNT" -eq 0 ]]; then
              JSON='[]'
            else
              JSON=$(printf '%s\n' "${FNS[@]}" | jq -R . | jq -sc .)
            fi
            echo "functions=$JSON" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            mapfile -t FNS < <(find . -maxdepth 2 -name 'index.ts' -type f \
              | sed 's|^\./||;s|/index\.ts$||' \
              | grep -vE '^(_shared|tests)' \
              | sort)
            COUNT=${#FNS[@]}
            JSON=$(printf '%s\n' "${FNS[@]}" | jq -R . | jq -sc .)
            echo "functions=$JSON" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          DETECT_COUNT: ${{ steps.detect.outputs.count }}
          DETECT_FUNCTIONS: ${{ steps.detect.outputs.functions }}
        shell: bash
        run: |
          echo "## 📦 Edge Functions detectadas: $DETECT_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$DETECT_FUNCTIONS" \
            | jq -r '.[]' \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.fn }}
    needs: list-functions
    if: ${{ !inputs.dry_run && needs.list-functions.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fn: ${{ fromJSON(needs.list-functions.outputs.functions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2
        with:
          version: 2.101.0

      - name: Deploy ${{ matrix.fn }}
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FN: ${{ matrix.fn }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "❌ Secret SUPABASE_ACCESS_TOKEN não configurado" >&2
            echo "Vá em https://supabase.com/dashboard/account/tokens, gere um token," >&2
            echo "e adicione em Settings → Secrets → Actions" >&2
            exit 1
          fi

          # E64 (plano de 100): 3 tentativas com backoff — 108 chamadas à
          # Management API por deploy completo sem nenhuma proteção contra
          # falha transitória/rate-limit.
          attempt=1
          max_attempts=3
          delays=(5 15 45)
          until supabase functions deploy "$FN" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api 2>&1 | tee deploy.log; do
            status=${PIPESTATUS[0]}
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "❌ Deploy de $FN falhou após $attempt tentativa(s) (exit $status)." >&2
              exit "$status"
            fi
            delay="${delays[$((attempt - 1))]}"
            echo "⚠️ Tentativa $attempt de $FN falhou (exit $status) — retry em ${delay}s." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          echo "Deployed $FN to project $SUPABASE_PROJECT_REF (tentativa $attempt)."

      - name: Mark step status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FN: ${{ matrix.fn }}
        shell: bash
        run: |
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "✅ $FN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ $FN" >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Verify deployment
    needs: [list-functions, deploy]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Final summary
        env:
          TOTAL_COUNT: ${{ needs.list-functions.outputs.count }}
        shell: bash
        run: |
          echo "## 🏁 Deployment concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total de funções processadas: **$TOTAL_COUNT**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifique status em:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF/functions" >> "$GITHUB_STEP_SUMMARY"

  ledger:
    # E66 (plano de 100 etapas, 2026-09-24): migrations têm
    # supabase/MIGRATIONS_SYNC_LOG.md (PLANO_DBA E15); edge functions não
    # tinham ledger nenhum — foi essa lacuna que deixou kit-ai-builder e
    # magazine-reader-state-read serem deployadas fora do git sem detecção
    # até o drift check rodar por acaso. Roda só quando o job `deploy`
    # terminou 'success' (matrix inteira, fail-fast: false) — uma falha
    # parcial não gera recibo automático; investigar e redeployar antes.
    name: Registrar recibo do deploy (E66)
    needs: [list-functions, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2
        with:
          version: 2.101.0

      - name: Grava um recibo por função deployada
        env:
          FUNCTIONS_TO_DEPLOY: ${{ needs.list-functions.outputs.functions }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions.json

          echo "$FUNCTIONS_TO_DEPLOY" | jq -r '.[]' | while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            version=$(jq -r --arg slug "$slug" '.[] | select(.slug==$slug) | .version // "-"' /tmp/functions.json)
            node scripts/append-edge-deploy-receipt.mjs \
              --slug="$slug" \
              --version="$version" \
              --sha="$GIT_SHA" \
              --run="$RUN_ID" \
              --executor="GitHub Actions (disparado por $ACTOR)" \
              --metodo="$EVENT_NAME"
          done

      - name: Abre PR com o recibo
        env:
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/EDGE_FUNCTIONS_DEPLOY_LOG.md; then
            echo "Nada novo em EDGE_FUNCTIONS_DEPLOY_LOG.md — pulando PR."
            exit 0
          fi
          BRANCH="e66-edge-deploy-receipt-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/EDGE_FUNCTIONS_DEPLOY_LOG.md
          git commit -m "docs(edge-deploy-log): recibo do deploy — run $RUN_ID" \
                     -m "Auto-gerado por .github/workflows/deploy-edge-functions.yml (run $RUN_ID), disparado por $ACTOR. Plano de 100 etapas E66."
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: recibo de deploy de edge function(s) — run $RUN_ID (E66)" \
            --body "Recibo automático do deploy via \`deploy-edge-functions.yml\` (run $RUN_ID, disparado por @$ACTOR). As funções já foram deployadas pelo job \`deploy\` desta mesma run — este PR só registra o recibo textual (E66/E67, docs/plans/PLANO_CONSOLIDACAO_AUDITORIAS_100_ETAPAS_2026-09-24.md)."
