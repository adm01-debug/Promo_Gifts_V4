name: wraparound-monitor-report

# =============================================================================
# Etapa E33 do PLANO_DBA_CORRECOES_MELHORIAS_50_ETAPAS_2026-09-16.md.
# Ver docs/E33_MONITOR_WRAPAROUND_2026-09-16.md para a investigação completa.
#
# O que faz: roda scripts/wraparound-monitor-check.mjs, que lê a série diária
# de ops.wraparound_monitor_log (gravada pelo cron
# wraparound-toast-sequence-monitor — ver a migration da etapa E33) e compara
# a captura mais recente de cada objeto (banco atual, sequências,
# replication slots, tabelas com TOAST) contra os thresholds de aviso/
# crítico declarados no script. Sinaliza (issue rotulada `db-warning` ou
# `db-critical`, ou comentário se já existir uma aberta) qualquer objeto
# acima do limiar.
#
# O que NÃO faz: não aplica DDL, não grava em ops.wraparound_monitor_log — é
# advisory/best-effort, não um gate (mesmo padrão de
# ddl-out-of-band-detector.yml/capacity-growth-report.yml/pgss-slo-report.yml,
# etapas E12/E30/E40). Depende da migration de E33 (tabela
# ops.wraparound_monitor_log + cron) já ter sido aplicada — enquanto não
# for, o check degrada para inconclusive (sem issue) e só loga aviso.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   - SUPABASE_ACCESS_TOKEN : PAT da Management API (mesmo secret dos outros
#                             workflows de checagem deste repo)
# Variável sobrescrevível (não-secret):
#   SUPABASE_PROJECT_REF (default: doufsxqlfjyuvxuezpln)
# =============================================================================

on:
  # schedule:
  #   - cron: '15 6 * * *' # diário, 06:15 UTC
  # E31: schedule desabilitado — aguardando migration [DBA-E33] (ops.wraparound_monitor_log).
  # Reativar após aplicação via .github/workflows/db-apply-migration.yml.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wraparound-monitor-report
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  check:
    name: Compara ops.wraparound_monitor_log contra THRESHOLDS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Roda checagem de wraparound/TOAST/sequências
        id: check
        continue-on-error: true
        # E56: captura exit_code para tri-state (0=ok, 1=alerta, 2=inconclusivo)
        run: |
          set +e
          node scripts/wraparound-monitor-check.mjs --out=/tmp/wraparound.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wraparound-monitor-report-${{ github.run_id }}
          path: /tmp/wraparound.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Abre ou atualiza issue (objeto em aviso ou crítico)
        # exit 1 (FAILED) e exit 2 (INCONCLUSIVE) chegam aqui como 'failure' via
        # continue-on-error. Só abrimos issue quando o relatório existe e lista
        # >=1 objeto em aviso/crítico — caso contrário (inconclusivo: sem
        # credenciais obrigatórias, Management API fora do ar,
        # ops.wraparound_monitor_log ainda não existe porque E33 não foi
        # aplicado) só logamos warning, sem issue.
        id: issue_body
        if: steps.check.outcome == 'failure'
        run: |
          node <<'NODEEOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const DELIM = 'BODY_EOF_WRAPAROUND';
          let skip = 'true';
          let title = '';
          let body = '';
          let key = '';
          try {
            const report = JSON.parse(fs.readFileSync('/tmp/wraparound.json', 'utf-8'));
            const warnings = report?.warnings || [];
            const criticals = report?.criticals || [];
            if (warnings.length === 0 && criticals.length === 0) {
              process.stderr.write('Relatório existe mas warnings/criticals estão vazios — nada a fazer.\n');
            } else {
              const label = criticals.length > 0 ? 'db-critical' : 'db-warning';
              key = `wraparound-${label}`;
              const today = new Date().toISOString().slice(0, 10);
              title = `[${label}] ${criticals.length + warnings.length} objeto(s) de wraparound/TOAST/sequência sinalizado(s) — ${today}`;
              const fmt = (e) => `- \`${e.metric}\` em \`${e.object_name}\` — value_numeric=${e.value_numeric ?? 'n/a'} value_pct=${e.value_pct ?? 'n/a'} (captura ${e.captured_at})`;
              const lines = [
                ...(criticals.length ? ['### Crítico', ...criticals.map(fmt)] : []),
                ...(warnings.length ? ['### Aviso', ...warnings.map(fmt)] : []),
              ];
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              body = [
                '## Objeto(s) de risco de wraparound/TOAST/sequência acima do threshold',
                '',
                ...lines,
                '',
                `Run: ${runUrl}`,
                '',
                '### Como agir',
                'Não é uma ordem de execução automática — só um alerta de threshold estourado (PLANO_DBA E33, ver docs/E33_MONITOR_WRAPAROUND_2026-09-16.md para os thresholds e a justificativa de cada um).',
                'Investigar a causa antes de propor qualquer ação (ex.: `VACUUM FREEZE` manual para xid_age, `ALTER SEQUENCE`/migração de tipo para sequência, `pg_drop_replication_slot` para slot morto, `VACUUM FULL`/revisão de coluna para TOAST) — qualquer DDL resultante segue a REGRA #8 (aprovação explícita do PO por objeto).',
              ].join('\n');
              skip = 'false';
              process.stdout.write(`labels=${label},priority/low\n`);
            }
          } catch (e) {
            process.stderr.write(`Checagem inconclusiva ou sem relatório (${e.message}) — provavelmente ops.wraparound_monitor_log ainda não existe (E33 aguardando aprovação do PO). Não é um achado de risco, apenas logando.\n`);
          }
          process.stdout.write(`skip=${skip}\n`);
          if (skip === 'false') {
            process.stdout.write(`key=${key}\n`);
            process.stdout.write(`title=${title}\n`);
            process.stdout.write(`body<<${DELIM}\n${body}\n${DELIM}\n`);
          }
          NODEEOF

      - name: Reportar issue de wraparound
        # E12 — ci-issue action com dedupe por marcador <!-- ci-issue:wraparound-{db-critical|db-warning} -->
        if: steps.check.outcome == 'failure' && steps.issue_body.outputs.skip != 'true'
        uses: ./.github/actions/ci-issue
        with:
          key: ${{ steps.issue_body.outputs.key }}
          title: ${{ steps.issue_body.outputs.title }}
          body: ${{ steps.issue_body.outputs.body }}
          labels: ${{ steps.issue_body.outputs.labels }}
          state: open

      - name: Não quebra o build
        if: steps.check.outcome == 'failure'
        # E56: tri-state — distingue falha real (exit 1) de inconclusivo (exit 2)
        run: |
          if [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
            echo "::warning::Checagem de wraparound/TOAST/sequências inconclusiva (exit 2) — sem SUPABASE_ACCESS_TOKEN ou ops.wraparound_monitor_log ausente (E33 pendente). Nenhum objeto sinalizado."
          else
            echo "::warning::Checagem de wraparound/TOAST/sequências encontrou objeto(s) acima do limiar — ver issue/artefato desta run. Job não quebra build (advisory, não gate)."
          fi
