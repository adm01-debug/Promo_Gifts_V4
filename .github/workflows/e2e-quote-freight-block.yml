name: E2E Quote Freight Block (visual)

# Regressão visual do bloco Frete no QuoteBuilderPage.
# Falha se as screenshots divergirem além de maxDiffPixelRatio 0.02
# e sobe o diff/report como artefato + comenta o PR com o link.

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/quotes/QuoteBuilderPage.tsx'
      - 'src/components/ui/label.tsx'
      - 'src/components/ui/select.tsx'
      - 'src/components/ui/currency-input.tsx'
      - 'src/index.css'
      - 'src/styles/brand-tokens.css'
      - 'tailwind.config.ts'
      - 'e2e/visual/quote-freight-block.spec.ts'
      - 'e2e/visual/quote-freight-block.spec.ts-snapshots/**'
      - 'e2e/helpers/nav.ts'
      - '.github/workflows/e2e-quote-freight-block.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/quotes/QuoteBuilderPage.tsx'
      - 'src/components/ui/label.tsx'
      - 'src/components/ui/select.tsx'
      - 'src/components/ui/currency-input.tsx'
      - 'src/index.css'
      - 'src/styles/brand-tokens.css'
      - 'tailwind.config.ts'
      - 'e2e/visual/quote-freight-block.spec.ts'
      - 'e2e/visual/quote-freight-block.spec.ts-snapshots/**'
      - 'e2e/helpers/nav.ts'
      - '.github/workflows/e2e-quote-freight-block.yml'
  workflow_dispatch:
  schedule:
    - cron: '28 4 * * 1'  # E10/E89 — weekly Monday 04:28 UTC (≥5min gaps: 04:15/04:22/04:28/04:34/04:44/04:50)

permissions:
  contents: read

concurrency:
  group: e2e-quote-freight-block-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  freight-block-visual:
    permissions:
      contents: read
      issues: write   # E92: PR comment step (github.rest.issues.createComment)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browser }}

      - name: Run freight block visual spec (${{ matrix.browser }})
        id: run
        run: |
          npx playwright test \
            e2e/visual/quote-freight-block.spec.ts \
            --project=${{ matrix.browser }}-public \
            --reporter=line,html

      - name: Upload report + snapshots + diffs
        if: always()
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quote-freight-block-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            e2e/visual/quote-freight-block.spec.ts-snapshots
          retention-days: 14

      - name: Comentar report/artefato no PR (sempre)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = ${{ toJSON(steps.run.outcome) }};
            const artifactUrl = ${{ toJSON(steps.upload.outputs.artifact-url) }} ||
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = outcome === 'success' ? '✅' : '🖼️❌';
            const status = outcome === 'success' ? 'passou' : 'falhou';
            const body = [
              `### ${icon} Regressão visual do bloco Frete ${status}`,
              '',
              `**Browser:** \`${{ matrix.browser }}\``,
              `**Resultado:** \`${outcome}\``,
              `**Run:** ${runUrl}`,
              `**Playwright report + diffs + snapshots:** ${artifactUrl}`,
              '',
              outcome === 'success'
                ? '_Nenhuma divergência visual detectada._'
                : [
                    'Passos para investigar:',
                    `1. Baixe o artefato \`quote-freight-block-${{ matrix.browser }}\` em ${artifactUrl}`,
                    '2. Abra `playwright-report/index.html` para ver **expected × actual × diff** pixel-a-pixel',
                    '3. Se a mudança visual for intencional, dispare **E2E · Update Quote Freight snapshots** para regenerar os baselines',
                  ].join('\n'),
            ].join('\n');
            const marker = '<!-- freight-block-visual-report -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Resumo no summary do run
        if: always()
        run: |
          {
            echo "## 🖼️ Regressão visual do bloco Frete"
            echo ""
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo "- Resultado: **${{ steps.run.outcome }}**"
            echo "- Artefato: [quote-freight-block-${{ matrix.browser }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  # E12 — usa ci-issue action para dedupe real
  notify-failure:
    name: Notificar falha — Quote Freight Block Visual (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [freight-block-visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-freight-block
          title: "[CI] E2E Quote Freight Block (visual) falhou no cron semanal"
          body: |
            ## ❌ E2E Quote Freight Block (visual) falhou no cron semanal

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered:** ${{ github.run_started_at }}

            Verifique os artifacts do run para screenshots, diffs e traces.
          labels: ci-focused-e2e
          state: open
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quote Freight Block Visual (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [freight-block-visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quote-freight-block
          title: "[CI] E2E Quote Freight Block (visual) falhou no cron semanal"
          body: "Todos os testes passaram."
          labels: ci-focused-e2e
          state: resolved
