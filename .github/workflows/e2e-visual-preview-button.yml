name: E2E — Visual Regression (Preview button)

# Snapshot visual + contraste do botão Preview da QuoteViewPage.
#
# Atualização de baselines:
#  - workflow_dispatch com input update_baselines=true
# O job re-roda com --update-snapshots e publica os PNGs como artifact.
# Para persistir: baixe o artifact e commite manualmente.
# E61: removido trigger [update-visual-baselines] por commit — risco de push automático em PR.

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/__visual/**'
      - 'src/pages/quotes/QuoteViewPage.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'tailwind.config.ts'
      - 'src/index.css'
      - 'e2e/visual/**'
      - '.github/workflows/e2e-visual-preview-button.yml'
      - 'scripts/check-visual-preview-suite.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/__visual/**'
      - 'src/pages/quotes/QuoteViewPage.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'tailwind.config.ts'
      - 'src/index.css'
      - 'e2e/visual/**'
      - '.github/workflows/e2e-visual-preview-button.yml'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Atualizar baselines (commit automático)'
        type: boolean
        default: false

concurrency:
  group: e2e-visual-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: America/Sao_Paulo
  CI: 'true'
  FORCE_COLOR: '0'
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}


permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  visual:
    name: Visual snapshots + axe contrast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # G-H3: fork guard — pull_request de forks não deve escrever no repo
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    # E61: visual workflows must not push to the repo — baselines update via workflow_dispatch + artifact download
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
        with:
          start-vite: "true"

      # Falha cedo se a suíte foi revertida (harness/spec/workflow/rota).
      - name: 🛡️ Guarda de presença da suíte visual
        run: node scripts/check-visual-preview-suite.mjs

      - name: Detectar pedido de atualização de baselines
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_BASELINES: ${{ inputs.update_baselines }}
        run: |
          should_update="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPDATE_BASELINES" = "true" ]; then
            should_update="true"
          fi
          # E61: removed [update-visual-baselines] commit tag trigger — baselines update only via workflow_dispatch
          echo "should_update=$should_update" >> "$GITHUB_OUTPUT"

      - name: Run visual + axe specs
        if: steps.detect.outputs.should_update != 'true'
        run: |
          npx playwright test \
            e2e/visual/preview-button.spec.ts \
            --project=chromium-public \
            --reporter=github,list,html
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Update visual baselines
        if: steps.detect.outputs.should_update == 'true'
        run: |
          npx playwright test \
            e2e/visual/preview-button.spec.ts \
            --project=chromium-public \
            --update-snapshots \
            --reporter=list
        env:
          E2E_BASE_URL: http://localhost:8080

      # E61: replaced git commit+push with artifact upload — developer downloads and commits manually
      - name: Upload updated baselines (artifact — commit manualmente)
        if: steps.detect.outputs.should_update == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-updated-${{ github.run_id }}
          path: e2e/visual/**-snapshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-preview-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload baseline diffs (screenshots actual/diff/expected)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-preview-diffs-${{ github.run_id }}
          path: |
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
            !test-results/axe/
          retention-days: 14

      - name: Upload axe contrast logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-preview-axe-${{ github.run_id }}
          path: |
            test-results/axe/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
          if-no-files-found: ignore
          retention-days: 14
