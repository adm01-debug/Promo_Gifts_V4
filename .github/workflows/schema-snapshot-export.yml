name: schema-snapshot-export

# =============================================================================
# Roda o script `scripts/export-schema-snapshot.mjs` em toda PR e no push para
# `main`, publicando os artefatos gerados em `supabase/migrations-snapshot/`
# (ALL_IN_ONE.sql, SCHEMA_LIVE.sql, SCHEMA_DRIFT.sql, SNAPSHOT_META.json).
#
# Semântica:
#   - ALL_IN_ONE.sql SEMPRE é gerado (não depende de secrets).
#   - SCHEMA_LIVE.sql e SCHEMA_DRIFT.sql só saúem quando SUPABASE_ACCESS_TOKEN
#     e SUPABASE_DB_PASSWORD estão configurados (safe-by-default).
#   - Este workflow NÃO commita nada — só publica artefato para auditoria.
#   - Se quiser gate de drift bloqueante, use `db-schema-drift-check.yml`.
#
# 2026-09-27: paths filter em PR e push — 12min de snapshot só quando schema muda.
# Schedule semanal mantém varredura incondicional (segunda 06:00 UTC).
# =============================================================================

on:
  pull_request:
    branches: [main]
    # 2026-09-27: paths filter — 12min de snapshot só quando schema/migrations muda
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'package.json'
      - '.github/workflows/schema-snapshot-export.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'package.json'
      - '.github/workflows/schema-snapshot-export.yml'
  schedule:
    - cron: '34 6 * * 1' # semanal, segunda 06:00 UTC (03:00 BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-snapshot-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  export:
    name: Export schema snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Generate snapshot
        run: node scripts/export-schema-snapshot.mjs

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-snapshot-${{ github.run_number }}
          path: supabase/migrations-snapshot/
          retention-days: 14

  weekly-live-drift:
    name: Weekly live drift check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
      - name: Check ledger manifest drift
        run: node scripts/check-ledger-manifest-drift.mjs
        continue-on-error: true
