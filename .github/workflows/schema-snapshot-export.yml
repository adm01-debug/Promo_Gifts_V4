name: schema-snapshot-export

# =============================================================================
# Roda o script `scripts/export-schema-snapshot.mjs` em toda PR e no push para
# `main`, publicando os artefatos gerados em `supabase/migrations-snapshot/`
# (ALL_IN_ONE.sql, SCHEMA_LIVE.sql, SNAPSHOT_META.json) e o baseline do
# db-schema-drift-check em `supabase/baseline/`.
#
# Semântica:
#   - ALL_IN_ONE.sql SEMPRE é gerado (não depende de secrets).
#   - SCHEMA_LIVE.sql e o baseline só saíem quando SUPABASE_ACCESS_TOKEN
#     e SUPABASE_DB_PASSWORD estão configurados (safe-by-default).
#   - Em `schedule`: falha explicitamente se SUPABASE_ACCESS_TOKEN ausente —
#     sem no-op verde (E84).
#   - Job `commit-snapshot` (E84): commita o snapshot na branch fixa
#     `bot/schema-snapshot` (force-push) e abre/reutiliza uma única PR.
#     Roda apenas em `schedule` e `workflow_dispatch` quando secrets presentes.
#   - Job `drift-gate` (2026-10-15): o export de schedule/dispatch só roda se
#     db-schema-drift-check (reutilizável) passar com o baseline atual — senão
#     o baseline novo absorveria drift. `force_rotate` (dispatch) pula a trava.
#
# 2026-09-27: paths filter em PR e push — 12min de snapshot só quando schema muda.
# 2026-10-02: E84 — no-op guard em schedule + branch fixa bot/schema-snapshot.
# Schedule semanal mantém varredura incondicional (segunda 06:36 UTC).
# =============================================================================

on:
  pull_request:
    branches: [main]
    # 2026-09-27: paths filter — 12min de snapshot só quando schema/migrations muda
    # E68: removido supabase/functions/** — snapshot de schema não depende de edge functions
    paths:
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/schema-snapshot-export.yml'
  push:
    branches: [main]
    # E68: removido supabase/functions/** — paths só supabase/migrations/**
    paths:
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/schema-snapshot-export.yml'
  schedule:
    - cron: '36 6 * * 1' # semanal, segunda 06:36 UTC (03:36 BRT) — E89: ≥20min after wraparound-monitor (06:15)
  workflow_dispatch:
    inputs:
      force_rotate:
        description: >-
          Gira o baseline mesmo com o drift-check vermelho (ex.: replay quebrado por
          repair-only). Revise o diff do baseline na PR antes do merge.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: schema-snapshot-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  # Baseline novo só depois de provar que o atual não tem drift: sem isto o
  # dump semanal absorveria objeto criado fora de migration e o drift-check
  # deixaria de acusá-lo. Sem baseline anterior (bootstrap) passa direto.
  drift-gate:
    name: Drift gate antes de girar o baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/db-schema-drift-check.yml
    with:
      allow_missing_baseline: false
    secrets: inherit

  export:
    name: Export schema snapshot
    needs: drift-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks.
    # drift-gate: skipped em PR/push; em schedule/dispatch tem de passar, salvo force_rotate.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.drift-gate.result == 'success' || needs.drift-gate.result == 'skipped' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_rotate))
    env:
      # Dump ao vivo (supabase db dump --linked) só em schedule/dispatch. Em PR e
      # push o pg_dump segurava AccessShareLock em todas as tabelas de produção por
      # minutos e fez DDL de migration esperar 2 min (2026-10-15, run 38730252412);
      # sem credenciais o script gera só ALL_IN_ONE.sql, e o commit do snapshot
      # (commit-snapshot) já roda só em schedule/dispatch.
      SUPABASE_ACCESS_TOKEN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_ACCESS_TOKEN || '' }}
      SUPABASE_DB_PASSWORD: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_DB_PASSWORD || '' }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v2
        with:
          version: 2.101.0

      # E84: no-op guard — schedule/dispatch sem credenciais é falha, não sucesso
      # silencioso (dispatch é o caminho para gerar baseline novo).
      - name: Guard — secrets obrigatórios no schedule/dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -z "${TOKEN:-}" || -z "${DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD ausentes. Schedule/dispatch sem credenciais é erro, não no-op verde."
            echo "::error::Configure o secret em Settings → Secrets → Actions e rerun manual."
            exit 1
          fi
          echo "Credenciais presentes — prosseguindo com snapshot live."

      - name: Read schemas.txt (E035 — SSOT compartilhado com db-schema-drift-check)
        run: |
          # E035: este arquivo é a SSOT dos schemas de aplicação.
          # db-schema-drift-check.yml também o lê (grep schemas.txt ali).
          SCHEMAS=$(grep -v '^#' supabase/baseline/schemas.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          echo "SCHEMAS=${SCHEMAS}" >> "$GITHUB_ENV"
          echo "::notice::Schemas registrados em schemas.txt: ${SCHEMAS}"

      - name: Generate snapshot
        run: node scripts/export-schema-snapshot.mjs

      - name: Export event triggers snapshot (E036)
        if: env.SUPABASE_DB_PASSWORD != ''
        continue-on-error: true  # psql direto via IPv6 pode falhar do runner — snapshot é observacional
        run: |
          set -euo pipefail
          shopt -s nullglob
          bases=(supabase/baseline/*_baseline_schema.sql)
          if [ "${#bases[@]}" -ne 1 ]; then
            echo "::notice::Sem baseline SQL gerado — pulando snapshot de event triggers."
            exit 0
          fi
          fname="${bases[0]##*/}"
          B="${fname%_baseline_schema.sql}"
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "db.${SUPABASE_PROJECT_REF}.supabase.co" \
            -U postgres \
            -d postgres \
            -t -A -c \
            "SELECT COALESCE(json_agg(t ORDER BY t.evtname),'[]'::json) FROM (SELECT evtname,evtevent,evtenabled,evtfoid::regproc::text AS evtfunc FROM pg_event_trigger) t;" \
            | tr -d '\n' > /tmp/event_triggers.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/event_triggers.json','utf8')); console.log('JSON válido');"
          cp /tmp/event_triggers.json "supabase/baseline/${B}_event_triggers.json"
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/event_triggers.json','utf8')).length)")
          echo "::notice::${count} event trigger(s) exportados → ${B}_event_triggers.json"

      - name: Export cron jobs snapshot (E037)
        if: env.SUPABASE_DB_PASSWORD != ''
        continue-on-error: true  # psql direto via IPv6 pode falhar do runner — snapshot é observacional
        run: |
          set -euo pipefail
          shopt -s nullglob
          bases=(supabase/baseline/*_baseline_schema.sql)
          if [ "${#bases[@]}" -ne 1 ]; then
            echo "::notice::Sem baseline SQL gerado — pulando snapshot de cron jobs."
            exit 0
          fi
          fname="${bases[0]##*/}"
          B="${fname%_baseline_schema.sql}"
          # E037: cron.job (pg_cron) — falha silenciosa se extensão ausente
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "db.${SUPABASE_PROJECT_REF}.supabase.co" \
            -U postgres \
            -d postgres \
            -t -A -c \
            "SELECT COALESCE(json_agg(t ORDER BY t.jobname),'[]'::json) FROM (SELECT jobid::text,jobname,schedule,command,nodename,active FROM cron.job) t;" \
            2>/tmp/cron_err.txt | tr -d '\n' > /tmp/cron_jobs.json || {
            if grep -q 'does not exist\|schema "cron"' /tmp/cron_err.txt 2>/dev/null; then
              echo '[]' > /tmp/cron_jobs.json
              echo "::notice::cron schema ausente — snapshot vazio gerado."
            else
              cat /tmp/cron_err.txt >&2; exit 1
            fi
          }
          node -e "JSON.parse(require('fs').readFileSync('/tmp/cron_jobs.json','utf8')); console.log('JSON válido');"
          cp /tmp/cron_jobs.json "supabase/baseline/${B}_cron_jobs.json"
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/cron_jobs.json','utf8')).length)")
          echo "::notice::${count} cron job(s) exportados → ${B}_cron_jobs.json"

      # E072: Recovery dump semanal — schema-only (reaproveitando o baseline) + ledger +
      # checksums SHA256. Arquivos vão para /tmp/e072-recovery/ e são enviados como
      # artifact separado (não misturar com supabase/baseline/ para não mudar o
      # common-prefix do artifact principal e quebrar os cp existentes).
      - name: Export recovery dump (E072)
        if: env.SUPABASE_DB_PASSWORD != ''
        continue-on-error: true  # psql direto via IPv6 pode falhar do runner — recovery dump é observacional
        run: |
          set -euo pipefail
          shopt -s nullglob
          bases=(supabase/baseline/*_baseline_schema.sql)
          if [ "${#bases[@]}" -ne 1 ]; then
            echo "::notice::E072: Sem baseline SQL gerado — pulando recovery dump."
            exit 0
          fi
          TODAY=$(date -u +"%Y-%m-%d")
          mkdir -p /tmp/e072-recovery
          # Schema-only: reaproveita o baseline já gerado nesta execução (evita 2º pg_dump)
          cp "${bases[0]}" "/tmp/e072-recovery/BACKUP_SCHEMA_ONLY_${TODAY}.sql"
          # Ledger de migrations
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "db.${SUPABASE_PROJECT_REF}.supabase.co" \
            -U postgres \
            -d postgres \
            -c "COPY (SELECT version, inserted_at FROM supabase_migrations.schema_migrations ORDER BY version) TO STDOUT WITH CSV HEADER;" \
            > "/tmp/e072-recovery/LEDGER_DATA_${TODAY}.sql"
          # Checksums SHA256
          sha256sum \
            "/tmp/e072-recovery/BACKUP_SCHEMA_ONLY_${TODAY}.sql" \
            "/tmp/e072-recovery/LEDGER_DATA_${TODAY}.sql" \
            > "/tmp/e072-recovery/BACKUP_CHECKSUMS_${TODAY}.txt"
          echo "::notice::E072: Recovery dump → BACKUP_SCHEMA_ONLY_${TODAY}.sql + LEDGER_DATA_${TODAY}.sql + checksums OK."

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-snapshot-${{ github.run_number }}
          path: |
            supabase/migrations-snapshot/
            supabase/baseline/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload recovery dump artifact (E072)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: recovery-dump-${{ github.run_number }}
          path: /tmp/e072-recovery/
          if-no-files-found: ignore
          retention-days: 30  # R6: recovery — 30 dias

  # E84: commita snapshot na branch fixa bot/schema-snapshot e mantém ≤ 1 PR aberta.
  commit-snapshot:
    name: Commit snapshot to bot/schema-snapshot
    needs: export
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.export.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
          fetch-depth: 0

      # Reaproveita o dump do job export: um único pg_dump por execução em
      # produção (antes este job refazia o dump inteiro).
      - name: Baixa o snapshot do job export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: schema-snapshot-${{ github.run_number }}
          path: ${{ runner.temp }}/snapshot

      # E072: recovery dump (schema-only + ledger + checksums). Artifact ausente
      # quando o baseline não foi gerado (ex.: primeiro run sem supabase CLI) — nesse
      # caso o continue-on-error=true impede falha do job e o bloco de cópia é no-op.
      - name: Baixa o recovery dump (E072)
        id: download_recovery
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-dump-${{ github.run_number }}
          path: ${{ runner.temp }}/e072-recovery

      # O download não apaga arquivos que já estão no checkout: troca o baseline
      # só quando o export gerou um novo (senão ficariam dois baselines e o
      # drift-check falha) e remove o SCHEMA_DRIFT.sql aposentado.
      - name: Aplica o snapshot no checkout
        env:
          SNAP: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          # supabase/baseline/drift-allowlist.txt está versionado: o artifact sempre
          # tem as duas pastas e a raiz dele é supabase/.
          find "$SNAP" -maxdepth 2 -type f
          cp -R "$SNAP/migrations-snapshot/." supabase/migrations-snapshot/
          rm -f supabase/migrations-snapshot/SCHEMA_DRIFT.sql
          if compgen -G "$SNAP/baseline/*_baseline_schema.sql" > /dev/null; then
            mkdir -p supabase/baseline
            find supabase/baseline -maxdepth 1 -type f \
              \( -name '*_baseline_schema.sql' -o -name '*_ledger_versions.json' \
                 -o -name '*_event_triggers.json' -o -name '*_cron_jobs.json' \) -delete
            cp "$SNAP"/baseline/*_baseline_schema.sql "$SNAP"/baseline/*_ledger_versions.json supabase/baseline/
            # E036/E037: copia snapshots de event triggers e cron jobs quando presentes
            if compgen -G "$SNAP/baseline/*_event_triggers.json" > /dev/null; then
              cp "$SNAP"/baseline/*_event_triggers.json supabase/baseline/
            fi
            if compgen -G "$SNAP/baseline/*_cron_jobs.json" > /dev/null; then
              cp "$SNAP"/baseline/*_cron_jobs.json supabase/baseline/
            fi
          else
            echo "::warning::Export sem baseline novo — baseline atual mantido."
          fi
          # Exatamente um baseline, com o JSON do ledger da mesma versão: dois
          # arquivos (ou um sem o outro) deixariam o drift-check vermelho depois
          # do merge da PR do bot.
          shopt -s nullglob
          bases=(supabase/baseline/*_baseline_schema.sql)
          if [ "${#bases[@]}" -ne 1 ] || [ ! -f "${bases[0]%_baseline_schema.sql}_ledger_versions.json" ]; then
            echo "::error::supabase/baseline precisa de exatamente um <B>_baseline_schema.sql com o <B>_ledger_versions.json correspondente (achei ${#bases[@]} baseline(s))."
            exit 1
          fi

          # E072: copia recovery dump para docs/db/ (substitui versões datadas anteriores)
          RECOV="${{ runner.temp }}/e072-recovery"
          if compgen -G "${RECOV}/BACKUP_SCHEMA_ONLY_*.sql" > /dev/null 2>&1; then
            mkdir -p docs/db
            find docs/db -maxdepth 1 \
              \( -name 'BACKUP_SCHEMA_ONLY_*.sql' \
                 -o -name 'LEDGER_DATA_*.sql' \
                 -o -name 'BACKUP_CHECKSUMS_*.txt' \) \
              -delete 2>/dev/null || true
            cp "${RECOV}"/BACKUP_SCHEMA_ONLY_*.sql \
               "${RECOV}"/LEDGER_DATA_*.sql \
               "${RECOV}"/BACKUP_CHECKSUMS_*.txt \
               docs/db/
            ls docs/db/BACKUP_SCHEMA_ONLY_*.sql docs/db/LEDGER_DATA_*.sql docs/db/BACKUP_CHECKSUMS_*.txt
            echo "::notice::E072: Recovery dump copiado para docs/db/."
          else
            echo "::notice::E072: Recovery dump ausente — docs/db/ não atualizado."
          fi

      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          # shellcheck disable=SC2016 # aspas simples intencionais: $1 e GIT_PUSH_TOKEN expandem quando o git chama o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Commit snapshot to bot/schema-snapshot (force-push)
        id: commit
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          if ! git --no-pager diff --quiet -- supabase/migrations-snapshot/ supabase/baseline/ docs/db/ \
            || [ -n "$(git ls-files --others --exclude-standard -- supabase/baseline/ docs/db/)" ]; then
            echo "Snapshot mudou — commitando."
          else
            echo "::notice::Nenhuma mudança detectada no snapshot — nada a commitar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Cria ou reseta bot/schema-snapshot a partir do HEAD atual de main
          git checkout -B bot/schema-snapshot

          git add -A supabase/migrations-snapshot/ supabase/baseline/ docs/db/
          WEEK=$(date -u +"%Y-W%V")
          git commit -m "chore(schema-snapshot): snapshot semanal $WEEK (run $RUN_ID)" \
            -m "Auto-gerado por schema-snapshot-export.yml (E84). Snapshot do schema canônico doufsxqlfjyuvxuezpln."
          git push --force-with-lease origin bot/schema-snapshot
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Abrir ou atualizar PR única (bot/schema-snapshot)
        if: steps.commit.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Verifica se snapshot foi commitado (branch pode não ter mudado)
          if ! git rev-parse bot/schema-snapshot >/dev/null 2>&1; then
            echo "Branch bot/schema-snapshot não encontrada — snapshot não mudou, PR dispensada."
            exit 0
          fi

          WEEK=$(date -u +"%Y-W%V")
          # E68: --head usa repository_owner dinâmico em vez de org hardcoded
          EXISTING=$(gh pr list \
            --base main \
            --head "${{ github.repository_owner }}:bot/schema-snapshot" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING já existe para bot/schema-snapshot — branch atualizada por force-push, PR reutilizada."
          else
            PR_BODY="Snapshot semanal do schema canônico doufsxqlfjyuvxuezpln (run $RUN_ID, semana $WEEK). Arquivos: supabase/migrations-snapshot/ (ALL_IN_ONE.sql, SCHEMA_LIVE.sql, SNAPSHOT_META.json) e supabase/baseline/ (baseline do db-schema-drift-check + versões do ledger no momento do dump). Auto-gerado por schema-snapshot-export.yml (E84) — sempre <=1 PR aberta."
            gh pr create \
              --base main \
              --head bot/schema-snapshot \
              --title "chore(schema-snapshot): snapshot semanal $WEEK" \
              --body "$PR_BODY"
            echo "PR criada para bot/schema-snapshot."
          fi

  weekly-live-drift:
    name: Weekly live drift check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v2
        with:
          version: 2.101.0
      - name: Check ledger manifest drift
        # E56: removed continue-on-error — drift check must fail loudly
        run: node scripts/check-ledger-manifest-drift.mjs
