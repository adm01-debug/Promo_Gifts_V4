# Contract tests — roda em todo PR que toca contratos
#
# 2 jobs:
#   - unit:  vitest contra schemas Zod (sem rede, rápido)
#   - smoke: supabase functions serve + script HTTP real (precisa do repo, não
#            roda em forks porque depende de secrets do próprio repositório)
#
# Política de bloqueio: unit e smoke são informativos; o único required check em main
# é "Gate Final - Deploy Ready" (deploy-gates.yml).

name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - 'tests/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # E19: PR cancela; dispatch não
defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit — Zod schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Run vitest contract tests
        run: npm test -- tests/contracts/ --run
      - name: Report coverage summary
        if: always()
        run: |
          echo "### Contract test summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -d tests/contracts ]; then
            find tests/contracts -name '*.contract.test.ts' | wc -l \
              | xargs -I{} echo "{} contract test files" >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    name: Smoke — HTTP against supabase functions serve
    runs-on: ubuntu-24.04
    needs: unit
    # Só roda em PRs do próprio repo ou workflow_dispatch (forks não têm acesso a secrets,
    # e supabase CLI exige tokens válidos pra subir o stack)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read  # autentica os pulls do GHCR e reduz o limite anônimo compartilhado
    env:
      N8N_PRODUCT_WEBHOOK_SECRET: contract-test-secret
      WEBHOOK_DISPATCHER_SECRET: contract-test-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          # supabase/setup-cli@v2 bloqueada pela GitHub Actions policy (P46).
          VERSION="2.101.0"
          wget -q "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" \
               -O /tmp/supabase.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
          sudo chmod +x /usr/local/bin/supabase
          supabase --version

      - name: Garante registry ghcr.io (E104 — revertido de ECR por data-limit)
        run: |
          set -euo pipefail
          # supabase/setup-cli define SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io via $GITHUB_ENV.
          # O override para ECR Public (E104) passou a falhar com "toomanyrequests: Data limit
          # exceeded" no supabase start (run 40198510942); mesma reversão do db-schema-drift-check.yml.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"

      - name: Pre-pull PostgreSQL do Supabase com fallback de registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          postgres_tag="17.6.1.063"
          ghcr_image="ghcr.io/supabase/postgres:${postgres_tag}"
          dockerhub_image="docker.io/supabase/postgres:${postgres_tag}"

          # O pull autenticado do GHCR ainda retornou toomanyrequests em 5
          # tentativas (run 40928555691). A tag equivalente existe no Docker Hub
          # oficial da Supabase; usa-se esse mirror quando o GHCR limitar o runner.
          if echo "$GITHUB_TOKEN" | docker login ghcr.io -u x-access-token --password-stdin \
              && docker pull "$ghcr_image"; then
            echo "Imagem PostgreSQL obtida do GHCR"
            exit 0
          fi

          echo "::warning::GHCR indisponível/limitado; tentando a tag oficial no Docker Hub"
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            if docker pull "$dockerhub_image"; then
              echo "Imagem PostgreSQL obtida do Docker Hub (tentativa $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_s=$((attempt * 20))
              echo "Pull Docker Hub falhou; nova tentativa em ${wait_s}s"
              sleep "$wait_s"
            fi
          done

          echo "::error::Não foi possível obter $postgres_tag do GHCR nem do Docker Hub"
          exit 1

      - run: npm ci --no-audit --no-fund

      - name: Start Supabase stack
        run: |
          # Este job valida contratos HTTP das Edge Functions, não replay de
          # migrations. O histórico possui migrations canônicas que alteram
          # objetos gerenciados pelo Supabase (ex.: realtime.messages) e não
          # podem ser executadas pelo owner local. Isolamos o diretório apenas
          # durante o bootstrap e o restauramos antes de servir as funções.
          migrations_dir="supabase/migrations"
          migrations_hold="/tmp/contract-smoke-migrations"
          restore_migrations() {
            if [ -d "$migrations_hold" ]; then
              mv "$migrations_hold" "$migrations_dir"
            fi
          }
          trap restore_migrations EXIT
          if [ -d "$migrations_dir" ]; then
            mv "$migrations_dir" "$migrations_hold"
          fi

          start_stack() {
            supabase start --debug > /tmp/supabase-start.log 2>&1
          }
          # O bring-up do stack local é ocasionalmente flaky no CI (pull de imagens
          # Docker, drift do CLI etc.). Uma retry após `supabase stop` absorve falhas
          # transitórias sem mascarar erro persistente — o log é preservado p/ diagnóstico.
          if ! start_stack; then
            echo "::warning::supabase start falhou na 1ª tentativa — limpando e tentando novamente"
            supabase stop || true  # ok: stop antes de retry — falha de stop não impede retry
            start_stack
          fi
          # captura anon key local
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY // .API.anon_key')" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL // .API.url')" >> "$GITHUB_ENV"

      - name: Install contract-only database fixture
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/contract_smoke_schema.sql
          # A fixture termina com `NOTIFY pgrst, 'reload schema'`; aguarda o
          # listener do PostgREST consumir a invalidação antes do primeiro hit.
          sleep 1

      - name: Serve Edge Functions
        run: |
          {
            echo "N8N_PRODUCT_WEBHOOK_SECRET=$N8N_PRODUCT_WEBHOOK_SECRET"
            echo "WEBHOOK_DISPATCHER_SECRET=$WEBHOOK_DISPATCHER_SECRET"
          } > /tmp/contract-functions.env

          nohup supabase functions serve --no-verify-jwt --env-file /tmp/contract-functions.env > /tmp/functions.log 2>&1 &
          echo $! > /tmp/functions.pid

          for _ in $(seq 1 30); do
            HTTP=$(curl -sS -o /tmp/functions-health.json -w "%{http_code}" \
              "$SUPABASE_URL/functions/v1/health-check" || true)  # ok: curl pode falhar com rede ainda subindo — loop verifica HTTP code
            if [[ "$HTTP" != "000" ]]; then
              echo "Edge runtime ready via health-check (HTTP $HTTP)"
              break
            fi
            sleep 1
          done

          if [[ "${HTTP:-000}" == "000" ]]; then
            echo "::error::Edge runtime did not become reachable through /functions/v1/health-check"
            cat /tmp/functions.log || true  # ok: dump diagnóstico — arquivo pode não existir se serve nunca iniciou
            exit 1
          fi

          for _ in $(seq 1 30); do
            HTTP=$(curl -sS -o /tmp/product-webhook-ready.json -w "%{http_code}" \
              -X POST "$SUPABASE_URL/functions/v1/product-webhook" \
              -H "content-type: application/json" \
              --data '{}' || true)  # ok: curl pode falhar enquanto função ainda não está pronta — loop verifica HTTP
            if [[ "$HTTP" != "000" && "$HTTP" != "502" ]]; then
              echo "product-webhook ready (HTTP $HTTP)"
              break
            fi
            sleep 1
          done

          if [[ "${HTTP:-000}" == "000" || "${HTTP:-000}" == "502" ]]; then
            echo "::error::product-webhook did not become reachable"
            cat /tmp/functions.log || true  # ok: dump diagnóstico — arquivo pode não existir se serve nunca iniciou
            exit 1
          fi

      - name: Run contract smoke tests
        run: npm run test:contract
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::supabase start log"
          cat /tmp/supabase-start.log || true  # ok: dump diagnóstico — falha na falha não deve mascarar o erro original
          echo "::endgroup::"
          echo "::group::supabase functions serve log"
          cat /tmp/functions.log || true  # ok: dump diagnóstico — idem
          echo "::endgroup::"
          echo "::group::docker containers"
          docker ps -a || true  # ok: dump diagnóstico — docker pode não estar disponível
          echo "::endgroup::"
          echo "::group::supabase status"
          supabase status || true  # ok: dump diagnóstico — stack pode já ter falhado
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/functions.pid ]; then kill "$(cat /tmp/functions.pid)" 2>/dev/null || true; fi  # ok: processo pode já ter terminado — E92
          supabase stop || true  # ok: cleanup — stop pode falhar se stack já não estava rodando
