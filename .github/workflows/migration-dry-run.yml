name: migration-dry-run

on:
  pull_request:
    paths:
      - 'qa/migrations-draft/**.sql'
      - 'scripts/dry-run-migration-draft.mjs'
  workflow_dispatch:
    inputs:
      draft_path:
        description: 'Caminho do draft (relativo ao repo). Vazio = todos os *.sql do diretorio.'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migration-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry-run migration drafts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT || '5432' }}
      PGOPTIONS: '-c lock_timeout=5s -c statement_timeout=60s'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Guard - PG secrets presentes?
        id: guard
        run: |
          set -euo pipefail
          if [ -z "${PGHOST:-}" ] || [ -z "${PGUSER:-}" ] || [ -z "${PGPASSWORD:-}" ] || [ -z "${PGDATABASE:-}" ]; then
            echo "::warning::PG* secrets ausentes - migration dry-run PULADO (safe-by-default). Configure PGHOST/PGUSER/PGPASSWORD/PGDATABASE para ativar."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql client
        if: steps.guard.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Detectar drafts alvo
        if: steps.guard.outputs.enabled == 'true'
        id: drafts
        env:
          DRAFT_PATH: ${{ github.event.inputs.draft_path }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$DRAFT_PATH" ]; then
            # Validar formato do caminho para evitar path traversal
            if ! echo "$DRAFT_PATH" | grep -qE '^qa/migrations-draft/[A-Za-z0-9._-]+\.sql$'; then
              echo "::error::draft_path inválido: '$DRAFT_PATH'. Formato esperado: qa/migrations-draft/<nome>.sql (sem ../ ou chars especiais)"
              exit 1
            fi
            echo "$DRAFT_PATH" > /tmp/drafts.txt
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -E '^qa/migrations-draft/.*\.sql$' > /tmp/drafts.txt || true
          else
            ls qa/migrations-draft/*.sql > /tmp/drafts.txt
          fi
          if [ ! -s /tmp/drafts.txt ]; then
            echo "::notice::Nenhum draft alterado neste PR - nada a checar."
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            cnt=$(wc -l < /tmp/drafts.txt | tr -d ' ')
            echo "count=$cnt" >> "$GITHUB_OUTPUT"
            echo "Drafts alvo:"
            cat /tmp/drafts.txt
          fi

      - name: Baseline SECURITY DEFINER ACL (antes)
        if: steps.guard.outputs.enabled == 'true' && steps.drafts.outputs.count != '0'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "## Baseline check-security-definer-acl" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-security-definer-acl.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run drafts
        if: steps.guard.outputs.enabled == 'true' && steps.drafts.outputs.count != '0'
        run: |
          set -euo pipefail
          FAIL=0
          echo "## Dry-run de drafts" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r draft; do
            [ -z "$draft" ] && continue
            [ -f "$draft" ] || continue
            echo "### $draft" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if node scripts/dry-run-migration-draft.mjs "$draft" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
              :
            else
              FAIL=1
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/drafts.txt
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Um ou mais drafts falharam no dry-run. Veja o job summary."
            exit 1
          fi
