name: OptimizedImage E2E CI
on:
  push:
    branches: [ main ]
    paths:
      - 'src/components/ui/OptimizedImage.tsx'
      - 'src/pages/tools/OptimizedImageDemo.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/optimized-image-*.spec.ts'
      - '.github/workflows/optimized-image-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/components/ui/OptimizedImage.tsx'
      - 'src/pages/tools/OptimizedImageDemo.tsx'
      - 'src/routes/AppRoutes.tsx'
      - 'e2e/optimized-image-*.spec.ts'
      - '.github/workflows/optimized-image-e2e.yml'

permissions:
  contents: read

concurrency:
  group: optimized-image-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false  # E32
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run OptimizedImage E2E tests
      run: npx playwright test optimized-image-detection.spec.ts optimized-image-visual.spec.ts --project=chromium-public
      env:
        CI: true
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: optimized-image-report
        path: playwright-report/
        retention-days: 14
