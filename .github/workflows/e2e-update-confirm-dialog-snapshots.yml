name: E2E · Update Confirm Dialog snapshots
# Executa `playwright test --update-snapshots` para o spec do ConfirmDialog
# e faz commit dos PNGs atualizados. Dispara manualmente OU quando o próprio
# spec é editado.
on:
  workflow_dispatch:
  push:
    paths:
      - "e2e/ui/confirm-dialog-visual.spec.ts"
      - "src/pages/dev/ConfirmDialogHarness.tsx"
      - ".github/workflows/e2e-update-confirm-dialog-snapshots.yml"

permissions:
  contents: write

# Evita execuções simultâneas — a última em fila cancela as anteriores no mesmo ref.
concurrency:
  group: e2e-update-confirm-dialog-${{ github.ref }}
  cancel-in-progress: false

env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}


defaults:
  run:
    shell: bash

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Bootstrap (install deps + chromium)
        run: npm run e2e:bootstrap
      - name: Update baselines
        run: npm run e2e:confirm-dialog:update
      - name: Credencial de push sem token em disco (E32)
        run: |
          # persist-credentials:false nao grava token; o helper le GIT_PUSH_TOKEN so no passo de push.
          # shellcheck disable=SC2016 # aspas simples intencionais: $1 e GIT_PUSH_TOKEN expandem quando o git chama o helper
          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=${GIT_PUSH_TOKEN}"; }; f'
      - name: Commit updated snapshots
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/ui/confirm-dialog-visual.spec.ts-snapshots || true  # ok: sem snapshots novos é resultado válido
          if git diff --cached --quiet; then
            echo "Sem mudanças de baseline."
          else
            git commit -m "chore(e2e): update ConfirmDialog visual snapshots [skip ci]"
            git push
          fi
