name: E2E Quotes Responsive

# Roda o spec responsivo da lista de orçamentos em matriz de viewports
# (mobile, tablet, desktop). Snapshots visuais são publicados como artefatos
# para revisão / atualização manual via `--update-snapshots`.

on:
  push:
    branches: [main]
    paths:
      - 'src/components/quotes/QuotesConfigurableList.tsx'
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/lib/quotes/quotesLayout.ts'
      - 'e2e/helpers/quotes-layout.ts'
      - 'e2e/routes/quotes/quote-list-responsive.spec.ts'
      - 'e2e/quotes/quote-items-table-header-radius.spec.ts'
      - '.github/workflows/e2e-quotes-responsive.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/quotes/QuotesConfigurableList.tsx'
      - 'src/components/quotes/QuoteItemsTable.tsx'
      - 'src/lib/quotes/quotesLayout.ts'
      - 'e2e/helpers/quotes-layout.ts'
      - 'e2e/routes/quotes/quote-list-responsive.spec.ts'
      - 'e2e/quotes/quote-items-table-header-radius.spec.ts'
      - '.github/workflows/e2e-quotes-responsive.yml'
  workflow_dispatch:
  schedule:
    - cron: '34 4 * * 1'  # E10/E89 — weekly Monday 04:34 UTC

permissions:
  contents: read

concurrency:
  group: e2e-quotes-responsive-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop]
    env:
      CI: "true"
      FORCE_COLOR: "0"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_VIEWPORT_FILTER: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Run responsive spec (${{ matrix.viewport }})
        run: |
          npx playwright test e2e/routes/quotes/quote-list-responsive.spec.ts \
            --project=chromium-public \
            --grep "${{ matrix.viewport }}|mirror E2E|desktop mostra mais"

      - name: Run header-radius spec (${{ matrix.viewport }}) · Chromium + Firefox + WebKit
        run: |
          npx playwright test e2e/quotes/quote-items-table-header-radius.spec.ts \
            --project=chromium-public --project=firefox-public --project=webkit-public \
            --grep "\[${{ matrix.viewport }}\]"



      - name: Upload report + snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quotes-responsive-${{ matrix.viewport }}
          path: |
            playwright-report
            test-results
            e2e/routes/quotes/quote-list-responsive.spec.ts-snapshots
          retention-days: 14

  # E10/E12 — usa ci-issue action para dedupe real
  notify-failure:
    name: Notificar falha — Quotes Responsive (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [responsive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quotes-responsive
          title: "[CI] E2E Quotes Responsive falhou no cron semanal"
          body: |
            ## ❌ E2E Quotes Responsive falhou no cron semanal

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered:** ${{ github.run_started_at }}

            Verifique os artifacts do run para screenshots, diffs e traces.
          labels: ci-focused-e2e
          state: open
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — Quotes Responsive (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [responsive]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-quotes-responsive
          title: "[CI] E2E Quotes Responsive falhou no cron semanal"
          body: "Todos os testes passaram."
          labels: ci-focused-e2e
          state: resolved
