name: Quote Number Hardening — Verify (canonical DB)

on:
  schedule:
    - cron: '17 */6 * * *' # a cada 6h
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-quote-number-hardening.mjs'
      - 'docs/sql/quote-number-hardening*.sql'
      - '.github/workflows/quote-number-hardening-verify.yml'

permissions:
  contents: read

concurrency:
  group: quote-number-hardening-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify trigger + unique index no banco canônico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Banco canônico Gold/Medallion (doufsxqlfjyuvxuezpln).
      # O PAT existente consulta como supabase_read_only_user pela Management API.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Guard — acesso read-only ao canônico configurado
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente."
            exit 1
          fi

      - name: Rodar verify-quote-number-hardening
        run: node scripts/verify-quote-number-hardening.mjs

      - name: Resultado
        if: failure()
        run: |
          echo "::error::Hardening do quote_number falhou no banco canônico."
          echo "Runbook: docs/RUNBOOK_QUOTE_NUMBER_HARDENING.md"
          echo "Rollback (se necessário): docs/sql/quote-number-hardening-rollback.sql"
