name: SSOT Supabase Guard

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - 'src/integrations/supabase/**'
      - 'scripts/validate-supabase-config.mjs'
      - 'scripts/guard-canonical-project.mjs'
      - 'scripts/check-docs-supabase-hosts.mjs'
      - 'scripts/ssot-report*.mjs'
      - 'scripts/validate-ssot-report.mjs'
      - 'schemas/ssot-report.schema.json'
      - '.github/workflows/ssot-supabase.yml'
      - 'package.json'
  push:
    branches: [main]

concurrency:
  group: ssot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  ssot-gates:
    name: SSOT Gates (validate + guard + hosts)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install (minimal, ignore scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Gate 0 — validate-supabase-config
        run: npm run ssot:validate

      - name: Gate 1 — guard-canonical-project (runtime + critical + docs)
        run: npm run ssot:guard

      - name: Gate 2 — supabase hosts nos .md
        run: npm run ssot:hosts

      - name: Agregador — relatório unificado (JSON)
        if: always()
        run: node scripts/ssot-report.mjs --out=ssot-report.json --json > /dev/null

      - name: Schema — validar ssot-report.json
        if: always()
        run: node scripts/validate-ssot-report.mjs --file=ssot-report.json --schema=schemas/ssot-report.schema.json

      - name: Renderizar relatório em Markdown
        if: always()
        run: node scripts/ssot-report-markdown.mjs --in=ssot-report.json --out=ssot-report.md || true  # ok: rendering é best-effort; ausência do MD não bloqueia o job principal

      - name: Anotações no PR (Checks annotations por gate)
        if: always()
        run: node scripts/ssot-report-annotations.mjs --in=ssot-report.json

      - name: Upload SSOT report (combinado)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssot-report
          path: |
            ssot-report.json
            ssot-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report.json (individual)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-json
          path: ssot-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report.md (individual)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-md
          path: ssot-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Comentar relatório no PR (sticky, idempotente)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ssot-report.md
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const path = process.env.REPORT_PATH;
            const marker = '<!-- ssot-report-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            } else {
              body = `## SSOT Supabase Guard\n\n⚠️ \`ssot-report.md\` não foi gerado neste run.`;
            }
            // GitHub PR comment body limit: 65_536 chars. Deixa folga p/ marker + footer.
            const MAX = 60000;
            if (body.length > MAX) {
              body = body.slice(0, MAX) + '\n\n_(truncado — veja o artifact `ssot-report` para o relatório completo)_';
            }
            const finalBody = `${marker}\n${body}\n\n---\n<sub>🤖 SSOT Supabase Guard · status: **${process.env.JOB_STATUS}** · [run #${context.runId}](${runUrl})</sub>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: finalBody,
              });
              core.info(`Comentário SSOT atualizado (id=${existing.id}).`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: finalBody,
              });
              core.info('Comentário SSOT criado.');
            }

      - name: Resumo (log + Job Summary)
        if: always()
        run: node scripts/ssot-report-summary.mjs --in=ssot-report.json


