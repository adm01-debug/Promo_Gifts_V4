name: Quote Builder Delivery Quality
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package*.json'
      - '.nvmrc'
      - 'vite.config.*'
      - '.github/workflows/delivery-quality.yml'

permissions:
  contents: read

concurrency:
  group: delivery-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # E104: +5min para absorver --retries=2 no E2E (75s/tentativa × 2 retries)
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false  # E32
    - name: Setup E2E
      uses: ./.github/actions/e2e-setup

    - name: 🧪 Unit Tests (Vitest)
      run: TZ=America/Sao_Paulo npx vitest run src/pages/__tests__/QuoteBuilderDeliveryTooltip.test.tsx

    - name: 🌍 E2E & Visual Regression
      if: env.E2E_USER_EMAIL != ''
      env:
        CI: true
        E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
        E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      # E104: --retries=2 → 3 tentativas totais. A 4ª chamada ao Supabase auth
      # degrada após ~7min de CI (3 loginAs anteriores sobrecarregam o endpoint).
      # Com retry, a nova tentativa acontece 75s depois — API geralmente recupera.
      run: npx playwright test e2e/quote-builder-delivery.spec.ts --project=chromium-authed --retries=2

    - name: 📦 Upload Report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: delivery-quality-report
        path: |
          playwright-report/
          test-results/
          !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
        retention-days: 14
        if-no-files-found: ignore
