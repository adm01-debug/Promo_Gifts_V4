name: Quote Builder Delivery Quality
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package*.json'
      - '.nvmrc'
      - 'vite.config.*'
      - '.github/workflows/delivery-quality.yml'

permissions:
  contents: read

concurrency:
  group: delivery-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false  # E32
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: 🧪 Unit Tests (Vitest)
      run: TZ=America/Sao_Paulo npx vitest run src/pages/__tests__/QuoteBuilderDeliveryTooltip.test.tsx

    - name: 🎭 Install Playwright
      run: npx playwright install --with-deps chromium

    - name: 🌍 E2E & Visual Regression
      if: env.E2E_USER_EMAIL != ''
      run: npx playwright test e2e/quote-builder-delivery.spec.ts --project=chromium-authed
      env:
        CI: true

    - name: 📦 Upload Report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: delivery-quality-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
        if-no-files-found: ignore
