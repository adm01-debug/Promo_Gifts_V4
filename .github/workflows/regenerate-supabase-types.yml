# Workflow: regenera src/integrations/supabase/types.ts via supabase CLI.
# Disparado manualmente via Actions UI (workflow_dispatch).
#
# Pre-requisito: secret SUPABASE_ACCESS_TOKEN no repo.
# Gere o token em https://supabase.com/dashboard/account/tokens
#
# Uso apos merge:
#   Actions tab -> Regenerate Supabase Types -> Run workflow -> branch main
#
# O workflow:
#   1. Regenera types.ts via supabase gen types
#   2. Gate estrutural (PLANO_DBA E41): compara o inventário de Tables/Views/
#      Functions/Enums do types.ts novo contra o types.ts antigo (HEAD, antes
#      da regeneracao) via scripts/check-types-inventory-drift.mjs. Falha o
#      job se algo sumiu sem entrada em docs/TYPES_INVENTORY_REMOVAL_ALLOWLIST.json
#      — substitui o proxy antigo (contagem de linhas / "export type"), que
#      nao detecta remocao de tabela de dentro do union Database.public.Tables
#      (ver REGRA #4 do CLAUDE.md e o incidente magazine_*, 2026-07-16).
#   3. Remove continue-on-error de lint-untyped-from.yml (promove a required)
#   4. Roda o lint local pra validar
#   5. Commita em branch nova e abre PR
#
# Pode ser usado a qualquer momento pra sincronizar types.ts com o schema do banco.

name: Regenerate Supabase Types

on:
  workflow_dispatch:
    inputs:
      promote_lint:
        description: 'Remover continue-on-error de lint-untyped-from.yml (one-shot, primeira execucao)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    name: Regenerate types and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (para o gate estrutural de types.ts)
        run: npm ci --prefer-offline

      - name: Check SUPABASE_ACCESS_TOKEN secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN nao configurado."
            echo "Adicione em Settings -> Secrets and variables -> Actions"
            echo "Gere o token em https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - name: Regenerate types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          old=$(wc -l < src/integrations/supabase/types.ts | tr -d ' ')
          supabase gen types typescript --project-id doufsxqlfjyuvxuezpln > types.ts.new
          mv types.ts.new src/integrations/supabase/types.ts
          new=$(wc -l < src/integrations/supabase/types.ts | tr -d ' ')
          echo "types.ts: $old -> $new linhas (diagnostico informal; o gate real eh o passo seguinte)"
          echo "OLD_LINES=$old" >> $GITHUB_ENV
          echo "NEW_LINES=$new" >> $GITHUB_ENV

      # PLANO_DBA E41: gate estrutural. `--base HEAD` porque neste ponto o
      # working tree ja foi sobrescrito pelo types.ts novo mas nenhum commit
      # foi feito ainda nesta run — HEAD ainda aponta pro types.ts antigo
      # (o que estava em `main` antes desta regeneracao). Falha o job (sem
      # continue-on-error - REGRA #5 do CLAUDE.md) se uma Table/View/
      # Function/Enum sumiu sem entrada em
      # docs/TYPES_INVENTORY_REMOVAL_ALLOWLIST.json. Nao usa --live aqui:
      # o types.ts recem-gerado JA VEIO do banco vivo (supabase gen types),
      # entao comparar contra pg_catalog de novo seria redundante.
      - name: Gate estrutural de types.ts (PLANO_DBA E41)
        run: node scripts/check-types-inventory-drift.mjs --base HEAD

      - name: Promote lint to required
        if: inputs.promote_lint
        run: |
          python3 -c "
          import re
          p = '.github/workflows/lint-untyped-from.yml'
          c = open(p).read()
          new = re.sub(r'\n    # TODO.*?\n    continue-on-error: true\n', '\n', c, flags=re.DOTALL)
          if new == c:
              new = re.sub(r'\n    continue-on-error: true\n', '\n', c)
          if new == c:
              print('::warning::continue-on-error not found, lint may already be required')
          else:
              open(p, 'w').write(new)
              print('continue-on-error removido (lint agora eh required)')
          "

      - name: Run lint locally
        run: bash scripts/lint-untyped-from.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "::warning::Nenhuma mudanca - types.ts ja estava sincronizado"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Write PR body
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          mkdir -p /tmp/pr
          cat > /tmp/pr/body.md << 'BODYEOF'
          Regenera `src/integrations/supabase/types.ts` via supabase CLI.

          Auto-gerado por `.github/workflows/regenerate-supabase-types.yml`.

          ## Mudancas

          - `types.ts`: regenerado via `supabase gen types typescript --project-id doufsxqlfjyuvxuezpln`
          - `lint-untyped-from.yml`: `continue-on-error: true` removido se ainda presente (promovido a required)

          ## Validacao

          - Gate estrutural (PLANO_DBA E41, `scripts/check-types-inventory-drift.mjs`) passou: nenhuma Table/View/Function/Enum sumiu sem justificativa em `docs/TYPES_INVENTORY_REMOVAL_ALLOWLIST.json`.
          - Lint rodou local no runner e passou.

          Auto-aplicado via Claude MCP.
          BODYEOF

      - name: Commit, push, and open PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/regenerate-types-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/integrations/supabase/types.ts .github/workflows/lint-untyped-from.yml || true
          git commit -m "chore: regenerate supabase types ($OLD_LINES -> $NEW_LINES linhas)" \
                     -m "Auto-aplicado via workflow regenerate-supabase-types.yml"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate supabase types" \
            --body-file /tmp/pr/body.md
