name: Magazine Flakiness Guard

# Roda a suíte tests/magazine/ + tests/utils/tailwindRings.interaction.test.tsx
# N vezes seguidas e agrega flakiness.
#
# Escopo (auditoria 2026-07-14, promoção 2026-07-14):
#  - tests/magazine/                                — fuzz de rings, breakpoints, layout.
#  - tests/utils/tailwindRings.interaction.test.tsx — helpers SSOT ringsOf/focusRingsOf/
#    hoverRingsOf/focusWithinRingsOf/dataStateRingsOf sob interação real (mouse+teclado).
#    Crítico para qualidade: QUALQUER regressão nesses helpers invalida
#    silenciosamente todos os testes de rings do Magazine e do CompareTableView.
#
# Estratégia (E81 2026-10-14):
#  - Flakiness é detecção de deriva lenta (deps, jsdom, runners) — não gate de PR.
#    (E58: "gate obrigatório" removido — único required check é Gate Final em deploy-gates.yml)
#    Promovido para PR causava 10 runs extra por PR nos arquivos de magazine.
#  - Schedule semanal: pega drift lento, sem --strict para não spam issues.
#  - Manual: workflow_dispatch permite ajustar `runs=N` e `strict=true|false`.
#
# Falha o job quando:
#   - algum teste falha em 100% das rodadas (fail-all), OU
#   - modo strict + qualquer teste flaky (1..N-1 falhas).

on:
  schedule:
    - cron: '18 6 * * 1' # semanal, segunda 06:18 UTC — varredura incondicional
  workflow_dispatch:
    inputs:
      runs:
        description: 'Número de execuções consecutivas (1..50)'
        required: false
        default: '10'
      strict:
        description: 'Falhar em qualquer flakiness detectado'
        required: false
        default: 'false'

concurrency:
  group: magazine-flakiness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  flakiness:
    name: Magazine + Rings Flakiness (repeat × N)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run flakiness report
        env:
          CI: 'true'
          NODE_ENV: 'test'
          INPUT_RUNS: ${{ github.event.inputs.runs || '10' }}
          INPUT_STRICT: ${{ github.event.inputs.strict }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          RUNS="$INPUT_RUNS"
          # Modo strict:
          #   - PR:                não roda (E81 — não é gate de PR).
          #   - workflow_dispatch: respeita input (default true).
          #   - schedule:          nunca strict (evita ruído em cron semanal).
          STRICT_FLAG=""
          # strict só em workflow_dispatch com input explícito
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_STRICT" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          node scripts/magazine-flakiness-report.mjs \
            --runs="$RUNS" \
            --retry=0 \
            --pattern="tests/magazine/,tests/utils/tailwindRings.interaction.test.tsx" \
            $STRICT_FLAG

      - name: Upload flakiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magazine-flakiness-report
          path: reports/flakiness/
          retention-days: 30

  flakiness-ok:
    name: Magazine Flakiness OK
    needs: [flakiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check result
        run: |
          if [ '${{ needs.flakiness.result }}' = 'success' ]; then
            echo '✅ Nenhum flaky/fail-all detectado em tests/magazine/ + tailwindRings.interaction'
          else
            echo '❌ Flakiness/fail-all detectado — ver artifact magazine-flakiness-report'
            exit 1
          fi
