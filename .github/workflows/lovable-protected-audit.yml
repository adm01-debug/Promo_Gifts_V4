name: "Lovable Protected-File Audit (E196)"

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: lovable-audit-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: lovable-protected-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Roda só em commits do Lovable bot
    if: contains(github.event.head_commit.author.name, 'gpt-engineer') || contains(github.event.head_commit.author.email, 'gpt-engineer')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detectar arquivos protegidos alterados
        id: detect
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          PROTECTED=(
            "src/integrations/supabase/client.ts"
            "src/integrations/supabase/types.ts"
            "scripts/validate-supabase-config.mjs"
            ".env.example"
            ".github/CODEOWNERS"
            "scripts/sentinel-check.sh"
            ".github/workflows/deploy-gates.yml"
            "supabase/functions/_shared/cors-snapshot.json"
            ".codeql-alerts-baseline.json"
            "docs/TYPES_INVENTORY_REMOVAL_ALLOWLIST.json"
          )

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          HITS=""
          for f in "${PROTECTED[@]}"; do
            if echo "$CHANGED" | grep -qF "$f"; then
              HITS="$HITS\n- \`$f\`"
            fi
          done

          # Também detectar snapshots e baselines
          SNAP=$(echo "$CHANGED" | grep -E '(/__snapshots__/|supabase/baseline/)' || true)
          if [ -n "$SNAP" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && HITS="$HITS\n- \`$line\`"
            done <<< "$SNAP"
          fi

          if [ -z "$HITS" ]; then
            echo "no_hits=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_hits=false" >> "$GITHUB_OUTPUT"
            {
              echo "hits<<EOF"
              echo -e "$HITS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir issue de auditoria
        if: steps.detect.outputs.no_hits == 'false'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const hits = `${{ steps.detect.outputs.hits }}`;
            const sha = context.sha.slice(0, 8);
            const author = `${{ github.event.head_commit.author.name }}`;
            const msg = `${{ github.event.head_commit.message }}`.split('\n')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[E196] Lovable tocou arquivo protegido — ${sha}`,
              body: [
                '## Auditoria automática de commit do Lovable',
                '',
                `**Commit:** \`${context.sha}\``,
                `**Autor:** ${author}`,
                `**Mensagem:** ${msg}`,
                '',
                '### Arquivos protegidos alterados',
                hits,
                '',
                '### Ação necessária',
                '1. Revisar o diff: verifique se o Lovable reverteu alguma correção de segurança.',
                '2. Se reverteu: reabrir PR com a correção restaurada.',
                '3. Se a alteração é legítima: fechar esta issue com justificativa.',
                '',
                '**Referência:** E196, REGRA #7 (CLAUDE.md)',
              ].join('\n'),
              labels: ['lovable-audit', 'needs-review'],
            });
