name: Magazine Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/magazine/**'
      - 'src/pages/magazine/hooks/**'
      - 'src/services/magazineService.ts'
      - 'src/services/__tests__/magazine*.test.ts'
      - 'tests/integration/magazine-service-fuzz.test.ts'
      - 'tests/magazine/**'
      - 'tests/utils/tailwindRings*'
      - 'supabase/migrations/*magazine*.sql'
      - 'supabase/functions/magazine-import-local/**'
      - 'scripts/test*magazine*'
      - 'package.json'
      - 'src/hooks/auth/**'
      - 'src/contexts/AuthContext.tsx'
      - 'src/lib/supabase/**'
      - 'scripts/check-no-template-thumbnail.mjs'
      - '.github/workflows/magazine-unit-tests.yml'
  pull_request:
    paths:
      - 'src/pages/magazine/**'
      - 'src/pages/magazine/hooks/**'
      - 'src/services/magazineService.ts'
      - 'src/services/__tests__/magazine*.test.ts'
      - 'tests/integration/magazine-service-fuzz.test.ts'
      - 'tests/magazine/**'
      - 'tests/utils/tailwindRings*'
      - 'supabase/migrations/*magazine*.sql'
      - 'supabase/functions/magazine-import-local/**'
      - 'scripts/test*magazine*'
      - 'package.json'
      - 'src/hooks/auth/**'
      - 'src/contexts/AuthContext.tsx'
      - 'src/lib/supabase/**'
      - 'scripts/check-no-template-thumbnail.mjs'
      - '.github/workflows/magazine-unit-tests.yml'

concurrency:
  group: magazine-unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge-import-contract:
    name: Deno Magazine import contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Test transactional local import logic
        run: deno test --allow-net supabase/functions/magazine-import-local/logic.test.ts

  unit-tests:
    name: Vitest Unit Tests (Magazine)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: 🚫 No TemplateThumbnail regression gate
        run: node scripts/check-no-template-thumbnail.mjs

      - name: 🌐 Edge CORS x-request-id gate
        run: node scripts/check-edge-cors-headers.mjs

      - name: 🤖 AI key contract gate (503 ai_not_configured)
        run: node scripts/simulate-ai-key-scenarios.mjs



      - name: Run complete Magazine suite with coverage floors
        run: |
          set -o pipefail
          npm run test:magazine:coverage 2>&1 | tee /tmp/magazine-vitest.log
        env:
          CI: true
          NODE_ENV: test

      - name: Detect React act warnings (advisory)
        if: always()
        run: |
          COUNT=$(grep -c "not wrapped in act" /tmp/magazine-vitest.log 2>/dev/null || true)
          echo "React act warnings: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning title=Magazine React act warnings::$COUNT warning(s) detected; advisory until fixtures are repaired"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magazine-coverage
          path: coverage/
          retention-days: 7

  postgres-contracts:
    name: PostgreSQL 17 RPC Contracts (Magazine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run forward-only RPC, idempotence and concurrency scenarios
        run: npm run test:magazine:sql

  security-definer-acl:
    name: SECURITY DEFINER ACL Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # E40 (2026-10-01): --require-live em push:main e PRs do mesmo repo.
      # PR de fork não tem secrets → aceita inconclusive (não bloqueia).
      - name: SECURITY DEFINER ACL gate
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIVE_FLAG=""
          IS_FORK_PR="false"
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK_PR="true"
          fi
          if [ "$IS_FORK_PR" = "false" ]; then
            LIVE_FLAG="--require-live"
          fi
          node scripts/check-security-definer-acl.mjs --baseline .security-definer-acl-baseline.json $LIVE_FLAG

  magazine-tests-ok:
    name: Magazine Tests OK
    needs: [edge-import-contract, unit-tests, postgres-contracts, security-definer-acl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check result
        run: |
          if [ '${{ needs.unit-tests.result }}' = 'success' ] \
              && [ '${{ needs.edge-import-contract.result }}' = 'success' ] \
              && [ '${{ needs.security-definer-acl.result }}' = 'success' ] \
              && [ '${{ needs.postgres-contracts.result }}' = 'success' ]; then
            echo '✅ All Magazine tests + PostgreSQL contracts + gates passed'
          else
            echo '❌ Magazine gates failed:'
            echo "  unit-tests=${{ needs.unit-tests.result }}"
            echo "  edge-import-contract=${{ needs.edge-import-contract.result }}"
            echo "  security-definer-acl=${{ needs.security-definer-acl.result }}"
            echo "  postgres-contracts=${{ needs.postgres-contracts.result }}"
            exit 1
          fi
