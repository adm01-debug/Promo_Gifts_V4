name: CI Metrics Weekly (E66/E87)

# E66/E87: Coleta métricas de CI da última semana e abre PR com docs/ci/METRICAS_SEMANAIS.md
# Roda toda segunda 07:15 UTC e via workflow_dispatch (para forçar manualmente).
# Nunca faz push direto em main — entrega via PR em branch ci-metrics/YYYY-WNN.

on:
  schedule:
    - cron: '15 7 * * 1' # Segunda 07:15 UTC (jitter E89)
  workflow_dispatch:

concurrency:
  group: ci-metrics-weekly
  cancel-in-progress: false

permissions:
  contents: write      # para criar branch e fazer commit
  pull-requests: write # para abrir PR
  actions: read        # para ler workflow runs via API


defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # E24: cron pesado ≤ 60 min; coleta paginada de runs da semana
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Coletar métricas de CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-metrics.mjs

      - name: Abrir PR com relatório se houve mudança
        # E66/E87: nunca push direto em main — entrega via PR em branch ci-metrics/YYYY-WNN.
        # Cron e workflow_dispatch se comportam igual: se mudou, abre PR.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ci/METRICAS_SEMANAIS.md
          if git diff --staged --quiet; then
            echo "Sem mudança no relatório — nenhum PR a abrir."
            exit 0
          fi
          WEEK=$(date -u +%Y-W%V)
          BRANCH="ci-metrics/${WEEK}"
          git checkout -b "$BRANCH"
          git commit -m "chore(ci): métricas semanais ${WEEK}

          Relatório automático gerado por ci-metrics-weekly.yml (E66/E87).
          Revise antes de mergear — dados de runs/dia, fila e cache."
          git push -u origin "$BRANCH"
          # Verifica se já existe PR aberto para esta semana (idempotência)
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} já existe para ${BRANCH} — branch atualizado."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(ci): métricas semanais ${WEEK}" \
              --body "## Métricas de CI — semana ${WEEK}

          Relatório gerado automaticamente por \`.github/workflows/ci-metrics-weekly.yml\`.

          Verifique \`docs/ci/METRICAS_SEMANAIS.md\` e mergee para registrar as métricas da semana.

          > Auto-gerado por [ci-metrics-weekly](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi
      - name: Upload relatório (sempre — cron não commita)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-metrics-weekly-${{ github.run_id }}
          path: docs/ci/METRICAS_SEMANAIS.md
          retention-days: 14
