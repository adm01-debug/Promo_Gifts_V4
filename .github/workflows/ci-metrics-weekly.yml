name: CI Metrics Weekly (E93)

# Coleta métricas de CI da última semana e publica docs/ci/METRICAS_SEMANAIS.md
# Roda toda segunda 07:15 UTC e via workflow_dispatch (para forçar manualmente).
# Usa GITHUB_TOKEN nativo (read:actions). Para substituir por GitHub App token
# assim que E02 for implementado, troque o env GH_TOKEN abaixo.

on:
  schedule:
    - cron: '15 7 * * 1' # Segunda 07:15 UTC (jitter E19)
  workflow_dispatch:

concurrency:
  group: ci-metrics-weekly
  cancel-in-progress: false

permissions:
  contents: write  # para fazer commit do relatório
  actions: read    # para ler workflow runs via API


defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # E24: cron pesado ≤ 60 min; coleta paginada de runs da semana
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # E32
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Coletar métricas de CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-metrics.mjs

      - name: Commit relatório se houve mudança
        # E89/A-23: push direto em main só via workflow_dispatch (nunca pelo cron).
        # O cron gera o relatório e o expõe como artifact; o operador faz dispatch
        # quando quiser persistir no repo.
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ci/METRICAS_SEMANAIS.md
          if git diff --staged --quiet; then
            echo "Sem mudança no relatório."
          else
            git commit -m "chore(ci): atualiza METRICAS_SEMANAIS.md $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi
      - name: Upload relatório (sempre — cron não commita)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-metrics-weekly-${{ github.run_id }}
          path: docs/ci/METRICAS_SEMANAIS.md
          retention-days: 14
