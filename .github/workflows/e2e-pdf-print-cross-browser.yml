name: E2E — PDF Print (cross-browser)

# Valida o fluxo de impressão do PDF nos 3 engines suportados pelo Playwright:
# Chromium, Firefox e WebKit (Safari). Cobre:
#   • Chromium/Firefox: iframe.contentWindow.print() executa sem fallback.
#   • WebKit: detecção via UA → fallback modal com data-reason="safari".
#   • Cross-browser: window.open bloqueado → fallback data-reason="popup-blocked".
#
# O spec não depende de auth nem de dados reais (usa page.setContent com um
# harness HTML que espelha a lógica do handlePrint). Roda em paralelo por
# engine via matrix.

on:
  push:
    branches: [main]
    paths:
      - 'e2e/flows/pdf-print-cross-browser.spec.ts'
      - 'src/components/quotes/PdfGenerationDialog.tsx'
      - 'src/components/quotes/PdfPrintHelpDialog.tsx'
      - '.github/workflows/e2e-pdf-print-cross-browser.yml'
  pull_request:
    paths:
      - 'e2e/flows/pdf-print-cross-browser.spec.ts'
      - 'src/components/quotes/PdfGenerationDialog.tsx'
      - 'src/components/quotes/PdfPrintHelpDialog.tsx'
      - '.github/workflows/e2e-pdf-print-cross-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'  # E10 — weekly Monday 04:23 UTC

permissions:
  contents: read
  issues: write

jobs:
  print-cross-browser:
    name: Print fallback (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-public
            browser: chromium
          - project: firefox-public
            browser: firefox
          - project: webkit-public
            browser: webkit
    env:
      CI: 'true'
      # Não precisa de Supabase — spec é 100% cliente-side com setContent.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run print cross-browser spec
        run: |
          npx playwright test \
            e2e/flows/pdf-print-cross-browser.spec.ts \
            --project=${{ matrix.project }} \
            --retries=2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-print-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # E10 — alerta de falha no cron semanal (deduplication via label ci-focused-e2e)
  notify-failure:
    name: Notificar falha (cron)
    if: failure() && github.event_name == 'schedule'
    needs: [print-cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowName = 'E2E — PDF Print (cross-browser)';
            const label = 'ci-focused-e2e';
            const title = `[CI] ${workflowName} falhou no cron semanal`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: label, state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha detectada: ${runUrl} — ${new Date().toISOString()}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: [label],
                body: [
                  `## ❌ ${workflowName} falhou no cron semanal`,
                  '',
                  `- **Run:** ${runUrl}`,
                  `- **Triggered:** ${new Date().toISOString()}`,
                  '',
                  'Verifique os artifacts do run para screenshots, diffs e traces.',
                ].join('\n'),
              });
            }
