name: E2E — PDF Print (cross-browser)

# Valida o fluxo de impressão do PDF nos 3 engines suportados pelo Playwright:
# Chromium, Firefox e WebKit (Safari). Cobre:
#   • Chromium/Firefox: iframe.contentWindow.print() executa sem fallback.
#   • WebKit: detecção via UA → fallback modal com data-reason="safari".
#   • Cross-browser: window.open bloqueado → fallback data-reason="popup-blocked".
#
# O spec não depende de auth nem de dados reais (usa page.setContent com um
# harness HTML que espelha a lógica do handlePrint). Roda em paralelo por
# engine via matrix.

on:
  push:
    branches: [main]
    paths:
      - 'e2e/flows/pdf-print-cross-browser.spec.ts'
      - 'src/components/quotes/PdfGenerationDialog.tsx'
      - 'src/components/quotes/PdfPrintHelpDialog.tsx'
      - '.github/workflows/e2e-pdf-print-cross-browser.yml'
  pull_request:
    paths:
      - 'e2e/flows/pdf-print-cross-browser.spec.ts'
      - 'src/components/quotes/PdfGenerationDialog.tsx'
      - 'src/components/quotes/PdfPrintHelpDialog.tsx'
      - '.github/workflows/e2e-pdf-print-cross-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '44 4 * * 1'  # E10/E89 — weekly Monday 04:44 UTC

permissions:
  contents: read

concurrency:
  group: e2e-pdf-print-cross-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  print-cross-browser:
    name: Print fallback (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-public
            browser: chromium
          # E54: Firefox e WebKit falham constantemente em PR — isolados no cron semanal
          - project: firefox-public
            browser: firefox
            schedule_only: true
          - project: webkit-public
            browser: webkit
            schedule_only: true
    env:
      CI: 'true'
      # Não precisa de Supabase — spec é 100% cliente-side com setContent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # E32
      - name: Setup E2E
        uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browser }}

      - name: Run print cross-browser spec
        if: ${{ !matrix.schedule_only || github.event_name == 'schedule' }}
        run: |
          npx playwright test \
            e2e/flows/pdf-print-cross-browser.spec.ts \
            --project=${{ matrix.project }} \
            --retries=2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-print-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/trace.zip  # E26: trace contém dados de formulário (incluindo senhas E2E)
          retention-days: 14
          if-no-files-found: ignore

  # E12 — usa ci-issue action para dedupe real
  notify-failure:
    name: Notificar falha — PDF Print Cross-Browser (cron)
    permissions:
      issues: write
    if: failure() && github.event_name == 'schedule'
    needs: [print-cross-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-pdf-print-cross-browser
          title: "[CI] E2E — PDF Print (cross-browser) falhou no cron semanal"
          body: |
            ## ❌ E2E — PDF Print (cross-browser) falhou no cron semanal

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered:** ${{ github.run_started_at }}

            Verifique os artifacts do run para screenshots, diffs e traces.
          labels: ci-focused-e2e
          state: open
  # E12 — fecha a issue quando o cron volta a passar
  notify-success:
    name: Fechar issue — PDF Print Cross-Browser (cron recuperado)
    permissions:
      issues: write
    if: success() && github.event_name == 'schedule'
    needs: [print-cross-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/ci-issue
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/ci-issue
        with:
          key: e2e-pdf-print-cross-browser
          title: "[CI] E2E — PDF Print (cross-browser) falhou no cron semanal"
          body: "Todos os testes passaram."
          labels: ci-focused-e2e
          state: resolved
