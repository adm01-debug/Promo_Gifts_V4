name: E2E — Personalization Flow

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/__tests__/**'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - '.nvmrc'
      - 'playwright.config.*'
      - 'vite.config.*'
      - '.github/workflows/e2e-personalization.yml'
      - '.github/scripts/e2e-relevance.mjs'
  pull_request:
    branches: [main]
    paths:  # E14: evitar CI em PRs doc-only
      - 'src/**'
      - '!src/**/__tests__/**'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - '.nvmrc'
      - 'playwright.config.*'
      - 'vite.config.*'
      - '.github/workflows/e2e-personalization.yml'
      - '.github/scripts/e2e-relevance.mjs'
  workflow_dispatch:

concurrency:
  group: e2e-personalization-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  FORCE_COLOR: "0"
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_E2E_PROJECT_REF && format('https://{0}.supabase.co', vars.SUPABASE_E2E_PROJECT_REF) || '' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY_E2E }}
  VITE_SUPABASE_E2E_PROJECT_ID: ${{ vars.SUPABASE_E2E_PROJECT_REF }}
permissions:
  contents: read
  pull-requests: read


defaults:
  run:
    shell: bash

jobs:
  e2e-relevance:
    uses: ./.github/workflows/_e2e-relevance.yml

  personalization-tests:
    name: E2E — Personalization Journey
    needs: [e2e-relevance]
    if: needs.e2e-relevance.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: 'chromium'
          start-vite: 'true'

      - name: Setup auth state
        id: auth-setup
        if: env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != ''
        run: npx playwright test --project=setup
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Run Personalization E2E Tests
        run: |
          npx playwright test \
            e2e/flows/90-personalization-pdp-flow.spec.ts \
            e2e/flows/91-personalization-variant-flow.spec.ts \
            e2e/flows/92-personalization-auth-redirect.spec.ts \
            --project=chromium-authed \
            --no-deps \
            --reporter=github,list,html,json
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-personalization.json

      - name: Check min tests executed  # E42
        if: always() && steps.auth-setup.outcome == 'success'
        uses: ./.github/actions/check-min-tests
        with:
          results-json: 'playwright-report/results-personalization.json'
          min: 1
          max-skipped-ratio: '0.95'

      - name: Upload Test Artifacts (Screenshots/Videos/Traces)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personalization-e2e-artifacts
          path: |
            e2e-artifacts/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
