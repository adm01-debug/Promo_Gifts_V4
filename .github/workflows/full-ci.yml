name: Full CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Guard — package-lock em sincronia
        run: node scripts/check-lockfile-sync.mjs

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:baseline

      - name: Unit & Integration Tests (Coverage)
        run: npm run test:ci-core:coverage
        env:
          TZ: America/Sao_Paulo

      - name: Validate Coverage Threshold
        run: |
          pct=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Current Coverage: $pct%"
          if (( $(echo "$pct < 50" | bc -l) )); then
            echo "Coverage below 50% threshold!"
            exit 1
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Vitest — stress + fuzz badges (blocking)
        run: |
          TZ=America/Sao_Paulo npx vitest run \
            src/hooks/products/__tests__/useProductIntelligenceBadges.test.tsx \
            src/hooks/products/__tests__/useProductIntelligenceBadges.stress.test.tsx \
            src/hooks/admin/__tests__/useIntelligenceBadgeSettings.fuzz.test.ts

      - name: Run Playwright tests (Sharded Parallel)
        run: |
          npx playwright test --shard=${{ matrix.shard }}/2 \
            e2e/catalog.spec.ts \
            e2e/kit-builder.spec.ts \
            e2e/login.spec.ts \
            e2e/mockup-generate.spec.ts \
            e2e/routes/app/replenishment-grid-visual.spec.ts \
            e2e/catalog/product-card-badges-visual.spec.ts \
            e2e/catalog/product-card-to-superfilter.spec.ts \
            --project=chromium-authed
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
      
      - name: Upload Playwright Artifacts (Screenshots & Diffs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            e2e-artifacts/
          retention-days: 14

      - name: Upload Playwright Report (Always)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14


  audit-report:
    name: Final Audit Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gate, e2e-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Download Coverage Summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          path: coverage

      - name: Generate Audit Report
        run: node scripts/generate-audit-report.mjs

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-audit-report
          path: audit-report.txt
          retention-days: 14
