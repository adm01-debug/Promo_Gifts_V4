name: Gate 5 — Supabase Security Audit

# E39 (2026-10-01):
# - Ref canônico hardcoded (doufsxqlfjyuvxuezpln) — SSOT REGRA #1
# - db lint limitado a push:main (PR-independente: audita schema inteiro)
# - CHECK 2 reimplementado via Management API (pg_proc.proconfig),
#   nunca mais PostgREST/anon key (REGRA #8 corolário)
# - SUPABASE_PROJECT_REF hardcoded em CHECK 2 e CHECK 5
#
# Secrets necessários:
#   SUPABASE_ACCESS_TOKEN      → Supabase CLI personal access token
#   VITE_SUPABASE_URL          → https://doufsxqlfjyuvxuezpln.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY → usada apenas em CHECKs 3/4 (smoke/RPC)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/**'
      - '.github/workflows/supabase-security-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/**'
      - '.github/workflows/supabase-security-gate.yml'

permissions:
  contents: read

concurrency:
  group: supabase-security-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    shell: bash

jobs:
  supabase-security-gate:
    name: Gate 5 — DB Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Supabase CLI só é necessário para CHECK 1 (db lint), que roda apenas
      # em push:main — não instalar em PRs para economizar tempo.
      - name: Setup Supabase CLI
        if: github.event_name != 'pull_request'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v2
        with:
          version: 2.101.0

      # ─────────────────────────────────────────────────
      # CHECK 1: lint das migrations (idempotência, style)
      # E39: limitado a push:main — db lint audita schema inteiro
      # (não só o diff do PR) e é PR-independente.
      # Ref hardcoded: SSOT — nunca de secret para evitar substituição silenciosa.
      # ─────────────────────────────────────────────────
      - name: 🔗 Link Supabase project
        if: github.event_name != 'pull_request'
        run: supabase link --project-ref doufsxqlfjyuvxuezpln
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🔍 Lint migrations
        if: github.event_name != 'pull_request'
        run: |
          supabase db lint \
            --linked \
            --schema public \
            --level warning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ─────────────────────────────────────────────────
      # CHECK 2: auditoria de SECURITY DEFINER
      # E39: via Management API (pg_proc.proconfig), nunca PostgREST/anon key.
      # --require-live: sem SUPABASE_ACCESS_TOKEN → inconclusive, nunca green.
      # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks.
      # ─────────────────────────────────────────────────
      - name: 🔒 Audit SECURITY DEFINER functions
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/check-security-definer-audit.mjs --require-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln

      # ─────────────────────────────────────────────────
      # CHECK 3: smoke test da RPC get_profile_and_roles
      # ─────────────────────────────────────────────────
      - name: 🩺 RPC get_profile_and_roles smoke test
        run: node scripts/check-rpc-get-profile-and-roles.mjs --require-live
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # ─────────────────────────────────────────────────
      # CHECK 4: verifica que anon NÃO tem EXECUTE na RPC
      # ─────────────────────────────────────────────────
      - name: 🚫 Verify anon cannot execute RPC
        run: node scripts/check-rpc-permissions.mjs --require-live
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # ─────────────────────────────────────────────────
      # CHECK 5 (PLANO_DBA E22): gate permanente anon write grants.
      # --require-live: sem credencial → inconclusive, nunca green.
      # PROJECT_REF hardcoded (SSOT — REGRA #1).
      # E27: SUPABASE_ACCESS_TOKEN não deve chegar a PRs de forks.
      # ─────────────────────────────────────────────────
      - name: 🔓 Verify anon has no write GRANTs (E22)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/check-anon-write-grants.mjs --require-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
