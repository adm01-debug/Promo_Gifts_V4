name: Apply Magazine FK indexes (temporary)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite APPLY_MAGAZINE_FK_INDEXES_CANONICAL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: inputs.confirmation == 'APPLY_MAGAZINE_FK_INDEXES_CANONICAL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Guard canônico, preflight, apply e postflight
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const version = '20260909220000';
          const name = 'magazine_duplicate_request_indexes';
          const path = 'supabase/migrations/20260909220000_magazine_duplicate_request_indexes.sql';
          if (!token || projectRef !== 'doufsxqlfjyuvxuezpln') {
            throw new Error('canonical_project_guard_failed');
          }

          const apiBase = `https://api.supabase.com/v1/projects/${projectRef}/database`;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function execute(query, readOnly) {
            const endpoint = readOnly ? `${apiBase}/query/read-only` : `${apiBase}/query`;
            const response = await fetch(endpoint, {
              method: 'POST', headers,
              body: JSON.stringify(readOnly ? { query } : { query, read_only: false }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`management_api_${response.status}:${body.slice(0, 500)}`);
            return body ? JSON.parse(body) : [];
          }

          const inspectSql = `
            SELECT
              EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='${version}') AS migration_exists,
              (SELECT count(*)::int FROM pg_indexes WHERE schemaname='public'
                AND tablename='magazine_duplicate_requests'
                AND indexname IN ('idx_magazine_duplicate_requests_source_magazine_id',
                                  'idx_magazine_duplicate_requests_magazine_id')) AS index_count
          `;
          const pre = (await execute(inspectSql, true))[0];
          console.log(`Preflight: migration=${pre.migration_exists}, indexes=${pre.index_count}`);
          if (pre.migration_exists && Number(pre.index_count) === 2) process.exit(0);
          if (pre.migration_exists || Number(pre.index_count) !== 0) throw new Error('unexpected_partial_state');

          const sql = readFileSync(path, 'utf8');
          if (sql.includes('$migration_body$')) throw new Error('reserved_dollar_quote');
          await execute(`BEGIN;\n${sql}\nINSERT INTO supabase_migrations.schema_migrations(version,name,statements)
            VALUES ('${version}','${name}',ARRAY[$migration_body$${sql}$migration_body$]::text[])
            ON CONFLICT (version) DO NOTHING;\nCOMMIT;`, false);

          const post = (await execute(inspectSql, true))[0];
          console.log(`Postflight: migration=${post.migration_exists}, indexes=${post.index_count}`);
          if (!post.migration_exists || Number(post.index_count) !== 2) throw new Error('postflight_failed');
          NODE
