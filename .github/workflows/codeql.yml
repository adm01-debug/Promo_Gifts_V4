name: CodeQL

on:
  push:
    branches: [main]
  # 2026-09-27: pull_request removido — CodeQL em todo PR adicionava 12min/2 jobs
  # ao fan-out do repo (123 workflows). Varredura continua em cada push na main e
  # na segunda 09:00 UTC. Sem branch protection, não bloqueia nenhuma PR.
  schedule:
    - cron: '33 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Check Code Security availability
        id: code-security
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/code-scanning/alerts?per_page=1")"

          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          message="$(jq -r '.message // ""' "$response_file")"
          if [ "$status" = '403' ] && [[ "$message" == *'not enabled for this repository'* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=CodeQL indisponível::O repositório privado não possui GitHub Code Security habilitado; análise não iniciada.'
            exit 0
          fi

          echo "::error title=Falha ao consultar Code Security::GitHub API respondeu HTTP $status: $message"
          exit 1

      - name: Initialize CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Gate E96 — ratchet de alertas HIGH/CRITICAL do CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ratchet E10/E96: falha se COUNT aumentou em relação ao baseline commitado.
          # severity=high filtra pelo campo security_severity_level da rule;
          # severity=critical é distinto de high na API — ambos consultados (Codex P1, 2026-10-02).
          COUNT_HIGH=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=high&per_page=100" \
            --jq 'length')
          COUNT_CRITICAL=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=critical&per_page=100" \
            --jq 'length')
          COUNT=$(( ${COUNT_HIGH:-0} + ${COUNT_CRITICAL:-0} ))

          BASELINE=0
          if [ -f .codeql-alerts-baseline.json ]; then
            BASELINE=$(jq -r '.high_critical // 0' .codeql-alerts-baseline.json)
          fi

          if [ "${COUNT}" -gt "${BASELINE}" ]; then
            echo "::error::❌ Regressão CodeQL: ${COUNT} alerta(s) HIGH/CRITICAL (high=${COUNT_HIGH:-0}, critical=${COUNT_CRITICAL:-0}) > baseline ${BASELINE} — corrija antes de mergear ou atualize .codeql-alerts-baseline.json"
            exit 1
          fi
          if [ "${COUNT}" -gt 0 ]; then
            echo "::warning::${COUNT} alerta(s) HIGH/CRITICAL conhecidos (≤ baseline ${BASELINE}) — atualize .codeql-alerts-baseline.json ao corrigir"
          fi
          echo "✅ CodeQL ratchet OK: ${COUNT} alerta(s) HIGH/CRITICAL (baseline: ${BASELINE})"
