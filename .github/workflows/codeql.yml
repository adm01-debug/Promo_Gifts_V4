name: CodeQL

on:
  push:
    branches: [main]
  # 2026-09-27: pull_request removido — CodeQL em todo PR adicionava 12min/2 jobs
  # ao fan-out do repo (123 workflows). Varredura continua em cada push na main e
  # na segunda 09:00 UTC. Sem branch protection, não bloqueia nenhuma PR.
  schedule:
    - cron: '33 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Code Security availability
        id: code-security
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \\
            --output "$response_file" \\
            --write-out '%{http_code}' \\
            --header 'Accept: application/vnd.github+json' \\
            --header "Authorization: Bearer $GH_TOKEN" \\
            --header 'X-GitHub-Api-Version: 2022-11-28' \\
            "$API_URL/repos/$REPOSITORY/code-scanning/alerts?per_page=1")"

          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          message="$(jq -r '.message // ""' "$response_file")"
          if [ "$status" = '403' ] && [[ "$message" == *'not enabled for this repository'* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=CodeQL indisponível::O repositório privado não possui GitHub Code Security habilitado; análise não iniciada.'
            exit 0
          fi

          echo "::error title=Falha ao consultar Code Security::GitHub API respondeu HTTP $status: $message"
          exit 1

      - name: Initialize CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Gate E96 — falha em alertas HIGH do CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Conta alertas CodeQL abertos com nível SARIF "error" (HIGH no GitHub UI).
          # fail-on: high foi removido por ser input não documentado em analyze@v4
          # (codeql-action ignora inputs desconhecidos sem falhar — Codex P1, 2026-10-02).
          COUNT=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=error&per_page=100" \
            --jq 'length')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::error::❌ ${COUNT} alerta(s) HIGH (severity=error) do CodeQL em aberto — corrija antes de mergear"
            exit 1
          fi
          echo "✅ 0 alertas HIGH do CodeQL em aberto"
