name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Code Security availability
        id: code-security
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/code-scanning/alerts?per_page=1")"

          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          message="$(jq -r '.message // ""' "$response_file")"
          if [ "$status" = '403' ] && [[ "$message" == *'not enabled for this repository'* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=CodeQL indisponível::O repositório privado não possui GitHub Code Security habilitado; análise não iniciada.'
            exit 0
          fi

          echo "::error title=Falha ao consultar Code Security::GitHub API respondeu HTTP $status: $message"
          exit 1

      - name: Initialize CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
