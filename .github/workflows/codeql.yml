name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - '.github/workflows/codeql.yml'  # R12: self-reference
  schedule:
    - cron: '33 9 * * 1'  # segunda 09:33 UTC (E89)

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false  # E32
      - name: Check Code Security availability
        id: code-security
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/code-scanning/alerts?per_page=1")"

          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # E017: 403 da code-scanning API em repo público = erro real de permissão/configuração.
          # exit 1 garante que o job falhe visível (vermelho) em vez de passar verde sem scan.
          if [ "$status" = '403' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            message="$(jq -r '.message // ""' "$response_file")"
            echo "::error title=CodeQL indisponível::Code Security não habilitado ou sem permissão (HTTP 403: $message). Repositório público deve ter CodeQL disponível — verifique Advanced Security nas configurações."
            exit 1
          fi
          message="$(jq -r '.message // ""' "$response_file")" 

          echo "::error title=Falha ao consultar Code Security::GitHub API respondeu HTTP $status: $message"
          exit 1

      - name: Initialize CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.code-security.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Gate E96 — ratchet de alertas HIGH/CRITICAL do CodeQL
        if: steps.code-security.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ratchet E10/E96: falha se COUNT aumentou em relação ao baseline commitado.
          # severity=high filtra pelo campo security_severity_level da rule;
          # severity=critical é distinto de high na API — ambos consultados (Codex P1, 2026-10-02).
          COUNT_HIGH=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=high&per_page=100" \
            --jq 'length')
          COUNT_CRITICAL=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=critical&per_page=100" \
            --jq 'length')
          COUNT=$(( ${COUNT_HIGH:-0} + ${COUNT_CRITICAL:-0} ))

          BASELINE=0
          if [ -f .codeql-alerts-baseline.json ]; then
            BASELINE=$(jq -r '.high_critical // 0' .codeql-alerts-baseline.json)
          fi

          if [ "${COUNT}" -gt "${BASELINE}" ]; then
            echo "::error::❌ Regressão CodeQL: ${COUNT} alerta(s) HIGH/CRITICAL (high=${COUNT_HIGH:-0}, critical=${COUNT_CRITICAL:-0}) > baseline ${BASELINE} — corrija antes de mergear ou atualize .codeql-alerts-baseline.json"
            exit 1
          fi
          if [ "${COUNT}" -gt 0 ]; then
            echo "::warning::${COUNT} alerta(s) HIGH/CRITICAL conhecidos (≤ baseline ${BASELINE}) — atualize .codeql-alerts-baseline.json ao corrigir"
          fi
          echo "✅ CodeQL ratchet OK: ${COUNT} alerta(s) HIGH/CRITICAL (baseline: ${BASELINE})"
