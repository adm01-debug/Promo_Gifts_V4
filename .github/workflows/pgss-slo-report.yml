name: pgss-slo-report

on:
  # schedule:
  #   - cron: '31 10 * * 1'
  # E31: schedule desabilitado — aguardando migration [DBA-E40] (ops.pgss_history).
  # Reativar após aplicação via .github/workflows/db-apply-migration.yml.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pgss-slo-report
  cancel-in-progress: false


defaults:
  run:
    shell: bash

jobs:
  check:
    name: Compara ops.pgss_history contra SLO_TARGETS_MS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: doufsxqlfjyuvxuezpln
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        with:
          persist-credentials: false  # E32
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Roda checagem de SLO
        id: check
        continue-on-error: true
        # E56: captura exit_code para tri-state (0=ok, 1=alerta, 2=inconclusivo)
        run: |
          set +e
          node scripts/pgss-slo-check.mjs --out=/tmp/pgss-slo.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgss-slo-report-${{ github.run_id }}
          path: /tmp/pgss-slo.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Compute issue body (RPC acima do SLO)
        id: issue_body
        if: steps.check.outcome == 'failure'
        run: |
          node <<'NODEEOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const DELIM = 'BODY_EOF_PGSS';
          let skip = 'true';
          let title = '';
          let body = '';
          try {
            const report = JSON.parse(fs.readFileSync('/tmp/pgss-slo.json', 'utf-8'));
            const breaches = report?.breaches || [];
            if (breaches.length === 0) {
              process.stderr.write('Relatório existe mas breaches está vazio — nada a fazer.\n');
            } else {
              const today = new Date().toISOString().slice(0, 10);
              title = `[perf-slo] ${breaches.length} RPC(s) acima do SLO — ${today}`;
              const lines = breaches.map((b) =>
                `- \`${b.fnName}\` — p95 estimado ${b.p95EstimateMs}ms > SLO ${b.sloMs}ms (mean ${b.meanMs}ms, ${b.calls} chamadas, captura ${b.capturedAt})`
              );
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              body = [
                `## RPC(s) acima do SLO declarado (p95 aproximado por mean + ${report.p95ZScore}*stddev)`,
                '',
                ...lines,
                '',
                `Run: ${runUrl}`,
                '',
                '### Como agir',
                'Não é uma ordem de otimização automática — só um alerta de SLO estourado (PLANO_DBA E40, ver também E34/E35 para achados de causa raiz de RPCs lentas já investigadas).',
                'Investigar a causa (N+1, falta de índice, volume de dados) antes de propor qualquer mudança de função ou índice — qualquer DDL resultante segue a REGRA #8 (aprovação explícita do PO por objeto).',
                '',
                '_p95 é uma aproximação estatística (pg_stat_statements não expõe percentil nativo) — sensível a distribuições não-normais. Confirmar a tendência com mais de uma captura antes de agir._',
              ].join('\n');
              skip = 'false';
            }
          } catch (e) {
            process.stderr.write(`Checagem inconclusiva ou sem relatório (${e.message}) — provavelmente ops.pgss_history ainda não existe (E40 aguardando aprovação do PO). Não é um achado de desempenho, apenas logando.\n`);
          }
          process.stdout.write(`skip=${skip}\n`);
          if (skip === 'false') {
            process.stdout.write(`title=${title}\n`);
            process.stdout.write(`body<<${DELIM}\n${body}\n${DELIM}\n`);
          }
          NODEEOF

      - name: Reportar issue de SLO
        # E12 — ci-issue action com dedupe por marcador <!-- ci-issue:perf-slo -->
        if: steps.check.outcome == 'failure' && steps.issue_body.outputs.skip != 'true'
        uses: ./.github/actions/ci-issue
        with:
          key: perf-slo
          title: ${{ steps.issue_body.outputs.title }}
          body: ${{ steps.issue_body.outputs.body }}
          labels: perf-slo,priority/low
          state: open

      - name: Não quebra o build
        if: steps.check.outcome == 'failure'
        # E56: tri-state — distingue falha real (exit 1) de inconclusivo (exit 2)
        run: |
          if [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
            echo "::warning::Checagem de SLO inconclusiva (exit 2) — sem SUPABASE_ACCESS_TOKEN ou ops.pgss_history ausente (E40 pendente). Nenhuma RPC sinalizada."
          else
            echo "::warning::Checagem de SLO encontrou RPC(s) acima do limiar — ver issue/artefato desta run. Job não quebra build (advisory, não gate)."
          fi
