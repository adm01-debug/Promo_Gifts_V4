name: pgss-slo-report

on:
  schedule:
    - cron: '31 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pgss-slo-report
  cancel-in-progress: false

jobs:
  check:
    name: Compara ops.pgss_history contra SLO_TARGETS_MS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'doufsxqlfjyuvxuezpln' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Roda checagem de SLO
        id: check
        continue-on-error: true
        run: node scripts/pgss-slo-check.mjs --out=/tmp/pgss-slo.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgss-slo-report-${{ github.run_id }}
          path: /tmp/pgss-slo.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Abre ou atualiza issue (RPC acima do SLO)
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/pgss-slo.json', 'utf-8'));
            } catch (e) {
              core.warning(`Checagem inconclusiva ou sem relatório (${e.message}) — provavelmente ops.pgss_history ainda não existe (E40 aguardando aprovação do PO). Não é um achado de desempenho, apenas logando.`);
              return;
            }
            const breaches = report?.breaches || [];
            if (breaches.length === 0) {
              core.warning('Relatório existe mas breaches está vazio — nada a fazer.');
              return;
            }
            const today = new Date().toISOString().slice(0, 10);
            const title = `[perf-slo] ${breaches.length} RPC(s) acima do SLO — ${today}`;

            const lines = breaches.map((b) => {
              return `- \`${b.fnName}\` — p95 estimado ${b.p95EstimateMs}ms > SLO ${b.sloMs}ms (mean ${b.meanMs}ms, ${b.calls} chamadas, captura ${b.capturedAt})`;
            });

            const body = [
              `## RPC(s) acima do SLO declarado (p95 aproximado por mean + ${report.p95ZScore}*stddev)`,
              '',
              ...lines,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Como agir',
              'Não é uma ordem de otimização automática — só um alerta de SLO estourado (PLANO_DBA E40, ver também E34/E35 para achados de causa raiz de RPCs lentas já investigadas).',
              'Investigar a causa (N+1, falta de índice, volume de dados) antes de propor qualquer mudança de função ou índice — qualquer DDL resultante segue a REGRA #8 (aprovação explícita do PO por objeto).',
              '',
              '_p95 é uma aproximação estatística (pg_stat_statements não expõe percentil nativo) — sensível a distribuições não-normais. Confirmar a tendência com mais de uma captura antes de agir._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'perf-slo',
            });
            const dup = existing.data.find((i) => i.title.startsWith('[perf-slo]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Atualização do dia ${today}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['perf-slo', 'priority/low'],
              });
            }

      - name: Não quebra o build
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::Checagem de SLO encontrou RPC(s) acima do limiar ou ficou inconclusiva — ver issue/artefato desta run. Job não quebra build (advisory, não gate)."
