name: Freight Quest — Quality Gates

on:
  push:
    branches: [main, master, "claude/**", "feat/**", "fix/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "supabase/functions/**"
      - "scripts/**"
      - ".github/workflows/freight-quality-gates.yml"
      - "package.json"
      - ".tsc-baseline.json"
      - ".eslint-baseline.json"
  pull_request:
    branches: [main, master]
    # 2026-09-27: mesmos paths do push — evita 19min de CI em mudanças non-freight
    paths:
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "supabase/functions/**"
      - "scripts/**"
      - ".github/workflows/freight-quality-gates.yml"
      - "package.json"
      - ".tsc-baseline.json"
      - ".eslint-baseline.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  NODE_VERSION: '22.22.1'
  NODE_OPTIONS: --max-old-space-size=4096
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://doufsxqlfjyuvxuezpln.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tjH5qAbZ0e5HTTd872NijQ_s9m6JvYU' }}
