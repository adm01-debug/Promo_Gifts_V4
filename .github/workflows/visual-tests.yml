name: Visual Baseline Tests — Nightly

# 2026-09-27: paths filter — evita rodar 17+min de Playwright visual em mudanças não-UI
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/__tests__/**'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'public/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-tests.yml'
      - '.github/scripts/e2e-relevance.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/__tests__/**'
      - '!src/**/*.test.*'
      - '!src/**/*.spec.*'
      - 'public/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-tests.yml'
      - '.github/scripts/e2e-relevance.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  e2e-relevance:
    uses: ./.github/workflows/_e2e-relevance.yml
    with:
      requires_backend: false  # só harnesses locais, sem banco

  visual-baseline:
    # G-H3: fork guard — pull_request de forks não deve escrever no repo
    needs: [e2e-relevance]
    if: needs.e2e-relevance.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read # E60: somente-leitura — baselines são atualizados via _update-snapshots.yml (E59)
    strategy:
      fail-fast: false
      # A matriz usa apenas harnesses locais, sem acesso ao banco canônico.
      max-parallel: 2
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # E32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate visual specs exist (fail-fast antes do Playwright)
        run: node scripts/check-visual-tests-specs.mjs

      - name: Clear Cache & Artifacts
        run: |
          rm -rf e2e-artifacts/
          rm -rf playwright-report/
          rm -rf playwright-report-authed/
          rm -rf test-results/

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Somente specs com baselines Linux/Chromium versionados. Todos usam
      # harnesses locais e dados congelados; nenhum consulta o banco canônico.
      - name: Run Playwright Visual Tests (baseline canônico — chromium-public)
        # E36: Removido --update-snapshots (incondicional) e --update-snapshots=missing.
        # Baselines devem estar commitados (E43). Specs sem baseline falham
        # explicitamente, forçando commit da baseline antes de aprovar o PR.
        run: >-
          npx playwright test
          --project=chromium-public
          --fail-on-flaky-tests
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          e2e/ui/calendar-visual.spec.ts
          e2e/ui/magazine-ring-visual.spec.ts
        env:
          CI: true

      - name: Rejeitar shard vazio ou quase todo ignorado
        if: always()
        uses: ./.github/actions/check-min-tests
        with:
          results-json: playwright-report/results.json
          min: 10
          max-skipped-ratio: '0'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
